/* ============================================================ ordering
   One manual order (sortIndex) drives Today, Minimal and Board. Dragging gives the moved task a
   value between its new neighbours, so only that task changes. */
function prioIdx(t){return PRIORITIES.indexOf(t.priority)}
function manualCmp(a,b){
  const x=a.task||a,y=b.task||b;
  return((x.sortIndex||0)-(y.sortIndex||0))||(prioIdx(x)-prioIdx(y))||String(x.createdAt||'').localeCompare(String(y.createdAt||''));
}
function maxSort(){return tasks.reduce((m,t)=>Math.max(m,t.sortIndex||0),0)}
function applyOrder(ids,movedId,pool){
  const T=new Map((pool||tasks).map(t=>[t.id,t]));
  ids=ids.filter(id=>T.has(id));
  const i=ids.indexOf(movedId);if(i<0)return;
  const m=T.get(movedId);
  const a=i>0?(T.get(ids[i-1]).sortIndex||0):null,b=i<ids.length-1?(T.get(ids[i+1]).sortIndex||0):null;
  if(a===null&&b===null)return;
  if(a===null){m.sortIndex=b-1;return;}
  if(b===null){m.sortIndex=a+1;return;}
  if(b-a>1e-7){m.sortIndex=(a+b)/2;return;}
  // no room between the neighbours, so lay the whole list out again from its smallest value
  const base=Math.min(...ids.map(id=>T.get(id).sortIndex||0));
  ids.forEach((id,k)=>{T.get(id).sortIndex=base+k;});
}
function applyClientOrder(visibleIds){
  const slots=[];CLIENTS.forEach((c,i)=>{if(visibleIds.includes(c.id))slots.push(i)});
  const vis=visibleIds.map(id=>CLIENTS.find(c=>c.id===id)).filter(Boolean);
  if(vis.length!==slots.length)return;
  const next=CLIENTS.slice();slots.forEach((s,k)=>next[s]=vis[k]);
  CLIENTS=next;saveCfg();
}

/* ============================================================ completing
   Completing sets a state, it never blindly toggles, so a double tap cannot undo itself. */
function isDoneInst(t,date){return t.rrule?isCompleted(t.id,date):t.status==='done'}
function setInstDone(t,date,done,opts){
  if(!t||isNote(t))return false;
  opts=opts||{};
  const today=todayStr();
  if(t.rrule){
    if(done){
      if(!date)date=today;
      if(isCompleted(t.id,date))return false;
      let target=date;
      if(opts.smart&&date<today){
        // finishing a late repeat counts once: for today if today is on its schedule, otherwise for the
        // latest missed day. The other missed days are skipped, so the task leaves Today straight away
        const occ=occurrences(t,date,today).filter(d=>!isCompleted(t.id,d));
        target=occ.includes(today)?today:(occ.filter(d=>d<=today).pop()||date);
        const now=new Date().toISOString();
        occ.forEach(d=>{if(d!==target&&d<today)exceptions.push({id:uid(),taskId:t.id,action:'skip',date:d,at:now});});
        saveExc();
      }
      const at=opts.at||(target<today&&!opts.smart?target+'T12:00:00':new Date().toISOString());
      completions.push({id:uid(),taskId:t.id,date:target,at});
      if(t.status==='doing')t.status='todo';
      if(t.resetSubs&&t.subtasks.some(s=>s.done)){t.subtasks.forEach(s=>s.done=false);logAct(t,'Checklist reset for the next time');}
      saveComp();saveTasks();
    }else{
      if(!isCompleted(t.id,date))return false;
      completions=completions.filter(c=>!(c.taskId===t.id&&c.date===date));saveComp();
    }
  }else{
    if(done===(t.status==='done'))return false;
    if(done){t.status='done';t.completedAt=new Date().toISOString();}
    else{t.status='todo';t.completedAt=null;t.archivedAt=null;}
    saveTasks();
  }
  if(!opts.silent)play(done?'done':'untick');
  return true;
}
function toggleDone(t,date,smart,silent){
  if(!t||isNote(t))return;
  const want=!isDoneInst(t,date);
  let changed=false;
  withUndo(want?'Completed · '+titleOf(t):'Marked as not done',()=>{changed=setInstDone(t,date,want,{smart,silent});});
  if(changed&&want)afterComplete();
  render();
}

/* ============================================================ task ops */
function rescheduleInst(t,from,to,silent){
  if(!t||!to||from===to)return;
  const fn=()=>{
    if(t.rrule){
      const now=new Date().toISOString();
      const ex=exceptions.find(e=>e.taskId===t.id&&e.action==='move'&&e.newDate===from);
      if(ex){exceptions=exceptions.filter(e=>e!==ex);if(ex.date!==to)exceptions.push({id:uid(),taskId:t.id,action:'move',date:ex.date,newDate:to,at:now});}
      else exceptions.push({id:uid(),taskId:t.id,action:'move',date:from||todayStr(),newDate:to,at:now});
      saveExc();
    }else{t.due=to;logAct(t,'Rescheduled to '+fmtDM(to));saveTasks();}
  };
  if(silent)fn();else withUndo('Moved to '+fmtRel(to)+(t.rrule?' · this time only':''),fn);
  render();
}
function moveOverdueToToday(list){
  const today=todayStr();
  withUndo('Moved '+plural(list.length,'task')+' to today',()=>{
    const now=new Date().toISOString();
    list.forEach(o=>{const t=o.task;
      if(!t.rrule){t.due=today;logAct(t,'Moved to today');return;}
      const occ=occurrences(t,o.date,today).filter(d=>!isCompleted(t.id,d));
      const missed=occ.filter(d=>d<today);
      if(occ.includes(today))missed.forEach(d=>exceptions.push({id:uid(),taskId:t.id,action:'skip',date:d,at:now}));
      else{const last=missed.pop();missed.forEach(d=>exceptions.push({id:uid(),taskId:t.id,action:'skip',date:d,at:now}));
        if(last)exceptions.push({id:uid(),taskId:t.id,action:'move',date:last,newDate:today,at:now});}
    });
    saveTasks();saveExc();
  });
  render();
}
function deleteTask(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  withUndo('Deleted · '+titleOf(t),()=>{
    tasks=tasks.filter(x=>x.id!==id);
    completions=completions.filter(c=>c.taskId!==id);
    exceptions=exceptions.filter(e=>e.taskId!==id);
    saveTasks();saveComp();saveExc();
  });
  play('del');haptic(14);
  render();
}
function duplicateTask(t){
  const c=clone(t);
  c.id=uid();c.subtasks=(c.subtasks||[]).map(s=>({...s,id:uid()}));
  c.attachments=(c.attachments||[]).map(a=>({...a,id:uid()}));
  c.comments=[];c.activity=[];c.createdAt=new Date().toISOString();
  if(!c.rrule){c.status='todo';c.completedAt=null;}
  c.archivedAt=null;c.sortIndex=(t.sortIndex||0)+.5;
  const n=normTask(c);logAct(n,'Duplicated from “'+titleOf(t)+'”');
  withUndo('Duplicated',()=>{tasks.push(n);saveTasks();});
  render();
  return n;
}
function moveTaskToClient(t,cid,silent){
  if(!t||t.client===cid)return;
  const fn=()=>{t.client=cid;logAct(t,'Moved to '+clientOf(cid).name);saveTasks();};
  if(silent)fn();else withUndo('Moved to '+clientOf(cid).name,fn);
  render();
}
function setTaskStatus(t,status,date){
  if(!t)return;
  const wasDone=isDoneInst(t,date);
  if(status==='done'){if(!wasDone){setInstDone(t,date,true,{smart:true});afterComplete();}return;}
  if(wasDone)setInstDone(t,date,false);
  if(t.status!==status&&!(t.rrule&&status==='done')){t.status=status;if(status!=='done')t.completedAt=null;logAct(t,'Status changed to '+(status==='doing'?'in progress':'to do'));}
  saveTasks();
}
function copyTaskLink(t){
  const url=location.href.split('#')[0]+'#task='+t.id;
  const ok=()=>toast('Link copied');
  try{navigator.clipboard.writeText(url).then(ok,()=>prompt('Copy this link',url));}catch(e){prompt('Copy this link',url);}
}
// a task turned into a checklist item keeps its full original record on the item, so turning it back loses nothing
function convertToSubtask(t,parentId){
  const parent=tasks.find(x=>x.id===parentId);if(!parent||parent.id===t.id)return;
  withUndo('Now a checklist item in '+titleOf(parent),()=>{
    const origin=clone(t);delete origin.subtasks;
    const item={id:uid(),text:titleOf(t)||t.title,done:t.rrule?false:t.status==='done',depth:0,origin};
    const kids=(t.subtasks||[]).map(s=>({...s,depth:Math.min(MAX_DEPTH,(s.depth||0)+1)}));
    parent.subtasks.push(item,...kids);
    logAct(parent,'Added “'+titleOf(t)+'” as a checklist item');
    tasks=tasks.filter(x=>x.id!==t.id);
    saveTasks();
  });
  render();
}
function subtaskToTask(parent,idx){
  const list=parent.subtasks;const end=blockEnd(list,idx);const item=list[idx];
  const d0=item.depth||0;
  const kids=list.slice(idx+1,end).map(s=>({...s,depth:Math.max(0,(s.depth||0)-d0-1)}));
  let nt;
  if(item.origin){
    nt=normTask({...item.origin,title:(isNote(item.origin)?'* ':'')+item.text,subtasks:kids,archivedAt:null});
    if(!nt.rrule){nt.status=item.done?'done':(nt.status==='done'?'todo':nt.status);nt.completedAt=item.done?(nt.completedAt||new Date().toISOString()):null;}
    if(tasks.some(x=>x.id===nt.id))nt.id=uid();
  }else{
    nt=normTask({id:uid(),title:item.text,client:parent.client,assignee:parent.assignee,priority:'None',
      due:parent.rrule?todayStr():(parent.due||todayStr()),subtasks:kids,status:item.done?'done':'todo',
      completedAt:item.done?new Date().toISOString():null,sortIndex:(parent.sortIndex||0)+.5});
  }
  withUndo('Now its own task',()=>{
    logAct(nt,'Made a task from a checklist item of “'+titleOf(parent)+'”');
    list.splice(idx,end-idx);
    tasks.push(nt);saveTasks();
  });
  return nt;
}
/* ---- labels across every task ---- */
function labelUse(l){return tasks.filter(t=>t.labels.includes(l)).length}
function renameLabel(from,to){
  to=String(to||'').trim().replace(/^[#@]/,'');if(!to||to===from)return;
  withUndo('Renamed label to '+to,()=>{
    tasks.forEach(t=>{if(t.labels.includes(from)){t.labels=[...new Set(t.labels.map(l=>l===from?to:l))];}});
    if(X.labelColors[from]){if(!X.labelColors[to])X.labelColors[to]=X.labelColors[from];delete X.labelColors[from];}
    if(UI.view.fLabel===from){UI.view.fLabel=to;saveUi();}
    saveTasks();saveX();
  });
}
function deleteLabel(l){
  const n=labelUse(l);
  withUndo('Removed label '+l+(n?' from '+plural(n,'task'):''),()=>{
    tasks.forEach(t=>{if(t.labels.includes(l))t.labels=t.labels.filter(x=>x!==l);});
    delete X.labelColors[l];
    if(UI.view.fLabel===l){UI.view.fLabel='all';saveUi();}
    saveTasks();saveX();
  });
}
/* ---- clients ---- */
function openCount(cid){const today=todayStr();return tasks.filter(t=>t.client===cid&&!t.archivedAt&&!isNote(t)&&(t.rrule?!!openTodayInstance(t):t.status!=='done')).length}
function addClient(name){
  const n=CLIENTS.length;
  const c={id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:name||'New client',color:SWATCHES[n%SWATCHES.length],t:Date.now()};
  CLIENTS.push(c);saveCfg();return c;
}
function removeClient(id,moveTo){
  const used=tasks.filter(t=>t.client===id);
  withUndo('Removed client '+clientOf(id).name,()=>{
    if(used.length&&moveTo){used.forEach(t=>{t.client=moveTo;logAct(t,'Moved to '+clientOf(moveTo).name);});saveTasks();}
    CLIENTS=CLIENTS.filter(c=>c.id!==id);
    if(UI.view.fClient===id){UI.view.fClient='all';saveUi();}
    saveCfg();
  });
}

/* ============================================================ quick add */
const QA={client:null,date:'0',prio:'None',text:'',ready:null};
function qaDate(){if(QA.date==='0')return todayStr();if(QA.date==='1')return addLocalDays(todayStr(),1);if(QA.date==='mon')return addLocalDays(mondayOf(todayStr()),7);return QA.date}
function qaClient(){return(QA.client&&CLIENTS.some(c=>c.id===QA.client))?QA.client:(UI.view.fClient!=='all'&&CLIENTS.some(c=>c.id===UI.view.fClient)?UI.view.fClient:CLIENTS[0]?.id||'personal')}
function parseQuick(text){
  let title=' '+text+' ',client=null,prio=null;
  title=title.replace(/\s#([^\s#]+)/g,(m,w)=>{const q=w.toLowerCase();const c=CLIENTS.find(c=>c.name.toLowerCase().replace(/\s+/g,'').startsWith(q))||CLIENTS.find(c=>c.name.toLowerCase().includes(q));if(c&&!client){client=c.id;return' ';}return m;});
  title=title.replace(/\s(?:p|!)([1-4])(?=\s)/gi,(m,n)=>{if(!prio){prio=PRIORITIES[Number(n)-1];return' ';}return m;});
  return{title:title.replace(/\s+/g,' ').trim(),client,prio};
}
function quickAdd(){
  const raw=QA.text.trim();if(!raw)return;
  const p=parseQuick(raw);if(!p.title)return;
  const nt=normTask({id:uid(),title:p.title,client:p.client||qaClient(),assignee:meName(),priority:p.prio||QA.prio||'None',due:qaDate(),readyTill:QA.ready,
    sortIndex:maxSort()+1,createdAt:new Date().toISOString(),status:'todo'});
  withUndo('Added · '+titleOf(nt)+(nt.due!==todayStr()?' · '+fmtRel(nt.due):''),()=>{tasks.push(nt);saveTasks();});
  QA.text='';QA.ready=null;play('add');haptic(10);markFresh(nt.id);render();
  const q=$('#qaIn');if(q)q.focus({preventScroll:true});
}

/* ============================================================ list builders */
function todaysTasks(){
  const out=[];
  tasks.forEach(t=>{if(t.archivedAt)return;const inst=openTodayInstance(t);if(inst)out.push({task:t,date:inst.date,floating:inst.floating})});
  return out.sort(manualCmp);
}
function doneTodayList(){
  const today=todayStr();const out=[];
  tasks.forEach(t=>{
    if(t.rrule&&isCompleted(t.id,today))out.push({task:t,date:today});
    else if(t.rrule){const c=completions.find(c=>c.taskId===t.id&&c.at&&localDay(c.at)===today);if(c)out.push({task:t,date:c.date});}
    else if(t.status==='done'&&!t.archivedAt&&t.completedAt&&localDay(t.completedAt)===today)out.push({task:t,date:t.due||today});
  });
  return out;
}
function visibleDoneToday(){
  const today=todayStr();
  const keys=X.cleared&&X.cleared.date===today?X.cleared.keys:[];
  return doneTodayList().filter(o=>!keys.includes(o.task.id));
}
function tasksOnDay(dateStr,withDeadlines){
  const out=[];
  tasks.forEach(t=>{
    if(t.archivedAt&&!(t.status==='done'))return;
    const occ=occurrences(t,dateStr,dateStr);
    if(occ.length){if(t.archivedAt)return;out.push({task:t,date:dateStr});}
    else if(withDeadlines&&t.deadline===dateStr&&t.status!=='done'&&!t.archivedAt)out.push({task:t,date:t.due||dateStr,dlOnly:true});
  });
  out.sort((a,b)=>{
    const da=isDoneInst(a.task,a.date)?1:0,db=isDoneInst(b.task,b.date)?1:0;if(da!==db)return da-db;
    const at=a.task.dueTime||'99',bt=b.task.dueTime||'99';if(at!==bt)return at.localeCompare(bt);
    return manualCmp(a,b);
  });
  return out;
}
function matchesFilters(o){
  const fc=UI.view.fClient;
  return fc==='all'||o.task.client===fc;
}

/* ============================================================ row html */
function lateLabel(d){const n=-dayDiff(d);return n===1?'Yesterday':n+'d late'}
function metaHtml(t,date,ctx,done){
  let m='';
  if(!done&&t.priority!=='None'&&!isNote(t))m+='<span class="mt '+PRIO_CLS[t.priority]+'">'+svg('flagf')+PRIO_P[t.priority]+'</span>';
  const groupedByClient=ctx==='today'&&UI.view.group==='client';
  if(!groupedByClient){const c=clientOf(t.client);m+='<span class="mt"><i class="cdot" style="background:'+c.color+'"></i>'+esc(c.name)+'</span>';}
  const today=todayStr();
  if(date&&!done&&date<today&&ctx!=='done')m+='<span class="mt late">'+svg('clock')+lateLabel(date)+'</span>';
  else if(date&&!done&&ctx!=='today'&&ctx!=='day'&&ctx!=='done'){
    if(date===today)m+='<span class="mt today">'+svg('calendar')+'Today</span>';
    else if(!t.rrule||ctx==='search')m+='<span class="mt">'+svg('calendar')+esc(fmtRel(date))+'</span>';
  }
  if(t.rrule)m+='<span class="mt">'+svg('repeat')+esc(repeatLabel(t.rrule))+'</span>';
  if(t.dueTime)m+='<span class="mt">'+svg('clock')+fmtTime(t.dueTime)+(t.estimate?'–'+fmtTime(addMinsToTime(t.dueTime,t.estimate)):'')+'</span>';
  else if(t.estimate){const c=corrected(t);m+='<span class="mt"'+(c!==t.estimate?' title="Your estimate, then what your history says it takes"':'')+'>'+svg('timer')+fmtMins(t.estimate)+(c!==t.estimate?'<span class="corr">→ '+fmtMins(c)+'</span>':'')+'</span>';}
  if(t.deadline&&!done){const d=dayDiff(t.deadline);const cls=d<0?' late':d<=1?' soon':'';
    m+='<span class="mt'+cls+'">'+svg('flag')+(d<0?'Deadline passed':d===0?'Deadline today':d===1?'Deadline tomorrow':'Deadline '+fmtDM(t.deadline))+'</span>';}
  if(t.startDate&&t.startDate>today)m+='<span class="mt hid">'+svg('eyeoff')+'Shows '+fmtDM(t.startDate)+'</span>';
  m+=readyChip(t);
  if(t.type==='post')m+='<span class="mt post '+t.postStatus+'" data-poststatus="'+t.id+'">'+t.postStatus+'</span>';
  if(t.status==='doing'&&!done)m+='<span class="mt today">'+svg('status')+'In progress</span>';
  if(!done)m+=timeChip(t);
  if(t.remind&&t.remind!=='none')m+='<span class="mt">'+svg('bell')+'</span>';
  if(t.comments&&t.comments.length)m+='<span class="mt">'+svg('chat')+t.comments.length+'</span>';
  if(t.attachments&&t.attachments.length)m+='<span class="mt">'+svg('clip')+t.attachments.length+'</span>';
  if(t.subtasks.length){const s=ckStats(t.subtasks);
    m+='<button class="ckp'+(s.d===s.n?' full':'')+(EXPANDED.has(t.id)?' open':'')+'" data-ckexp="'+t.id+'" title="Show checklist">'+svg('chev')+'<span class="tr"><i style="width:'+s.pct+'%"></i></span>'+s.d+'/'+s.n+'</button>';}
  t.labels.forEach(l=>m+='<span class="lbl" style="--c:'+labelColor(l)+'"><i></i>'+esc(l)+'</span>');
  if(t.assignee&&t.assignee!==meName())m+='<span class="mt">'+svg('person')+esc(t.assignee)+'</span>';
  return m;
}
function inlineChecklist(t){
  const list=t.subtasks;const vis=visibleIdx(list,false);
  return'<div class="rck">'+vis.map(i=>{const s=list[i];const kids=hasKids(list,i);
    return'<div class="ck'+(s.done?' done':'')+'" style="--d:'+(s.depth||0)+'">'
      +'<button class="ck-fold'+(kids?' has':'')+(kids&&!s.collapsed?' open':'')+'" data-rfold="'+t.id+'|'+i+'" aria-label="Expand">'+svg('chev')+'</button>'
      +'<button class="ck-box'+(s.done?' on':'')+'" data-rtick="'+t.id+'|'+i+'" aria-label="Tick step">'+svg('check')+'</button>'
      +'<div class="ck-text">'+esc(s.text)+'</div>'
      +(kids&&s.collapsed?'<span class="ck-kids">+'+(blockEnd(list,i)-i-1)+'</span>':'')
      +'</div>';}).join('')+'</div>';
}
function tickHtml(t,date,done){
  return'<button class="tick '+PRIO_CLS[t.priority]+(done?' on':'')+'" data-tick="'+t.id+'" data-date="'+(date||'')+'" aria-label="'+(done?'Mark as not done':'Complete')+'">'+svg('check')+'</button>';
}
/* ctx: today (Today list), min (Minimal), day (a calendar day), done, search */
function rowHtml(o,ctx){
  const t=o.task,date=o.date;
  const done=o.done!==undefined?o.done:isDoneInst(t,date);
  const note=isNote(t);
  const lead=note?'<span class="notemark">'+svg('note')+'</span>':tickHtml(t,date,done);
  const drag=(ctx==='today'||ctx==='min'||ctx==='day')&&!done;
  const attrs=' data-row data-tid="'+t.id+'" data-date="'+(date||'')+'"'+(drag?' data-drag="'+(ctx==='day'?'dayrow':'row')+'"':'');
  if(ctx==='min'){
    const late=date&&date<todayStr()&&!done;
    return'<div class="row min'+(done?' done':'')+(note?' note':'')+selCls(t.id)+'"'+attrs+'>'+lead
      +'<div class="rb"><div class="rt">'+esc(titleOf(t))+'</div></div>'
      +(late?'<span class="late">'+lateLabel(date)+'</span>':'')
      +'<span class="mindot" style="background:'+clientOf(t.client).color+'" title="'+esc(clientOf(t.client).name)+'"></span>'
      +'<div class="ra"><span class="grip" data-handle aria-label="Drag to reorder">'+svg('grip')+'</span></div></div>';
  }
  const snippet=UI.view.details&&t.notes?plain(t.notes).split('\n').find(x=>x.trim()):'';
  const side=(ctx!=='search'&&!note?'<button class="rmore" data-rmore="'+t.id+'" data-date="'+(date||'')+'" aria-label="More actions">'+svg('dots')+'</button>':'')
    +(drag?'<span class="grip" data-handle aria-label="Drag">'+svg('grip')+'</span>':'');
  return'<div class="row'+(done?' done':'')+(note?' note':'')+(FRESH.has(t.id)?' fresh':'')+selCls(t.id)+'"'+attrs+'>'+lead
    +'<div class="rb"><div class="rt">'+esc(titleOf(t))+'</div>'
    +(snippet?'<div class="rd">'+esc(snippet)+'</div>':'')
    +'<div class="rm">'+(o.dlOnly?'<span class="mt late">'+svg('flag')+'Deadline</span>':'')+metaHtml(t,date,ctx,done)+'</div>'
    +(EXPANDED.has(t.id)&&t.subtasks.length?inlineChecklist(t):'')
    +'</div><div class="ra">'+side+'</div></div>';
}

/* ============================================================ time blocks */
function hourH(){return isPhone()?54:62}
function fmtHour(m){const h=Math.floor(m/60)%24;return(((h+11)%12)+1)+(h<12?' am':' pm')}
function layoutLanes(evs){
  evs.sort((a,b)=>a.s-b.s||b.e-a.e);
  let cluster=[],cEnd=-1;
  const flush=()=>{const ends=[];cluster.forEach(ev=>{let i=ends.findIndex(x=>x<=ev.s);if(i<0){i=ends.length;ends.push(ev.e);}else ends[i]=ev.e;ev.lane=i;});cluster.forEach(ev=>ev.lanes=ends.length);cluster=[];};
  evs.forEach(ev=>{if(cluster.length&&ev.s>=cEnd){flush();cEnd=-1;}cluster.push(ev);cEnd=Math.max(cEnd,ev.e);});
  if(cluster.length)flush();
  return evs;
}
function timelineHtml(date,opts){
  opts=opts||{};
  let items=(opts.items||tasksOnDay(date,false)).filter(o=>!isNote(o.task));
  if(opts.filter)items=items.filter(matchesFilters);
  const timed=items.filter(o=>o.task.dueTime);
  const untimed=items.filter(o=>!o.task.dueTime&&!isDoneInst(o.task,o.date));
  let s=7*60,e=21*60;
  const isToday=date===todayStr();const nowM=new Date().getHours()*60+new Date().getMinutes();
  timed.forEach(o=>{const m=toMin(o.task.dueTime);s=Math.min(s,Math.floor(m/60)*60);e=Math.max(e,Math.min(1440,Math.ceil((m+(o.task.estimate||30))/60)*60));});
  if(isToday){s=Math.min(s,Math.floor(nowM/60)*60);e=Math.max(e,Math.min(1440,Math.ceil((nowM+30)/60)*60));}
  const ppm=hourH()/60;
  let h='<div class="tl-wrap">';
  if(opts.tray!==false)h+='<div class="tl-tray" data-tltray="'+date+'"><span class="tl-tl">No time yet'+(untimed.length?' · '+untimed.length:'')+'</span>'
    +(untimed.length?untimed.map(o=>'<span class="tl-chip" data-drag="tray" data-tid="'+o.task.id+'" data-date="'+o.date+'" style="--c:'+clientOf(o.task.client).color+'"><span class="grip" data-handle>'+svg('grip')+'</span><i></i><span>'+esc(titleOf(o.task))+'</span></span>').join('')
      :'<span class="hint" style="margin:0">Everything here has a time.</span>')+'</div>';
  h+='<div class="tl" data-tl="'+date+'" data-s="'+s+'" data-e="'+e+'" style="height:'+Math.round((e-s)*ppm)+'px">';
  for(let m=s;m<e;m+=60){h+='<div class="tl-h" style="top:'+Math.round((m-s)*ppm)+'px"><span>'+fmtHour(m)+'</span></div><div class="tl-h half" style="top:'+Math.round((m+30-s)*ppm)+'px"></div>';}
  if(isToday&&nowM>=s&&nowM<=e)h+='<div class="tl-now" style="top:'+Math.round((nowM-s)*ppm)+'px"></div>';
  const evs=layoutLanes(timed.map(o=>{const st=toMin(o.task.dueTime);return{o,s:st,e:st+Math.max(15,o.task.estimate||30)}}));
  evs.forEach(ev=>{const t=ev.o.task;const c=clientOf(t.client);const done=ev.o.done!==undefined?ev.o.done:isDoneInst(t,ev.o.date);
    const top=Math.round((ev.s-s)*ppm),ht=Math.max(22,Math.round((ev.e-ev.s)*ppm)-3);
    const narrow=ev.lanes>=(isPhone()?3:5);
    h+='<div class="tl-b'+(done?' done':'')+(ht<44&&!narrow?' short':'')+(narrow?' narrow':'')+'" data-tlb data-tid="'+t.id+'" data-date="'+ev.o.date+'" style="top:'+top+'px;height:'+ht+'px;left:calc(58px + (100% - 66px) * '+(ev.lane/ev.lanes)+');width:calc((100% - 66px) / '+ev.lanes+' - 4px);--c:'+c.color+'">'
      +(isNote(t)||narrow?'':tickHtml(t,ev.o.date,done))
      +'<div class="tl-bx"><div class="tl-bt">'+esc(titleOf(t))+'</div><div class="tl-bm">'+fmtTime(t.dueTime)+' – '+fmtTime(addMinsToTime(t.dueTime,t.estimate||30))+' · '+esc(c.name)+'</div></div>'
      +(done?'':'<span class="tl-rs" data-tlrs aria-hidden="true"></span>')+'</div>';});
  h+='</div><p class="tl-hint">Tap an empty slot to add a task there. Drag a block to move it, drag its bottom edge to change how long it takes.</p></div>';
  return h;
}

const BCOLS=[['todo','To do','#9AA59D'],['doing','In progress','#DD8530'],['done','Done','#2F9E6E']];
function boardData(){
  const today=todayStr(),scope=UI.boardScope;
  const end=scope==='today'?today:scope==='week'?addLocalDays(mondayOf(today),6):'9999-12-31';
  const from=scope==='today'?today:scope==='week'?mondayOf(today):addLocalDays(today,-13);
  const fc=UI.view.fClient;
  const cols={todo:[],doing:[],done:[]};
  tasks.forEach(t=>{
    if(isNote(t)||t.habit||t.archivedAt)return;
    if(fc!=='all'&&t.client!==fc)return;
    if(!t.rrule&&hiddenNow(t))return;
    const inst=openInstanceUpTo(t,end);
    if(inst){cols[t.status==='doing'?'doing':'todo'].push({task:t,date:inst.date});return;}
    if(!t.rrule){if(t.status==='done'&&t.completedAt&&localDay(t.completedAt)>=from)cols.done.push({task:t,date:t.due||localDay(t.completedAt),done:true});}
    else{const cs=completions.filter(c=>c.taskId===t.id&&c.date>=from&&c.date<=(end>today?today:end)).sort((a,b)=>b.date.localeCompare(a.date));
      if(cs.length)cols.done.push({task:t,date:cs[0].date,done:true});}
  });
  Object.values(cols).forEach(l=>l.sort(manualCmp));
  return cols;
}

  if(!done&&t.priority!=='None')m+='<span class="mt '+PRIO_CLS[t.priority]+'">'+svg('flagf')+PRIO_P[t.priority]+'</span>';
  if(date&&!done){if(date<today)m+='<span class="mt late">'+svg('clock')+lateLabel(date)+'</span>';else if(date===today)m+='<span class="mt today">'+svg('calendar')+'Today</span>';else m+='<span class="mt">'+svg('calendar')+esc(fmtRel(date))+'</span>';}
  if(t.dueTime)m+='<span class="mt">'+svg('clock')+fmtTime(t.dueTime)+'</span>';
  if(t.rrule)m+='<span class="mt">'+svg('repeat')+'</span>';
  if(t.deadline&&!done){const d=dayDiff(t.deadline);m+='<span class="mt'+(d<0?' late':d<=1?' soon':'')+'">'+svg('flag')+fmtDM(t.deadline)+'</span>';}
  m+=readyChip(t);
  if(t.subtasks.length){const s=ckStats(t.subtasks);m+='<span class="ckp'+(s.d===s.n?' full':'')+'"><span class="tr"><i style="width:'+s.pct+'%"></i></span>'+s.d+'/'+s.n+'</span>';}
  if(t.comments&&t.comments.length)m+='<span class="mt">'+svg('chat')+t.comments.length+'</span>';
  m+=timeChip(t);
  t.labels.slice(0,3).forEach(l=>m+='<span class="lbl" style="--c:'+labelColor(l)+'"><i></i>'+esc(l)+'</span>');
  return m;
}
/* the clock on a card or row: shows once any time is logged, pulses while it runs */
function timeChip(t){
  const ms=timeSpent(t.id);const live=!!openSession(t.id);

  return'<span class="mt tm'+(live?' live':'')+'" title="Time logged. Tap to edit" data-timeedit="'+t.id+'">'+svg('timer')+'<span data-livetime="'+t.id+'">'+fmtDur(ms)+'</span></span>';
}

/* ============================================================ PROGRESS */
function barChart(data,goal){
  const W=640,H=190,pl=6,pr=6,pt=22,pb=24;const n=data.length;
  const max=Math.max(goal,...data.map(d=>d.v),1);
  const bw=(W-pl-pr)/n;const y=v=>pt+(H-pt-pb)*(1-v/max);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Completed tasks chart">';
  data.forEach((d,i)=>{
    const x=pl+i*bw+bw*.2,w=bw*.6,top=y(d.v),hgt=Math.max(0,H-pb-top);
    const fill=d.off?'var(--fill-2)':d.v>=goal?'var(--brand)':'color-mix(in srgb,var(--brand) 42%,var(--fill-2))';
    if(d.v>0)s+='<rect x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+hgt.toFixed(1)+'" rx="6" style="fill:'+fill+'"/>';
    else s+='<rect x="'+x.toFixed(1)+'" y="'+(H-pb-3)+'" width="'+w.toFixed(1)+'" height="3" rx="1.5" style="fill:var(--line-2)"/>';
    if(d.v>0)s+='<text class="val" x="'+(x+w/2).toFixed(1)+'" y="'+(top-6).toFixed(1)+'" text-anchor="middle">'+d.v+'</text>';
    s+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle"'+(d.cur?' style="fill:var(--brand);font-weight:800"':'')+'>'+esc(d.l)+'</text>';
  });
  const gy=y(goal).toFixed(1);
  s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'" style="stroke:var(--brand-2)" stroke-dasharray="4 5" stroke-width="1.3"/>';
  s+='<text x="'+(W-pr)+'" y="'+(Number(gy)-6)+'" text-anchor="end" style="fill:var(--brand-2);font-weight:700">goal '+goal+'</text>';
  return s+'</svg>';
}

/* ============================================================ HOLIDAYS
   Public holidays for your home country and each client's country, shown on the calendar, in
   Upcoming and on Today. Festival dates that move each year are built in for 2026 to 2028; anything
   else can be added by hand in Settings. */
const COUNTRIES=[['IN','India'],['US','United States'],['GB','United Kingdom'],['BT','Bhutan'],['SG','Singapore'],['AU','Australia'],['AE','UAE']];
const HOL_FIXED={
  IN:[['01-14','Makar Sankranti'],['01-26','Republic Day'],['08-15','Independence Day'],['10-02','Gandhi Jayanti'],['12-25','Christmas']],
  US:[['01-01',"New Year's Day"],['06-19','Juneteenth'],['07-04','Independence Day'],['11-11','Veterans Day'],['12-25','Christmas']],
  GB:[['01-01',"New Year's Day"],['12-25','Christmas'],['12-26','Boxing Day']],
  BT:[['02-21',"King's Birthday"],['02-22',"King's Birthday"],['02-23',"King's Birthday"],['05-02','Birth Anniversary of the Third King'],['11-11','Birth Anniversary of the Fourth King'],['12-17','National Day']],
  SG:[['01-01',"New Year's Day"],['05-01','Labour Day'],['08-09','National Day'],['12-25','Christmas']],
  AU:[['01-01',"New Year's Day"],['01-26','Australia Day'],['04-25','Anzac Day'],['12-25','Christmas'],['12-26','Boxing Day']],
  AE:[['01-01',"New Year's Day"],['12-02','National Day'],['12-03','National Day']]
};
const HOL_MOVABLE={
  IN:{'2026-03-04':'Holi','2026-03-20':'Eid al-Fitr','2026-08-28':'Raksha Bandhan','2026-09-04':'Janmashtami','2026-09-14':'Ganesh Chaturthi','2026-10-20':'Dussehra','2026-11-08':'Diwali','2026-11-24':'Guru Nanak Jayanti',
      '2027-03-10':'Eid al-Fitr','2027-03-22':'Holi','2027-08-17':'Raksha Bandhan','2027-09-04':'Ganesh Chaturthi','2027-10-09':'Dussehra','2027-10-29':'Diwali','2027-11-14':'Guru Nanak Jayanti',
      '2028-03-11':'Holi','2028-09-27':'Dussehra','2028-10-17':'Diwali'},
  SG:{'2026-02-17':'Chinese New Year','2026-02-18':'Chinese New Year','2026-11-08':'Deepavali','2027-02-06':'Chinese New Year','2027-02-07':'Chinese New Year','2027-10-28':'Deepavali','2028-01-26':'Chinese New Year','2028-01-27':'Chinese New Year'},
  AE:{'2026-03-20':'Eid al-Fitr','2026-05-27':'Eid al-Adha','2027-03-10':'Eid al-Fitr','2027-05-16':'Eid al-Adha'}
};
function easterOf(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return y+'-'+pad(mo)+'-'+pad(da)}
function nthDow(y,m,dow,n){ // dow 0..6 (Sunday 0); n<0 counts from the end of the month
  if(n>0){const first=new Date(Date.UTC(y,m-1,1,12)).getUTCDay();const day=1+((dow-first+7)%7)+(n-1)*7;return y+'-'+pad(m)+'-'+pad(day);}
  const last=new Date(Date.UTC(y,m,0,12));const ld=last.getUTCDate(),lw=last.getUTCDay();const day=ld-((lw-dow+7)%7)+(n+1)*7;return y+'-'+pad(m)+'-'+pad(day);
}
const HOL_MEMO=new Map();
function holidaysFor(cc,y){
  const key=cc+y;if(HOL_MEMO.has(key))return HOL_MEMO.get(key);
  const out=[];(HOL_FIXED[cc]||[]).forEach(([md,n])=>out.push([y+'-'+md,n]));
  const mv=HOL_MOVABLE[cc]||{};Object.keys(mv).forEach(d=>{if(d.slice(0,4)===String(y))out.push([d,mv[d]])});
  if(cc==='US')out.push([nthDow(y,1,1,3),'Martin Luther King Jr. Day'],[nthDow(y,2,1,3),"Presidents' Day"],[nthDow(y,5,1,-1),'Memorial Day'],[nthDow(y,9,1,1),'Labor Day'],[nthDow(y,11,4,4),'Thanksgiving'],[addLocalDays(nthDow(y,11,4,4),1),'Day after Thanksgiving']);
  if(cc==='GB'){const e=easterOf(y);out.push([addLocalDays(e,-2),'Good Friday'],[addLocalDays(e,1),'Easter Monday'],[nthDow(y,5,1,1),'Early May bank holiday'],[nthDow(y,5,1,-1),'Spring bank holiday'],[nthDow(y,8,1,-1),'Summer bank holiday']);}
  if(cc==='IN')out.push([addLocalDays(easterOf(y),-2),'Good Friday']);
  if(cc==='AU'){const e=easterOf(y);out.push([addLocalDays(e,-2),'Good Friday'],[addLocalDays(e,1),'Easter Monday']);}
  if(cc==='SG')out.push([addLocalDays(easterOf(y),-2),'Good Friday']);
  HOL_MEMO.set(key,out);return out;
}
function countryName(cc){return(COUNTRIES.find(c=>c[0]===cc)||['',cc])[1]}
/* who observes which country: you (home) and every client with a country set */
function holidaySources(){
  const src=[];
  if(X.home)src.push({cc:X.home,who:'You'});
  CLIENTS.forEach(c=>{if(c.country)src.push({cc:c.country,who:c.name,color:c.color});});
  return src;
}
function holidaysOn(d){
  const y=Number(d.slice(0,4));const out=[];
  holidaySources().forEach(s=>{holidaysFor(s.cc,y).forEach(([dt,name])=>{if(dt!==d)return;const h=out.find(x=>x.name===name);if(h){if(!h.who.includes(s.who))h.who.push(s.who);}else out.push({name,who:[s.who],cc:s.cc});});});
  X.holidays.forEach(h=>{if(h.date===d&&!out.some(x=>x.name===h.name))out.push({name:h.name,who:['Added by you'],custom:true});});
  return out;
}
function holidayLabel(d){const hs=holidaysOn(d);return hs.length?hs.map(h=>h.name).join(', '):''}
function holidayTagHtml(d){const hs=holidaysOn(d);if(!hs.length)return'';return'<span class="tag hol" title="'+esc(hs.map(h=>h.name+' · '+h.who.join(', ')).join('; '))+'">'+svg('sun')+esc(hs[0].name)+(hs.length>1?' +'+(hs.length-1):'')+'</span>';}
function monthHolidaysHtml(ym){
  const[y,m]=ym.split('-').map(Number);const last=new Date(Date.UTC(y,m,0,12)).getUTCDate();const rows=[];
  for(let i=1;i<=last;i++){const d=ym+'-'+pad(i);holidaysOn(d).forEach(h=>rows.push({d,...h}));}
  if(!rows.length)return'';
  return'<div class="card holcard"><div class="sec-h" style="margin:0 2px 6px"><h3 style="font-size:16.5px">Holidays</h3><span class="cnt">'+esc(fmtYm(ym))+'</span></div>'
    +rows.map(r=>'<div class="holrow"><span class="hd">'+parseYmd(r.d).getUTCDate()+'</span><span class="hn">'+esc(r.name)+'</span><span class="hw">'+esc(r.who.join(', '))+'</span></div>').join('')+'</div>';
}

/* ============================================================ AWAY (time off planner)
   A planned trip lives in X.trips, synced with the rest of your settings. Its days count as vacation,
   so streaks pause and the calendar marks them. The page lists what to finish before leaving, what
   would be missed while away, and what waits on return. */
function activeTrip(){
  const today=todayStr();
  const list=X.trips.filter(t=>t.to>=today).sort((a,b)=>a.from.localeCompare(b.from));
  return list[0]||null;
}
function pruneTrips(){
  const cut=addLocalDays(todayStr(),-90);const n=X.trips.length;
  X.trips=X.trips.filter(t=>t.to>=cut);
  if(X.trips.length!==n)saveX();
}
function tripDays(tr){return daysBetweenU(tr.from,tr.to)+1}
function openTripSheet(id){
  const tr=id?X.trips.find(t=>t.id===id):null;const today=todayStr();
  const from=tr?tr.from:addLocalDays(today,7),to=tr?tr.to:addLocalDays(today,13);
  openSheet('<div class="sh-head"><span class="st">'+(tr?'Change the dates':'Plan time away')+'</span><button class="sh-x" data-close>Cancel</button></div><div class="sh-body last">'
    +'<p class="hint" style="margin:0 2px 14px">Pick the first and last day you are away. Those days pause streaks and overdue penalties, and the Away tab shows what to finish before you go.</p>'
    +'<div class="field"><label>First day away</label><input class="inp" type="date" id="trFrom" value="'+from+'" min="'+(tr?'':today)+'"></div>'
    +'<div class="field"><label>Last day away</label><input class="inp" type="date" id="trTo" value="'+to+'"></div>'
    +'<p class="hint" id="trHint"></p>'
    +'<button class="btn primary" id="trSave" style="width:100%;margin-top:6px">'+(tr?'Save dates':'Plan it')+'</button></div>',{kind:'trip',narrow:true});
  const f=$('#trFrom'),t=$('#trTo'),hint=$('#trHint');
  const upd=()=>{if(f.value&&t.value&&t.value<f.value)t.value=f.value;
    if(f.value&&t.value){const n=daysBetweenU(f.value,t.value)+1;const miss=awayData({from:f.value,to:t.value}).missed.length;
      hint.textContent=plural(n,'day')+' away, '+fmtShort(f.value)+' to '+fmtShort(t.value)+(miss?'. '+plural(miss,'task')+' currently fall on those days.':'. Nothing is scheduled on those days yet.');}
    else hint.textContent='';};
  f.onchange=upd;t.onchange=upd;upd();
  $('#trSave').onclick=()=>{
    if(!f.value||!t.value){toast('Pick both dates');return;}
    if(t.value<f.value){toast('The last day cannot be before the first');return;}
    if(tr){tr.from=f.value;tr.to=t.value;}
    else X.trips.push({id:uid(),from:f.value,to:t.value,createdAt:new Date().toISOString()});
    saveX();closeSheet();UI.tab='away';saveUi();render();window.scrollTo(0,0);
    toast(tr?'Dates updated':'Time away planned · '+fmtDM(f.value)+' to '+fmtDM(t.value));
  };
}
async function removeTrip(id){
  const tr=X.trips.find(t=>t.id===id);if(!tr)return;
  if(!await ask({title:'Remove this plan?',body:'Your tasks stay exactly where they are.',ok:'Remove',danger:true}))return;
  const copy={...tr};
  X.trips=X.trips.filter(t=>t.id!==id);saveX();render();
  toast('Plan removed',()=>{X.trips.push(copy);saveX();render();});
}
/* everything the page needs for a trip, computed fresh each time */
function awayData(tr){
  const today=todayStr();
  const before=addLocalDays(tr.from,-1),after=addLocalDays(tr.to,1),afterEnd=addLocalDays(tr.to,7);
  const live=t=>!t.archivedAt&&!isNote(t)&&!t.habit;
  const finish=[],missed=[],back=[],repeats=new Map();let done=0;
  const planned=tr.createdAt?localDay(tr.createdAt):today;
  tasks.forEach(t=>{
    if(!live(t))return;
    if(t.rrule){
      // repeats are routine: only the times that fall on away days are shown, grouped by task
      const occ=occurrences(t,tr.from>today?tr.from:today,tr.to).filter(d=>!isCompleted(t.id,d));
      if(occ.length)repeats.set(t.id,{task:t,dates:occ});
      return;
    }
    if(t.status==='done'){if(t.completedAt&&localDay(t.completedAt)>=planned&&(!t.due||t.due<tr.from))done++;return;}
    const inst=openInstanceUpTo(t,afterEnd);const d=inst?inst.date:t.due;
    const dl=t.deadline&&t.deadline>=today&&t.deadline<=tr.to;
    if(tr.from>today&&((d&&d<tr.from)||(!d&&t.deadline&&t.deadline<tr.from)||dl&&(!d||d<tr.from)))finish.push({task:t,date:d||t.deadline,dlOnly:!d});
    else if(d&&d>=tr.from&&d<=tr.to)missed.push({task:t,date:d,inWindow:true});
    else if(dl&&d>tr.to)missed.push({task:t,date:d,dlOnly:true});
    else if(d&&d>=after&&d<=afterEnd)back.push({task:t,date:d});
  });
  finish.sort((a,b)=>String(a.date).localeCompare(String(b.date))||manualCmp(a,b));
  missed.sort((a,b)=>String(a.date).localeCompare(String(b.date))||manualCmp(a,b));
  back.sort((a,b)=>String(a.date).localeCompare(String(b.date))||manualCmp(a,b));
  return{finish,missed,back,repeats:[...repeats.values()],done,before,after};
}
function awayMove(items,where){
  const tr=activeTrip();if(!tr)return;
  const to=where==='before'?addLocalDays(tr.from,-1):addLocalDays(tr.to,1);
  const list=items.filter(o=>o.task);if(!list.length)return;
  withUndo('Moved '+(list.length===1?'“'+titleOf(list[0].task)+'”':plural(list.length,'task'))+' to '+fmtRel(to),()=>{list.forEach(o=>rescheduleInst(o.task,o.date,to,true));});
  render();
}
function awayMoveAll(where){
  const tr=activeTrip();if(!tr)return;
  const d=awayData(tr);
  awayMove(d.missed.filter(o=>!o.dlOnly),where);
}
function awaySkip(t){
  const tr=activeTrip();if(!tr)return;
  const occ=occurrences(t,tr.from,tr.to).filter(d=>!isCompleted(t.id,d)&&d>=todayStr());
  if(!occ.length)return;
  withUndo('Skipped '+plural(occ.length,'time')+' of “'+titleOf(t)+'” while away',()=>{const now=new Date().toISOString();occ.forEach(d=>exceptions.push({id:uid(),taskId:t.id,action:'skip',date:d,at:now}));saveExc();});
  render();
}

function awayGrouped(list){
  const today=todayStr();const groups=[];
  list.forEach(o=>{const d=o.date||'';const k=d<today?'late':d;const g=groups.find(x=>x.k===k);if(g)g.items.push(o);else groups.push({k,items:[o]});});
  return groups.map(g=>'<div class="aw-day'+(g.k==='late'?' late':'')+'">'+(g.k==='late'?'Overdue':g.k===today?'Today':esc(fmtRel(g.k))+' · '+esc(fmtDM(g.k)))+'<span>'+g.items.length+'</span></div>'+awayRows(g.items,'finish')).join('');
}
function awayRows(list,key,opts){
  opts=opts||{};

    let acts='';
    if(opts.acts){acts='<div class="aw-acts"><button class="chip sm" data-awmove="'+o.task.id+'|'+(o.date||'')+'|before">'+svg('chevl')+'Before I go</button><button class="chip sm" data-awmove="'+o.task.id+'|'+(o.date||'')+'|after">After I am back'+svg('chev')+'</button></div>';}
    return rowHtml({task:o.task,date:o.date,dlOnly:o.dlOnly},'search')+acts;}).join('')+'</div>';
}

    +'<div class="aw-btns"><button class="chip sm" data-awedit="'+tr.id+'">'+svg('edit')+'Dates</button><button class="chip sm" data-awdel="'+tr.id+'">'+svg('trash')+'Remove</button></div></div>';
  if(!awayNow)h+='<div class="aw-prog"><div class="bar"><i style="width:'+pct+'%"></i></div><div class="lab">'+(left?plural(left,'task')+' left to finish before you go':'Nothing left to finish before you go')+(d.done?' · '+d.done+' done since you planned this':'')+'</div></div>';
  else h+='<div class="aw-prog"><div class="lab">'+(d.missed.length?plural(d.missed.length,'task')+' waiting on your away days':'Nothing waiting on your away days')+'. Streaks and overdue penalties are paused.</div></div>';
  h+='</section>';

    h+='<div class="sec-h"><h3>Finish before you go</h3><span class="cnt">'+(left||'none')+'</span><span class="sp"></span><button class="lnk" data-addon="'+d.before+'">Add one</button></div>';
    h+=left?awayGrouped(d.finish):'<div class="quiet">Nothing dated before you leave. Overdue tasks and anything due up to '+esc(fmtDM(d.before))+' would show here.</div>';

      +'<div class="aw-acts"><button class="chip sm" data-awskip="'+t.id+'">'+svg('x')+'Skip while away</button></div>';}).join('')+'</div>';
  if(!d.missed.length&&!d.repeats.length)h+='<div class="quiet">Nothing falls on those days. Enjoy.</div>';
  const bk=UI.collapsed['awback'];

  else if(!d.back.length)h+='<div class="quiet">A clear first week back. Nothing is dated '+esc(fmtDM(d.after))+' to '+esc(fmtDM(addLocalDays(tr.to,7)))+' yet.</div>';
  return h;
}

/* ============================================================ TIME LOG (monthly) */
function timeMonthData(ym){
  const[y,m]=ym.split('-').map(Number);
  const start=new Date(y,m-1,1).getTime(),end=new Date(y,m,1).getTime(),now=Date.now();
  const byTask=new Map();let total=0,live=false;
  timelog.forEach(r=>{
    const s=Math.max(r.s,start),e=Math.min(r.e==null?now:r.e,end);if(e<=s)return;
    const ms=e-s;total+=ms;const t=tasks.find(x=>x.id===r.taskId);
    const o=byTask.get(r.taskId)||{id:r.taskId,title:t?titleOf(t):(r.title||'Removed task'),client:t?t.client:r.client,exists:!!t,ms:0,n:0,live:false};
    o.ms+=ms;o.n++;if(r.e==null){o.live=true;live=true;}byTask.set(r.taskId,o);
  });
  const byClient=new Map();byTask.forEach(o=>byClient.set(o.client,(byClient.get(o.client)||0)+o.ms));
  return{total,live,tasks:[...byTask.values()].sort((a,b)=>b.ms-a.ms),clients:[...byClient].map(([c,ms])=>({c,ms})).sort((a,b)=>b.ms-a.ms)};
}
function shiftYm(ym,n){const[y,m]=ym.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+n,1,12));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)}
function fmtYm(ym){const[y,m]=ym.split('-').map(Number);return MONTHS[m-1]+' '+y}

/* ============================================================ GITHUB STYLE GRAPHS
   One square a day, a year at a time. The shade of a square is relative to your own busier days
   (the 90th percentile), so a quiet year still shows its rhythm. */
function ghRange(sel){
  const today=todayStr();
  if(!/^\d{4}$/.test(String(sel))){const end=addLocalDays(mondayOf(today),6);return{start:addLocalDays(end,-53*7+1),end,from:addLocalDays(today,-364),to:today,label:'in the last year'};}
  const y=String(sel),first=y+'-01-01',last=y+'-12-31';
  return{start:mondayOf(first),end:addLocalDays(mondayOf(last),6),from:first,to:last<today?last:today,label:'in '+y};
}
function ghYears(counts){
  const now=Number(todayStr().slice(0,4));let first=now;
  counts.forEach((n,d)=>{const y=Number(d.slice(0,4));if(n>0&&y<first&&y>now-8)first=y;});
  const out=[];for(let y=now;y>=first;y--)out.push(String(y));return out;
}
function ghStats(counts,from,to){
  let total=0,active=0,best=0,bestDay=null,longest=0,run=0;
  for(let d=from,i=0;d<=to&&i<400;d=addLocalDays(d,1),i++){const n=counts.get(d)||0;total+=n;
    if(n){active++;run++;longest=Math.max(longest,run);if(n>best){best=n;bestDay=d;}}else run=0;}
  // the current run counts back from today, or from yesterday while today is still empty
  let cur=0;{let d=todayStr();if(!(counts.get(d)>0))d=addLocalDays(d,-1);while((counts.get(d)||0)>0&&cur<5000){cur++;d=addLocalDays(d,-1);}}
  return{total,active,best,bestDay,cur,longest};
}
function ghStat(v,l){return'<div class="gh-stat"><b'+(typeof v==='number'?' data-count="'+v+'"':'')+'>'+esc(typeof v==='number'?v.toLocaleString('en-GB'):String(v))+'</b><span>'+esc(l)+'</span></div>'}
function ghGraphHtml(o){
  const r=ghRange(o.sel);const today=todayStr();
  const vals=[];for(let d=r.from,i=0;d<=r.to&&i<400;d=addLocalDays(d,1),i++){const n=o.counts.get(d)||0;if(n)vals.push(n);}
  vals.sort((a,b)=>a-b);const cap=vals.length?Math.max(1,vals[Math.floor((vals.length-1)*.9)]):1;
  const weeks=Math.round((daysBetweenU(r.start,r.end)+1)/7);
  let cells='',total=0,prevM=-1;const labs=[];
  for(let w=0;w<weeks;w++){
    const wk=addLocalDays(r.start,w*7);const m=parseYmd(addLocalDays(wk,6)).getUTCMonth();
    if(m!==prevM){labs.push([w,m]);prevM=m;}
    for(let i=0;i<7;i++){const d=addLocalDays(wk,i);
      if(d<r.from||d>r.to){cells+='<i class="o"></i>';continue;}
      const n=o.counts.get(d)||0;total+=n;
      const l=n?Math.min(4,Math.max(1,Math.ceil(n/cap*4))):0;
      cells+='<i class="l'+l+(d===today?' now':'')+'" data-gd="'+d+'" data-gn="'+n+'" style="--w:'+(w+i)+'"></i>';}
  }
  // a month label needs room, so one squeezed in right before the next is dropped
  const months=labs.filter((x,i)=>!labs[i+1]||labs[i+1][0]-x[0]>=3).map(([w,m])=>'<span style="grid-column:'+(w+1)+'">'+MONTHS[m]+'</span>').join('');
  const years=o.years||[];
  return'<div class="gh-top"><h3><b>'+total.toLocaleString('en-GB')+'</b> '+esc(total===1?o.unit[0]:o.unit[1])+' '+esc(r.label)+'</h3>'
    +'<div class="gh-years"><button data-ghy="'+o.key+'|last" class="'+(o.sel==='last'?'on':'')+'">12 months</button>'
    +years.map(y=>'<button data-ghy="'+o.key+'|'+y+'" class="'+(String(o.sel)===y?'on':'')+'">'+y+'</button>').join('')+'</div></div>'
    +'<div class="gh-scroll"><div class="gh-body" style="--weeks:'+weeks+'"><div class="gh-days"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>'
    +'<div><div class="gh-months">'+months+'</div><div class="gh-cells">'+cells+'</div></div></div></div>'
    +'<div class="gh-foot"><span class="gh-hint">'+(isPhone()?'Tap':'Point at')+' a square for the day</span><span class="sp"></span>Less<i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i>More</div>';
}
function ghTasksHtml(st){
  const counts=st.counts;const r=ghRange(UI.ghYear);const g=ghStats(counts,r.from,r.to);
  let h='<section class="card gh" data-ghkey="tasks" data-u1="task completed" data-u2="tasks completed" style="--gc:var(--brand)">';
  h+=ghGraphHtml({key:'tasks',counts,sel:UI.ghYear,unit:['task completed','tasks completed'],years:ghYears(counts)});

const LQ={w:''};

/* ---- numbers for the pages ---- */
function weightSeries(){
  const by=new Map();
  life.forEach(r=>{if(r.kind!=='weight'||!(r.kg>0))return;const p=by.get(r.date);if(!p||String(r.createdAt)>String(p.createdAt))by.set(r.date,r);});
  return[...by.values()].sort((a,b)=>a.date.localeCompare(b.date));
}
function weightStats(){
  const s=weightSeries();if(!s.length)return null;
  const cur=s[s.length-1],start=s[0];
  const before=d=>{let v=null;for(const r of s){if(r.date<=d)v=r;else break;}return v};
  const w7=before(addLocalDays(cur.date,-7)),w30=before(addLocalDays(cur.date,-30));
  const goal=X.life.goal;let pct=null;
  if(goal&&Math.abs(start.kg-goal)>.05)pct=Math.max(0,Math.min(100,Math.round((start.kg-cur.kg)/(start.kg-goal)*100)));
  return{s,cur,start,d7:w7?cur.kg-w7.kg:null,d30:w30?cur.kg-w30.kg:null,goal,pct,toGoal:goal?cur.kg-goal:null};
}
/* green when the change heads toward the goal, red when it heads away. With no goal it stays neutral */
function deltaCls(d,st){if(d==null||Math.abs(d)<.05||!st||!st.goal||Math.abs(st.start.kg-st.goal)<.05)return'';const down=st.goal<st.start.kg;return(d<0)===down?' good':' bad'}
function workoutStats(){
  const all=lifeOf('workout');const today=todayStr();const mon=mondayOf(today);const ym=today.slice(0,7);
  const wk=all.filter(r=>r.date>=mon&&r.date<=addLocalDays(mon,6)),mo=all.filter(r=>r.date.slice(0,7)===ym);
  const weeks=new Set(all.map(r=>mondayOf(r.date)));
  let streak=0;{let m=weeks.has(mon)?mon:addLocalDays(mon,-7);while(weeks.has(m)&&streak<600){streak++;m=addLocalDays(m,-7);}}
  const mins=l=>l.reduce((s,r)=>s+(r.mins||0),0);
  return{all,wk:wk.length,wkMins:mins(wk),mo:mo.length,moMins:mins(mo),streak,moKm:mo.reduce((s,r)=>s+(r.km||0),0)};
}
function journalStats(){
  const all=lifeOf('journal');const today=todayStr();const days=new Set(all.map(r=>r.date));
  let streak=0;{let d=days.has(today)?today:addLocalDays(today,-1);while(days.has(d)&&streak<5000){streak++;d=addLocalDays(d,-1);}}
  let best=0,run=0,prev=null;[...days].sort().forEach(x=>{run=prev&&addLocalDays(prev,1)===x?run+1:1;best=Math.max(best,run);prev=x;});
  const mo=all.filter(r=>r.date.slice(0,7)===today.slice(0,7));
  const moods=all.filter(r=>r.mood&&r.date>addLocalDays(today,-14));
  return{all,streak,best,mo:mo.length,moWords:mo.reduce((s,r)=>s+journalWords(r),0),today:all.filter(r=>r.date===today),mood:moods.length?moods.reduce((s,r)=>s+r.mood,0)/moods.length:null};
}
function moodByDay(){
  const m=new Map();lifeOf('journal').forEach(r=>{if(!r.mood)return;const a=m.get(r.date)||[];a.push(r.mood);m.set(r.date,a);});
  const o=new Map();m.forEach((a,d)=>o.set(d,a.reduce((x,y)=>x+y,0)/a.length));return o;
}
function lifeCounts(kind){const m=new Map();life.forEach(r=>{if(kind!=='all'&&r.kind!==kind)return;m.set(r.date,(m.get(r.date)||0)+1);});return m}

function weightChartHtml(series,range){
  const today=todayStr();
  const from=range==='1m'?addLocalDays(today,-30):range==='3m'?addLocalDays(today,-91):range==='1y'?addLocalDays(today,-365):(series[0]?series[0].date:today);
  const pts=series.filter(r=>r.date>=from);
  if(!pts.length)return'<div class="quiet" style="margin-top:12px">'+(series.length?'No weigh-ins in this stretch. Try a longer one.':'Log your weight and the trend draws itself here.')+'</div>';
  const ph=isPhone();const W=ph?360:640,H=ph?220:230,pl=ph?34:40,pr=ph?8:12,pt=16,pb=26;
  const xs=range==='all'?(pts.length>1?pts[0].date:addLocalDays(pts[0].date,-7)):from;const span=Math.max(1,daysBetweenU(xs,today));
  const X_=d=>pl+(W-pl-pr)*Math.max(0,daysBetweenU(xs,d))/span;
  const vals=pts.map(r=>toUnit(r.kg));const goal=X.life.goal?toUnit(X.life.goal):null;
  let lo=Math.min(...vals),hi=Math.max(...vals);
  // the goal joins the scale when it is within reach (15% either side), so the line shows how far is left
  const mid=(lo+hi)/2;if(goal&&Math.abs(goal-mid)<=mid*.15){lo=Math.min(lo,goal);hi=Math.max(hi,goal);}
  const pv=Math.max(.6,(hi-lo)*.14);lo-=pv;hi+=pv;
  const Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  // a seven day trailing average smooths out water weight
  const avg=pts.map((r,i)=>{let s=0,n=0;for(let j=i;j>=0&&daysBetweenU(pts[j].date,r.date)<7;j--){s+=vals[j];n++;}return s/n;});
  const line=arr=>arr.map((v,i)=>(i?'L':'M')+X_(pts[i].date).toFixed(1)+' '+Y(v).toFixed(1)).join('');
  let g='<svg class="wchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weight trend"><defs><linearGradient id="wgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--wc);stop-opacity:.26"/><stop offset="1" style="stop-color:var(--wc);stop-opacity:0"/></linearGradient></defs>';
  for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3,y=Y(v);g+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text x="'+(pl-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+(Math.round(v*10)/10).toFixed(1)+'</text>';}
  for(let i=0;i<=3;i++){const d=addLocalDays(xs,Math.round(span*i/3));g+='<text x="'+X_(d).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+(i===0?'start':i===3?'end':'middle')+'">'+esc(fmtDM(d))+'</text>';}
  if(goal&&goal>=lo&&goal<=hi)g+='<line class="goal" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(goal).toFixed(1)+'" y2="'+Y(goal).toFixed(1)+'"/><text class="gt" x="'+(W-pr)+'" y="'+(Y(goal)-6).toFixed(1)+'" text-anchor="end">goal '+(Math.round(goal*10)/10).toFixed(1)+'</text>';
  if(pts.length>1){const a=line(avg);
    g+='<path class="area" d="'+a+'L'+X_(pts[pts.length-1].date).toFixed(1)+' '+(H-pb)+'L'+X_(pts[0].date).toFixed(1)+' '+(H-pb)+'Z"/><path class="raw" d="'+line(vals)+'"/><path class="avg" pathLength="1" d="'+a+'"/>';}
  const many=pts.length>45;
  pts.forEach((r,i)=>{g+='<circle class="dot" style="--k:'+Math.round(i/pts.length*40)+'" cx="'+X_(r.date).toFixed(1)+'" cy="'+Y(vals[i]).toFixed(1)+'" r="'+(many?2.4:4)+'" data-lid="'+r.id+'"><title>'+esc(fmtShort(r.date)+' · '+fmtW(r.kg))+'</title></circle>';});
  return g+'</svg>';
}
function wkBarsHtml(){

function quickWeigh(){
  const inp=$('#lwIn');const v=parseFloat(String((inp?inp.value:LQ.w)||'').replace(',','.'));
  if(!(v>0)){if(inp)inp.focus();toast('Type your weight first');return;}
  const today=todayStr();const kg=fromUnit(v);
  const ex=life.filter(r=>r.kind==='weight'&&r.date===today).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))[0];
  const before=weightStats();
  if(ex)ex.kg=kg;else{const r=normLife({kind:'weight',kg,date:today});life.push(r);markFresh(r.id);}
  saveLife();LQ.w='';play('done');render();successBurst(KIND_COLOR.weight);
  const big=$('#screen .wbig[data-count]');if(big&&before){big.dataset.from=Math.round(toUnit(before.cur.kg)*10)/10;countUp(big.parentElement);}
  const st=weightStats();
  toast((ex?'Updated today · ':'Logged · ')+fmtW(kg)+(st&&st.d7!=null?' · '+fmtWDelta(st.d7)+' in a week':''));
}
function setGoalWeight(){
  const v=prompt('Goal weight in '+X.life.unit+' (leave empty to clear)',X.life.goal?wNum(X.life.goal).replace(/,/g,''):'');
  if(v===null)return;
  if(!v.trim()){X.life.goal=null;saveX();render();toast('Goal cleared');return;}
  const n=parseFloat(v.replace(',','.'));if(!(n>0)){toast('That is not a weight');return;}
  X.life.goal=fromUnit(n);saveX();render();toast('Goal set · '+fmtW(X.life.goal));
}

function lifeClick(e,T){
  let el;

  if((el=T.closest('[data-ghy]'))){const[k,y]=el.dataset.ghy.split('|');if(k==='tasks')UI.ghYear=y;else UI.lifeYear=y;saveUi();render();ghSwap(k);return true;}
  if((el=T.closest('[data-lkind]'))){UI.lifeKind=el.dataset.lkind;saveUi();render();ghSwap('life');return true;}
  if((el=T.closest('[data-lnew]'))){openLifeSheet(el.dataset.lnew);return true;}
  if((el=T.closest('[data-jnew]'))){openLifeSheet('journal',null,{format:el.dataset.jnew});return true;}
  if((el=T.closest('[data-lid]'))){openLifeSheet(null,el.dataset.lid);return true;}
  if((el=T.closest('[data-lact]'))){if(el.dataset.lact==='wtypes')openWorkoutTypes(null);else openJournalFormats(null);return true;}
  if((el=T.closest('[data-wlog]'))){quickWeigh();return true;}
  if((el=T.closest('[data-wgoal]'))){setGoalWeight();return true;}
  if((el=T.closest('[data-wrange]'))){UI.weightRange=el.dataset.wrange;saveUi();render();return true;}
  if((el=T.closest('[data-wkf]'))){UI.wkType=el.dataset.wkf;saveUi();render();return true;}
  if((el=T.closest('[data-jff]'))){UI.jFormat=el.dataset.jff;saveUi();render();return true;}
  if((el=T.closest('[data-life]'))){go('life',el.dataset.life);return true;}

}

function lifeFromDraft(){

function lifeReady(explicit){
  const d=LD;if(!d)return false;
  if(d.kind==='weight')return parseFloat(String(d._w||'').replace(',','.'))>0;
  if(d.kind==='workout')return explicit||!!LORIG||!!(d.mins||d.km||d.kcal||(d.title||'').trim()||(d.note||'').trim()||(d.ex||[]).some(e=>String(e.name||'').trim()));

function commitLife(){

function rerenderLife(focusSel){
  const b=$('#lfWrap');const y=b?b.scrollTop:0;

function switchJFormat(fid){
  const f=jformatOf(fid);if(!f||!LD)return;
  // answers carry over where the prompt matches, anything else you wrote moves into the page so nothing is lost
  const old=LD.answers.filter(a=>a.a.trim()).map(a=>({...a}));
  const answers=f.prompts.map(q=>{const m=old.find(a=>a.q===q&&!a.used);if(m){m.used=true;return{q,a:m.a};}return{q,a:''};});
  const left=old.filter(a=>!a.used);
  if(left.length)LD.body=left.map(a=>a.q+'\n'+a.a).join('\n\n')+(LD.body.trim()?'\n\n'+LD.body:'');
  LD.format=f.id;LD.formatName=f.name;LD.answers=answers;rerenderLife();
}

function noteDirty(){

  clearTimeout(nTimer);nTimer=setTimeout(()=>commitNote(false),450);

/* only the fields you changed are written, so an edit made to the same note on another device survives */
function commitNote(final){
  clearTimeout(nTimer);
  if(!NDRAFT)return;
  const d=NDRAFT;
  let n=notebook.find(x=>x.id===d.id);
  if(!n){
    const has=d.title.trim()||d.body.trim();
    if(!has){if(final){NDRAFT=null;NORIG=null;}return;}
    // a brand new note, or one removed on another device while it was open here: your words bring it back
    n=normNote({...(NORIG||{}),...d});delete n.updatedAt;
    notebook.push(n);markFresh(n.id);delete X.tomb['n:'+n.id];
    const del=$('#nDelete');if(del)del.innerHTML=svg('trash')+'Delete';
    const cr=$('#sheet .crumb .n');if(cr)cr.textContent=cr.textContent.replace(' · New note','');
  }else{
    const base=NORIG||{};
    ['title','body','client','pinned'].forEach(k=>{if(JSON.stringify(d[k])!==JSON.stringify(base[k]))n[k]=d[k];});
  }
  saveNotes();
  d.updatedAt=n.updatedAt;
  const sv=$('#nSaved');if(sv){sv.classList.remove('saving');sv.lastChild.textContent='Saved';}
  if(final){NDRAFT=null;NORIG=null;render();}
  else if(UI.tab==='notes'&&!DRAG.on)render();
}
function bindNoteSheet(){
  const sh=$('#sheet');
  const ti=$('#nTitle');autosize(ti);
  ti.oninput=()=>{NDRAFT.title=ti.value.replace(/\n/g,' ');autosize(ti);noteDirty();};
  ti.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const b=$('#nBody');if(b){b.focus();b.setSelectionRange(0,0);}}};
  const bd=$('#nBody');
  const setBody=v=>{NDRAFT.body=v;noteDirty();};
  if(bd){
    autosize(bd);
    bd.oninput=()=>{autosize(bd);setBody(bd.value);};
    // return carries a list on, return on an empty item ends it
    bd.onkeydown=e=>{
      if(e.key!=='Enter'||e.shiftKey||e.isComposing)return;
      const v=bd.value,p=bd.selectionStart;const ls=v.lastIndexOf('\n',p-1)+1;const line=v.slice(ls,p);
      const m=line.match(/^(\s*)([-*+] \[[ xX]\] |[-*+] |(\d+)[.)] )/);if(!m)return;
      e.preventDefault();
      if(line.trim()===m[2].trim()){bd.value=v.slice(0,ls)+v.slice(p);bd.setSelectionRange(ls,ls);}
      else{let mk=m[2];if(m[3])mk=(Number(m[3])+1)+mk.slice(m[3].length);mk=mk.replace(/\[[xX]\]/,'[ ]');
        const ins='\n'+m[1]+mk;bd.value=v.slice(0,p)+ins+v.slice(bd.selectionEnd);bd.setSelectionRange(p+ins.length,p+ins.length);}
      autosize(bd);setBody(bd.value);
    };
  }
  $$('[data-nmdw]',sh).forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>mdWrap($('#nBody'),b.dataset.nmdw,setBody);});
  $$('[data-nmdl]',sh).forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>mdLine($('#nBody'),b.dataset.nmdl,setBody);});
  $$('[data-nmdlink]',sh).forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{const u=prompt('Link address');if(!u)return;const ta=$('#nBody');const s=ta.selectionStart,e2=ta.selectionEnd;const txt=ta.value.slice(s,e2)||'link';
    ta.value=ta.value.slice(0,s)+'['+txt+']('+(/^https?:|^mailto:/i.test(u)?u:'https://'+u)+')'+ta.value.slice(e2);ta.focus();mdDone(ta,setBody);};});
  $$('[data-nmode]',sh).forEach(b=>b.onclick=()=>{nPreview=b.dataset.nmode==='read';rerenderNote(nPreview?null:'#nBody');});
  $('#nPin').onclick=()=>{NDRAFT.pinned=!NDRAFT.pinned;play('tick');commitNote(false);rerenderNote();};
  $('#nClient').onclick=e=>{
    openMenu(e.currentTarget,[['__none','No client',svg('x'),!NDRAFT.client?'on':'']].concat(CLIENTS.map(c=>[c.id,c.name,dotIcon(c.color),c.id===NDRAFT.client?'on':''])),k=>{
      NDRAFT.client=k==='__none'?null:k;commitNote(false);rerenderNote();},{title:'Client'});
  };
  $('#nMore').onclick=e=>{
    const btn=e.currentTarget;
    openMenu(btn,[['task','Turn into a task','totask'],['dup','Duplicate','copy'],['copy','Copy the text','copy'],'-',['del','Delete note','trash','danger']],k=>{
      commitNote(false);const cur=notebook.find(x=>x.id===NDRAFT.id)||NDRAFT;
      if(k==='task'){const nt=noteToTask(cur);toast('Task created · the note is kept',()=>{commitNote(true);SHEET.beforeClose=null;closeSheet(true);setTimeout(()=>openTaskSheet(nt.id),320);},'Open task');}
      else if(k==='dup'){const c2=normNote({...clone(cur),id:uid(),title:(cur.title||'Untitled')+' copy',createdAt:new Date().toISOString(),sortIndex:(cur.sortIndex||0)+.5});delete c2.updatedAt;
        notebook.push(c2);saveNotes();markFresh(c2.id);render();toast('Duplicated');}
      else if(k==='copy'){const txt=(cur.title?cur.title+'\n\n':'')+(cur.body||'');try{navigator.clipboard.writeText(txt).then(()=>toast('Copied'),()=>prompt('Copy the note',txt));}catch(_){prompt('Copy the note',txt);}}
      else if(k==='del')$('#nDelete').click();
    });
  };
  $('#nDone').onclick=()=>closeSheet();
  $('#nSave').onclick=()=>closeSheet();
  $('#nDelete').onclick=async()=>{
    const id=NDRAFT.id;const saved=notebook.some(x=>x.id===id);

    if(!NDRAFT)return;
    clearTimeout(nTimer);NDRAFT=null;NORIG=null;SHEET.beforeClose=null;closeSheet(true);
    if(saved)deleteNote(id);

}

/* ============================================================ POST READY TILL
   How far ahead the posts are prepared: a date on the task, kept on the series when the task repeats. The furthest
   date per client is that client's runway, shown on the Board so you can see at a glance where to plan next. */
function readyState(d){const n=dayDiff(d);return n<0?'out':n<=3?'low':n<14?'thin':'ok';}
function readyChip(t){
  if(!t.readyTill||isNote(t))return'';
  return'<span class="mt ready '+readyState(t.readyTill)+'" data-readyedit="'+t.id+'" title="Post ready till '+esc(fmtShort(t.readyTill))+'. Tap to update">'+svg('ready')+'Ready till '+fmtDM(t.readyTill)+'</span>';
}
function runwayData(){
  const best=new Map();
  tasks.forEach(t=>{if(!t.readyTill||isNote(t))return;const b=best.get(t.client);if(!b||t.readyTill>b.readyTill)best.set(t.client,t);});
  return[...best.values()].filter(t=>dayDiff(t.readyTill)>=-21).sort((a,b)=>a.readyTill.localeCompare(b.readyTill));
}
function runwayHtml(){
  const fc=UI.view.fClient;const list=runwayData().filter(t=>fc==='all'||t.client===fc);
  if(!list.length)return'';
  return'<section class="runway"><div class="rw-h"><h3>Posts ready</h3><span>How far ahead you are</span></div><div class="rw-row">'+list.map(t=>{
    const c=clientOf(t.client),d=t.readyTill,n=dayDiff(d);
    return'<button class="rw '+readyState(d)+'" data-readyedit="'+t.id+'" style="--c:'+c.color+';--p:'+Math.max(4,Math.min(100,n/30*100))+'%"><span class="rw-n"><i></i>'+esc(c.name)+'</span>'
      +'<b>'+(n<0?'Ran out':n===0?'Today':plural(n,'day'))+'</b><span class="rw-d">'+(n<0?'last covered '+esc(fmtDM(d)):'till '+esc(fmtShort(d)))+'</span><span class="rw-bar"><i></i></span></button>';
  }).join('')+'</div></section>';
}
/* the picker, in the task sheet and on its own: add to what is already prepared, or pick the date */
function readyPanelBody(cur,attr,inputId){
  const today=todayStr();const base=cur&&cur>today?cur:today;
  const eom=s=>{const[y,m]=s.split('-').map(Number);return y+'-'+pad(m)+'-'+pad(new Date(Date.UTC(y,m,0,12)).getUTCDate())};
  let end=eom(base);if(end===base)end=eom(addLocalDays(base,1));
  const opts=[['+3 days',addLocalDays(base,3)],['+1 week',addLocalDays(base,7)],['+2 weeks',addLocalDays(base,14)],['End of month',end]];
  let sum='How far ahead are the posts prepared? Pick the last date they cover.';
  if(cur){const n=dayDiff(cur);sum=n<0?'Ran out '+plural(-n,'day')+' ago, on '+esc(fmtShort(cur)):n===0?'Ready till today':'<b>'+plural(n,'day')+'</b> ahead, ready till '+esc(fmtShort(cur));}

function openReadySheet(id){

/* ============================================================ EDITING LOGGED TIME
   Any stretch can be changed, stopped, removed or added at any time, from the task sheet, from the clock on a card, or
   from the monthly log, even when the task itself is gone. Changes apply as you make them; Undo stays on offer after. */
const RUNAWAY=8*3600000; // a clock past this long has usually been left running
const TE={id:null,before:null,added:false,stopped:null,total:false,all:false,task:null,ym:null};
function ymWindow(ym){const[y,m]=ym.split('-').map(Number);return{a:new Date(y,m-1,1).getTime(),b:new Date(y,m,1).getTime()};}
function tmLen(r,win,now){const e=r.e==null?(now||Date.now()):r.e;return win?Math.max(0,Math.min(e,win.b)-Math.max(r.s,win.a)):Math.max(0,e-r.s);}
function tmRecords(id,ym){const win=ym?ymWindow(ym):null;return timelog.filter(r=>r.taskId===id&&tmLen(r,win)>0).sort((a,b)=>b.s-a.s);}
function tmSum(id,ym){const win=ym?ymWindow(ym):null,now=Date.now();return tmRecords(id,ym).reduce((s,r)=>s+tmLen(r,win,now),0);}
function tmParts(ms){const d=new Date(ms);return{date:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),time:pad(d.getHours())+':'+pad(d.getMinutes())};}
function tmJoin(date,time){const[y,m,d]=date.split('-').map(Number);const[h,mi]=time.split(':').map(Number);return new Date(y,m-1,d,h,mi).getTime();}
function tmSpan(r){
  const a=fmtClockTime(r.s);if(r.e==null)return a+' – now';
  const nd=daysBetweenU(tmParts(r.s).date,tmParts(r.e).date);
  return a+' – '+fmtClockTime(r.e)+(nd>0?' +'+nd+'d':'');
}
function tmNote(r){return(r.src==='manual'?' · by hand':'')+(r.by&&r.by!==meName()?' · '+r.by:'')}
function tmEditorHtml(r){
  const live=r.e==null,st=tmParts(r.s),mins=Math.round(((live?Date.now():r.e)-r.s)/60000);
  return'<div class="tmed" data-tmfor="'+r.id+'">'
    +'<div class="tmf"><label for="tfd">Date</label><input class="inp" id="tfd" type="date" data-tf="date" value="'+st.date+'" max="'+todayStr()+'"></div>'
    +'<div class="tmf2"><div class="tmf"><label for="tff">From</label><input class="inp" id="tff" type="time" data-tf="from" value="'+st.time+'"></div>'
    +'<div class="tmf"><label for="tft">To</label><input class="inp" id="tft" type="time" data-tf="to" value="'+(live?'':tmParts(r.e).time)+'"></div></div>'
    +'<div class="tmf"><label>How long</label><div class="tmdur"><button class="tstep" data-tstep="-15" aria-label="15 minutes less">−15m</button>'
    +'<span class="tmdin"><input type="number" inputmode="numeric" min="0" max="9999" data-tf="h" value="'+Math.floor(mins/60)+'" aria-label="Hours"><i>h</i><input type="number" inputmode="numeric" min="0" max="59" data-tf="m" value="'+(mins%60)+'" aria-label="Minutes"><i>m</i></span>'
    +'<button class="tstep" data-tstep="15" aria-label="15 minutes more">+15m</button></div></div>'
    +'<div class="chips">'+[15,30,60,120,240].map(m=>'<button class="chip sm" data-tset="'+m+'">'+fmtMins(m)+'</button>').join('')+'</div>'
    +(live?'<p class="hint">This clock is still running. Setting a To time stops it there.</p>':'')
    +'<div class="tmacts"><button class="lnkbtn del" data-tldel="'+r.id+'">'+svg('trash')+'Remove</button><span class="sp"></span><button class="chip sm on" data-tmclose>Done</button></div></div>';
}
function tmRowHtml(r){
  const live=r.e==null,open=TE.id===r.id;

function tmListHtml(id,ym){
  TE.task=id;TE.ym=ym||null;

function openTimeSheet(id,ym){

/* adding time from the monthly log: pick the task first */
function openTimePicker(){

    +'<input class="inp" type="search" id="ppQ" placeholder="Search tasks" style="margin-bottom:12px"><div id="ppList"></div></div>',{kind:'parent',narrow:true});

    $('#ppList').innerHTML=cands.filter(t=>!qv||t.title.toLowerCase().includes(qv)||clientOf(t.client).name.toLowerCase().includes(qv)).slice(0,50)
      .map(t=>'<div class="row-link" data-pp="'+t.id+'"><span><i class="dot" style="margin-right:8px;background:'+clientOf(t.client).color+'"></i>'+esc(titleOf(t))+'<span class="sub">'+esc(clientOf(t.client).name)+'</span></span></div>').join('')||'<p class="hint">No tasks match.</p>';
    $$('[data-pp]').forEach(el=>el.onclick=()=>{openTimeSheet(el.dataset.pp,ym);tmAdd();});};
  $('#ppQ').oninput=draw;draw();

function tmRefresh(){
  if(!$('#sheet').hidden){if(SHEET.kind==='task'&&draft)rerenderSheet();else if(SHEET.kind==='time')openTimeSheet(TE.task,TE.ym);}
  render();
}
function tmLog(id,what){const t=tasks.find(x=>x.id===id);if(!t)return;logAct(t,what);saveTasks();if(draft&&draft.id===id)draft.activity=clone(t.activity);}
/* applies a change straight away. The first change of an edit remembers the stretch as it was, for Undo */
function tmApply(r,s,e){
  const now=Date.now();
  if(!TE.before||TE.before.id!==r.id)TE.before={...r};
  s=Math.min(s,now-60000);
  if(e!=null){e=Math.min(e,now);if(e-s<60000)s=Math.min(s,e-60000);}
  const stopping=r.e==null&&e!=null;
  r.s=s;r.e=e;saveTime();
  if(stopping){
    const t=tasks.find(x=>x.id===r.taskId);
    if(t&&t.status==='doing'){
      TE.stopped={id:t.id};t.status='todo';logAct(t,'Clock stopped by hand');
      if(draft&&draft.id===t.id)draft.status='todo';
      if(draftOrig&&draftOrig.id===t.id)draftOrig.status='todo';
      saveTasks();
    }
  }
  tmPaint(r);render();
}
function tmPaint(r){
  const box=$('[data-tmrow="'+r.id+'"]');if(!box)return;
  const live=r.e==null,ms=(live?Date.now():r.e)-r.s,mins=Math.round(ms/60000);
  box.querySelector('.tmr').textContent=tmSpan(r)+tmNote(r);
  const v=box.querySelector('.tmv');v.textContent=fmtDur(ms);v.classList.toggle('live',live);
  const set=(k,val)=>{const i=box.querySelector('[data-tf="'+k+'"]');if(i&&document.activeElement!==i)i.value=val;};
  const p=tmParts(r.s);set('date',p.date);set('from',p.time);set('to',live?'':tmParts(r.e).time);set('h',Math.floor(mins/60));set('m',mins%60);
  const tot=$('#tmTotal');if(tot)tot.textContent=fmtDur(tmSum(r.taskId,SHEET.kind==='time'?TE.ym:null));
}
/* an edit is finished: say what changed and offer it back */
function tmFinish(){
  const r=TE.id?timelog.find(x=>x.id===TE.id):null,b=TE.before,added=TE.added,stopped=TE.stopped;
  TE.before=null;TE.added=false;TE.stopped=null;
  if(!r)return;
  const len=x=>Math.max(0,(x.e==null?Date.now():x.e)-x.s);
  if(added){
    tmLog(r.taskId,'Added '+fmtDur(len(r))+' by hand');play('time');
    toast('Added '+fmtDur(len(r)),()=>{play('undo');timelog=timelog.filter(x=>x.id!==r.id);saveTime();tmRefresh();});
    return;
  }
  if(!b||(b.s===r.s&&b.e===r.e))return;
  tmLog(r.taskId,'Time changed from '+fmtDur(len(b))+' to '+fmtDur(len(r)));play('time');haptic(8);
  toast('Time changed from '+fmtDur(len(b))+' to '+fmtDur(len(r)),()=>{
    play('undo');const c=timelog.find(x=>x.id===b.id);if(!c)return;
    c.s=b.s;c.e=b.e;saveTime();
    if(stopped){const t=tasks.find(x=>x.id===stopped.id);if(t){t.status='doing';if(draft&&draft.id===t.id)draft.status='doing';if(draftOrig&&draftOrig.id===t.id)draftOrig.status='doing';saveTasks();}}
    tmRefresh();
  });
}
function tmAdd(){
  tmFinish();
  const id=TE.task,t=tasks.find(x=>x.id===id),any=timelog.find(r=>r.taskId===id);
  const now=Date.now(),win=TE.ym?ymWindow(TE.ym):null,e=win&&now>=win.b?win.b-6*3600000:now;
  const r=normTime({id:uid(),taskId:id,title:t?titleOf(t):any?any.title:'',client:t?t.client:any?any.client:null,s:e-1800000,e,by:meName(),src:'manual',dev:DEV_ID});
  timelog.push(r);saveTime();
  TE.id=r.id;TE.added=true;TE.total=false;play('add');tmRefresh();
}
function tmRemove(id){
  const r=timelog.find(x=>x.id===id);if(!r)return;
  const copy={...r},added=TE.added&&TE.id===id;
  TE.id=null;TE.before=null;TE.added=false;TE.stopped=null;
  timelog=timelog.filter(x=>x!==r);saveTime();
  play('del');haptic(12);
  if(!added&&copy.e==null)trackStatus(); // a task still in progress starts counting afresh from now
  tmRefresh();
  if(added)return;
  tmLog(copy.taskId,'Removed a stretch of '+fmtDur((copy.e==null?Date.now():copy.e)-copy.s));
  toast('Removed '+fmtDur((copy.e==null?Date.now():copy.e)-copy.s),()=>{
    if(timelog.some(x=>x.id===copy.id))return;
    play('undo');delete X.tomb['tl:'+copy.id];timelog.push(normTime(copy));saveTime();dedupeTime();tmRefresh();
  });
}
/* set a total: a lower one trims the longest stretches first, a higher one logs the difference as its own stretch */
function tmSetTotal(id,ym,target){
  const now=Date.now(),win=ym?ymWindow(ym):null,list=tmRecords(id,ym),cur=tmSum(id,ym);
  if(Math.abs(target-cur)<30000)return;
  const before=list.map(r=>({...r}));let extra=null;
  if(target>cur){
    const t=tasks.find(x=>x.id===id),any=list[0],e=win&&now>=win.b?win.b-6*3600000:now;
    extra=normTime({id:uid(),taskId:id,title:t?titleOf(t):any?any.title:'',client:t?t.client:any?any.client:null,s:e-(target-cur),e,by:meName(),src:'manual',dev:DEV_ID});
    timelog.push(extra);
  }else{
    let cut=cur-target;
    list.slice().sort((a,b)=>tmLen(b,win,now)-tmLen(a,win,now)).forEach(r=>{
      if(cut<=0)return;
      const len=tmLen(r,win,now),keep=len-Math.min(cut,len);cut-=len-keep;
      if(keep<60000){if(r.e==null){r.s=now-60000;return;}timelog=timelog.filter(x=>x!==r);return;}
      if(r.e==null)r.s=now-keep;else r.e=(win?Math.max(r.s,win.a):r.s)+keep;
    });
  }
  saveTime();TE.total=false;TE.id=null;tmLog(id,'Total time set to '+fmtDur(target));
  play('time');haptic(10);tmRefresh();
  toast('Total set to '+fmtDur(target),()=>{
    play('undo');const ids=new Set(before.map(r=>r.id));if(extra)ids.add(extra.id);
    timelog=timelog.filter(r=>!ids.has(r.id)).concat(before.map(normTime));
    before.forEach(r=>{delete X.tomb['tl:'+r.id]});saveTime();tmRefresh();
  });
}
function bindTimeEditor(sh){
  const q=s=>sh.querySelectorAll(s);
  q('[data-tmedit]').forEach(b=>b.onclick=()=>{const id=b.dataset.tmedit,was=TE.id===id;tmFinish();TE.id=was?null:id;TE.total=false;tmRefresh();});
  q('[data-tmclose]').forEach(b=>b.onclick=()=>{tmFinish();TE.id=null;tmRefresh();});
  q('[data-tmadd]').forEach(b=>b.onclick=tmAdd);
  q('[data-tmtotal]').forEach(b=>b.onclick=()=>{tmFinish();TE.id=null;TE.total=!TE.total;tmRefresh();});
  q('[data-tmmore]').forEach(b=>b.onclick=()=>{TE.all=!TE.all;tmRefresh();});
  q('[data-tmapply]').forEach(b=>b.onclick=()=>{const h=Math.max(0,Number($('#tmTotH').value)||0),m=Math.max(0,Number($('#tmTotM').value)||0);tmSetTotal(TE.task,TE.ym,(h*60+m)*60000);});
  q('[data-tmopen]').forEach(b=>b.onclick=()=>{const id=TE.task;closeSheet(true);setTimeout(()=>openTaskSheet(id),320);});
  q('[data-tldel]').forEach(b=>b.onclick=()=>tmRemove(b.dataset.tldel));
  const ed=sh.querySelector('.tmed[data-tmfor]');if(!ed)return;
  const r=timelog.find(x=>x.id===ed.dataset.tmfor);if(!r)return;

/* numbers count up to their value. data-dec keeps decimals, data-from starts somewhere other than zero */
function countUp(root){
  if(reducedMotion())return;
  root.querySelectorAll('[data-count]').forEach(el=>{const to=Number(el.dataset.count)||0;const dec=Number(el.dataset.dec)||0;const from=el.dataset.from!=null?Number(el.dataset.from):0;
    if(!dec&&to<2&&el.dataset.from==null)return;const t0=performance.now(),d=dec?1100:1000;
    const fmt=v=>dec?v.toLocaleString('en-GB',{minimumFractionDigits:dec,maximumFractionDigits:dec}):Math.round(v).toLocaleString('en-GB');
    const step=t=>{const p=Math.min(1,(t-t0)/d);const e=1-Math.pow(1-p,3);el.firstChild.nodeValue=fmt(from+(to-from)*e);if(p<1&&el.isConnected)requestAnimationFrame(step);};
    if(!el.firstChild||el.firstChild.nodeType!==3)el.insertBefore(document.createTextNode(''),el.firstChild);
    el.firstChild.nodeValue=fmt(from);requestAnimationFrame(step);delete el.dataset.from;});
}

}
/* on a phone the three board columns scroll sideways; the pills above follow along and jump to a column */
function bindBoardPager(){
  const bd=$('#screen .board');const pg=$('#screen .bpager');if(!bd||!pg)return;
  const btns=[...pg.querySelectorAll('[data-bcol]')];
  const sync=()=>{const cols=[...bd.children];let best=0,bd0=Infinity;const x=bd.getBoundingClientRect().left;
    cols.forEach((c,i)=>{const d=Math.abs(c.getBoundingClientRect().left-x-16);if(d<bd0){bd0=d;best=i;}});
    btns.forEach((b,i)=>b.classList.toggle('on',i===best));placeInd(pg,'bpager',true);};
  bd.addEventListener('scroll',()=>{cancelAnimationFrame(bd._raf);bd._raf=requestAnimationFrame(sync);},{passive:true});
  btns.forEach((b,i)=>b.onclick=()=>{const c=bd.children[i];if(c)bd.scrollTo({left:c.offsetLeft-bd.children[0].offsetLeft,behavior:reducedMotion()?'auto':'smooth'});});
  sync();
}
/* the opening screen stays until the fonts are in, so nothing on the board jumps as it appears */
function hideBoot(){
  const b=$('#boot');if(!b){BOOTING=false;return;}
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const minWait=new Promise(r=>setTimeout(r,Math.max(0,(reduce?150:760)-performance.now())));
  const fonts=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1600))]):Promise.resolve();
  Promise.all([minWait,fonts]).then(()=>{
    BOOTING=false;try{renderShell();}catch(e){}
    b.classList.add('out');animateEnter();barGo();
    setTimeout(()=>b.remove(),700);
  });
}

const SHEET={kind:null,onClose:null,beforeClose:null,narrow:false};
function openSheet(html,opts){
  opts=opts||{};
  const sh=$('#sheet'),sc=$('#scrim');
  // contents rise in only when the sheet first opens, not each time it redraws
  if(sh.hidden||!sh.classList.contains('show')){sh.classList.add('opening');clearTimeout(SHEET.ot);SHEET.ot=setTimeout(()=>sh.classList.remove('opening'),700);play('open');haptic(6);
    document.documentElement.style.setProperty('--po',Math.round(window.scrollY+innerHeight/2)+'px');document.body.classList.add('sheet-up');}
  SHEET.kind=opts.kind||null;SHEET.onClose=opts.onClose||null;SHEET.beforeClose=null;
  sh.className='sheet'+(opts.narrow?' narrow':'')+(opts.tall?' tall':'')+(sh.classList.contains('show')?' show':'')+(sh.classList.contains('opening')?' opening':'');
  sh.innerHTML='<div class="sh-grab" data-grab></div>'+html;
  sc.hidden=false;sh.hidden=false;
  requestAnimationFrame(()=>{sc.classList.add('show');sh.classList.add('show')});
  document.body.style.overflow='hidden';
  bindSheetCommon();
}
function closeSheet(force){
  if(SHEET.beforeClose&&!force){const f=SHEET.beforeClose;let keep=false;try{keep=f()===false}catch(e){console.error(e)}if(keep)return;}
  SHEET.beforeClose=null;
  stopRecording(true);closeMenu();tmFinish();TE.id=null;TE.total=false;TE.all=false;
  const sh=$('#sheet'),sc=$('#scrim');
  if(sh.classList.contains('show'))play('close');
  sc.classList.remove('show');sh.classList.remove('show');sh.style.transform='';sc.style.opacity='';
  document.body.style.overflow='';document.body.classList.remove('sheet-up');
  const cb=SHEET.onClose;SHEET.onClose=null;SHEET.kind=null;
  setTimeout(()=>{if(sh.classList.contains('show'))return;sc.hidden=true;sh.hidden=true;sh.innerHTML='';if(cb)cb();if(pendingRender)render();},300);
}
$('#scrim').addEventListener('click',()=>closeSheet());
function bindSheetCommon(){
  const sh=$('#sheet');
  $$('[data-close]',sh).forEach(b=>b.onclick=()=>closeSheet());

    comments:[],activity:[],resetSubs:false,rDirty:false,...(preset||{})};
