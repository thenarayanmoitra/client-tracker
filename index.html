/* ============================================================ focus mode */
let focusQueue=[],focusPos=0,focusTimer=null,focusRemain=0,focusMinutes=25,focusRunning=false;
const FOREST='<svg class="forest" viewBox="0 0 400 140" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><path d="M0 110C60 90 120 96 200 100S320 86 400 96V140H0z" fill="#1E5546"/>'
  +[[20,70],[48,52],[80,64],[300,58],[330,44],[362,60],[390,50]].map(([x,y],i)=>'<path d="M'+x+' '+(y)+'l14 '+(30)+'h-8l12 '+(24)+'h-36l12-24h-8z" fill="'+(i%2?'#2C7A61':'#246A54')+'"/>').join('')
  +'<path d="M0 124C100 112 260 118 400 112V140H0z" fill="#16443A"/></svg>';
function startFocus(startId,queueIds){
  let q;
  if(queueIds)q=queueIds;
  else q=todaysTasks().filter(o=>o.task.focusOn!==false&&!isNote(o.task)&&!isDoneInst(o.task,o.date)).map(o=>o.task.id);
  if(startId){const i=q.indexOf(startId);if(i>0)q=q.slice(i).concat(q.slice(0,i));else if(i<0)q=[startId].concat(q);}
  focusQueue=q.filter(Boolean);focusPos=0;
  if(!focusQueue.length){toast('Nothing to focus on right now');return;}
  focusRunning=false;stopTimer();focusRemain=0;
  $('#focus').hidden=false;requestAnimationFrame(()=>$('#focus').classList.add('show'));
  renderFocus();
}
function currentFocusTask(){const id=focusQueue[focusPos];return tasks.find(t=>t.id===id)}
function renderFocus(){
  const t=currentFocusTask();
  if(!t){exitFocus();return;}
  const c=clientOf(t.client);
  const mins=String(Math.floor(focusRemain/60)).padStart(2,'0');
  const secs=String(focusRemain%60).padStart(2,'0');
  const total=focusMinutes*60;const prog=total?(1-focusRemain/total)*100:0;
  let checks='';
  if(t.subtasks.length){
    checks='<div class="focus-checks">'+visibleIdx(t.subtasks,false).map(i=>{const s=t.subtasks[i];return'<div class="focus-check'+(s.done?' done':'')+'" data-fcheck="'+i+'" style="padding-left:'+((s.depth||0)*22)+'px"><span class="fb">'+svg('check')+'</span><span>'+esc(s.text)+'</span></div>'}).join('')+'</div>';}
  const timerBlock=focusRunning||focusRemain>0
    ?'<div class="focus-timer">'+mins+'<span class="sep">:</span>'+secs+'</div><div class="focus-track"><i style="width:'+prog+'%"></i></div>'
    :'<div class="focus-mins">'+[15,25,45,60].map(m=>'<button class="focus-min'+(focusMinutes===m?' on':'')+'" data-fmin="'+m+'">'+m+' min</button>').join('')+'</div>';
  $('#focus').innerHTML=FOREST+'<div class="focus-in">'
    +'<div class="focus-top"><button class="focus-close" id="fClose">Close</button><span class="focus-count">'+(focusPos+1)+' of '+focusQueue.length+'</span></div>'
    +'<div class="focus-mid"><div class="focus-client"><i class="dot" style="background:'+c.color+'"></i>'+esc(c.name)+'</div>'
    +'<div class="focus-title">'+esc(titleOf(t))+'</div>'+timerBlock+checks+'</div>'
    +'<div class="focus-actions">'
    +(focusPos<focusQueue.length-1?'<button class="focus-btn sec" id="fNext">Skip</button>':'')
    +'<button class="focus-btn main" id="fDone">'+(focusRunning?'Pause':'Complete')+'</button>'
    +(focusRunning?'':'<button class="focus-btn sec" id="fPlay">'+(focusRemain>0?'Resume':'Start timer')+'</button>')
    +'</div></div>';
  $('#fClose').onclick=exitFocus;
  $('#fDone').onclick=()=>{if(focusRunning){stopTimer();renderFocus();}else completeFocusTask();};
  const nx=$('#fNext');if(nx)nx.onclick=advanceFocus;
  const pl=$('#fPlay');if(pl)pl.onclick=()=>{if(!focusRemain)focusRemain=focusMinutes*60;startTimer();renderFocus();};
  $$('[data-fmin]',$('#focus')).forEach(b=>b.onclick=()=>{focusMinutes=Number(b.dataset.fmin);renderFocus();});
  $$('[data-fcheck]',$('#focus')).forEach(el=>el.onclick=()=>{const i=Number(el.dataset.fcheck);const s=t.subtasks[i];s.done=!s.done;
    const end=blockEnd(t.subtasks,i);for(let k=i+1;k<end;k++)t.subtasks[k].done=s.done;
    const st=ckStats(t.subtasks);if(s.done&&st.d===st.n)play('list');else play(s.done?'tick':'untick');saveTasks();renderFocus();});
}
function completeFocusTask(){
  const t=currentFocusTask();if(!t)return;
  const inst=openTodayInstance(t);
  if(setInstDone(t,inst?inst.date:todayStr(),true,{smart:true}))afterComplete();
  advanceFocus();
}
function advanceFocus(){stopTimer();focusRemain=0;focusPos++;if(focusPos>=focusQueue.length){exitFocus();return;}renderFocus();}
function startTimer(){
  stopTimer();focusRunning=true;
  focusTimer=setInterval(()=>{
    focusRemain--;
    if(focusRemain<=0){stopTimer();focusRemain=0;try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}play('remind');toast('Time is up. Complete it or start another round.');renderFocus();return;}
    const el=$('.focus-timer');if(el){const m=String(Math.floor(focusRemain/60)).padStart(2,'0'),s=String(focusRemain%60).padStart(2,'0');el.innerHTML=m+'<span class="sep">:</span>'+s;}
    const tr=$('.focus-track > i');if(tr)tr.style.width=((1-focusRemain/(focusMinutes*60))*100)+'%';
  },1000);
}
function stopTimer(){if(focusTimer){clearInterval(focusTimer);focusTimer=null}focusRunning=false;}
function exitFocus(){stopTimer();$('#focus').classList.remove('show');setTimeout(()=>{$('#focus').hidden=true;render();},280);}

/* ============================================================ reminders */
function nowLocalMin(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function taskRep(t){
  const today=todayStr();
  if(t.rrule){const nd=nextDue(t,today);return{date:nd||today,done:isCompleted(t.id,today)};}
  return{date:t.due,done:t.status==='done'};
}
function computeRemindAt(t){
  if(!t.remind||t.remind==='none')return null;
  if(t.remind==='custom')return t.remindAt||null;
  const rep=taskRep(t);if(!rep.date||rep.done)return null;
  const tm=t.dueTime||'09:00';
  if(t.remind==='attime')return rep.date+'T'+tm;
  if(t.remind==='before30'){const mins=toMin(tm)-30;
    return mins>=0?rep.date+'T'+fromMin(mins):addLocalDays(rep.date,-1)+'T'+fromMin(mins+1440);}
  if(t.remind==='due9')return rep.date+'T09:00';
  if(t.remind==='due18')return rep.date+'T18:00';
  if(t.remind==='before1d9')return addLocalDays(rep.date,-1)+'T09:00';
  return null;
}
function ensureNotifyPermission(){try{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();}catch(e){}}
function notify(title,body){try{if('Notification'in window&&Notification.permission==='granted')new Notification(title,{body,icon:'/favicon-192.png'});}catch(e){}}
function checkReminders(){
  const now=nowLocalMin();
  const cutoff=addLocalDays(todayStr(),-1)+'T'+now.slice(11);
  let changed=false;
  tasks.forEach(t=>{
    if(t.archivedAt)return;
    const at=computeRemindAt(t);if(!at||at>now)return;
    const key=t.id+'|'+at;if(fired.includes(key))return;
    fired.push(key);changed=true;
    // reminders that lapsed while the board was closed are marked as seen, not fired on open
    if(at>=cutoff&&initDone){notify('Task reminder',titleOf(t)+' · '+clientOf(t.client).name);play('remind');toast('Reminder · '+titleOf(t));}
  });
  if(changed)saveFired();
}

function fullBlob(){return{version:SCHEMA,schema:SCHEMA,exportedAt:new Date().toISOString(),tasks,completions,exceptions,routines,templates,meetings,x:X,fired,cfg:cfgObj(),notebook}}
function backupData(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(fullBlob(),null,2)],{type:'application/json'}));
  a.download='taskboard-backup-'+todayStr()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),100);
}
function restoreData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=async()=>{let b;try{b=JSON.parse(r.result)}catch(e){toast('That file could not be read');return;}
      if(!Array.isArray(b.tasks)){toast('That file has no tasks in it');return;}
      if(!confirm('Replace this board with the '+b.tasks.length+' tasks'+(Array.isArray(b.notebook)?' and '+plural(b.notebook.length,'note'):'')+' in that file? The current board is saved as an earlier copy first.'+(Array.isArray(b.notebook)?'':' Your notes are kept as they are.')))return;
      store.set('pn_tb2_before_restore',JSON.stringify(fullBlob()));
      try{await sbUpsert(SB_ROW+'_bak_before_restore',{...buildSnapshot(),_backupOf:Date.now()});}catch(e){}
      replaceAll(b);closeSheet(true);render();toast('Restored from the backup file');
    };
    r.readAsText(f);};
  inp.click();
}
function exportCsv(){
  const esc2=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['Title','Client','Assignee','Type','Priority','Date','Time','Duration','Deadline','Repeat','Status','Labels','Checklist','Description'].join(',')];
  tasks.forEach(t=>{const s=ckStats(t.subtasks);rows.push([esc2(t.title),esc2(clientOf(t.client).name),esc2(t.assignee),t.type,PRIO_P[t.priority],t.due||'',t.dueTime||'',t.estimate||'',t.deadline||'',esc2(repeatLabel(t.rrule)),t.rrule?'repeating':t.status,esc2(t.labels.join(' ')),s.n?s.d+'/'+s.n:'',esc2(t.notes||'')].join(','))});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
  a.download='tasks-'+todayStr()+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),100);
}

/* ============================================================ toast */
let toastTimer=null;
function toast(msg,action,label){
  const t=$('#toast'),u=$('#toastUndo');
  $('#toastText').textContent=msg;
  if(action){u.hidden=false;u.textContent=label||'Undo';u.onclick=()=>{u.hidden=true;t.classList.remove('show');setTimeout(()=>t.hidden=true,300);action();};}
  else{u.hidden=true;u.onclick=null;}
  t.hidden=false;requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.classList.remove('show');setTimeout(()=>{if(!t.classList.contains('show'))t.hidden=true},300)},action?6000:3200);
}

/* ============================================================ taps on the screen (one delegated handler) */
const TICKING=new Set();
function tickClicked(b){
  const t=tasks.find(x=>x.id===b.dataset.tick);if(!t)return;
  const date=b.dataset.date||todayStr();
  const key=t.id+'|'+date;if(TICKING.has(key))return; // a second tap while the first is landing is ignored
  const want=!isDoneInst(t,date);
  TICKING.add(key);
  b.classList.toggle('on',want);
  if(want){b.classList.add('pop');const row=b.closest('.row');if(row&&UI.tab==='today'&&row.dataset.drag)row.classList.add('leaving');}
  const smart=UI.tab==='today'||UI.tab==='board';
  setTimeout(()=>{TICKING.delete(key);if(isDoneInst(t,date)!==want)toggleDone(t,date,smart);else render();},want?260:40);
}
function onScreenClick(e){
  const T=e.target;let el;
  if(T.closest('#qaGo')){quickAdd();return;}
  if((el=T.closest('[data-tick]'))){e.stopPropagation();tickClicked(el);return;}
  if((el=T.closest('[data-htick]'))||(el=T.closest('[data-hcell]'))){const[id,d]=(el.dataset.htick||el.dataset.hcell).split('|');const t=tasks.find(x=>x.id===id);if(t)toggleDone(t,d,false);return;}
  if((el=T.closest('[data-ckexp]'))){const id=el.dataset.ckexp;if(EXPANDED.has(id))EXPANDED.delete(id);else EXPANDED.add(id);render();return;}
  if((el=T.closest('[data-rtick]'))){
    const[id,i]=el.dataset.rtick.split('|');const t=tasks.find(x=>x.id===id);if(!t)return;
    const list=t.subtasks;const it=list[Number(i)];if(!it)return;it.done=!it.done;
    const end=blockEnd(list,Number(i));for(let k=Number(i)+1;k<end;k++)list[k].done=it.done;
    const st=ckStats(list);
    if(it.done&&st.d===st.n){play('list');confetti(.45);if(!t.rrule&&t.status!=='done')setTimeout(()=>toast('Checklist complete',()=>{toggleDone(t,t.due||todayStr(),true);},'Complete task'),200);}
    else play(it.done?'tick':'untick');
    saveTasks();render();return;
  }
  if((el=T.closest('[data-rfold]'))){const[id,i]=el.dataset.rfold.split('|');const t=tasks.find(x=>x.id===id);if(!t)return;const it=t.subtasks[Number(i)];it.collapsed=!it.collapsed;saveTasks();render();return;}
  if((el=T.closest('[data-rmore]'))){rowMenu(el,tasks.find(x=>x.id===el.dataset.rmore),el.dataset.date||null);return;}
  if((el=T.closest('[data-poststatus]'))){cyclePostStatus(tasks.find(x=>x.id===el.dataset.poststatus));return;}
  if((el=T.closest('[data-layout]'))){UI.todayLayout=el.dataset.layout;saveUi();render();return;}
  if((el=T.closest('[data-fold]'))){const k=el.dataset.fold;if(UI.collapsed[k])delete UI.collapsed[k];else UI.collapsed[k]=true;saveUi();render();return;}
  if((el=T.closest('[data-act]'))){screenAct(el.dataset.act,el);return;}
  if((el=T.closest('[data-go]'))){go(el.dataset.go);return;}
  if((el=T.closest('[data-qa]'))){qaAct(el.dataset.qa,el);return;}
  if((el=T.closest('[data-qadate]'))){QA.date=el.dataset.qadate;render();const q=$('#qaIn');if(q&&!isPhone())q.focus({preventScroll:true});return;}
  if((el=T.closest('[data-clearf]'))){UI.view[el.dataset.clearf]='all';saveUi();render();return;}
  if((el=T.closest('[data-weekday]'))){UI.weekSel=el.dataset.weekday;UI.weekMode='day';saveUi();render();return;}
  if((el=T.closest('[data-wk]'))){const v=Number(el.dataset.wk);UI.weekOff=v===0?0:(UI.weekOff||0)+v;
    UI.weekSel=UI.weekOff===0?todayStr():addLocalDays(mondayOf(todayStr()),7*UI.weekOff);saveUi();render();return;}
  if((el=T.closest('[data-wmode]'))){UI.weekMode=el.dataset.wmode;saveUi();render();return;}
  if((el=T.closest('[data-addon]'))){openTaskSheet(null,{due:el.dataset.addon});return;}
  if((el=T.closest('[data-cal]'))){const v=Number(el.dataset.cal);if(v===0){UI.calMonth=todayStr().slice(0,7);UI.calSel=todayStr();saveUi();render();}else shiftMonth(v);return;}
  if((el=T.closest('[data-calday]'))){UI.calSel=el.dataset.calday;if(UI.calSel.slice(0,7)!==UI.calMonth)UI.calMonth=UI.calSel.slice(0,7);saveUi();render();
    if(window.innerWidth<880)setTimeout(()=>{const p=$('.dpanel');if(p)p.scrollIntoView({behavior:'smooth',block:'start'});},40);return;}
  if((el=T.closest('[data-calmode]'))){UI.calMode=el.dataset.calmode;saveUi();render();return;}
  if((el=T.closest('[data-bscope]'))){UI.boardScope=el.dataset.bscope;saveUi();render();return;}
  if((el=T.closest('[data-bclient]'))){UI.view.fClient=el.dataset.bclient;saveUi();render();return;}
  if((el=T.closest('[data-bnew]'))){openTaskSheet(null,{status:el.dataset.bnew});return;}
  if((el=T.closest('[data-hwk]'))){UI.habitWeekOff=Math.min(0,(UI.habitWeekOff||0)+Number(el.dataset.hwk));saveUi();render();return;}
  if((el=T.closest('[data-mkhabit]'))){const t=tasks.find(x=>x.id===el.dataset.mkhabit);if(t){withUndo('Tracking · '+titleOf(t),()=>{t.habit=true;saveTasks();});render();}return;}
  if((el=T.closest('[data-goal]'))){const[k,v]=el.dataset.goal.split('|');
    if(k==='d')X.dailyGoal=Math.max(1,Math.min(99,X.dailyGoal+Number(v)));else X.weeklyGoal=Math.max(5,Math.min(500,X.weeklyGoal+Number(v)));saveX();render();return;}
  if((el=T.closest('[data-chart]'))){UI.chart=el.dataset.chart;saveUi();render();return;}
  if((el=T.closest('[data-dayoff]'))){const d=el.dataset.dayoff;X.daysOff=X.daysOff.includes(d)?X.daysOff.filter(x=>x!==d):X.daysOff.concat(d);saveX();render();return;}
  if((el=T.closest('[data-vac]'))){setVacation(!vacationActive());return;}
  if((el=T.closest('[data-vacoff]'))){setVacation(false);return;}
  if((el=T.closest('[data-xtoggle]'))){const k=el.dataset.xtoggle;X[k]=!X[k];saveX();render();return;}
  if((el=T.closest('[data-tlb]'))){openTaskSheet(el.dataset.tid);return;}
  if((el=T.closest('.tl'))){
    if(T.closest('.tl-now'))return;
    const g=tlGeom(el);const r=el.getBoundingClientRect();const m=Math.floor((g.s+(e.clientY-r.top)/g.ppm)/30)*30;
    openTaskSheet(null,{due:el.dataset.tl,dueTime:fromMin(m),estimate:30});return;
  }
  if((el=T.closest('#nqGo'))){const t=NQ.text;NQ.text='';createNote(t,true);return;}
  if((el=T.closest('[data-npin]'))){toggleNotePin(el.dataset.npin);return;}
  if((el=T.closest('[data-nid]'))){openNoteSheet(el.dataset.nid);return;}
  if((el=T.closest('[data-open]'))){openTaskSheet(el.dataset.open);return;}
  if((el=T.closest('[data-row]'))){openTaskSheet(el.dataset.tid);return;}
}
function screenAct(a,el){
  if(a==='view')openViewSheet();
  else if(a==='focus')startFocus(null);
  else if(a==='overdue'){const today=todayStr();moveOverdueToToday(todaysTasks().filter(o=>!o.task.habit&&o.date<today&&!isNote(o.task)&&matchesFilters(o)));}
  else if(a==='showdone'){UI.showDone=!UI.showDone;saveUi();render();}
  else if(a==='cleardone')clearCompleted();
  else if(a==='newhabit')openHabitSheet();
  else if(a==='newnote')createNote('',true);
}
function qaAct(a,el){
  if(a==='client')pickClientMenu(el,qaClient(),cid=>{QA.client=cid;render();});
  else if(a==='prio')prioMenu(el,QA.prio,p=>{QA.prio=p;render();});
  else if(a==='full'){const p=parseQuick(QA.text);openTaskSheet(null,{title:p.title,due:qaDate(),client:p.client||qaClient(),priority:p.prio||QA.prio});QA.text='';}
}
function setVacation(on){
  const today=todayStr();
  if(on){X.vacations.push({from:today,to:null});toast('Vacation mode on. Streaks are paused.');}
  else{const v=X.vacations[X.vacations.length-1];if(v&&!v.to){v.to=today;if(v.to<v.from)v.to=v.from;}toast('Welcome back. Vacation mode is off.');}
  saveX();render();
}
$('#screen').addEventListener('click',onScreenClick);
$('#screen').addEventListener('input',e=>{if(e.target.id==='qaIn'){QA.text=e.target.value;const g=$('#qaGo');if(g)g.disabled=!QA.text.trim();}
  else if(e.target.id==='nqIn')NQ.text=e.target.value;
  else if(e.target.id==='nsQ'){UI.notesQ=e.target.value;saveUi();render();}});
$('#screen').addEventListener('keydown',e=>{if(e.target.id==='qaIn'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();quickAdd();}
  else if(e.target.id==='nqIn'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();const t=NQ.text;NQ.text='';e.target.value='';createNote(t,true);}});
$('#screen').addEventListener('change',e=>{if(e.target.id==='qaDate'&&e.target.value){QA.date=e.target.value;render();}});
$('#screen').addEventListener('keydown',e=>{const c=e.target.closest&&e.target.closest('[data-calday]');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();c.click();}});

/* ============================================================ chrome */
function onNavClick(e){const m=e.target.closest('[data-tabmore]');if(m){openTabMore(m);return;}const b=e.target.closest('[data-tab]');if(!b)return;go(b.dataset.tab);}
$('#sideNav').addEventListener('click',onNavClick);
$('#tabbar').addEventListener('click',onNavClick);
$('#sideNav').addEventListener('pointerdown',e=>{const el=e.target.closest('[data-drag="tab"]');if(!el)return;
  pressToDrag(e,el,ev=>startSort(ev,el,{itemSel:'.nav-i',listSel:'#sideNav',scroller:$('#side'),
    onDrop:()=>setTabOrder($$('#sideNav > .nav-i').map(b=>b.dataset.tab))}));});
$('#tabbar').addEventListener('pointerdown',e=>{const el=e.target.closest('[data-drag="tab"]');if(!el)return;
  pressToDrag(e,el,ev=>startSort(ev,el,{itemSel:'[data-drag="tab"]',listSel:'#tabbar',axis:'x',noScroll:true,
    onDrop:()=>{const vis=$$('#tabbar > [data-drag="tab"]').map(b=>b.dataset.tab);setTabOrder(vis.concat(orderedTabs().slice(5).map(t=>t[0])));}}));});
$('#sideClients').addEventListener('click',e=>{const r=e.target.closest('[data-sclient]');if(!r||e.target.closest('[data-handle]'))return;
  const id=r.dataset.sclient;UI.view.fClient=UI.view.fClient===id?'all':id;if(!['today','board'].includes(UI.tab))UI.tab='today';saveUi();render();window.scrollTo(0,0);});
$('#sideAddClient').addEventListener('click',()=>{const n=prompt('New client name');if(!n||!n.trim())return;addClient(n.trim());render();});
function newFromContext(){
  let due=todayStr();
  if(UI.tab==='calendar'&&UI.calSel)due=UI.calSel;
  else if(UI.tab==='upcoming'&&UI.weekSel&&UI.weekMode==='day')due=UI.weekSel;
  if(UI.tab==='habits'){openHabitSheet();return;}
  if(UI.tab==='notes'){createNote('',true);return;}
  openTaskSheet(null,{due});
}
$('#btnNew').addEventListener('click',newFromContext);
$('#fab').addEventListener('click',newFromContext);
$('#btnFocus').addEventListener('click',()=>startFocus(null));
$('#btnSettings').addEventListener('click',openSettings);
$('#btnSearch').addEventListener('click',openSearch);
$('#btnSearchWide').addEventListener('click',openSearch);
$('#btnKarma').addEventListener('click',()=>go('progress'));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(MENU)closeMenu();else if(!$('#focus').hidden)exitFocus();else if(!$('#sheet').hidden)closeSheet();return;}
  const typing=e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]');
  if(typing||e.metaKey||e.ctrlKey||e.altKey||!$('#sheet').hidden||!$('#focus').hidden)return;
  if(e.key==='n'||e.key==='q'){e.preventDefault();newFromContext();}
  else if(e.key==='/'){e.preventDefault();openSearch();}
  else if(/^[1-7]$/.test(e.key)){const t=orderedTabs()[Number(e.key)-1];if(t)go(t[0]);}
});
window.addEventListener('scroll',()=>{$('#top').classList.toggle('scrolled',window.scrollY>4);},{passive:true});
document.addEventListener('focusin',e=>{if(isPhone()&&e.target.matches&&e.target.matches('input:not([type=checkbox]):not([type=date]):not([type=color]),textarea'))document.body.classList.add('kb-open');});
document.addEventListener('focusout',()=>{setTimeout(()=>{const a=document.activeElement;if(!(a&&a.matches&&a.matches('input,textarea')))document.body.classList.remove('kb-open');
  if(pendingRender&&!(a&&a.id==='qaIn')&&!DRAG.on&&!TLDRAG.on)render();},60);});
window.addEventListener('beforeunload',()=>{if(draft&&draft.id)commitDraft(false);else if(draft)keepNewDraftCopy();if(NDRAFT)commitNote(false);});
window.addEventListener('pagehide',()=>{if(draft&&draft.id)commitDraft(false);else if(draft)keepNewDraftCopy();if(NDRAFT)commitNote(false);});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(draft&&draft.id)commitDraft(false);else if(draft)keepNewDraftCopy();if(NDRAFT)commitNote(false);if(isDirty())syncNow();}
  else{refreshDate();syncNow();}
});
window.addEventListener('online',()=>syncNow());
window.addEventListener('offline',()=>setSync('offline'));
let resizeT=null;window.addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{if(UI.tab==='calendar'||UI.todayLayout==='schedule')render();else{placeInd($('#sideNav'),'nav',false);placeInd($('#tabbar'),'tab',false);}},200);});

let lastDateStr='';
function refreshDate(){
  const ds=todayStr();
  if(lastDateStr&&ds!==lastDateStr){countEndMemo.clear();if(SYNC.archived)runArchive();if($('#sheet').hidden)render();}
  else if($('#sheet').hidden&&!DRAG.on&&!TLDRAG.on&&(UI.tab==='today'&&UI.todayLayout==='schedule'||UI.tab==='calendar'&&UI.calMode==='schedule')){const n=$('.tl-now');const tl=n&&n.closest('.tl');
    if(n&&tl){const g=tlGeom(tl);const m=new Date().getHours()*60+new Date().getMinutes();n.style.top=Math.round((m-g.s)*g.ppm)+'px';}}
  lastDateStr=ds;
}
function openFromHash(){const m=location.hash.match(/^#task=([\w-]+)/);if(m&&tasks.some(t=>t.id===m[1])){openTaskSheet(m[1]);history.replaceState(null,'',location.pathname+location.search);}}

/* ============================================================ start */
let initDone=false;
safetyCopy('pn_tb2_preupgrade_v5_done','pn_tb2_preupgrade_v5');
safetyCopy('pn_tb2_preupgrade_v6_done','pn_tb2_preupgrade_v6');
loadAll();
if(UI.startTab!=='last')UI.tab=UI.startTab;
render();
hideBoot();
refreshDate();setInterval(refreshDate,60000);
checkReminders();initDone=true;
setInterval(checkReminders,30000);
if(tasks.some(t=>t.remind&&t.remind!=='none'))ensureNotifyPermission();
syncNow().then(openFromHash);
setInterval(()=>{if(!document.hidden)syncNow();},15000);
window.addEventListener('hashchange',openFromHash);
setTimeout(offerDraftRestore,1200);
</script>
