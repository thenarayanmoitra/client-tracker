function ruleToCustom(r){
  if(!r)return{interval:1,unit:'week',byday:[],monthMode:'date'};
  const unit={DAILY:'day',WEEKLY:'week',MONTHLY:'month',YEARLY:'year'}[r.freq]||'week';
  return{interval:r.interval||1,unit,byday:(r.byday||[]).slice(),monthMode:r.bysetpos?'weekday':'date'};
}
function taskToDraft(t){
  let repeatKey='';
  if(t.rrule){
    const r=t.rrule;const iv=r.interval||1;
    if(r.freq==='DAILY')repeatKey=iv===1?'daily':'custom';
    else if(r.freq==='WEEKLY'){
      const d=r.byday||[];
      if(iv===1&&d.length===5&&WEEKDAYS.every(x=>d.includes(x)))repeatKey='weekdays';
      else if(iv===2&&d.length===1)repeatKey='biweekly';
      else if(iv===1&&d.length===1)repeatKey='weekly';
      else repeatKey='custom';
    }
    else if(r.freq==='MONTHLY')repeatKey=iv===1?(r.bysetpos?'monthlyWeekday':'monthly'):'custom';
    else if(r.freq==='YEARLY')repeatKey=iv===1?'yearly':'custom';
  }
  const r=t.rrule||{};
  return{...clone(t),repeatKey,custom:ruleToCustom(t.rrule),endMode:r.until?'until':r.count?'count':'never',until:r.until||null,count:r.count||null,rDirty:false};
}
function draftRule(){
  let rule=null;
  if(draft.repeatKey==='custom'){
    const c=draft.custom||{interval:1,unit:'week',byday:[]};const iv=Math.max(1,Number(c.interval)||1);
    const anchor=parseYmd(draft.due||todayStr());
    if(c.unit==='day')rule={freq:'DAILY',interval:iv};
    else if(c.unit==='week')rule={freq:'WEEKLY',interval:iv,byday:c.byday&&c.byday.length?c.byday.slice():[DOW[anchor.getUTCDay()]]};
    else if(c.unit==='month')rule=c.monthMode==='weekday'?{freq:'MONTHLY',interval:iv,byday:[DOW[anchor.getUTCDay()]],bysetpos:isLastWeekday(anchor)?-1:nthWeekdayPos(anchor)}:{freq:'MONTHLY',interval:iv};
    else rule={freq:'YEARLY',interval:iv};
  }else if(draft.repeatKey)rule=ruleFromPreset(draft.repeatKey,draft.due||todayStr());
  if(rule){
    if(draft.endMode==='until'&&draft.until)rule.until=draft.until;
    if(draft.endMode==='count'&&draft.count>0)rule.count=Math.floor(draft.count);
  }
  return rule;
}
function effRule(){return(draft.rDirty||!draftOrig||draft.due!==draftOrig.due)?draftRule():(draftOrig.rrule?clone(draftOrig.rrule):null)}
function draftHasContent(){return!!(draft&&((draft.title||'').trim()||(draft.notes||'').trim()||draft.subtasks.length||draft.attachments.length||(draft.comments||[]).length))}
function openTaskSheet(id,preset){

function offToDate(off){
  if(off==='none')return null;

  if(off==='sat'){const d=parseYmd(today);const add=(6-d.getUTCDay()+7)%7;return addLocalDays(today,add||0);}

}

function logDiff(t,a,b){
  if(!a)return;
  if(a.title!==b.title)logAct(t,'Renamed to “'+b.title+'”');
  if(a.due!==b.due)logAct(t,b.due?'Date set to '+fmtDM(b.due):'Date removed');
  if((a.dueTime||null)!==(b.dueTime||null))logAct(t,b.dueTime?'Time set to '+fmtTime(b.dueTime):'Time removed');
  if((a.deadline||null)!==(b.deadline||null))logAct(t,b.deadline?'Deadline set to '+fmtDM(b.deadline):'Deadline removed');
  if((a.readyTill||null)!==(b.readyTill||null))logAct(t,b.readyTill?'Post ready till '+fmtDM(b.readyTill):'Post ready till removed');
  if(a.priority!==b.priority)logAct(t,'Priority changed to '+PRIO_P[b.priority]);
  if(a.client!==b.client)logAct(t,'Moved to '+clientOf(b.client).name);
  if((a.assignee||null)!==(b.assignee||null))logAct(t,b.assignee?'Assigned to '+b.assignee:'Unassigned');
  if(JSON.stringify(a.rrule||null)!==JSON.stringify(b.rrule||null))logAct(t,b.rrule?'Repeat set to '+repeatLabel(b.rrule):'Repeat removed');
  if((a.startDate||null)!==(b.startDate||null))logAct(t,b.startDate?'Hidden until '+fmtDM(b.startDate):'Hide until removed');
  if((a.notes||'')!==(b.notes||''))logAct(t,'Description edited');
  if(a.status!==b.status&&!b.rrule)logAct(t,'Status changed to '+(b.status==='doing'?'in progress':b.status==='done'?'done':'to do'));
}

function mergeComments(cur,orig,mine){
  const o=new Set((orig||[]).map(c=>c&&c.id));const m=new Set((mine||[]).map(c=>c&&c.id));
  const extra=(cur||[]).filter(c=>c&&c.id&&!o.has(c.id)&&!m.has(c.id));

function commitDraft(final){
  clearTimeout(commitTimer);
  if(!draft||!draft.id)return;
  let t=tasks.find(x=>x.id===draft.id);
  // if the task vanished while you were editing it (removed on another device), your edits bring it back
  if(!t){t=normTask({...clone(draftOrig||{}),id:draft.id});tasks.push(t);}
  const f=draftFields();
  const base=draftOrig?origFields(draftOrig):null;
  Object.keys(f).forEach(k=>{
    if(base&&JSON.stringify(f[k])===JSON.stringify(base[k]))return;
    if(k==='comments')t.comments=mergeComments(t.comments,draftOrig&&draftOrig.comments,f.comments);
    else t[k]=f[k];
  });
  if(final){logDiff(t,draftOrig,t);draftOrig=clone(t);draft.comments=clone(t.comments);}
  saveTasks();
  if(final&&draft.remind!=='none')ensureNotifyPermission();
  if(final)render();

function saveDraft(quiet){

  if(draft.id){commitDraft(true);SHEET.beforeClose=null;closeSheet(true);return;}
  const f=draftFields();
  const nt=normTask({...f,id:uid(),sortIndex:maxSort()+1,createdAt:new Date().toISOString()});
  SHEET.beforeClose=null;
  withUndo('Added · '+titleOf(nt),()=>{tasks.push(nt);saveTasks();});

}

function ckAt(i){return draft.subtasks[i]}
function ckInsertAfter(i,text,depth){
  const list=draft.subtasks;
  const at=i<0?list.length:blockEnd(list,i);
  const d=depth!==undefined?depth:(i>=0?(list[i].depth||0):0);
  list.splice(at,0,{id:uid(),text:text||'',done:false,depth:Math.min(MAX_DEPTH,d)});
  return at;
}
function ckIndent(i,dir){
  const list=draft.subtasks;if(!list[i])return;
  const end=blockEnd(list,i);const d=list[i].depth||0;
  if(dir>0){if(i===0)return;const prevD=list[i-1].depth||0;if(d+1>prevD+1)return;
    let deepest=0;for(let k=i;k<end;k++)deepest=Math.max(deepest,list[k].depth||0);if(deepest+1>MAX_DEPTH)return;}
  else if(d===0)return;
  for(let k=i;k<end;k++)list[k].depth=Math.max(0,(list[k].depth||0)+dir);
}
function ckMove(i,dir){
  const list=draft.subtasks;const end=blockEnd(list,i);const d=list[i].depth||0;const block=list.slice(i,end);
  if(dir<0){let j=i-1;while(j>=0&&(list[j].depth||0)>d)j--;if(j<0||(list[j].depth||0)<d)return i;
    list.splice(i,block.length);list.splice(j,0,...block);return j;}
  else{if(end>=list.length||(list[end].depth||0)<d)return i;const nEnd=blockEnd(list,end);
    list.splice(i,block.length);const ins=nEnd-block.length;list.splice(ins,0,...block);return ins;}
}
function ckTick(i){
  const list=draft.subtasks;const s=list[i];s.done=!s.done;
  // ticking a parent ticks its whole branch, like Todoist
  const end=blockEnd(list,i);for(let k=i+1;k<end;k++)list[k].done=s.done;
  const st=ckStats(list);
  if(s.done&&st.d===st.n&&st.n>1){play('list');confetti(.45);
    if(draft.id&&!draft.rrule&&draft.status!=='done')setTimeout(()=>toast('Checklist complete',()=>{completeFromSheet();},'Complete task'),200);}
  else play(s.done?'tick':'untick');

}

  if(draft.id)items.push(['task',s.origin?'Turn back into a task':'Make it a task','totask']);

    else if(a==='up'){ckMove(i,-1);rerenderSheet();}
    else if(a==='down'){ckMove(i,1);rerenderSheet();}
    else if(a==='below'){const at=ckInsertAfter(i,'');rerenderSheet('[data-cktext="'+at+'"]');}
    else if(a==='del'){draft.subtasks.splice(i,blockEnd(draft.subtasks,i)-i);rerenderSheet();}
    else if(a==='task'){commitDraft(false);const parent=tasks.find(x=>x.id===draft.id);if(!parent)return;
      const nt=subtaskToTask(parent,i);draft.subtasks=clone(parent.subtasks);draftOrig=clone(parent);rerenderSheet();render();
      setTimeout(()=>{if(confirm('Open the new task?')){commitDraft(true);SHEET.beforeClose=null;closeSheet(true);setTimeout(()=>openTaskSheet(nt.id),320);}},50);}
  });
}
function bindCkDrag(sh){
  sh.querySelectorAll('[data-ckgrip]').forEach(g=>{
    g.addEventListener('pointerdown',e=>{
      e.preventDefault();const from=Number(g.dataset.ckgrip);const row=g.closest('.ck');row.classList.add('dragging');
      let target=null,after=false;
      const clear=()=>sh.querySelectorAll('.ck').forEach(r=>r.classList.remove('drop-before','drop-after'));
      const move=ev=>{const el=document.elementFromPoint(ev.clientX,ev.clientY);const over=el&&el.closest('.ck[data-ck]');clear();
        if(over&&over!==row){const r=over.getBoundingClientRect();after=ev.clientY>r.top+r.height/2;target=Number(over.dataset.ck);over.classList.add(after?'drop-after':'drop-before');}else target=null;};
      const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);row.classList.remove('dragging');clear();
        if(target===null)return;const list=draft.subtasks;const end=blockEnd(list,from);
        if(target>=from&&target<end)return;
        const tItem=list[target];
        const block=list.splice(from,end-from);
        let t=list.indexOf(tItem);
        // the moved block takes the depth of the step it was dropped on, and lands before it or after its whole branch
        const shift=(tItem.depth||0)-(block[0].depth||0);
        if(after)t=blockEnd(list,t);
        block.forEach(b=>b.depth=Math.max(0,Math.min(MAX_DEPTH,(b.depth||0)+shift)));
        list.splice(t,0,...block);rerenderSheet();};
      document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
    });
  });
}

let recorder=null,recChunks=[],recStart=0,recTick=null;
function stopRecording(discard){
  if(!recorder)return;
  if(discard)recorder._discard=true;
  try{recorder.stop()}catch(e){}
}
async function toggleRecording(){
  if(recorder){stopRecording(false);return;}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Voice notes are not supported in this browser');return;}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){toast('Microphone access was blocked');return;}
  recChunks=[];
  try{recorder=new MediaRecorder(stream,{audioBitsPerSecond:24000});}catch(e){recorder=new MediaRecorder(stream);}
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data)};
  recorder.onstop=()=>{
    stream.getTracks().forEach(t=>t.stop());clearInterval(recTick);
    const discard=recorder._discard;recorder=null;
    const r=$('#cmRec');if(r)r.innerHTML='';const mic=$('#cmMic');if(mic)mic.innerHTML=svg('mic');
    if(discard||!recChunks.length)return;
    const blob=new Blob(recChunks,{type:recChunks[0].type||'audio/webm'});
    if(blob.size>ATTACH_CAP){toast('That voice note is too long to store. Keep it under a minute.');return;}
    const dur=Math.round((Date.now()-recStart)/1000);
    const fr=new FileReader();fr.onload=()=>{pendingCm.voice={url:String(fr.result),dur,size:blob.size};const p=$('#cmPending');if(p){p.innerHTML=pendingHtml();bindPending();}updatePostBtn();};
    fr.readAsDataURL(blob);
  };
  recorder.start();recStart=Date.now();
  const mic=$('#cmMic');if(mic)mic.innerHTML=svg('stop');
  recTick=setInterval(()=>{const s=Math.round((Date.now()-recStart)/1000);const r=$('#cmRec');if(r)r.innerHTML='<span class="rec"><i></i>'+s+'s</span>';if(s>=90)stopRecording(false);},250);
}

    else if(a==='move')pickClientMenu(anchor,task.client,cid=>{draft.client=cid;commitDraft(true);rerenderSheet();toast('Moved to '+clientOf(cid).name);});
    else if(a==='link')copyTaskLink(task);
    else if(a==='sub'){SHEET.beforeClose=null;closeSheet(true);setTimeout(()=>pickParent(task),320);}
    else if(a==='reset'){const inst=openTodayInstance(task);const date=inst?inst.date:(nextDue(task,todayStr())||todayStr());
      withUndo('Completed · checklist reset for next time',()=>{
        if(!isCompleted(task.id,date)){completions.push({id:uid(),taskId:task.id,date,at:new Date().toISOString()});saveComp();play('done');}
        task.subtasks.forEach(s=>s.done=false);logAct(task,'Completed and reset the checklist');saveTasks();});
      SHEET.beforeClose=null;closeSheet(true);render();afterComplete();}
    else if(a==='del'){askDelete('Delete this task?').then(ok=>{if(ok){const id=task.id;SHEET.beforeClose=null;draft=null;closeSheet(true);deleteTask(id);}});}
  });
}
function pickParent(task){

  const h='<div class="sh-head"><span class="st">Make it a sub-task of</span><button class="sh-x" data-close>Cancel</button></div><div class="sh-body last">'
    +'<p class="hint" style="margin:0 2px 12px">“'+esc(titleOf(task))+'” becomes a checklist step inside the task you pick. Everything about it is kept on the step, so you can turn it back into a task any time.</p>'
    +'<input class="inp" type="search" id="ppQ" placeholder="Search tasks" style="margin-bottom:12px">'
    +'<div id="ppList"></div></div>';
  openSheet(h,{kind:'parent',narrow:true});

    $('#ppList').innerHTML=cands.filter(t=>!qv||t.title.toLowerCase().includes(qv)||clientOf(t.client).name.toLowerCase().includes(qv)).slice(0,50)
      .map(t=>'<div class="row-link" data-pp="'+t.id+'"><span><i class="dot" style="margin-right:8px;background:'+clientOf(t.client).color+'"></i>'+esc(titleOf(t))+'<span class="sub">'+esc(clientOf(t.client).name)+'</span></span></div>').join('')||'<p class="hint">No tasks match.</p>';

/* ============================================================ drag and drop
   Works the same with a mouse, a finger or a pencil. A grip handle starts a drag at once.
   Anywhere else on a row: a mouse drags after a small move, a finger after a short press,
   so normal scrolling on the phone still works. */
/* ============================================================ bulk select
   Pick many tasks, then move, reassign, redate, complete or hide them in one go. */
const BULK={on:false,ids:new Map()};
function bulkOn(){return BULK.on}
function bulkToggle(on){BULK.on=on;BULK.ids.clear();document.body.classList.toggle('bulk',on);render();renderBulkBar();}
function bulkPick(id,date){if(BULK.ids.has(id))BULK.ids.delete(id);else BULK.ids.set(id,date||'');
  $$('[data-row][data-tid="'+id+'"]').forEach(r=>r.classList.toggle('sel',BULK.ids.has(id)));renderBulkBar();}
function bulkAll(){$$('#screen [data-row][data-tid]').forEach(r=>{if(!r.classList.contains('done'))BULK.ids.set(r.dataset.tid,r.dataset.date||'');});render();renderBulkBar();}
function selCls(id){return BULK.on&&BULK.ids.has(id)?' sel':''}
function renderBulkBar(){
  let bar=$('#bulkbar');
  if(!BULK.on){if(bar){bar.classList.remove('show');setTimeout(()=>{const b=$('#bulkbar');if(b&&!BULK.on)b.remove();},220);}return;}
  if(!bar){bar=document.createElement('div');bar.id='bulkbar';bar.className='bulkbar';document.body.appendChild(bar);bar.addEventListener('click',onBulkClick);requestAnimationFrame(()=>bar.classList.add('show'));}
  const n=BULK.ids.size;
  bar.innerHTML='<span class="bn">'+(n?n+' selected':'Tap tasks to select')+'</span><button class="bb" data-bulk="all">'+svg('list')+'<span>All</span></button>'
    +'<span class="sp"></span>'
    +'<button class="bb" data-bulk="date"'+(n?'':' disabled')+'>'+svg('calendar')+'<span>Date</span></button>'
    +'<button class="bb" data-bulk="client"'+(n?'':' disabled')+'>'+svg('move')+'<span>Client</span></button>'
    +'<button class="bb" data-bulk="assign"'+(n?'':' disabled')+'>'+svg('person')+'<span>Assign</span></button>'
    +'<button class="bb" data-bulk="prio"'+(n?'':' disabled')+'>'+svg('flag')+'<span>Priority</span></button>'
    +'<button class="bb" data-bulk="done"'+(n?'':' disabled')+'>'+svg('check')+'<span>Done</span></button>'
    +'<button class="bb" data-bulk="archive"'+(n?'':' disabled')+'>'+svg('hide')+'<span>Hide</span></button>'
    +'<button class="bb x" data-bulk="cancel">'+svg('x')+'<span>Cancel</span></button>';
}
function bulkTasks(){return[...BULK.ids].map(([id,date])=>({task:tasks.find(t=>t.id===id),date})).filter(o=>o.task)}
function onBulkClick(e){
  const b=e.target.closest('[data-bulk]');if(!b)return;const a=b.dataset.bulk;const list=bulkTasks();const n=list.length;
  const finish=msg=>{BULK.ids.clear();bulkToggle(false);if(msg)toast(msg);};
  if(a==='cancel'){bulkToggle(false);return;}
  if(a==='all'){bulkAll();return;}
  if(!n)return;
  const today=todayStr();
  if(a==='date'){
    openMenu(b,[['0','Today','today'],['1','Tomorrow','defer'],['mon','Next week','upcoming'],['pick','Pick a date…','calendar']],k=>{
      const go=to=>{withUndo('Moved '+plural(n,'task')+' to '+fmtRel(to),()=>list.forEach(o=>rescheduleInst(o.task,o.date,to,true)));finish();};
      if(k==='0')go(today);else if(k==='1')go(addLocalDays(today,1));else if(k==='mon')go(addLocalDays(mondayOf(today),7));
      else{openSheet('<div class="sh-head"><span class="st">Move '+plural(n,'task')+' to</span><button class="sh-x" data-close>Cancel</button></div><div class="sh-body last"><input class="inp" type="date" id="bkPick" value="'+today+'"></div>',{kind:'date',narrow:true});
        $('#bkPick').onchange=ev=>{const v=ev.target.value;if(!v)return;closeSheet();go(v);};}
    },{title:'Move '+plural(n,'task')});
  }else if(a==='client'){
    pickClientMenu(b,null,cid=>{withUndo('Moved '+plural(n,'task')+' to '+clientOf(cid).name,()=>{list.forEach(o=>{if(o.task.client!==cid){o.task.client=cid;logAct(o.task,'Moved to '+clientOf(cid).name);}});saveTasks();});finish();});
  }else if(a==='assign'){
    openMenu(b,[['','Nobody','person']].concat(PEOPLE.map(p=>[p,p,'person'])),p=>{withUndo(p?'Assigned '+plural(n,'task')+' to '+p:'Unassigned '+plural(n,'task'),()=>{list.forEach(o=>{o.task.assignee=p||null;logAct(o.task,p?'Assigned to '+p:'Unassigned');});saveTasks();});finish();},{title:'Assign to'});
  }else if(a==='prio'){
    prioMenu(b,null,p=>{withUndo('Priority '+PRIO_P[p]+' on '+plural(n,'task'),()=>{list.forEach(o=>{o.task.priority=p;logAct(o.task,'Priority changed to '+PRIO_P[p]);});saveTasks();});finish();});
  }else if(a==='done'){
    let c=0;withUndo('Completed '+plural(n,'task'),()=>{list.forEach(o=>{if(setInstDone(o.task,o.date||today,true,{smart:true}))c++;});});
    finish();if(c)afterComplete();
  }else if(a==='archive'){
    ask({title:'Hide '+plural(n,'task')+' from every list?',body:'They stay in search and can be undone straight after.',ok:'Hide'}).then(ok=>{if(!ok)return;
      withUndo('Hid '+plural(n,'task'),()=>{const now=new Date().toISOString();list.forEach(o=>{o.task.archivedAt=now;logAct(o.task,'Hidden');});saveTasks();});
      finish();});
  }
}

/* ============================================================ swipe on a phone
   Swipe a task row right to complete it, left to move it to tomorrow. A small sideways move decides it,
   so vertical scrolling and the press and hold drag keep working. */
$('#screen').addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'||DRAG.on||TLDRAG.on||BULK.on)return;
  const row=e.target.closest('.row[data-tid][data-drag]');if(!row||row.classList.contains('done')||row.classList.contains('note'))return;
  if(e.target.closest('button,a,input,textarea,select,[data-handle]'))return;
  const x0=e.clientX,y0=e.clientY;let dx=0,active=false,decided=false;const id=row.dataset.tid,date=row.dataset.date;
  const mv=ev=>{
    if(DRAG.on){decided=true;active=false;row.style.transform='';row.classList.remove('swiping');if(row.parentElement)row.parentElement.classList.remove('sw-bg','sw-bg-r','sw-bg-l');return;}
    const ddx=ev.clientX-x0,ddy=ev.clientY-y0;
    if(!decided){if(Math.abs(ddx)>14&&Math.abs(ddx)>Math.abs(ddy)*1.6){decided=true;active=true;row.classList.add('swiping');row.style.transition='none';}else if(Math.abs(ddy)>10)decided=true;return;}
    if(!active)return;
    dx=Math.max(-150,Math.min(150,ddx));row.style.transform='translateX('+dx+'px)';
    const P=row.parentElement;P.classList.add('sw-bg');P.classList.toggle('sw-bg-r',dx>70);P.classList.toggle('sw-bg-l',dx<-70);
    const past=Math.abs(dx)>80;if(past!==row._past){row._past=past;if(past){play('swipe');haptic(6);}}
  };
  const up=()=>{
    window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
    if(!active)return;
    row.style.transition='';const t=tasks.find(x=>x.id===id);const P=row.parentElement;
    const clean=()=>{if(P)P.classList.remove('sw-bg','sw-bg-r','sw-bg-l');};
    if(dx>80&&t){suppressClickUntil=Date.now()+500;row.style.transform='translateX(110%)';row.style.opacity='0';play('done');haptic(12);
      setTimeout(()=>{row.classList.remove('swiping');clean();toggleDone(t,date||todayStr(),true,true);},170);}
    else if(dx<-80&&t){suppressClickUntil=Date.now()+500;row.style.transform='translateX(-110%)';row.style.opacity='0';play('soft');haptic(8);
      setTimeout(()=>{row.classList.remove('swiping');clean();rescheduleInst(t,date,addLocalDays(todayStr(),1));},170);}
    else{row.style.transform='';row.classList.remove('swiping');clean();}
  };
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
});

const DRAG={on:false,pressing:false};
const TLDRAG={on:false};
let suppressClickUntil=0;
document.addEventListener('click',e=>{if(Date.now()<suppressClickUntil){e.preventDefault();e.stopPropagation();}},true);
document.addEventListener('touchmove',e=>{if(DRAG.on||TLDRAG.on)e.preventDefault();},{passive:false});
document.addEventListener('contextmenu',e=>{if(DRAG.on||DRAG.pressing||TLDRAG.on)e.preventDefault();});

function pressToDrag(e,el,start){
  if(DRAG.on||TLDRAG.on||e.button>0)return;
  const onHandle=!!e.target.closest('[data-handle]');
  const ctl=e.target.closest('button,a,input,textarea,select,label,[data-nodrag]');
  if(!onHandle&&ctl&&ctl!==el)return;
  const sx=e.clientX,sy=e.clientY,touch=e.pointerType!=='mouse';
  if(onHandle){e.preventDefault();start(e);return;}
  let timer=null,last=e;
  const off=()=>{clearTimeout(timer);DRAG.pressing=false;el.classList.remove('pressing');
    window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',off);window.removeEventListener('pointercancel',off);window.removeEventListener('scroll',off,true);};
  const origin={x:sx,y:sy};
  const mv=ev=>{last=ev;const d=Math.hypot(ev.clientX-sx,ev.clientY-sy);if(touch){if(d>9)off();}else if(d>6){off();start(ev,origin);}};
  if(touch){DRAG.pressing=true;el.classList.add('pressing');window.addEventListener('scroll',off,true);
    timer=setTimeout(()=>{off();haptic(12);start(last,origin);},340);}
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',off);window.addEventListener('pointercancel',off);
}
function flipMove(lists,mutate){
  const els=[];lists.forEach(l=>{if(l)[...l.children].forEach(c=>{if(!els.includes(c))els.push(c)})});
  const pre=new Map(els.map(x=>{const r=x.getBoundingClientRect();return[x,{t:r.top,l:r.left}]}));
  mutate();
  els.forEach(x=>{const r=x.getBoundingClientRect(),p=pre.get(x);const dy=p.t-r.top,dx=p.l-r.left;if(!dy&&!dx)return;
    x.style.transition='none';x.style.transform='translate('+dx+'px,'+dy+'px)';x.getBoundingClientRect();
    x.style.transition='transform .22s var(--ease)';x.style.transform='';});
}
function autoScroller(st,o,onTick){
  const loop=()=>{
    if(!st.live)return;
    let vy=0,vx=0;const edge=78;
    const top=o.scroller?o.scroller.getBoundingClientRect().top:$('#top').getBoundingClientRect().bottom;
    const bottom=o.scroller?o.scroller.getBoundingClientRect().bottom:window.innerHeight-(isWide()?0:86);
    if(o.noV){}
    else if(st.y<top+edge)vy=-Math.min(18,Math.ceil((top+edge-st.y)/edge*18));
    else if(st.y>bottom-edge)vy=Math.min(18,Math.ceil((st.y-(bottom-edge))/edge*18));
    if(vy){if(o.scroller)o.scroller.scrollTop+=vy;else window.scrollBy(0,vy);}
    if(o.hscroll){const hr=o.hscroll.getBoundingClientRect();if(st.x<hr.left+46)vx=-14;else if(st.x>hr.right-46)vx=14;if(vx)o.hscroll.scrollLeft+=vx;}
    if(vy||vx)onTick();
    st.raf=requestAnimationFrame(loop);
  };
  st.raf=requestAnimationFrame(loop);
}
/* o: itemSel, listSel, dates (drop on [data-drop-date]), onDrop(toList,item,fromList), onDate(date), scroller, hscroll, prepare,
   axis ('y' by default, 'x' for a row of tabs or chips, 'grid' for cards that wrap), noV (no vertical autoscroll) */
function startSort(e,item,o){
  const r0=item.getBoundingClientRect();
  const offY=e.clientY-r0.top,offX=e.clientX-r0.left;
  if(o.prepare)o.prepare();
  const r=item.getBoundingClientRect();
  const ghost=item.cloneNode(true);
  ghost.classList.add('drag-ghost');ghost.classList.remove('pressing');ghost.removeAttribute('data-drag');
  ghost.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
  const gx=e.clientX-Math.min(offX,r.width-12),gy=e.clientY-Math.min(offY,r.height-8);
  Object.assign(ghost.style,{position:'fixed',left:gx+'px',top:gy+'px',width:r.width+'px',height:r.height+'px',margin:'0',zIndex:'95',pointerEvents:'none',boxSizing:'border-box'});
  document.body.appendChild(ghost);play('pick');
  item.classList.add('drag-src');item.classList.remove('pressing');
  const home={parent:item.parentElement,next:item.nextElementSibling};
  DRAG.on=true;document.body.classList.add('is-dragging');
  const st={x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,dateEl:null,raf:0,moved:false,live:true,over:null};
  const setOver=l=>{if(l===st.over)return;if(st.over)st.over.classList.remove('sort-over');st.over=l;if(l)l.classList.add('sort-over');};
  const place=()=>{
    ghost.style.transform='translate3d('+(st.x-st.x0)+'px,'+(st.y-st.y0)+'px,0)'+(o.tilt?' rotate(1.5deg)':'');
    const under=document.elementFromPoint(st.x,st.y);
    const dEl=o.dates&&under?under.closest('[data-drop-date]'):null;
    if(dEl!==st.dateEl){if(st.dateEl)st.dateEl.classList.remove('drop-on');st.dateEl=dEl;if(dEl)dEl.classList.add('drop-on');}
    if(dEl||!o.listSel){setOver(null);return;}
    const list=under?under.closest(o.listSel):null;
    if(!list)return;
    if(o.axis==='grid'||o.listSel==='.rows[data-day]'||o.listSel==='.bcards')setOver(list);
    const kids=[...list.children].filter(k=>k!==item&&k.matches(o.itemSel));
    const lr=list.getBoundingClientRect();
    let before=null;
    // positions come from layout (offsetTop/Left), not from the boxes mid-animation, so the order never flickers
    if(o.axis==='x'){for(const k of kids){const mid=lr.left+k.offsetLeft-list.scrollLeft+k.offsetWidth/2;if(st.x<mid){before=k;break;}}}
    else if(o.axis==='grid'){for(const k of kids){const top=lr.top+k.offsetTop-list.scrollTop,left=lr.left+k.offsetLeft;
      if(st.y<top||(st.y<=top+k.offsetHeight&&st.x<left+k.offsetWidth/2)){before=k;break;}}}
    else for(const k of kids){const mid=lr.top+k.offsetTop-list.scrollTop+k.offsetHeight/2;if(st.y<mid){before=k;break;}}
    const ref=before||list.querySelector(':scope > [data-sort-end]')||null;
    if(item.parentElement===list&&(item.nextElementSibling===ref||(!ref&&item===list.lastElementChild)))return;
    flipMove([list,item.parentElement],()=>list.insertBefore(item,ref));
    st.moved=true;
  };
  const mv=ev=>{st.x=ev.clientX;st.y=ev.clientY;place();};
  const key=ev=>{if(ev.key==='Escape')end(true)};
  const end=cancelled=>{
    st.live=false;cancelAnimationFrame(st.raf);
    window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel);document.removeEventListener('keydown',key);
    ghost.remove();item.classList.remove('drag-src');document.body.classList.remove('is-dragging');
    if(st.dateEl)st.dateEl.classList.remove('drop-on');setOver(null);
    if(o.cleanup)o.cleanup();
    DRAG.on=false;suppressClickUntil=Date.now()+400;
    if(!cancelled)play('drop');
    const restore=()=>{if(home.parent&&home.parent.isConnected)home.parent.insertBefore(item,home.next&&home.next.parentElement===home.parent?home.next:null);};
    if(cancelled){restore();render();return;}
    if(st.dateEl){const d=st.dateEl.dataset.dropDate;restore();if(o.onDate)o.onDate(d);else render();return;}
    if(st.moved&&o.onDrop)o.onDrop(item.parentElement,item,home.parent);else render();
  };
  const up=()=>end(false),cancel=()=>end(true);
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',cancel);document.addEventListener('keydown',key);
  place();if(!o.noScroll)autoScroller(st,o,place);
}

/* ---- what each kind of drag does when dropped ---- */
function dropRow(to,item){
  const id=item.dataset.tid;const t=tasks.find(x=>x.id===id);if(!t){render();return;}
  const ids=[...to.querySelectorAll(':scope > .row')].map(r=>r.dataset.tid);
  const nc=to.dataset.client;
  if(nc&&nc!==t.client){withUndo('Moved to '+clientOf(nc).name,()=>{t.client=nc;logAct(t,'Moved to '+clientOf(nc).name);applyOrder(ids,id);saveTasks();});}
  else{applyOrder(ids,id);saveTasks();}
  render();
}
function dropCard(to,item,from){
  const id=item.dataset.tid;const t=tasks.find(x=>x.id===id);if(!t){render();return;}
  const status=to.dataset.status,was=from.dataset.status;const date=item.dataset.date||todayStr();
  const ids=[...to.querySelectorAll(':scope > .bcard')].map(r=>r.dataset.tid);
  if(status!==was){
    withUndo(status==='done'?'Completed · '+titleOf(t):status==='doing'?'In progress · '+titleOf(t):'Back to to do · '+titleOf(t),()=>{setTaskStatus(t,status,date);applyOrder(ids,id);saveTasks();});
    if(status==='doing')play('start');else if(was==='doing'&&status==='todo')play('stop');
    haptic(10);
  }else{applyOrder(ids,id);saveTasks();}
  render();
}
function startKindDrag(e,el){
  const kind=el.dataset.drag;
  if(kind==='row'){
    const sk=el.parentElement.dataset.sort;
    startSort(e,el,{itemSel:'.row',listSel:sk==='client'?'.rows[data-sort="client"]':'.rows[data-sort="'+sk+'"]',onDrop:dropRow});
  }else if(kind==='group'){
    const groups=el.parentElement;
    startSort(e,el,{itemSel:'.cgroup',listSel:'.groups',prepare:()=>groups.classList.add('collapsing'),cleanup:()=>groups.classList.remove('collapsing'),
      onDrop:()=>{const ids=$$('.groups > .cgroup').map(g=>g.dataset.gid).filter(Boolean);withUndo('Client order saved',()=>applyClientOrder(ids));render();}});
  }else if(kind==='card'){
    startSort(e,el,{itemSel:'.bcard',listSel:'.bcards',hscroll:$('.board'),tilt:true,onDrop:dropCard});
  }else if(kind==='dayrow'){
    startSort(e,el,{itemSel:'.row',listSel:'.rows[data-day]',dates:true,onDrop:dropDayRow,
      onDate:d=>{const t=tasks.find(x=>x.id===el.dataset.tid);rescheduleInst(t,el.dataset.date,d);}});
  }else if(kind==='tray'){
    startTrayDrag(e,el);
  }else if(kind==='note'){
    startSort(e,el,{itemSel:'.ncard',listSel:'.ngrid',axis:'grid',onDrop:dropNote});
  }
}
/* a task dragged within a day keeps its new place, dragged into another day it moves there */
function dropDayRow(to,item){
  const id=item.dataset.tid;const t=tasks.find(x=>x.id===id);if(!t){render();return;}
  const from=item.dataset.date,day=to.dataset.day||from;
  const ids=[...to.querySelectorAll(':scope > .row')].map(r=>r.dataset.tid);
  if(day&&day!==from)withUndo('Moved to '+fmtRel(day)+(t.rrule?' · this time only':''),()=>{rescheduleInst(t,from,day,true);applyOrder(ids,id);saveTasks();});
  else{applyOrder(ids,id);saveTasks();}
  render();
}

/* ============================================================ time block interactions */
const snap15=m=>Math.round(m/15)*15;
function tlGeom(tl){return{s:Number(tl.dataset.s),e:Number(tl.dataset.e),ppm:hourH()/60}}
function tlTip(tl){const tip=document.createElement('div');tip.className='tl-tip';tl.appendChild(tip);return tip}
function tlDragShell(onMove,onEnd){
  TLDRAG.on=true;document.body.classList.add('is-dragging');
  const st={x:0,y:0,live:true,raf:0,sy0:window.scrollY};
  const mv=ev=>{st.x=ev.clientX;st.y=ev.clientY;onMove(st);};
  const fin=cancel=>{st.live=false;cancelAnimationFrame(st.raf);window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cn);
    document.body.classList.remove('is-dragging');TLDRAG.on=false;suppressClickUntil=Date.now()+400;onEnd(cancel);};
  const up=()=>fin(false),cn=()=>fin(true);

}
function startBlockMove(e,b,origin){
  const tl=b.closest('.tl');const g=tlGeom(tl);const t=tasks.find(x=>x.id===b.dataset.tid);if(!t||!t.dueTime)return;
  const dur=Math.max(15,t.estimate||30),s0=toMin(t.dueTime),y0=origin?origin.y:e.clientY,top0=b.offsetTop;
  b.classList.add('moving');const tip=tlTip(tl);const tray=tl.parentElement.querySelector('.tl-tray');
  let cur=s0,overTray=false;
  const st=tlDragShell(s=>{
    const dy=(s.y+window.scrollY)-(y0+s.sy0);
    const under=document.elementFromPoint(s.x,s.y);overTray=!!(under&&tray&&under.closest('.tl-tray')===tray);
    if(tray)tray.classList.toggle('drop-zone',overTray);
    cur=Math.max(g.s,Math.min(g.e-15,snap15(s0+dy/g.ppm)));
    b.style.top=(top0+(cur-s0)*g.ppm)+'px';
    tip.style.top=Math.max(0,top0+(cur-s0)*g.ppm-26)+'px';tip.textContent=overTray?'Remove the time':fmtTime(fromMin(cur))+' – '+fmtTime(fromMin(cur+dur));
  },cancel=>{
    tip.remove();b.classList.remove('moving');if(tray)tray.classList.remove('drop-zone');
    if(cancel){render();return;}
    if(overTray)withUndo('Time removed · '+titleOf(t),()=>{t.dueTime=null;saveTasks();});
    else if(cur!==s0)withUndo('Moved to '+fmtTime(fromMin(cur))+(t.rrule?' · every repeat':''),()=>{t.dueTime=fromMin(cur);logAct(t,'Time set to '+fmtTime(t.dueTime));saveTasks();});
    render();
  });
  st.x=e.clientX;st.y=e.clientY;
  autoScroller(st,{},()=>{});
}
function startBlockResize(e,b){
  e.preventDefault();e.stopPropagation();
  const tl=b.closest('.tl');const g=tlGeom(tl);const t=tasks.find(x=>x.id===b.dataset.tid);if(!t)return;
  const d0=Math.max(15,t.estimate||30),y0=e.clientY;let dur=d0;
  b.classList.add('moving');const tip=tlTip(tl);
  const st=tlDragShell(s=>{
    const dy=(s.y+window.scrollY)-(y0+s.sy0);
    dur=Math.max(15,Math.min(12*60,snap15(d0+dy/g.ppm)));
    b.style.height=Math.max(22,dur*g.ppm-3)+'px';
    tip.style.top=(b.offsetTop+b.offsetHeight+4)+'px';tip.textContent=fmtMins(dur)+' · until '+fmtTime(addMinsToTime(t.dueTime,dur));
  },cancel=>{
    tip.remove();b.classList.remove('moving');
    if(!cancel&&dur!==(t.estimate||30))withUndo('Takes '+fmtMins(dur)+' now',()=>{t.estimate=dur;saveTasks();});
    render();
  });
  st.x=e.clientX;st.y=e.clientY;
  autoScroller(st,{},()=>{});
}
function startTrayDrag(e,chip){
  const t=tasks.find(x=>x.id===chip.dataset.tid);if(!t)return;
  const date=chip.dataset.date;const wrap=chip.closest('.tl-wrap');const tl=wrap&&wrap.querySelector('.tl');if(!tl)return;
  const g=tlGeom(tl);const dur=Math.max(15,t.estimate||30);
  const r=chip.getBoundingClientRect();const ghost=chip.cloneNode(true);ghost.classList.add('drag-ghost');
  Object.assign(ghost.style,{position:'fixed',left:r.left+'px',top:r.top+'px',zIndex:'95',pointerEvents:'none',margin:'0'});
  document.body.appendChild(ghost);chip.classList.add('drag-src');
  const prev=document.createElement('div');prev.className='tl-prev';prev.hidden=true;tl.appendChild(prev);
  const x0=e.clientX,y0=e.clientY;let at=null;
  const st=tlDragShell(s=>{
    ghost.style.transform='translate3d('+(s.x-x0)+'px,'+(s.y-y0)+'px,0)';
    const tr=tl.getBoundingClientRect();
    if(s.x>=tr.left&&s.x<=tr.right&&s.y>=tr.top&&s.y<=tr.bottom){
      at=Math.max(g.s,Math.min(g.e-15,snap15(g.s+(s.y-tr.top)/g.ppm-dur/2)));
      prev.hidden=false;prev.style.top=((at-g.s)*g.ppm)+'px';prev.style.height=Math.max(22,dur*g.ppm-3)+'px';prev.textContent=fmtTime(fromMin(at))+' – '+fmtTime(fromMin(at+dur));
    }else{at=null;prev.hidden=true;}
  },cancel=>{
    ghost.remove();prev.remove();chip.classList.remove('drag-src');
    if(!cancel&&at!==null)withUndo('Scheduled for '+fmtTime(fromMin(at))+' · '+titleOf(t),()=>{
      t.dueTime=fromMin(at);if(!t.estimate)t.estimate=30;
      if(!t.rrule&&(!t.due||t.due<date))t.due=date;
      logAct(t,'Time set to '+fmtTime(t.dueTime));saveTasks();});
    render();
  });
  st.x=e.clientX;st.y=e.clientY;
  autoScroller(st,{},()=>{});
}

/* ---- one place that routes every press on the screen to the right drag ---- */
$('#screen').addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  const rs=e.target.closest('[data-tlrs]');
  if(rs){const b=rs.closest('[data-tlb]');if(b)startBlockResize(e,b);return;}
  const blk=e.target.closest('[data-tlb]');
  if(blk){if(!blk.classList.contains('done'))pressToDrag(e,blk,(ev,o)=>startBlockMove(ev,blk,o));return;}
  const el=e.target.closest('[data-drag]');
  if(el){pressToDrag(e,el,ev=>startKindDrag(ev,el));return;}
  const mg=e.target.closest('[data-mgrid]');
  if(mg&&e.pointerType!=='mouse'){
    // swipe the month left or right on a touch screen
    const x0=e.clientX,y0=e.clientY,t0=Date.now();
    const up=ev=>{window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cn);
      const dx=ev.clientX-x0,dy=ev.clientY-y0;
      if(Math.abs(dx)>55&&Math.abs(dy)<45&&Date.now()-t0<700){suppressClickUntil=Date.now()+350;shiftMonth(dx<0?1:-1);}};
    const cn=()=>{window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cn);};
    window.addEventListener('pointerup',up);window.addEventListener('pointercancel',cn);
  }
});
/* on a phone, a sideways swipe on a Life page moves to the next or previous view. Touch events, so a
   vertical scroll never swallows it, and anything that scrolls sideways itself is left alone */
(()=>{let st=null;
  $('#screen').addEventListener('touchstart',e=>{st=null;
    if(UI.tab!=='life'||e.touches.length!==1||DRAG.on)return;
    if(e.target.closest('.gh-scroll,.cscroll,.lnav,.gh-kinds,input,textarea,select,.wchart'))return;
    const t=e.touches[0];st={x:t.clientX,y:t.clientY,t:Date.now()};},{passive:true});
  $('#screen').addEventListener('touchend',e=>{if(!st)return;const t=e.changedTouches[0];const dx=t.clientX-st.x,dy=t.clientY-st.y,dt=Date.now()-st.t;st=null;
    if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*.6||dt>650)return;
    const i=LIFE_VIEWS.findIndex(v=>v[0]===UI.lifeView);const n=i+(dx<0?1:-1);
    if(n<0||n>=LIFE_VIEWS.length)return;
    suppressClickUntil=Date.now()+350;go('life',LIFE_VIEWS[n][0]);},{passive:true});
})();
function shiftMonth(v){
  const[y,m]=UI.calMonth.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+v,1,12));
  UI.calMonth=d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1);
  UI.calSel=UI.calMonth===todayStr().slice(0,7)?todayStr():UI.calMonth+'-01';
  saveUi();render();
  const g=$('#screen .m-grid');if(g&&!reducedMotion()){g.classList.add(v>0?'slide-r':'slide-l');}
}

/* ============================================================ menus (popover on wide screens, action sheet on a phone) */
let MENU=null,menuClosedAt=0,menuClosedAnchor=null;
function openMenu(anchor,items,onPick,opts){
  if(anchor&&anchor===menuClosedAnchor&&Date.now()-menuClosedAt<350)return;
  closeMenu();play('menu');
  const m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');
  let h=opts&&opts.title?'<div class="mh">'+esc(opts.title)+'</div>':'';
  items.forEach(it=>{
    if(it==='-'){h+='<hr>';return;}
    const[k,label,icon,cls,extra]=it;
    h+='<button class="mi'+(cls?' '+cls:'')+'" data-mk="'+esc(k)+'" role="menuitem">'+(icon?(icon.charAt(0)==='<'?icon:svg(icon)):'')+'<span>'+esc(label)+'</span>'+(extra?'<span class="r">'+esc(extra)+'</span>':'')+'</button>';
  });
  m.innerHTML=h;document.body.appendChild(m);
  let scrim=null;
  if(isPhone()){scrim=document.createElement('div');scrim.className='menu-scrim';document.body.appendChild(scrim);scrim.onclick=closeMenu;}
  else if(anchor){
    const r=anchor.getBoundingClientRect();const w=m.offsetWidth,hh=m.offsetHeight;
    const left=Math.min(innerWidth-w-10,Math.max(10,r.right-w));
    let top=r.bottom+6;if(top+hh>innerHeight-10)top=Math.max(10,r.top-hh-6);
    m.style.left=left+'px';m.style.top=top+'px';
    m.style.transformOrigin=(r.right-left>w/2?'100%':'0%')+' '+(top>r.top?'0%':'100%');
  }
  m.onclick=e=>{const b=e.target.closest('[data-mk]');if(!b)return;const k=b.dataset.mk;closeMenu();onPick(k);};
  MENU={m,scrim,anchor};
}
function closeMenu(){if(MENU){menuClosedAt=Date.now();menuClosedAnchor=MENU.anchor;MENU.m.remove();if(MENU.scrim)MENU.scrim.remove();MENU=null;if(pendingRender)setTimeout(()=>{if(pendingRender&&!MENU)render()},30);}}
document.addEventListener('pointerdown',e=>{if(MENU&&!e.target.closest('.menu')&&!e.target.closest('.menu-scrim'))closeMenu();},true);
function dotIcon(c){return'<i class="cd" style="background:'+c+'"></i>'}
function pickClientMenu(anchor,current,cb){
  openMenu(anchor,CLIENTS.map(c=>[c.id,c.name,dotIcon(c.color),c.id===current?'on':'',c.id===current?'current':'']).concat(['-',['__new','New client…','plus']]),k=>{
    if(k==='__new'){askText('New client','Client name').then(n=>{if(n){const c=addClient(n);cb(c.id);}});return;}
    cb(k);
  },{title:'Client'});
}
function prioMenu(anchor,current,cb){
  openMenu(anchor,PRIORITIES.map(p=>[p,PRIO_NAME[p],'<svg viewBox="0 0 24 24" style="color:var(--'+PRIO_CLS[p]+')">'+IC.flagf+'</svg>',p===current?'on':'']),cb,{title:'Priority'});
}
function rowMenu(anchor,t,date){
  if(!t)return;
  const today=todayStr();const done=isDoneInst(t,date);
  const items=[['open','Open details','edit']];
  if(!done){
    if(date!==today)items.push(['today','Do it today','today']);
    items.push(['tomorrow','Tomorrow','defer'],['nextweek','Next week','upcoming'],['pick','Pick a date…','calendar'],'-',['focus','Focus on it','focus']);
  }
  items.push(['client','Move to client…','move',null,clientOf(t.client).name],['prio','Priority…','flag',null,PRIO_P[t.priority]],['dup','Duplicate','copy'],'-',['del','Delete','trash','danger']);
  openMenu(anchor,items,k=>{
    if(k==='open')openTaskSheet(t.id);
    else if(k==='today')rescheduleInst(t,date,today);
    else if(k==='tomorrow')rescheduleInst(t,date,addLocalDays(today,1));
    else if(k==='nextweek')rescheduleInst(t,date,addLocalDays(mondayOf(today),7));
    else if(k==='pick')datePickSheet(t,date);
    else if(k==='focus')startFocus(t.id);
    else if(k==='client')pickClientMenu(anchor,t.client,cid=>moveTaskToClient(t,cid));
    else if(k==='prio')prioMenu(anchor,t.priority,p=>{withUndo('Priority set to '+PRIO_P[p],()=>{t.priority=p;logAct(t,'Priority changed to '+PRIO_P[p]);saveTasks();});render();});
    else if(k==='dup')duplicateTask(t);
    else if(k==='del'){askDelete('Delete “'+titleOf(t)+'”?').then(ok=>{if(ok)deleteTask(t.id);});}
  });
}
function datePickSheet(t,from){
  const today=todayStr();
  const opts=[['Today',today],['Tomorrow',addLocalDays(today,1)],['This weekend',offToDate('sat')],['Next week',offToDate('mon')],['In a week',addLocalDays(today,7)]];
  openSheet('<div class="sh-head"><span class="st">Move to</span><button class="sh-x" data-close>Cancel</button></div><div class="sh-body last">'
    +opts.map(([l,d],i)=>'<div class="row-link" data-dfo="'+i+'"><span>'+l+'</span><span style="font-size:13px;color:var(--ink-3)">'+esc(fmtShort(d))+'</span></div>').join('')
    +'<div class="field" style="margin-top:14px"><label>Or pick a date</label><input class="inp" type="date" id="dfPick" value="'+(from||today)+'"></div>'
    +(t.rrule?'<p class="hint">This repeats, so only this one time moves.</p>':'')+'</div>',{kind:'date',narrow:true});

function openSearch(){
  openSheet('<div class="sh-head"><span class="st">Search</span><button class="sh-x" data-close>Close</button></div><div class="sh-body last">'
    +'<input class="inp" type="search" id="sQ" placeholder="Search tasks, notes, journal and workouts" enterkeyhint="search" autocomplete="off"><div class="sres" id="sRes"></div></div>',{kind:'search',tall:true});
  const q=$('#sQ');
  const draw=()=>{
    const v=(q.value||'').trim().toLowerCase();const out=$('#sRes');if(!out)return;
    if(!v){out.innerHTML='<p class="hint" style="margin:8px 4px">Finds every task, including done and hidden ones, every note, journal entry and workout.</p>';return;}
    const words=v.split(/\s+/);
    const hits=tasks.filter(t=>{const hay=(t.title+' '+(t.notes||'')+' '+clientOf(t.client).name+' '+t.labels.join(' ')+' '+t.subtasks.map(s=>s.text).join(' ')).toLowerCase();return words.every(w=>hay.includes(w));});
    hits.sort((a,b)=>{const da=a.rrule?0:a.status==='done'?1:0,db=b.rrule?0:b.status==='done'?1:0;return da-db||String(a.due||'9').localeCompare(String(b.due||'9'));});
    const nh=notebook.filter(n=>noteMatches(n,v)).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,30);
    const lh=life.filter(r=>r.kind!=='weight'&&words.every(w=>lifeText(r).toLowerCase().includes(w))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30);
    out.innerHTML=(hits.length?'<p class="hint" style="margin:4px 4px 8px">'+plural(hits.length,'task')+(hits.length>80?', showing 80':'')+'</p><div class="rows">'+hits.slice(0,80).map(t=>{
      const inst=t.rrule?{date:nextDue(t,todayStr())||t.due}:{date:t.due};return rowHtml({task:t,date:inst.date,done:t.rrule?false:t.status==='done'},'search');}).join('')+'</div>':'')
      +(nh.length?'<p class="hint" style="margin:16px 4px 8px">'+plural(nh.length,'note')+'</p>'+nh.map(n=>'<div class="row-link" data-snote="'+n.id+'"><span>'+esc(n.title.trim()||'Untitled')

      +(lh.length?'<p class="hint" style="margin:16px 4px 8px">'+plural(lh.length,'life entry').replace('entrys','entries')+'</p><div class="feed">'+lh.map(lifeFeedItem).join('')+'</div>':'')
      +(!hits.length&&!nh.length&&!lh.length?'<div class="empty" style="padding:30px 10px"><b>No matches</b><p>Try fewer words.</p></div>':'');
  };
  q.oninput=draw;draw();
  $('#sRes').addEventListener('click',e=>{
    const sn=e.target.closest('[data-snote]');if(sn){closeSheet();setTimeout(()=>openNoteSheet(sn.dataset.snote),320);return;}
    const sl=e.target.closest('[data-lid]');if(sl){closeSheet();setTimeout(()=>openLifeSheet(null,sl.dataset.lid),320);return;}
    const tk=e.target.closest('[data-tick]');
    if(tk){const t=tasks.find(x=>x.id===tk.dataset.tick);if(t){const d=tk.dataset.date||todayStr();toggleDone(t,d,false);draw();}return;}
    const r=e.target.closest('[data-row]');if(r){closeSheet();setTimeout(()=>openTaskSheet(r.dataset.tid),320);}
  });

}

let focusQueue=[],focusPos=0,focusTimer=null,focusRemain=0,focusMinutes=25,focusRunning=false;
const FOREST='<svg class="forest" viewBox="0 0 400 140" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><path d="M0 110C60 90 120 96 200 100S320 86 400 96V140H0z" fill="#1E5546"/>'
  +[[20,70],[48,52],[80,64],[300,58],[330,44],[362,60],[390,50]].map(([x,y],i)=>'<path d="M'+x+' '+(y)+'l14 '+(30)+'h-8l12 '+(24)+'h-36l12-24h-8z" fill="'+(i%2?'#2C7A61':'#246A54')+'"/>').join('')
  +'<path d="M0 124C100 112 260 118 400 112V140H0z" fill="#16443A"/></svg>';
function startFocus(startId,queueIds){
  let q;
  if(queueIds)q=queueIds;
  else q=todaysTasks().filter(o=>o.task.focusOn!==false&&!isNote(o.task)&&!isDoneInst(o.task,o.date)).map(o=>o.task.id);
  if(startId){const i=q.indexOf(startId);if(i>0)q=q.slice(i).concat(q.slice(0,i));else if(i<0)q=[startId].concat(q);}
  focusQueue=q.filter(Boolean);focusPos=0;
  if(!focusQueue.length){toast('Nothing to focus on right now');return;}
  focusRunning=false;stopTimer();focusRemain=0;
  $('#focus').hidden=false;requestAnimationFrame(()=>$('#focus').classList.add('show'));
  renderFocus();
}
function currentFocusTask(){const id=focusQueue[focusPos];return tasks.find(t=>t.id===id)}
function renderFocus(){
  const t=currentFocusTask();
  if(!t){exitFocus();return;}
  const c=clientOf(t.client);
  const mins=String(Math.floor(focusRemain/60)).padStart(2,'0');
  const secs=String(focusRemain%60).padStart(2,'0');
  const total=focusMinutes*60;const prog=total?(1-focusRemain/total)*100:0;
  let checks='';
  if(t.subtasks.length){
    checks='<div class="focus-checks">'+visibleIdx(t.subtasks,false).map(i=>{const s=t.subtasks[i];return'<div class="focus-check'+(s.done?' done':'')+'" data-fcheck="'+i+'" style="padding-left:'+((s.depth||0)*22)+'px"><span class="fb">'+svg('check')+'</span><span>'+esc(s.text)+'</span></div>'}).join('')+'</div>';}
  const timerBlock=focusRunning||focusRemain>0
    ?'<div class="focus-timer">'+mins+'<span class="sep">:</span>'+secs+'</div><div class="focus-track"><i style="width:'+prog+'%"></i></div>'
    :'<div class="focus-mins">'+[15,25,45,60].map(m=>'<button class="focus-min'+(focusMinutes===m?' on':'')+'" data-fmin="'+m+'">'+m+' min</button>').join('')+'</div>';
  const amb=UI.focusAmb||'off';$('#focus').classList.toggle('drift',amb==='drift');
  $('#focus').innerHTML=FOREST+'<div class="focus-in">'
    +'<div class="focus-top"><button class="focus-close" id="fClose">Close</button><span class="focus-count">'+(focusPos+1)+' of '+focusQueue.length+'</span></div>'
    +'<div class="focus-mid"><div class="focus-client"><i class="dot" style="background:'+c.color+'"></i>'+esc(c.name)+'</div>'
    +'<div class="focus-title">'+esc(titleOf(t))+'</div>'+timerBlock+checks+'</div>'
    +'<div class="focus-amb"><span>Ambient</span>'+[['off','Off'],['rain','Rain'],['drift','Drift']].map(([k,l])=>'<button class="'+(amb===k?'on':'')+'" data-famb="'+k+'">'+l+'</button>').join('')+'</div>'
    +'<div class="focus-actions">'
    +(focusPos<focusQueue.length-1?'<button class="focus-btn sec" id="fNext">Skip</button>':'')
    +'<button class="focus-btn main" id="fDone">'+(focusRunning?'Pause':'Complete')+'</button>'
    +(focusRunning?'':'<button class="focus-btn sec" id="fPlay">'+(focusRemain>0?'Resume':'Start timer')+'</button>')
    +'</div></div>';
  $('#fClose').onclick=exitFocus;
  $('#fDone').onclick=()=>{if(focusRunning){stopTimer();renderFocus();}else completeFocusTask();};
  const nx=$('#fNext');if(nx)nx.onclick=advanceFocus;
  const pl=$('#fPlay');if(pl)pl.onclick=()=>{if(!focusRemain)focusRemain=focusMinutes*60;play('start');haptic(10);startTimer();renderFocus();};
  $$('[data-fmin]',$('#focus')).forEach(b=>b.onclick=()=>{focusMinutes=Number(b.dataset.fmin);renderFocus();});
  $$('[data-famb]',$('#focus')).forEach(b=>b.onclick=()=>{UI.focusAmb=b.dataset.famb;saveUi();setRain(UI.focusAmb==='rain');renderFocus();});
  setRain(amb==='rain');
  $$('[data-fcheck]',$('#focus')).forEach(el=>el.onclick=()=>{const i=Number(el.dataset.fcheck);const s=t.subtasks[i];s.done=!s.done;
    const end=blockEnd(t.subtasks,i);for(let k=i+1;k<end;k++)t.subtasks[k].done=s.done;
    const st=ckStats(t.subtasks);if(s.done&&st.d===st.n)play('list');else play(s.done?'tick':'untick');saveTasks();renderFocus();});
}
function completeFocusTask(){
  const t=currentFocusTask();if(!t)return;
  const inst=openTodayInstance(t);
  if(setInstDone(t,inst?inst.date:todayStr(),true,{smart:true}))afterComplete();
  advanceFocus();
}
function advanceFocus(){stopTimer();focusRemain=0;focusPos++;if(focusPos>=focusQueue.length){exitFocus();return;}renderFocus();}
function startTimer(){
  stopTimer();focusRunning=true;focusClockStart();
  focusTimer=setInterval(()=>{
    focusRemain--;
    if(focusRemain<=0){stopTimer();focusRemain=0;try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}play('remind');toast('Time is up. Complete it or start another round.');renderFocus();return;}
    const el=$('.focus-timer');if(el){const m=String(Math.floor(focusRemain/60)).padStart(2,'0'),s=String(focusRemain%60).padStart(2,'0');el.innerHTML=m+'<span class="sep">:</span>'+s;}
    const tr=$('.focus-track > i');if(tr)tr.style.width=((1-focusRemain/(focusMinutes*60))*100)+'%';
  },1000);
}
function stopTimer(){if(focusTimer){clearInterval(focusTimer);focusTimer=null}focusRunning=false;focusClockStop(true);}
/* rain is made on the spot: brown noise through a soft filter, with a slow swell. No file to load */
let RAIN=null;
function setRain(on){
  if(!on){if(RAIN){try{RAIN.gain.gain.setTargetAtTime(0,RAIN.ctx.currentTime,.4);const r=RAIN;setTimeout(()=>{try{r.src.stop();r.ctx.close();}catch(e){}},900);}catch(e){}RAIN=null;}return;}
  if(RAIN)return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const len=ctx.sampleRate*4;const buf=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5;}}
    const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;lp.Q.value=.6;
    const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=180;
    const gain=ctx.createGain();gain.gain.value=0;
    const lfo=ctx.createOscillator();lfo.frequency.value=.07;const lg=ctx.createGain();lg.gain.value=.05;lfo.connect(lg);lg.connect(gain.gain);
    src.connect(hp);hp.connect(lp);lp.connect(gain);gain.connect(ctx.destination);src.start();lfo.start();
    gain.gain.setTargetAtTime(.16,ctx.currentTime,1.2);
    RAIN={ctx,src,gain};
  }catch(e){RAIN=null;}
}
function exitFocus(){setRain(false);stopTimer();$('#focus').classList.remove('show');setTimeout(()=>{$('#focus').hidden=true;render();},280);}

/* ============================================================ reminders */
function nowLocalMin(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function taskRep(t){
  const today=todayStr();
  if(t.rrule){const nd=nextDue(t,today);return{date:nd||today,done:isCompleted(t.id,today)};}
  return{date:t.due,done:t.status==='done'};
}
function computeRemindAt(t){
  if(!t.remind||t.remind==='none')return null;
  if(t.remind==='custom')return t.remindAt||null;
  const rep=taskRep(t);if(!rep.date||rep.done)return null;
  const tm=t.dueTime||'09:00';
  if(t.remind==='attime')return rep.date+'T'+tm;
  if(t.remind==='before30'){const mins=toMin(tm)-30;
    return mins>=0?rep.date+'T'+fromMin(mins):addLocalDays(rep.date,-1)+'T'+fromMin(mins+1440);}
  if(t.remind==='due9')return rep.date+'T09:00';
  if(t.remind==='due18')return rep.date+'T18:00';
  if(t.remind==='before1d9')return addLocalDays(rep.date,-1)+'T09:00';
  return null;
}
function ensureNotifyPermission(){try{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();}catch(e){}}
function notify(title,body){try{if('Notification'in window&&Notification.permission==='granted')new Notification(title,{body,icon:'/favicon-192.png'});}catch(e){}}
function checkReminders(){
  const now=nowLocalMin();
  const cutoff=addLocalDays(todayStr(),-1)+'T'+now.slice(11);
  let changed=false;
  tasks.forEach(t=>{
    if(t.archivedAt)return;
    const at=computeRemindAt(t);if(!at||at>now)return;
    const key=t.id+'|'+at;if(fired.includes(key))return;
    fired.push(key);changed=true;
    // reminders that lapsed while the board was closed are marked as seen, not fired on open
    if(at>=cutoff&&initDone){notify('Task reminder',titleOf(t)+' · '+clientOf(t.client).name);play('remind');toast('Reminder · '+titleOf(t));}
  });
  if(changed)saveFired();
}

function restoreData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=async()=>{let b;try{b=JSON.parse(r.result)}catch(e){toast('That file could not be read');return;}
      if(!Array.isArray(b.tasks)){toast('That file has no tasks in it');return;}
      if(!confirm('Replace this board with the '+b.tasks.length+' tasks'+(Array.isArray(b.notebook)?' and '+plural(b.notebook.length,'note'):'')+(Array.isArray(b.life)?' and '+plural(b.life.length,'life entry').replace('entrys','entries'):'')+' in that file? The current board is saved as an earlier copy first.'+(Array.isArray(b.notebook)?'':' Your notes are kept as they are.')))return;
      store.set('pn_tb2_before_restore',JSON.stringify(fullBlob()));
      if(!NOSYNC)try{await sbUpsert(SB_ROW+'_bak_before_restore',{...buildSnapshot(),_backupOf:Date.now()});}catch(e){}
      replaceAll(b);closeSheet(true);render();toast('Restored from the backup file');
    };
    r.readAsText(f);};
  inp.click();
}

  const esc2=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['Title','Client','Assignee','Type','Priority','Date','Time','Duration','Deadline','Post ready till','Repeat','Status','Labels','Checklist','Description'].join(',')];
  tasks.forEach(t=>{const s=ckStats(t.subtasks);rows.push([esc2(t.title),esc2(clientOf(t.client).name),esc2(t.assignee),t.type,PRIO_P[t.priority],t.due||'',t.dueTime||'',t.estimate||'',t.deadline||'',t.readyTill||'',esc2(repeatLabel(t.rrule)),t.rrule?'repeating':t.status,esc2(t.labels.join(' ')),s.n?s.d+'/'+s.n:'',esc2(t.notes||'')].join(','))});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
  a.download='tasks-'+todayStr()+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),100);
}

/* ============================================================ toast */
let toastTimer=null;
function toast(msg,action,label){
  const t=$('#toast'),u=$('#toastUndo');
  $('#toastText').textContent=msg;
  if(action){u.hidden=false;u.textContent=label||'Undo';u.onclick=()=>{u.hidden=true;t.classList.remove('show');setTimeout(()=>t.hidden=true,300);action();};}
  else{u.hidden=true;u.onclick=null;}
  t.classList.remove('undoable');void t.offsetWidth;t.classList.toggle('undoable',!!action);
  t.hidden=false;requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.classList.remove('show');setTimeout(()=>{if(!t.classList.contains('show'))t.hidden=true},300)},action?8000:3200);
}

/* ============================================================ taps on the screen (one delegated handler) */
const TICKING=new Set();
function tickClicked(b){
  const t=tasks.find(x=>x.id===b.dataset.tick);if(!t)return;
  const date=b.dataset.date||todayStr();
  const key=t.id+'|'+date;if(TICKING.has(key))return; // a second tap while the first is landing is ignored
  const want=!isDoneInst(t,date);
  TICKING.add(key);
  b.classList.toggle('on',want);
  if(want)b.classList.add('pop');
  play(want?'done':'untick');haptic(want?12:6);
  if(want)sparkAt(b,clientOf(t.client).color);
  const smart=UI.tab==='board';
  setTimeout(()=>{TICKING.delete(key);if(isDoneInst(t,date)!==want)toggleDone(t,date,smart,true);else render();},want?300:40);
}
function onScreenClick(e){
  const T=e.target;let el;
  if((el=T.closest('[data-bulkon]'))){bulkToggle(!BULK.on);return;}
  if(BULK.on){const r=T.closest('[data-row][data-tid]');if(r&&!T.closest('[data-tick],[data-rtick],[data-ckexp],[data-rfold]')){e.preventDefault();bulkPick(r.dataset.tid,r.dataset.date);return;}}
  if(T.closest('#qaGo')){quickAdd();return;}
  if((el=T.closest('[data-tick]'))){e.stopPropagation();tickClicked(el);return;}
  if((el=T.closest('[data-readyedit]'))){openReadySheet(el.dataset.readyedit);return;}
  if((el=T.closest('[data-timeedit]'))){openTimeSheet(el.dataset.timeedit,el.dataset.ym||null);return;}
  if((el=T.closest('[data-tmclient]'))){const c=el.dataset.tmclient;UI.timeClient=UI.timeClient===c?null:c;UI.timeAll=false;saveUi();render();return;}
  if((el=T.closest('[data-tmpick]'))){openTimePicker();return;}
  if((el=T.closest('[data-ckexp]'))){const id=el.dataset.ckexp;if(EXPANDED.has(id))EXPANDED.delete(id);else EXPANDED.add(id);render();return;}
  if((el=T.closest('[data-rtick]'))){
    const[id,i]=el.dataset.rtick.split('|');const t=tasks.find(x=>x.id===id);if(!t)return;
    const list=t.subtasks;const it=list[Number(i)];if(!it)return;it.done=!it.done;
    const end=blockEnd(list,Number(i));for(let k=Number(i)+1;k<end;k++)list[k].done=it.done;
    const st=ckStats(list);
    if(it.done&&st.d===st.n){play('list');confetti(.45);if(!t.rrule&&t.status!=='done')setTimeout(()=>toast('Checklist complete',()=>{toggleDone(t,t.due||todayStr(),true);},'Complete task'),200);}
    else play(it.done?'tick':'untick',st.d);
    saveTasks();render();return;
  }
  if((el=T.closest('[data-rfold]'))){const[id,i]=el.dataset.rfold.split('|');const t=tasks.find(x=>x.id===id);if(!t)return;const it=t.subtasks[Number(i)];it.collapsed=!it.collapsed;saveTasks();render();return;}
  if((el=T.closest('[data-rmore]'))){rowMenu(el,tasks.find(x=>x.id===el.dataset.rmore),el.dataset.date||null);return;}
  if((el=T.closest('[data-poststatus]'))){cyclePostStatus(tasks.find(x=>x.id===el.dataset.poststatus));return;}
  if((el=T.closest('[data-fold]'))){const k=el.dataset.fold;if(UI.collapsed[k])delete UI.collapsed[k];else UI.collapsed[k]=true;saveUi();render();return;}
  if((el=T.closest('[data-act]'))){screenAct(el.dataset.act,el);return;}
  if((el=T.closest('[data-go]'))){go(el.dataset.go);return;}
  if((el=T.closest('[data-qa]'))){qaAct(el.dataset.qa,el);return;}
  if((el=T.closest('[data-qadate]'))){QA.date=el.dataset.qadate;render();const q=$('#qaIn');if(q&&!isPhone())q.focus({preventScroll:true});return;}
  if((el=T.closest('[data-clearf]'))){UI.view[el.dataset.clearf]='all';saveUi();render();return;}
  if((el=T.closest('[data-weekday]'))){const b=document.getElementById('wd-'+el.dataset.weekday);if(b)b.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if((el=T.closest('[data-wk]'))){const v=Number(el.dataset.wk);UI.weekOff=v===0?0:(UI.weekOff||0)+v;saveUi();render();return;}
  if((el=T.closest('[data-calview]'))){UI.calView=el.dataset.calview;saveUi();render();return;}
  if((el=T.closest('[data-addon]'))){openTaskSheet(null,{due:el.dataset.addon});return;}
  if((el=T.closest('[data-cal]'))){const v=Number(el.dataset.cal);if(v===0){UI.calMonth=todayStr().slice(0,7);UI.calSel=todayStr();saveUi();render();}else shiftMonth(v);return;}
  if((el=T.closest('[data-calday]'))){UI.calSel=el.dataset.calday;if(UI.calSel.slice(0,7)!==UI.calMonth)UI.calMonth=UI.calSel.slice(0,7);saveUi();render();
    if(window.innerWidth<880)setTimeout(()=>{const p=$('.dpanel');if(p)p.scrollIntoView({behavior:'smooth',block:'start'});},40);return;}
  if((el=T.closest('[data-calmode]'))){UI.calMode=el.dataset.calmode;saveUi();render();return;}
  if((el=T.closest('[data-bscope]'))){UI.boardScope=el.dataset.bscope;saveUi();render();return;}
  if((el=T.closest('[data-bclientmenu]'))){const fc=UI.view.fClient;
    openMenu(el,[['all','All clients','list',fc==='all'?'on':'']].concat(CLIENTS.map(c=>[c.id,c.name,dotIcon(c.color),fc===c.id?'on':''])),k=>{UI.view.fClient=k;saveUi();render();},{title:'Show tasks for'});return;}
  if((el=T.closest('[data-bnew]'))){openTaskSheet(null,{status:el.dataset.bnew});return;}
  if((el=T.closest('[data-goal]'))){const[k,v]=el.dataset.goal.split('|');
    if(k==='d')X.dailyGoal=Math.max(1,Math.min(99,X.dailyGoal+Number(v)));else X.weeklyGoal=Math.max(5,Math.min(500,X.weeklyGoal+Number(v)));saveX();render();return;}
  if((el=T.closest('[data-chart]'))){UI.chart=el.dataset.chart;saveUi();render();return;}
  if((el=T.closest('[data-tmonth]'))){const cur=todayStr().slice(0,7);const n=shiftYm(UI.timeMonth||cur,Number(el.dataset.tmonth));if(n<=cur){UI.timeMonth=n;UI.timeAll=false;saveUi();render();}return;}
  if((el=T.closest('[data-tmall]'))){UI.timeAll=!UI.timeAll;saveUi();render();return;}
  if((el=T.closest('[data-tmcsv]'))){exportTimeCsv(el.dataset.tmcsv);return;}
  if((el=T.closest('[data-dayoff]'))){const d=el.dataset.dayoff;X.daysOff=X.daysOff.includes(d)?X.daysOff.filter(x=>x!==d):X.daysOff.concat(d);saveX();render();return;}
  if((el=T.closest('[data-vac]'))){setVacation(!manualVacation());return;}
  if((el=T.closest('[data-vacoff]'))){setVacation(false);return;}
  if((el=T.closest('[data-awplan]'))){openTripSheet(null);return;}
  if((el=T.closest('[data-awedit]'))){openTripSheet(el.dataset.awedit);return;}
  if((el=T.closest('[data-awdel]'))){removeTrip(el.dataset.awdel);return;}
  if((el=T.closest('[data-awmove]'))){const[id,date,where]=el.dataset.awmove.split('|');awayMove([{task:tasks.find(x=>x.id===id),date}],where);return;}
  if((el=T.closest('[data-awall]'))){awayMoveAll(el.dataset.awall);return;}
  if((el=T.closest('[data-awskip]'))){const t=tasks.find(x=>x.id===el.dataset.awskip);if(t)awaySkip(t);return;}
  if((el=T.closest('[data-awfold]'))){const k=el.dataset.awfold;if(UI.collapsed[k])delete UI.collapsed[k];else UI.collapsed[k]=true;saveUi();render();return;}
  if(lifeClick(e,T))return;
  if((el=T.closest('[data-xtoggle]'))){const k=el.dataset.xtoggle;X[k]=!X[k];saveX();render();return;}
  if((el=T.closest('[data-tlb]'))){openTaskSheet(el.dataset.tid);return;}
  if((el=T.closest('.tl'))){
    if(T.closest('.tl-now'))return;
    const g=tlGeom(el);const r=el.getBoundingClientRect();const m=Math.floor((g.s+(e.clientY-r.top)/g.ppm)/30)*30;
    openTaskSheet(null,{due:el.dataset.tl,dueTime:fromMin(m),estimate:30});return;
  }
  if((el=T.closest('#nqGo'))){const t=NQ.text;NQ.text='';createNote(t,true);return;}
  if((el=T.closest('[data-npin]'))){toggleNotePin(el.dataset.npin);return;}
  if((el=T.closest('[data-nid]'))){openNoteSheet(el.dataset.nid);return;}
  if((el=T.closest('[data-open]'))){openTaskSheet(el.dataset.open);return;}
  if((el=T.closest('[data-row]'))){openTaskSheet(el.dataset.tid);return;}
}
function screenAct(a,el){
  if(a==='focus')startFocus(null);
  else if(a==='overdue'){const today=todayStr();moveOverdueToToday(todaysTasks().filter(o=>!o.task.habit&&o.date<today&&!isNote(o.task)&&matchesFilters(o)));}
  else if(a==='showdone'){UI.showDone=!UI.showDone;saveUi();render();}
  else if(a==='cleardone')clearCompleted();
  else if(a==='newnote')createNote('',true);
}
function qaAct(a,el){
  if(a==='client')pickClientMenu(el,qaClient(),cid=>{QA.client=cid;render();});
  else if(a==='prio')prioMenu(el,QA.prio,p=>{QA.prio=p;render();});
  else if(a==='full'){const p=parseQuick(QA.text);openTaskSheet(null,{title:p.title,due:qaDate(),client:p.client||qaClient(),priority:p.prio||QA.prio,readyTill:QA.ready});QA.text='';QA.ready=null;}
}
function setVacation(on){
  const today=todayStr();
  if(on){X.vacations.push({from:today,to:null});toast('Vacation mode on. Streaks are paused.');}
  else{const v=X.vacations[X.vacations.length-1];if(v&&!v.to){v.to=today;if(v.to<v.from)v.to=v.from;}toast('Welcome back. Vacation mode is off.');}
  saveX();render();
}

$('#screen').addEventListener('input',e=>{if(e.target.id==='qaIn'){QA.text=e.target.value;const g=$('#qaGo');if(g)g.disabled=!QA.text.trim();}
  else if(e.target.id==='lwIn')LQ.w=e.target.value;
  else if(e.target.id==='jQ'){UI.jQ=e.target.value;saveUi();render();}
  else if(e.target.id==='nqIn')NQ.text=e.target.value;
  else if(e.target.id==='nsQ'){UI.notesQ=e.target.value;saveUi();render();}});
$('#screen').addEventListener('keydown',e=>{if(e.target.id==='qaIn'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();quickAdd();}
  else if(e.target.id==='lwIn'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();quickWeigh();}
  else if(e.target.id==='nqIn'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();const t=NQ.text;NQ.text='';e.target.value='';createNote(t,true);}});
$('#screen').addEventListener('change',e=>{if(e.target.id==='qaDate'&&e.target.value){QA.date=e.target.value;render();}
  else if(e.target.id==='qaReady'){QA.ready=e.target.value||null;if(QA.ready)play('ready');render();}});
$('#screen').addEventListener('keydown',e=>{const c=e.target.closest&&e.target.closest('[data-calday]');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();c.click();}});

$('#sideNav').addEventListener('click',onNavClick);
$('#tabbar').addEventListener('click',onNavClick);
$('#sideNav').addEventListener('pointerdown',e=>{const el=e.target.closest('[data-drag="tab"]');if(!el)return;
  pressToDrag(e,el,ev=>startSort(ev,el,{itemSel:'.nav-i',listSel:'#sideNav',scroller:$('#side'),
    onDrop:()=>setTabOrder($$('#sideNav > .nav-i').map(b=>b.dataset.tab))}));});
$('#tabbar').addEventListener('pointerdown',e=>{const el=e.target.closest('[data-drag="tab"]');if(!el)return;
  pressToDrag(e,el,ev=>startSort(ev,el,{itemSel:'[data-drag="tab"]',listSel:'#tabbar',axis:'x',noScroll:true,
    onDrop:()=>{const vis=$$('#tabbar > [data-drag="tab"]').map(b=>b.dataset.tab);setTabOrder(vis.concat(orderedTabs().slice(phoneTabs()).map(t=>t[0])));}}));});

function newFromContext(){
  let due=todayStr();
  if(UI.tab==='life'){lifeNew($('#btnNew').offsetParent?$('#btnNew'):$('#fab'));return;}
  if(UI.tab==='calendar'&&UI.calView==='month'&&UI.calSel)due=UI.calSel;
  else if(UI.tab==='calendar'&&UI.calView==='week'&&UI.weekOff)due=addLocalDays(mondayOf(todayStr()),7*UI.weekOff);
  if(UI.tab==='notes'){createNote('',true);return;}
  if(UI.tab==='away'){const tr=activeTrip();if(tr&&tr.from>todayStr())due=addLocalDays(tr.from,-1);}
  openTaskSheet(null,{due});
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(MENU)closeMenu();else if(!$('#focus').hidden)exitFocus();else if(!$('#sheet').hidden)closeSheet();return;}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&$('#sheet').hidden&&$('#focus').hidden){e.preventDefault();openSearch();return;}
  const typing=e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]');
  if(typing||e.metaKey||e.ctrlKey||e.altKey||!$('#sheet').hidden||!$('#focus').hidden)return;
  if(e.key==='n'||e.key==='q'){e.preventDefault();newFromContext();}
  else if(e.key==='/'){e.preventDefault();openSearch();}
  else if(/^[1-7]$/.test(e.key)){const t=orderedTabs()[Number(e.key)-1];if(t)go(t[0]);}
});

document.addEventListener('focusout',()=>{setTimeout(()=>{const a=document.activeElement;if(!(a&&a.matches&&a.matches('input,textarea')))document.body.classList.remove('kb-open');

/* theme and density are per device, applied to the root so every token flips at once */
function applyAppearance(){
  const r=document.documentElement;
  if(UI.theme==='auto')r.removeAttribute('data-theme');else r.dataset.theme=UI.theme;
  document.body.classList.toggle('compact',UI.density==='compact');
  const dark=UI.theme==='dark'||(UI.theme==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#0E1813':'#EDF1EC';
}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyAppearance());}catch(e){}
let lastDateStr='';
function refreshDate(){
  const ds=todayStr();
  if(lastDateStr&&ds!==lastDateStr){countEndMemo.clear();if(SYNC.archived)runArchive();if($('#sheet').hidden)render();}
  else if($('#sheet').hidden&&!DRAG.on&&!TLDRAG.on&&UI.tab==='calendar'&&UI.calView==='month'&&UI.calMode==='schedule'){const n=$('.tl-now');const tl=n&&n.closest('.tl');
    if(n&&tl){const g=tlGeom(tl);const m=new Date().getHours()*60+new Date().getMinutes();n.style.top=Math.round((m-g.s)*g.ppm)+'px';}}
  lastDateStr=ds;
}
