<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task Board</title>
<meta name="theme-color" content="#FAF6EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6EF;
  --surface:#FFFFFF;
  --surface-2:#F6F1E8;
  --text:#1F1409;
  --text-2:#8A8378;
  --text-3:#B7AF9F;
  --sep:rgba(31,20,9,.08);
  --sep-strong:rgba(31,20,9,.14);
  --tint:#9C6B2F;
  --tint-press:#835a26;
  --tint-soft:rgba(156,107,47,.12);
  --red:#B23A2E;
  --amber:#B07C1E;
  --green:#3F7A4B;
  --radius:16px;
  --radius-lg:22px;
  --radius-sm:11px;
  --ease:cubic-bezier(.32,.72,0,1);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --maxw:1120px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
[hidden]{display:none !important}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none;margin:0}
input,select,textarea{font-family:inherit;color:var(--text);font-size:15px}
input,textarea,select{-webkit-appearance:none;appearance:none}
select{-webkit-appearance:none;background-image:none}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:6px}
.mono{font-family:'Space Mono',ui-monospace,monospace}
.fr{font-family:'Fraunces',Georgia,serif}
::selection{background:var(--tint-soft)}

/* ---------------- top bar ---------------- */
.topbar{position:sticky;top:0;z-index:44;
  background:rgba(250,246,239,.82);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep-strong);
  padding:calc(var(--safe-top) + 10px) 20px 10px}
.topbar-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:16px}
.brand{display:flex;flex-direction:column;line-height:1;flex:0 0 auto;margin-right:2px}
.brand .bn{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:22px;letter-spacing:-.01em}
.brand .bd{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);margin-top:3px}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--sep);border-radius:12px;padding:3px}
.tabs button{padding:7px 15px;border-radius:9px;font-size:14px;font-weight:600;color:var(--text-2);transition:all .14s;white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(31,20,9,.1)}
.topbar-sp{flex:1}
.topact{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:11px;
  font-size:14px;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--sep-strong);
  transition:all .12s;white-space:nowrap}
.tbtn:hover{background:var(--surface-2)}
.tbtn:active{transform:scale(.97)}
.tbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.tbtn.accent{background:var(--tint);border-color:var(--tint);color:#fff}
.tbtn.accent:hover{background:var(--tint-press)}
.tbtn.icon{padding:0;width:38px;justify-content:center}
.tbtn .lbl{display:inline}

/* ---------------- page ---------------- */
.page{max-width:var(--maxw);margin:0 auto;padding:20px 20px 80px}
.center{max-width:760px;margin:0 auto}
.hd{padding:6px 2px 4px;position:relative}
.hd .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--text-2);margin:0 0 4px}
.hd h1{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:600;
  font-size:32px;line-height:1.05;margin:0;color:var(--text);letter-spacing:-.01em}

.section-label{font-size:12.5px;font-weight:700;letter-spacing:.02em;
  text-transform:uppercase;color:var(--text-2);margin:24px 4px 9px;display:flex;align-items:center;gap:8px}
.section-label .cnt{font-family:'Space Mono',monospace;font-weight:400;color:var(--text-3);text-transform:none;letter-spacing:0}

.group{background:var(--surface);border-radius:var(--radius);
  overflow:hidden;border:1px solid var(--sep);box-shadow:0 1px 2px rgba(31,20,9,.03)}

/* ---------------- task row ---------------- */
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 15px;position:relative;
  background:var(--surface);transition:background .12s}
.row + .row{box-shadow:inset 0 1px 0 var(--sep)}
.row:hover{background:var(--surface-2)}
.row.done .rtitle{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--text-3)}
.row.dragging{opacity:.45}
.row.drop-target{box-shadow:inset 0 2px 0 var(--tint)}
.tick{flex:0 0 auto;width:23px;height:23px;border-radius:50%;margin-top:1px;
  border:2px solid var(--text-3);background:transparent;display:grid;place-items:center;
  transition:border-color .15s,background .15s,transform .1s}
.tick:active{transform:scale(.88)}
.tick svg{width:13px;height:13px;stroke:#fff;stroke-width:3.4;opacity:0;transition:opacity .12s}
.tick.on{background:var(--tint);border-color:var(--tint)}
.tick.on svg{opacity:1}
.tick.prio-High{border-color:var(--red)}
.tick.prio-High.on{background:var(--red);border-color:var(--red)}
.rbody{flex:1 1 auto;min-width:0}
.rtitle{font-size:15.5px;font-weight:500;line-height:1.3;color:var(--text);word-break:break-word}
.rmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.mtag{font-size:12.5px;color:var(--text-2);display:inline-flex;align-items:center;gap:4px}
.mtag svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.lblchip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);
  border:1px solid var(--sep);color:var(--text-2)}
.pill{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.03em;
  color:var(--tint);background:var(--tint-soft);padding:2px 7px;border-radius:6px;
  display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pill svg{width:11px;height:11px;stroke:var(--tint);fill:none;stroke-width:2}
.pill.over{color:var(--red);background:rgba(178,58,46,.1)}
.pill.over svg{stroke:var(--red)}
.status-pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;letter-spacing:.02em}
.status-pill.draft{color:var(--text-2);background:var(--sep)}
.status-pill.scheduled{color:var(--amber);background:rgba(176,124,30,.13)}
.status-pill.posted{color:var(--green);background:rgba(63,122,75,.13)}
.rside{flex:0 0 auto;display:flex;align-items:center;gap:1px;margin-top:-1px;opacity:.55;transition:opacity .12s}
.row:hover .rside{opacity:1}
.iconbtn{width:33px;height:33px;border-radius:9px;display:grid;place-items:center;
  color:var(--text-2);transition:background .12s,color .12s}
.iconbtn:hover{background:var(--sep)}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9}
.grip{color:var(--text-3);cursor:grab;touch-action:none}
.grip svg{width:16px;height:16px}

/* ---------------- empty ---------------- */
.empty{text-align:center;padding:52px 30px;color:var(--text-2)}
.empty .fr{font-size:21px;font-style:italic;color:var(--text);display:block;margin-bottom:6px}
.empty p{margin:0;font-size:14px;max-width:280px;margin-left:auto;margin-right:auto}

/* ---------------- load bar ---------------- */
.load{margin-top:16px;background:var(--surface);border:1px solid var(--sep);border-radius:var(--radius);padding:14px 16px}
.load-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.load-top .l{font-size:13px;font-weight:600}
.load-top .r{font-family:'Space Mono',monospace;font-size:12px;color:var(--text-2)}
.load-track{height:7px;border-radius:99px;background:var(--sep);overflow:hidden}
.load-fill{height:100%;border-radius:99px;background:var(--tint);transition:width .4s var(--ease)}
.load.over .load-fill{background:var(--red)}
.load.over .r{color:var(--red)}
.load-warn{font-size:12.5px;color:var(--red);margin-top:8px;display:flex;gap:6px;align-items:center}
.load-warn svg{width:14px;height:14px;stroke:var(--red);fill:none;stroke-width:2;flex:0 0 auto}

/* ---------------- quick add ---------------- */
.qa{margin-top:16px;display:flex;gap:9px;align-items:center}
.qa input{flex:1;background:var(--surface);border:1px solid var(--sep-strong);
  border-radius:13px;padding:12px 14px;font-size:15px;box-shadow:0 1px 2px rgba(31,20,9,.03)}
.qa input:focus{outline:none;border-color:var(--tint)}
.qa .go{flex:0 0 auto;width:46px;height:46px;border-radius:13px;background:var(--tint);
  display:grid;place-items:center;transition:background .12s,transform .1s}
.qa .go:hover{background:var(--tint-press)}
.qa .go:active{transform:scale(.95)}
.qa .go svg{width:22px;height:22px;stroke:#fff;stroke-width:2.4;fill:none}
.qa-hint{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--text-3);margin:7px 4px 0;letter-spacing:.02em}

/* ---------------- routine + template cards ---------------- */
.rcard{background:var(--surface);border:1px solid var(--sep);border-radius:var(--radius);
  margin-bottom:10px;padding:14px 16px;display:flex;align-items:center;gap:13px}
.rcard .ri{flex:1;min-width:0}
.rcard .rn{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.rcard .rsub{font-size:12.5px;color:var(--text-2);margin-top:2px}
.streak{font-family:'Space Mono',monospace;font-size:11px;color:var(--tint);
  background:var(--tint-soft);padding:2px 7px;border-radius:6px;display:inline-flex;gap:3px;align-items:center}
.streak svg{width:11px;height:11px;fill:var(--tint);stroke:none}
.rcard.done{opacity:.7}
.rdone-tag{font-size:12px;font-weight:600;color:var(--green)}
.rplay{flex:0 0 auto;background:var(--tint-soft);color:var(--tint);font-size:13px;
  font-weight:600;padding:9px 15px;border-radius:11px;transition:background .12s}
.rplay:hover{background:rgba(156,107,47,.2)}
.rplay.ghost{background:var(--surface-2);color:var(--text-2)}

/* ---------------- tasks view toolbar ---------------- */
.toolbar{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.filtsum{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.fchip{font-size:12.5px;font-weight:600;color:var(--tint);background:var(--tint-soft);
  padding:5px 10px;border-radius:8px;display:inline-flex;align-items:center;gap:6px}
.fchip button{color:var(--tint);opacity:.7;font-size:14px;line-height:1;display:grid;place-items:center}
.fchip button:hover{opacity:1}

/* ---------------- board ---------------- */
.board{display:flex;gap:14px;margin-top:16px;align-items:flex-start;overflow-x:auto;padding-bottom:6px}
.bcol{flex:1 1 0;min-width:260px;background:var(--surface-2);border-radius:var(--radius);
  border:1px solid var(--sep);padding:12px;min-height:120px}
.bcol-h{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 12px}
.bcol-h .t{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.bcol-h .c{font-family:'Space Mono',monospace;font-size:11px;color:var(--text-2)}
.bcard{background:var(--surface);border:1px solid var(--sep);border-radius:13px;
  padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 2px rgba(31,20,9,.04);cursor:pointer;transition:box-shadow .12s}
.bcard:hover{box-shadow:0 2px 8px rgba(31,20,9,.08)}
.bcard.dragging{opacity:.45}
.bcard .btop{display:flex;align-items:flex-start;gap:9px}
.bcard .bt{font-size:14px;font-weight:500;line-height:1.3;flex:1}
.bcard .bm{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.bcol.drop-target{outline:2px dashed var(--tint);outline-offset:-4px}
.minitick{flex:0 0 auto;width:19px;height:19px;border-radius:50%;border:2px solid var(--text-3);
  display:grid;place-items:center;margin-top:1px}
.minitick svg{width:11px;height:11px;stroke:#fff;stroke-width:3.4;opacity:0}
.minitick.on{background:var(--tint);border-color:var(--tint)}
.minitick.on svg{opacity:1}

/* ---------------- week ---------------- */
.wk-strip{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.wk-day{flex:1 1 0;min-width:64px;text-align:center;padding:10px 6px;border-radius:12px;
  background:var(--surface);border:1px solid var(--sep);transition:all .12s}
.wk-day:hover{border-color:var(--sep-strong)}
.wk-day.today{border-color:var(--tint)}
.wk-day.sel{background:var(--tint);border-color:var(--tint)}
.wk-day .wd{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.wk-day .wn{font-size:20px;font-weight:600;margin-top:3px}
.wk-day .wc{width:5px;height:5px;border-radius:50%;background:var(--tint);margin:5px auto 0}
.wk-day.sel .wd,.wk-day.sel .wn{color:#fff}
.wk-day.sel .wc{background:#fff}
.wk-day.today .wn{color:var(--tint)}
.wk-day.today.sel .wn{color:#fff}

/* ---------------- view menu popover ---------------- */
.pop{position:fixed;z-index:56;width:320px;max-width:calc(100vw - 24px);
  background:var(--surface);border:1px solid var(--sep-strong);border-radius:16px;
  box-shadow:0 16px 48px rgba(31,20,9,.22);overflow:hidden;
  opacity:0;transform:translateY(-6px);transition:opacity .16s,transform .16s var(--ease)}
.pop.show{opacity:1;transform:translateY(0)}
.pop-in{max-height:min(72vh,560px);overflow-y:auto;padding:6px}
.pop-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:10px}
.pop-row + .pop-row{box-shadow:inset 0 1px 0 var(--sep)}
.pop-row .k{font-size:14px;font-weight:600}
.pop-sel{position:relative}
.pop-sel select{background:var(--surface-2);border:1px solid var(--sep-strong);border-radius:9px;
  padding:8px 30px 8px 12px;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer}
.pop-sel::after{content:"";position:absolute;right:11px;top:50%;width:7px;height:7px;
  border-right:2px solid var(--text-2);border-bottom:2px solid var(--text-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.pop-seg{display:flex;background:var(--sep);border-radius:10px;padding:3px;gap:3px}
.pop-seg button{padding:7px 12px;border-radius:7px;font-size:13px;font-weight:600;color:var(--text-2)}
.pop-seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(31,20,9,.12)}
.pop-reset{width:100%;text-align:center;color:var(--red);font-size:14px;font-weight:600;padding:12px}

/* ---------------- switch ---------------- */
.switch{width:44px;height:27px;border-radius:99px;background:var(--sep-strong);position:relative;transition:background .2s;flex:0 0 auto}
.switch.on{background:var(--tint)}
.switch i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch.on i{left:20px}

/* ---------------- sheet / modal ---------------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(31,20,9,.42);opacity:0;transition:opacity .3s var(--ease)}
.scrim.show{opacity:1}
.sheet{position:fixed;z-index:51;background:var(--bg);
  left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;
  width:min(560px,calc(100vw - 40px));max-height:88vh;border-radius:20px;
  display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(31,20,9,.3);
  transition:transform .28s var(--ease),opacity .22s}
.sheet.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.sheet-grab{display:none}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;flex:0 0 auto}
.sheet-hd .st{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:20px}
.sheet-x{font-size:14px;font-weight:600;color:var(--tint);padding:6px 8px}
.sheet-body{overflow-y:auto;padding:0 18px 18px;-webkit-overflow-scrolling:touch}
@media(max-width:640px){
  .sheet{left:0;right:0;bottom:0;top:auto;transform:translateY(100%);width:100%;
    max-height:92vh;border-radius:20px 20px 0 0}
  .sheet.show{transform:translateY(0)}
  .sheet-grab{display:block;width:38px;height:5px;border-radius:99px;background:var(--sep-strong);margin:9px auto 0;flex:0 0 auto}
  .sheet-body{padding-bottom:calc(20px + var(--safe-bottom))}
}

.field{margin-bottom:15px}
.field > label{display:block;font-size:12px;font-weight:700;color:var(--text-2);
  text-transform:uppercase;letter-spacing:.03em;margin-bottom:7px}
.field input[type=text],.field textarea,.field .titlein,.field input[type=date],.field input[type=datetime-local],.field input[type=url]{
  width:100%;background:var(--surface);border:1px solid var(--sep-strong);border-radius:12px;padding:11px 13px;font-size:15px}
.field textarea{resize:vertical;min-height:60px;line-height:1.4}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--tint)}
.titlein{font-size:18px !important;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--sep-strong);border-radius:10px;
  padding:9px 13px;font-size:14px;font-weight:500;color:var(--text);transition:all .12s}
.chip:hover{background:var(--surface-2)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--tint);border-color:var(--tint);color:#fff}
.chip.sm{padding:7px 11px;font-size:13px}
.chip .cd{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}
.seg{display:flex;background:var(--sep);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text-2);transition:all .15s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(31,20,9,.1)}
.subrow{display:flex;align-items:center;gap:10px;padding:7px 0}
.subrow .sx{color:var(--text-3);font-size:20px;padding:0 4px;flex:0 0 auto}
.subrow input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--sep);padding:6px 2px;font-size:14.5px}
.subrow input:focus{outline:none;border-bottom-color:var(--tint)}
.addline{color:var(--tint);font-size:14px;font-weight:600;padding:8px 2px;display:inline-flex;gap:6px;align-items:center}
.addline svg{width:16px;height:16px;stroke:var(--tint);stroke-width:2.4;fill:none}
.sheet-actions{display:flex;gap:10px;padding:14px 0 4px}
.btn{flex:1;padding:13px;border-radius:13px;font-size:15px;font-weight:600;text-align:center;transition:all .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--tint);color:#fff}
.btn.primary:hover{background:var(--tint-press)}
.btn.ghost{background:var(--surface);border:1px solid var(--sep-strong);color:var(--text)}
.btn.danger{background:transparent;color:var(--red);flex:0 0 auto;padding:13px 18px}
.row-link{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface);border:1px solid var(--sep);border-radius:12px;
  padding:12px 14px;margin-bottom:9px;font-size:14.5px;font-weight:500}
.row-link .chev{color:var(--text-3);display:flex;align-items:center}
.row-link .chev svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none}

/* ---------------- manager rows (clients / people) ---------------- */
.mgr{display:flex;align-items:center;gap:11px;padding:9px 0}
.mgr + .mgr{box-shadow:inset 0 1px 0 var(--sep)}
.mgr .sw{width:26px;height:26px;border-radius:8px;flex:0 0 auto;border:1px solid rgba(0,0,0,.12);position:relative;cursor:pointer;overflow:hidden}
.mgr .sw input{position:absolute;inset:0;opacity:0;cursor:pointer;padding:0;border:none}
.mgr .nm{flex:1;background:transparent;border:none;border-bottom:1px solid transparent;padding:6px 2px;font-size:15px;font-weight:500}

/* ---------------- toast ---------------- */

<script>
'use strict';
/* ============================================================ storage seam */
const mem={};
const store={
  ok:(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}})(),
  get(k){ if(this.ok){try{return localStorage.getItem(k)}catch(e){}} return k in mem?mem[k]:null },
  set(k,v){ if(this.ok){try{localStorage.setItem(k,v);return true}catch(e){mem[k]=v;return false}} mem[k]=v;return true }
};
const K={tasks:'pn_tb2_tasks',comp:'pn_tb2_comp',exc:'pn_tb2_exc',rout:'pn_tb2_rout',
  tmpl:'pn_tb2_tmpl',cfg:'pn_tb2_cfg',ui:'pn_tb2_ui',rem:'pn_tb2_rem'};
const OLD={tasks:'pn_taskboard_v1',cfg:'pn_taskboard_cfg_v1'};

/* ============================================================ config defaults */
const DEFAULT_CLIENTS=[
  {id:'kipling',name:'Kipling India',color:'#B0552F'},
  {id:'druk',name:'Druk Asia',color:'#2F6B5E'},
  {id:'wfta',name:'WFTA',color:'#8A742C'},
  {id:'bluepoppy',name:'Blue Poppy Bhutan',color:'#3E5C94'},
  {id:'vtn',name:'V Travel Network',color:'#6D4C8C'},
  {id:'personal',name:'Personal',color:'#6B665C'}
];
const DEFAULT_PEOPLE=['Pratim','Nupur','Chirag','Gautam'];
const PRIORITIES=['High','Medium','Low'];
const PRIO_COLOR={High:'#B23A2E',Medium:'#9C6B2F',Low:'#B7AF9F'};
const POST_STATES=['draft','scheduled','posted'];
const SWATCHES=['#B0552F','#2F6B5E','#8A742C','#3E5C94','#6D4C8C','#6B665C','#B23A2E','#3F7A4B','#2E6F8E','#9C6B2F','#8C5A9E','#456B2F','#B07C1E','#5A4632'];
const REPEAT_PRESETS=[
  ['','Once'],['daily','Every day'],['weekdays','Weekdays'],['weekly','Weekly'],
  ['biweekly','Every 2 weeks'],['monthly','Monthly'],['monthlyWeekday','Monthly by weekday'],
  ['yearly','Yearly'],['custom','Custom days']
];
const REMIND_PRESETS=[['none','None'],['due9','9am on due day'],['due18','6pm on due day'],['before1d9','Day before, 9am'],['custom','Custom time']];
const DOW=['SU','MO','TU','WE','TH','FR','SA'];
const DOW_LABEL={SU:'Sun',MO:'Mon',TU:'Tue',WE:'Wed',TH:'Thu',FR:'Fri',SA:'Sat'};
const WEEKDAYS=['MO','TU','WE','TH','FR'];
const ATTACH_CAP=450*1024; // 450 KB per file to protect local storage

/* ============================================================ state */
let tasks=[],completions=[],exceptions=[],routines=[],templates=[],fired=[];
let CLIENTS=[],PEOPLE=[],CFG={workMins:360,archiveDays:4,sound:true};
let UI={tab:'today',weekSel:null,
  view:{layout:'list',group:'client',sort:'priority',dir:'asc',showDone:false,
        fClient:'all',fPrio:'all',fDate:'all',fLabel:'all'}};
let dismissedToday=[];

/* ============================================================ helpers */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
function uid(){return crypto.randomUUID?crypto.randomUUID():'t'+Date.now()+Math.random().toString(16).slice(2)}
function parseYmd(s){const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d,12,0,0))}
function ymdU(d){return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function addDaysU(dt,n){const d=new Date(dt);d.setUTCDate(d.getUTCDate()+n);return d}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addLocalDays(s,n){const d=parseYmd(s);d.setUTCDate(d.getUTCDate()+n);return ymdU(d)}
function dowOf(s){return DOW[parseYmd(s).getUTCDay()]}
function daysBetweenU(a,b){return Math.round((parseYmd(b)-parseYmd(a))/86400000)}
function clampDay(y,mi,day){const last=new Date(Date.UTC(y,mi+1,0,12)).getUTCDate();return Math.min(day,last)}
function weekIndexU(dt){const day=(dt.getUTCDay()+6)%7;const mon=addDaysU(dt,-day);return Math.floor(parseYmd(ymdU(mon))/86400000)}
function nthWeekdayPos(dt){return Math.floor((dt.getUTCDate()-1)/7)+1}
function isLastWeekday(dt){return dt.getUTCDate()+7>new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()+1,0,12)).getUTCDate()}
function clientOf(id){return CLIENTS.find(c=>c.id===id)||{id:'',name:'No client',color:'#B7AF9F'}}
function dayDiff(s){return daysBetweenU(todayStr(),s)}
function fmtDayLong(s){return parseYmd(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}
function fmtShort(s){return parseYmd(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function fmtMins(m){if(!m)return'';if(m<60)return m+'m';const h=Math.floor(m/60),r=m%60;return r?h+'h '+r+'m':h+'h'}
function allLabels(){const set=new Set();tasks.forEach(t=>t.labels.forEach(l=>set.add(l)));return[...set].sort()}

/* ============================================================ recurrence engine */
function ruleFromPreset(key,anchor){
  if(!key)return null;
  const a=parseYmd(anchor||todayStr());
  switch(key){
    case'daily':return{freq:'DAILY',interval:1};
    case'weekdays':return{freq:'WEEKLY',interval:1,byday:WEEKDAYS.slice()};
    case'weekly':return{freq:'WEEKLY',interval:1,byday:[DOW[a.getUTCDay()]]};
    case'biweekly':return{freq:'WEEKLY',interval:2,byday:[DOW[a.getUTCDay()]]};
    case'monthly':return{freq:'MONTHLY',interval:1};
    case'monthlyWeekday':return{freq:'MONTHLY',interval:1,byday:[DOW[a.getUTCDay()]],bysetpos:isLastWeekday(a)?-1:nthWeekdayPos(a)};
    case'yearly':return{freq:'YEARLY',interval:1};
    default:return null;
  }
}
function ruleMatches(rule,anchor,test){
  const a=parseYmd(anchor),t=parseYmd(test);
  if(t<a)return false;
  const iv=rule.interval||1;
  if(rule.freq==='DAILY')return daysBetweenU(anchor,test)%iv===0;
  if(rule.freq==='WEEKLY'){
    const days=(rule.byday&&rule.byday.length)?rule.byday:[DOW[a.getUTCDay()]];
    if(!days.includes(DOW[t.getUTCDay()]))return false;
    return(((weekIndexU(t)-weekIndexU(a))%iv)+iv)%iv===0;
  }
  if(rule.freq==='MONTHLY'){
    const md=(t.getUTCFullYear()-a.getUTCFullYear())*12+(t.getUTCMonth()-a.getUTCMonth());
    if(md%iv!==0)return false;
    if(rule.byday&&rule.bysetpos){
      if(DOW[t.getUTCDay()]!==rule.byday[0])return false;
      if(rule.bysetpos===-1)return isLastWeekday(t);
      return nthWeekdayPos(t)===rule.bysetpos;
    }
    return t.getUTCDate()===clampDay(t.getUTCFullYear(),t.getUTCMonth(),a.getUTCDate());
  }
  if(rule.freq==='YEARLY'){
    if((t.getUTCFullYear()-a.getUTCFullYear())%iv!==0)return false;
    if(t.getUTCMonth()!==a.getUTCMonth())return false;
    return t.getUTCDate()===clampDay(t.getUTCFullYear(),t.getUTCMonth(),a.getUTCDate());
  }
  return false;
}
function occurrences(task,from,to){
  let out=[];
  if(!task.rrule){ if(task.due&&task.due>=from&&task.due<=to)out.push(task.due); }
  else{
    const anchor=task.due||from;
    let cur=parseYmd(from<anchor?anchor:from);const end=parseYmd(to);let g=0;
    while(cur<=end&&g++<1200){const s=ymdU(cur);if(ruleMatches(task.rrule,anchor,s))out.push(s);cur=addDaysU(cur,1);}
  }
  const exc=exceptions.filter(e=>e.taskId===task.id);
  exc.forEach(e=>{
    if(e.action==='skip')out=out.filter(d=>d!==e.date);
    if(e.action==='move'){out=out.filter(d=>d!==e.date);if(e.newDate>=from&&e.newDate<=to)out.push(e.newDate);}
  });
  return out.sort();
}
function isCompleted(taskId,date){return completions.some(c=>c.taskId===taskId&&c.date===date)}
function nextDue(task,from){
  if(!task.rrule){
    if(!task.due)return null;
    if(task.status==='done')return null;
    return task.due;
  }
  const anchor=task.due||from;
  // look back up to 60 days for missed occurrences, then forward
  const lookback=addLocalDays(from,-60);
  const start=lookback<anchor?anchor:lookback;
  let cur=parseYmd(start),g=0;
  while(g++<1200){const s=ymdU(cur);
    if(ruleMatches(task.rrule,anchor,s)&&!isCompleted(task.id,s)&&!exceptions.some(e=>e.taskId===task.id&&e.action==='skip'&&e.date===s))return s;
    cur=addDaysU(cur,1);}
  return null;
}
function openTodayInstance(task){
  const today=todayStr();
  if(!task.rrule){
    if(task.status==='done'||task.archivedAt)return null;
    if(!task.due)return{date:today,floating:true};
    if(task.due<=today)return{date:task.due};
    return null;
  }
  const occ=occurrences(task,task.due||today,today);
  for(const d of occ){if(!isCompleted(task.id,d))return{date:d};}
  return null;
}
function repeatLabel(rule){
  if(!rule)return'';
  if(rule.freq==='DAILY')return'Every day';
  if(rule.freq==='WEEKLY'){
    const d=rule.byday||[];
    if(d.length===5&&WEEKDAYS.every(x=>d.includes(x)))return'Weekdays';
    if(d.length===7)return'Every day';
    const names=d.map(x=>DOW_LABEL[x]).join(' ');
    return(rule.interval===2?'Every 2 wks ':'Repeats ')+names;
  }
  if(rule.freq==='MONTHLY')return rule.bysetpos?'Monthly by weekday':'Monthly';
  if(rule.freq==='YEARLY')return'Yearly';
  return'Repeats';
}

/* ============================================================ persistence */
function saveTasks(){store.set(K.tasks,JSON.stringify(tasks))}
function saveComp(){store.set(K.comp,JSON.stringify(completions))}
function saveExc(){store.set(K.exc,JSON.stringify(exceptions))}
function saveRout(){store.set(K.rout,JSON.stringify(routines))}
function saveTmpl(){store.set(K.tmpl,JSON.stringify(templates))}
function saveCfg(){store.set(K.cfg,JSON.stringify({clients:CLIENTS,people:PEOPLE,workMins:CFG.workMins,archiveDays:CFG.archiveDays,sound:CFG.sound}))}
function saveUi(){store.set(K.ui,JSON.stringify(UI))}
function saveFired(){store.set(K.rem,JSON.stringify(fired.slice(-400)))}

function normTask(t){
  return{
    id:t.id||uid(),
    title:String(t.title||'Untitled'),
    client:t.client||CLIENTS[0]?.id||'personal',
    assignee:t.assignee||null,
    priority:PRIORITIES.includes(t.priority)?t.priority:'Medium',
    type:t.type==='post'?'post':'task',
    postStatus:POST_STATES.includes(t.postStatus)?t.postStatus:'draft',
    due:t.due||null,
    deadline:t.deadline||null,
    rrule:t.rrule||null,
    estimate:typeof t.estimate==='number'?t.estimate:null,
    labels:Array.isArray(t.labels)?t.labels.filter(Boolean).map(String):[],
    subtasks:Array.isArray(t.subtasks)?t.subtasks.filter(s=>s&&s.text).map(s=>({id:s.id||uid(),text:String(s.text),done:!!s.done})):[],
    attachments:Array.isArray(t.attachments)?t.attachments.filter(a=>a&&a.url).map(a=>({id:a.id||uid(),name:String(a.name||a.url),kind:a.kind==='file'?'file':'link',url:String(a.url),size:a.size||0})):[],
    remind:['none','due9','due18','before1d9','custom'].includes(t.remind)?t.remind:'none',
    remindAt:t.remindAt||null,
    notes:t.notes||null,
    status:['todo','doing','done'].includes(t.status)?t.status:'todo',
    focusOn:t.focusOn!==false,
    sortIndex:typeof t.sortIndex==='number'?t.sortIndex:0,
    routineId:t.routineId||null,
    createdAt:t.createdAt||new Date().toISOString(),
    completedAt:t.completedAt||null,
    archivedAt:t.archivedAt||null
  };
}

/* ---- migration from old occurrence-based model ---- */
const OLD_REPEAT=['daily','weekdays','weekly','biweekly','monthly','monthlyWeekday','yearly'];
function migrateOld(){
  let oldTasks=[];
  try{oldTasks=JSON.parse(store.get(OLD.tasks)||'[]')}catch(e){oldTasks=[]}
  if(!Array.isArray(oldTasks)||!oldTasks.length)return false;
  const bySeries={};
  oldTasks.forEach(t=>{const sid=t.seriesId||t.id;(bySeries[sid]=bySeries[sid]||[]).push(t)});
  let idx=0;
  Object.values(bySeries).forEach(grp=>{
    grp.sort((a,b)=>String(a.due||'').localeCompare(String(b.due||'')));
    const first=grp[0];
    const rep=OLD_REPEAT.includes(first.repeat)?first.repeat:null;
    if(rep){
      const anchor=grp.map(g=>g.due).filter(Boolean).sort()[0]||first.due||todayStr();
      const nt=normTask({
        id:uid(),title:first.title,client:first.client,assignee:first.assignee,
        priority:first.priority,type:/post|reel|story/i.test(first.title||'')?'post':'task',
        due:anchor,deadline:first.deadline,rrule:ruleFromPreset(rep,anchor),
        labels:first.labels,subtasks:(first.subtasks||[]).map(s=>({id:uid(),text:s.text,done:false})),
        notes:first.notes,status:'todo',sortIndex:idx++
      });
      tasks.push(nt);
      grp.forEach(g=>{if(g.status==='done'&&g.due)completions.push({id:uid(),taskId:nt.id,date:g.due,at:g.completedAt||new Date().toISOString()})});
    }else{
      grp.forEach(g=>{
        tasks.push(normTask({
          id:uid(),title:g.title,client:g.client,assignee:g.assignee,priority:g.priority,
          type:/post|reel|story/i.test(g.title||'')?'post':'task',
          due:g.due,deadline:g.deadline,rrule:null,labels:g.labels,
          subtasks:(g.subtasks||[]).map(s=>({id:uid(),text:s.text,done:!!s.done})),
          notes:g.notes,status:g.status,completedAt:g.completedAt,sortIndex:idx++
        }));
      });
    }
  });
  return true;
}

function loadAll(){
  let cfg=null;try{cfg=JSON.parse(store.get(K.cfg)||'null')}catch(e){}
  if(!cfg){try{const oc=JSON.parse(store.get(OLD.cfg)||'null');if(oc)cfg={clients:oc.clients,people:oc.people}}catch(e){}}
  CLIENTS=(cfg&&Array.isArray(cfg.clients)&&cfg.clients.length)?cfg.clients:DEFAULT_CLIENTS.map(c=>({...c}));
  PEOPLE=(cfg&&Array.isArray(cfg.people)&&cfg.people.length)?cfg.people:DEFAULT_PEOPLE.slice();
  CFG.workMins=(cfg&&cfg.workMins)||360;
  CFG.archiveDays=(cfg&&cfg.archiveDays)||4;
  CFG.sound=cfg&&typeof cfg.sound==='boolean'?cfg.sound:true;

  const hasNew=store.get(K.tasks)!==null;
  try{tasks=JSON.parse(store.get(K.tasks)||'[]').map(normTask)}catch(e){tasks=[]}
  try{completions=JSON.parse(store.get(K.comp)||'[]')}catch(e){completions=[]}
  try{exceptions=JSON.parse(store.get(K.exc)||'[]')}catch(e){exceptions=[]}
  try{routines=JSON.parse(store.get(K.rout)||'null')}catch(e){routines=null}
  try{templates=JSON.parse(store.get(K.tmpl)||'null')}catch(e){templates=null}
  try{fired=JSON.parse(store.get(K.rem)||'[]')}catch(e){fired=[]}
  try{const u=JSON.parse(store.get(K.ui)||'null');if(u){UI={...UI,...u};UI.view={...UI.view,...(u.view||{})}}}catch(e){}
  if(!['today','tasks','week'].includes(UI.tab))UI.tab='today';
  if(!Array.isArray(fired))fired=[];

  if(!hasNew){
    const migrated=migrateOld();
    if(routines===null)seedRoutines();
    if(templates===null)seedTemplates();
    saveTasks();saveComp();saveCfg();saveRout();saveTmpl();
    if(migrated)setTimeout(()=>toast('Imported your tasks into the new board'),400);
  }
  if(!Array.isArray(routines))routines=[];
  if(!Array.isArray(templates))templates=[];
  runArchive();

/* ============================================================ archive + load */
function runArchive(){
  const cutoff=addLocalDays(todayStr(),-(CFG.archiveDays||4));
  let changed=false;
  tasks.forEach(t=>{
    if(t.status==='done'&&!t.rrule&&!t.archivedAt&&t.completedAt){
      const d=t.completedAt.slice(0,10);
      if(d<cutoff){t.archivedAt=new Date().toISOString();changed=true;}
    }
  });
  if(changed)saveTasks();
}
function weeklyDoneCount(){
  const since=addLocalDays(todayStr(),-6);
  let n=0;
  tasks.forEach(t=>{if(t.status==='done'&&t.completedAt&&t.completedAt.slice(0,10)>=since)n++});
  completions.forEach(c=>{if(c.date>=since)n++});
  return n;
}
function todayLoad(){let total=0;todaysTasks().forEach(o=>{if(o.task.estimate)total+=o.task.estimate});return total}

/* ============================================================ routines */
function autoSpawnRoutines(){
  const today=todayStr();let changed=false;
  routines.forEach(r=>{if(r.autorun&&r.lastRun!==today){spawnRoutine(r,false);r.lastRun=today;changed=true;}});
  if(changed){saveTasks();saveRout();}
}
function spawnRoutine(r,notify){
  const today=todayStr();const base=maxSort()+1;
  r.items.forEach((it,i)=>{
    tasks.push(normTask({id:uid(),title:it.title,client:it.client,type:it.type,priority:it.priority,
      estimate:it.estimate,due:today,rrule:null,status:'todo',routineId:r.id,sortIndex:base+i}));
  });
  r.lastRun=today;
  if(notify){saveTasks();saveRout();toast('Added '+r.items.length+' tasks from '+r.name);render();}
}
function routineTasksToday(r){
  const today=todayStr();
  return tasks.filter(t=>t.routineId===r.id&&(t.due===today||(t.completedAt&&t.completedAt.slice(0,10)===today)));
}
function routineDoneToday(r){
  const mine=routineTasksToday(r);
  return mine.length>0&&mine.every(t=>t.status==='done');
}
function checkRoutineStreak(r){
  const today=todayStr();
  if(routineDoneToday(r)&&r.lastDone!==today){
    r.streak=(r.lastDone===addLocalDays(today,-1))?(r.streak||0)+1:1;
    r.lastDone=today;saveRout();
  }
}

/* ============================================================ templates */
function applyTemplate(tp){
  const today=todayStr();const base=maxSort()+1;
  tp.items.forEach((it,i)=>{
    tasks.push(normTask({id:uid(),title:it.title,client:tp.client,type:it.type,priority:it.priority,
      due:addLocalDays(today,it.dayOffset||0),rrule:null,status:'todo',sortIndex:base+i}));
  });
  saveTasks();toast('Added '+tp.items.length+' tasks from '+tp.name);render();
}

/* ============================================================ task ops */
function maxSort(){return tasks.reduce((m,t)=>Math.max(m,t.sortIndex||0),0)}
function completeInstance(task,date){
  let completed=false;
  if(task.rrule){
    if(isCompleted(task.id,date)) completions=completions.filter(c=>!(c.taskId===task.id&&c.date===date));
    else {completions.push({id:uid(),taskId:task.id,date,at:new Date().toISOString()});completed=true;}
    saveComp();
  }else{
    if(task.status==='done'){task.status='todo';task.completedAt=null;}
    else{task.status='done';task.completedAt=new Date().toISOString();completed=true;}
    saveTasks();
  }
  if(completed)pop();
  if(task.routineId){const r=routines.find(x=>x.id===task.routineId);if(r)checkRoutineStreak(r);}
  return completed;
}
function deferTask(task,mode){
  const today=todayStr();
  const target=mode==='tomorrow'?addLocalDays(today,1):addLocalDays(today,7);
  if(task.rrule){
    const inst=openTodayInstance(task);
    if(inst){exceptions.push({id:uid(),taskId:task.id,action:'move',date:inst.date,newDate:target});saveExc();}
  }else{task.due=target;task.status='todo';saveTasks();}
  toast('Moved to '+(mode==='tomorrow'?'tomorrow':'next week'),()=>{
    if(task.rrule){exceptions=exceptions.filter(e=>!(e.taskId===task.id&&e.newDate===target));saveExc();}
    else{task.due=today;saveTasks();}
    render();
  });
  render();
}
function cyclePostStatus(task){
  const i=POST_STATES.indexOf(task.postStatus);
  task.postStatus=POST_STATES[(i+1)%POST_STATES.length];
  saveTasks();render();
}

/* ============================================================ list builders */
function todaysTasks(){
  const out=[];
  tasks.forEach(t=>{if(t.archivedAt)return;const inst=openTodayInstance(t);if(inst)out.push({task:t,date:inst.date,floating:inst.floating})});
  out.sort((a,b)=>{
    const ov=(dayDiff(a.date)<0?-1:0)-(dayDiff(b.date)<0?-1:0);if(ov)return ov;
    if((a.task.sortIndex||0)!==(b.task.sortIndex||0))return(a.task.sortIndex||0)-(b.task.sortIndex||0);
    return PRIORITIES.indexOf(a.task.priority)-PRIORITIES.indexOf(b.task.priority);
  });
  return out;
}
function doneTodayList(){
  const today=todayStr();const out=[];
  tasks.forEach(t=>{
    if(t.rrule&&isCompleted(t.id,today))out.push({task:t,date:today});
    else if(!t.rrule&&t.status==='done'&&!t.archivedAt&&t.completedAt&&t.completedAt.slice(0,10)===today)out.push({task:t,date:today});
  });
  return out;
}

/* ============================================================ sound */
let AC=null;
function pop(){
  if(!CFG.sound)return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
    AC=AC||new Ctx();if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';const t0=AC.currentTime;
    o.frequency.setValueAtTime(520,t0);
    o.frequency.exponentialRampToValueAtTime(880,t0+.06);
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(.22,t0+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t0+.19);
    o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+.22);
  }catch(e){}
}

/* ============================================================ meta + row html */
function metaHtml(t,date,ctx){
  let m='';
  const c=clientOf(t.client);
  m+='<span class="dot" style="background:'+c.color+'"></span><span class="mtag">'+esc(c.name)+'</span>';
  if(t.rrule){m+='<span class="pill">'+svg('repeat')+esc(repeatLabel(t.rrule))+'</span>';}
  else if(date){const d=dayDiff(date);
    if(d<0)m+='<span class="pill over">'+svg('clock')+(d===-1?'Yesterday':Math.abs(d)+'d late')+'</span>';
    else if(ctx!=='today'&&d===0)m+='<span class="pill">'+svg('clock')+'Today</span>';
    else if(ctx!=='today'&&d>0)m+='<span class="mtag">'+svg('clock')+esc(fmtShort(date))+'</span>';
  }
  if(t.type==='post')m+='<span class="status-pill '+t.postStatus+'" data-poststatus="'+t.id+'">'+t.postStatus+'</span>';
  if(t.estimate)m+='<span class="mtag">'+fmtMins(t.estimate)+'</span>';
  if(t.remind&&t.remind!=='none')m+='<span class="mtag">'+svg('bell')+'</span>';
  if(t.attachments&&t.attachments.length)m+='<span class="mtag">'+svg('clip')+t.attachments.length+'</span>';
  if(t.subtasks.length)m+='<span class="mtag">'+t.subtasks.filter(s=>s.done).length+'/'+t.subtasks.length+'</span>';
  t.labels.forEach(l=>m+='<span class="lblchip">'+esc(l)+'</span>');
  if(t.assignee&&t.assignee!=='Pratim')m+='<span class="mtag">'+esc(t.assignee)+'</span>';
  return m;
}
function rowHtml(o,ctx){
  const t=o.task,date=o.date;
  const done=o.done!==undefined?o.done:(t.rrule?isCompleted(t.id,date):t.status==='done');

/* ============================================================ TASKS view (list + board) */
function taskRep(t){
  const today=todayStr();
  if(t.rrule){const nd=nextDue(t,today);return{date:nd||today,done:isCompleted(t.id,today)};}
  return{date:t.due,done:t.status==='done'};
}
function dispStatus(t){
  if(t.rrule)return isCompleted(t.id,todayStr())?'done':'todo';
  return t.status;
}
function dueBucket(date,done){
  if(!date)return{key:'nodate',label:'No date',order:5};
  const d=dayDiff(date);
  if(d<0&&!done)return{key:'overdue',label:'Overdue',order:0};
  if(d===0)return{key:'today',label:'Today',order:1};
  if(d===1)return{key:'tomorrow',label:'Tomorrow',order:2};
  if(d<=6&&d>0)return{key:'week',label:'This week',order:3};
  return{key:'later',label:'Later',order:4};
}
function viewItems(){
  const v=UI.view,out=[];
  tasks.forEach(t=>{
    if(t.archivedAt)return;
    const rep=taskRep(t);
    if(!v.showDone&&rep.done)return;
    if(v.fClient!=='all'&&t.client!==v.fClient)return;
    if(v.fPrio!=='all'&&t.priority!==v.fPrio)return;
    if(v.fLabel!=='all'&&!t.labels.includes(v.fLabel))return;
    if(v.fDate!=='all'){
      const b=dueBucket(rep.date,rep.done);
      if(v.fDate==='overdue'&&b.key!=='overdue')return;
      if(v.fDate==='today'&&b.key!=='today')return;
      if(v.fDate==='week'&&!['today','tomorrow','week','overdue'].includes(b.key))return;
      if(v.fDate==='nodate'&&rep.date)return;
      if(v.fDate==='hasdate'&&!rep.date)return;
    }
    out.push({task:t,date:rep.date,done:rep.done});
  });
  return out;
}
function buildGroups(items){
  const g=UI.view.group,map={};
  const put=(key,label,color,order,it)=>{(map[key]=map[key]||{key,label,color,order,items:[]}).items.push(it)};
  items.forEach(it=>{
    const t=it.task;
    if(g==='none')put('all','All tasks',null,0,it);
    else if(g==='client'){const c=clientOf(t.client);put('c_'+c.id,c.name,c.color,CLIENTS.findIndex(x=>x.id===c.id),it);}
    else if(g==='priority')put('p_'+t.priority,t.priority,PRIO_COLOR[t.priority],PRIORITIES.indexOf(t.priority),it);
    else if(g==='status'){const s=dispStatus(t);const lab=s==='doing'?'In progress':s==='done'?'Done':'To do';const ord=s==='todo'?0:s==='doing'?1:2;put('s_'+s,lab,null,ord,it);}
    else if(g==='due'){const b=dueBucket(it.date,it.done);put('d_'+b.key,b.label,null,b.order,it);}
    else if(g==='label'){if(!t.labels.length)put('l_none','No label',null,99,it);else t.labels.forEach(l=>put('l_'+l,l,null,50,it));}
  });
  const arr=Object.values(map);
  arr.sort((a,b)=>a.order-b.order||String(a.label).localeCompare(String(b.label)));
  const v=UI.view;
  const cmp=(a,b)=>{
    let r=0;
    if(v.sort==='manual')r=(a.task.sortIndex||0)-(b.task.sortIndex||0);
    else if(v.sort==='priority')r=PRIORITIES.indexOf(a.task.priority)-PRIORITIES.indexOf(b.task.priority);
    else if(v.sort==='due')r=String(a.date||'9999-99').localeCompare(String(b.date||'9999-99'));
    else if(v.sort==='title')r=a.task.title.localeCompare(b.task.title);
    else if(v.sort==='client')r=clientOf(a.task.client).name.localeCompare(clientOf(b.task.client).name);
    if(r===0)r=(a.task.sortIndex||0)-(b.task.sortIndex||0);
    return v.dir==='desc'?-r:r;
  };
  arr.forEach(grp=>grp.items.sort(cmp));
  return arr;
}

function ensureBoardColumns(groups){

/* ============================================================ THIS WEEK */
function weekDays(){
  const d=new Date();d.setHours(12,0,0,0);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);
  const out=[];for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()+i);out.push(x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()))}
  return out;
}
function tasksOnDay(dateStr){
  const out=[];
  tasks.forEach(t=>{if(t.archivedAt)return;const occ=occurrences(t,dateStr,dateStr);if(occ.length)out.push({task:t,date:dateStr})});
  out.sort((a,b)=>PRIORITIES.indexOf(a.task.priority)-PRIORITIES.indexOf(b.task.priority));
  return out;
}
function renderWeek(){
  const days=weekDays();const today=todayStr();
  const sel=UI.weekSel&&days.includes(UI.weekSel)?UI.weekSel:today;
  let h='<div class="hd"><p class="eyebrow">Next 7 days</p><h1>This week</h1></div>';
  h+='<div class="wk-strip">';
  days.forEach(d=>{
    const dt=parseYmd(d);const cnt=tasksOnDay(d).length;
    h+='<button class="wk-day'+(d===today?' today':'')+(d===sel?' sel':'')+'" data-weekday="'+d+'">'
      +'<div class="wd">'+DOW_LABEL[DOW[dt.getUTCDay()]]+'</div>'
      +'<div class="wn">'+dt.getUTCDate()+'</div>'
      +(cnt?'<div class="wc"></div>':'<div style="height:9px"></div>')+'</button>';
  });
  h+='</div>';
  const list=tasksOnDay(sel);
  h+='<div class="section-label">'+fmtDayLong(sel)+' <span class="cnt">'+list.length+'</span></div>';
  if(list.length){h+='<div class="group">'+list.map(o=>rowHtml(o,'week')).join('')+'</div>';}
  else{h+='<div class="empty"><span class="fr">Open day</span><p>Nothing scheduled. A good slot for deep work or getting ahead.</p></div>';}
  return h;
}

function newTaskDraft(){
  return{id:null,title:'',client:CLIENTS[0]?.id||'',assignee:'Pratim',priority:'Medium',type:'task',
    postStatus:'draft',due:todayStr(),deadline:null,repeatKey:'',customDays:[],rrule:null,
    estimate:null,labels:[],subtasks:[],attachments:[],remind:'none',remindAt:null,notes:'',focusOn:true,status:'todo'};
}
function taskToDraft(t){
  let repeatKey='',customDays=[];
  if(t.rrule){
    const r=t.rrule;
    if(r.freq==='DAILY')repeatKey='daily';
    else if(r.freq==='WEEKLY'){
      const d=r.byday||[];
      if(d.length===5&&WEEKDAYS.every(x=>d.includes(x)))repeatKey='weekdays';
      else if(r.interval===2)repeatKey='biweekly';
      else if(d.length===1)repeatKey='weekly';
      else{repeatKey='custom';customDays=d.slice();}
    }
    else if(r.freq==='MONTHLY')repeatKey=r.bysetpos?'monthlyWeekday':'monthly';
    else if(r.freq==='YEARLY')repeatKey='yearly';
  }
  return{...t,repeatKey,customDays,labels:t.labels.slice(),subtasks:t.subtasks.map(s=>({...s})),attachments:(t.attachments||[]).map(a=>({...a}))};
}
function openTaskSheet(id){
  draft=id?taskToDraft(tasks.find(t=>t.id===id)):newTaskDraft();

}
function rerenderSheet(){const b=$('.sheet-body');const y=b?b.scrollTop:0;$('#sheet').innerHTML='<div class="sheet-grab"></div>'+taskSheetHtml();bindTaskSheet();const nb=$('.sheet-body');if(nb)nb.scrollTop=y;}

  const addSub=$('#dAddSub');if(addSub)addSub.onclick=()=>{draft.subtasks.push({id:uid(),text:'',done:false});rerenderSheet();const ins=sh.querySelectorAll('[data-subidx]');if(ins.length)ins[ins.length-1].focus()};
  sh.querySelectorAll('[data-attdel]').forEach(b=>b.onclick=()=>{draft.attachments.splice(Number(b.dataset.attdel),1);rerenderSheet()});
  const au=$('#dAttAdd');if(au)au.onclick=()=>{const inp=$('#dAttUrl');let u=(inp.value||'').trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;let name=u.replace(/^https?:\/\//,'').replace(/\/$/,'');if(name.length>42)name=name.slice(0,42)+'…';draft.attachments.push({id:uid(),name,kind:'link',url:u});rerenderSheet();};
  const af=$('#dAttFile');if(af)af.onclick=pickFile;

function pickFile(){
  const inp=document.createElement('input');inp.type='file';
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;
    if(f.size>ATTACH_CAP){toast('That file is over 450KB. Add it as a link instead.');return;}
    const r=new FileReader();r.onload=()=>{draft.attachments.push({id:uid(),name:f.name,kind:'file',url:String(r.result),size:f.size});rerenderSheet();};
    r.readAsDataURL(f);};
  inp.click();
}
function saveDraft(){
  if(!draft.title.trim()){$('#dTitle').focus();return;}
  let rrule=null;
  if(draft.repeatKey==='custom')rrule=draft.customDays.length?{freq:'WEEKLY',interval:1,byday:draft.customDays.slice()}:null;
  else if(draft.repeatKey)rrule=ruleFromPreset(draft.repeatKey,draft.due||todayStr());
  if(rrule&&!draft.due)draft.due=todayStr();
  const fields={title:draft.title.trim(),client:draft.client,assignee:draft.assignee,priority:draft.priority,
    type:draft.type,postStatus:draft.postStatus,due:draft.due,deadline:draft.deadline,rrule,
    estimate:draft.estimate,labels:draft.labels,subtasks:draft.subtasks.filter(s=>s.text.trim()),
    attachments:draft.attachments,remind:draft.remind,remindAt:draft.remind==='custom'?draft.remindAt:null,
    notes:draft.notes,focusOn:draft.focusOn};
  if(!rrule){fields.status=draft.status||'todo';fields.completedAt=fields.status==='done'?(draft.completedAt||new Date().toISOString()):null;}
  else{fields.status='todo';}
  if(draft.id){const t=tasks.find(x=>x.id===draft.id);Object.assign(t,fields);}
  else{tasks.push(normTask({...fields,id:uid(),sortIndex:maxSort()+1}));}
  saveTasks();
  if(draft.remind&&draft.remind!=='none')ensureNotifyPermission();
  closeSheet();render();
}
function deleteTask(id){
  tasks=tasks.filter(t=>t.id!==id);
  completions=completions.filter(c=>c.taskId!==id);
  exceptions=exceptions.filter(e=>e.taskId!==id);
  saveTasks();saveComp();saveExc();render();
}

/* ============================================================ focus mode */
let focusQueue=[],focusPos=0,focusTimer=null,focusRemain=0,focusMinutes=25,focusRunning=false,focusRoutineId=null;
function startFocus(startId,queueIds,routineId){
  focusRoutineId=routineId||null;
  let q;
  if(queueIds)q=queueIds;
  else{q=todaysTasks().filter(o=>o.task.focusOn!==false&&!(o.task.rrule?isCompleted(o.task.id,o.date):o.task.status==='done')).map(o=>o.task.id);}
  if(startId){const i=q.indexOf(startId);if(i>0)q=q.slice(i).concat(q.slice(0,i));else if(i<0)q=[startId].concat(q);}
  focusQueue=q.filter(Boolean);focusPos=0;
  if(!focusQueue.length){toast('Nothing to focus on');return;}
  focusRunning=false;stopTimer();
  $('#focus').hidden=false;requestAnimationFrame(()=>$('#focus').classList.add('show'));
  renderFocus();
}
function currentFocusTask(){const id=focusQueue[focusPos];return tasks.find(t=>t.id===id)}
function renderFocus(){
  const t=currentFocusTask();
  if(!t){exitFocus();return;}
  const c=clientOf(t.client);
  const mins=String(Math.floor(focusRemain/60)).padStart(2,'0');
  const secs=String(focusRemain%60).padStart(2,'0');
  const total=focusMinutes*60;const prog=total?(1-focusRemain/total)*100:0;
  let checks='';
  if(t.subtasks.length){checks='<div class="focus-checks">'+t.subtasks.map((s,i)=>
    '<div class="focus-check'+(s.done?' done':'')+'" data-fcheck="'+i+'"><span class="fb">'+svg('check')+'</span><span>'+esc(s.text)+'</span></div>').join('')+'</div>';}
  const timerBlock=focusRunning||focusRemain>0
    ? '<div class="focus-timer">'+mins+'<span class="sep">·</span>'+secs+'</div><div class="focus-track"><i style="width:'+prog+'%"></i></div>'
    : '<div class="focus-mins">'+[15,25,45].map(m=>'<button class="focus-min'+(focusMinutes===m?' on':'')+'" data-fmin="'+m+'">'+m+'m</button>').join('')+'</div>';
  $('#focus').innerHTML='<div class="focus-in">'
    +'<div class="focus-top"><button class="focus-close" id="fClose">Done</button>'
    +'<span class="focus-count">'+(focusPos+1)+' / '+focusQueue.length+'</span></div>'
    +'<div class="focus-mid"><div class="focus-client"><span class="dot" style="background:'+c.color+'"></span>'+esc(c.name)+'</div>'
    +'<div class="focus-title">'+esc(t.title)+'</div>'
    +timerBlock+checks+'</div>'
    +'<div class="focus-actions">'
    +(focusPos<focusQueue.length-1?'<button class="focus-btn sec" id="fNext">Skip</button>':'')
    +'<button class="focus-btn main" id="fDone">'+(focusRunning?'Pause':'Complete')+'</button>'
    +(focusRunning?'':'<button class="focus-btn sec" id="fPlay">Start timer</button>')
    +'</div></div>';
  $('#fClose').onclick=exitFocus;
  $('#fDone').onclick=()=>{if(focusRunning){stopTimer();renderFocus();}else{completeFocusTask();}};
  const nx=$('#fNext');if(nx)nx.onclick=advanceFocus;
  const pl=$('#fPlay');if(pl)pl.onclick=()=>{focusRemain=focusMinutes*60;startTimer();renderFocus();};
  $('#focus').querySelectorAll('[data-fmin]').forEach(b=>b.onclick=()=>{focusMinutes=Number(b.dataset.fmin);renderFocus();});
  $('#focus').querySelectorAll('[data-fcheck]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.fcheck);t.subtasks[i].done=!t.subtasks[i].done;saveTasks();renderFocus();});
}
function completeFocusTask(){
  const t=currentFocusTask();if(!t)return;
  const inst=openTodayInstance(t);completeInstance(t,inst?inst.date:todayStr());
  advanceFocus();
}
function advanceFocus(){
  stopTimer();focusRunning=false;focusRemain=0;
  focusPos++;
  if(focusPos>=focusQueue.length){
    if(focusRoutineId){const r=routines.find(x=>x.id===focusRoutineId);if(r&&routineDoneToday(r))toast('Routine finished');}
    exitFocus();return;
  }
  renderFocus();
}
function startTimer(){
  focusRunning=true;stopTimer();
  focusTimer=setInterval(()=>{
    focusRemain--;
    if(focusRemain<=0){stopTimer();focusRunning=false;try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}toast('Time up');completeFocusTask();return;}
    const el=$('.focus-timer');if(el){const m=String(Math.floor(focusRemain/60)).padStart(2,'0'),s=String(focusRemain%60).padStart(2,'0');el.innerHTML=m+'<span class="sep">·</span>'+s;}
    const track=$('.focus-track > i');if(track)track.style.width=((1-focusRemain/(focusMinutes*60))*100)+'%';
  },1000);
}
function stopTimer(){if(focusTimer){clearInterval(focusTimer);focusTimer=null}focusRunning=false;}
function exitFocus(){stopTimer();focusRoutineId=null;$('#focus').classList.remove('show');setTimeout(()=>{$('#focus').hidden=true;render();},280);}

/* ============================================================ data io */
function backupData(){
  const blob={version:3,tasks,completions,exceptions,routines,templates,cfg:{clients:CLIENTS,people:PEOPLE,workMins:CFG.workMins,archiveDays:CFG.archiveDays,sound:CFG.sound}};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(blob,null,2)],{type:'application/json'}));
  a.download='taskboard-backup-'+todayStr()+'.json';a.click();
}
function restoreData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const b=JSON.parse(r.result);
      if(Array.isArray(b.tasks))tasks=b.tasks.map(normTask);
      if(Array.isArray(b.completions))completions=b.completions;
      if(Array.isArray(b.exceptions))exceptions=b.exceptions;
      if(Array.isArray(b.routines))routines=b.routines;
      if(Array.isArray(b.templates))templates=b.templates;
      if(b.cfg){if(b.cfg.clients)CLIENTS=b.cfg.clients;if(b.cfg.people)PEOPLE=b.cfg.people;if(b.cfg.workMins)CFG.workMins=b.cfg.workMins;if(b.cfg.archiveDays)CFG.archiveDays=b.cfg.archiveDays;if(typeof b.cfg.sound==='boolean')CFG.sound=b.cfg.sound;}
      saveTasks();saveComp();saveExc();saveRout();saveTmpl();saveCfg();closeSheet();render();toast('Restored from backup');
    }catch(e){toast('That file could not be read')}};
    r.readAsText(f);};
  inp.click();
}
function exportCsv(){
  const esc2=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['Title','Client','Owner','Type','Priority','Due','Repeat','Estimate','Status','Labels'].join(',')];

  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
  a.download='tasks-'+todayStr()+'.csv';a.click();

/* ============================================================ toast */
let toastTimer=null;
function toast(msg,undo){
  const t=$('#toast'),u=$('#toastUndo');
  $('#toastText').textContent=msg;
  if(undo){u.hidden=false;u.onclick=()=>{u.hidden=true;t.classList.remove('show');setTimeout(()=>t.hidden=true,300);undo();};}
  else u.hidden=true;
  t.hidden=false;requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.hidden=true,300)},undo?5000:2600);
}

function clearCompleted(){
  const today=todayStr();
  const undoData=[];
  tasks.forEach(t=>{
    if(t.rrule&&isCompleted(t.id,today)){undoData.push({type:'comp',taskId:t.id,date:today});completions=completions.filter(c=>!(c.taskId===t.id&&c.date===today));}
    else if(!t.rrule&&t.status==='done'&&!t.archivedAt&&t.completedAt&&t.completedAt.slice(0,10)===today){undoData.push({type:'task',id:t.id,prev:'done',at:t.completedAt});t.archivedAt=new Date().toISOString();}
  });
  saveTasks();saveComp();render();
  toast('Cleared '+undoData.length+' completed tasks',()=>{
    undoData.forEach(u=>{
      if(u.type==='comp')completions.push({id:uid(),taskId:u.taskId,date:u.date,at:u.at||new Date().toISOString()});
      else{const t=tasks.find(x=>x.id===u.id);if(t){t.archivedAt=null;t.status=u.prev;t.completedAt=u.at;}}
    });
    saveTasks();saveComp();render();
  });
}

/* ---- quick add parser (client-aware) ---- */
function parseQuickAdd(text){
  let t=' '+text.trim()+' ';const low=' '+text.toLowerCase()+' ';
  const res={title:text.trim(),client:null,type:'task',priority:null,due:null};
  const sorted=CLIENTS.slice().sort((a,b)=>b.name.length-a.name.length);
  for(const c of sorted){const n=c.name.toLowerCase();
    if(low.includes(' '+n+' ')||low.includes(' '+n)){res.client=c.id;t=t.replace(new RegExp(c.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),' ');break;}
    const first=n.split(' ')[0];if(first.length>3&&low.includes(' '+first+' ')){res.client=c.id;t=t.replace(new RegExp(first,'i'),' ');break;}
  }
  if(/\bhigh\b/i.test(t)){res.priority='High';t=t.replace(/\bhigh\b/i,' ');}
  else if(/\bmed(ium)?\b/i.test(t)){res.priority='Medium';t=t.replace(/\bmed(ium)?\b/i,' ');}
  else if(/\blow\b/i.test(t)){res.priority='Low';t=t.replace(/\blow\b/i,' ');}
  if(/\b(post|reel|story|carousel)\b/i.test(t))res.type='post';
  const map={sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
  const dm=t.toLowerCase().match(/\b(today|tomorrow|tmrw|mon|tue|wed|thu|fri|sat|sun)(day|s|nesday|rsday|urday)?\b/);
  if(dm){const w=dm[1];const today=new Date();today.setHours(12,0,0,0);let target=null;
    if(w==='today')target=new Date(today);
    else if(w==='tomorrow'||w==='tmrw'){target=new Date(today);target.setDate(target.getDate()+1);}
    else if(w in map){target=new Date(today);const diff=(map[w]-today.getDay()+7)%7||7;target.setDate(target.getDate()+diff);}
    if(target){res.due=target.getFullYear()+'-'+pad(target.getMonth()+1)+'-'+pad(target.getDate());t=t.replace(dm[0],' ');}
  }
  res.title=t.replace(/\s+/g,' ').trim()||text.trim();
  return res;
}

/* ============================================================ drag reorder (today + manual list) */
let dragId=null;
function currentListOrder(){
  if(UI.tab==='tasks'&&UI.view.layout==='list'){
    const flat=[];buildGroups(viewItems()).forEach(g=>g.items.forEach(o=>flat.push(o.task.id)));return flat;
  }
  return todaysTasks().map(o=>o.task.id);
}
function bindDrag(){
  const s=$('#screen');
  s.querySelectorAll('[data-grip]').forEach(g=>{
    g.addEventListener('pointerdown',e=>{
      e.preventDefault();
      const row=g.closest('.row');const cont=row.parentElement;dragId=row.dataset.tid;row.classList.add('dragging');
      const move=ev=>{
        const el=document.elementFromPoint(ev.clientX,ev.clientY);const over=el&&el.closest('.row');
        cont.querySelectorAll('.row').forEach(r=>r.classList.remove('drop-target'));
        if(over&&over!==row)over.classList.add('drop-target');
      };
      const up=ev=>{
        document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);
        const el=document.elementFromPoint(ev.clientX,ev.clientY);const over=el&&el.closest('.row');
        row.classList.remove('dragging');cont.querySelectorAll('.row').forEach(r=>r.classList.remove('drop-target'));
        if(over&&over.dataset.tid&&over.dataset.tid!==dragId)reorderTasks(dragId,over.dataset.tid);
        dragId=null;
      };
      document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
    });
  });
}
function reorderTasks(fromId,toId){
  const order=currentListOrder();
  const fi=order.indexOf(fromId),ti=order.indexOf(toId);if(fi<0||ti<0)return;
  order.splice(ti,0,order.splice(fi,1)[0]);
  order.forEach((id,i)=>{const t=tasks.find(x=>x.id===id);if(t)t.sortIndex=i;});
  saveTasks();render();
}

/* ============================================================ board drag */
let bDragId=null;
function bindBoardDrag(){
  const s=$('#screen');
  s.querySelectorAll('.bcard').forEach(card=>{
    card.addEventListener('dragstart',e=>{bDragId=card.dataset.tid;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    card.addEventListener('dragend',()=>{card.classList.remove('dragging');s.querySelectorAll('.bcol').forEach(c=>c.classList.remove('drop-target'));});
  });
  s.querySelectorAll('.bcol').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drop-target');});
    col.addEventListener('dragleave',()=>col.classList.remove('drop-target'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('drop-target');moveToGroup(bDragId,col.dataset.col);bDragId=null;});
  });
}
function moveToGroup(id,colKey){
  const t=tasks.find(x=>x.id===id);if(!t||!colKey)return;
  const today=todayStr();
  const pre=colKey.slice(0,2),val=colKey.slice(2);
  if(pre==='s_'){
    if(t.rrule){if(val==='done'){if(!isCompleted(t.id,today))completeInstance(t,today);}else{if(isCompleted(t.id,today))completeInstance(t,today);}}
    else{if(val==='done'&&t.status!=='done'){t.status='done';t.completedAt=new Date().toISOString();pop();}else if(val!=='done'){t.status=val;t.completedAt=null;}saveTasks();}
  }else if(pre==='c_'){t.client=val;saveTasks();}
  else if(pre==='p_'){if(PRIORITIES.includes(val)){t.priority=val;saveTasks();}}
  else{render();return;}
  render();
}

/* ============================================================ reminders */
function nowLocalMin(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function computeRemindAt(t){
  if(!t.remind||t.remind==='none')return null;
  if(t.remind==='custom')return t.remindAt||null;
  const rep=taskRep(t);if(!rep.date||rep.done)return null;
  if(t.remind==='due9')return rep.date+'T09:00';
  if(t.remind==='due18')return rep.date+'T18:00';
  if(t.remind==='before1d9')return addLocalDays(rep.date,-1)+'T09:00';
  return null;
}
function ensureNotifyPermission(){try{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();}catch(e){}}
function notify(title,body){try{if('Notification'in window&&Notification.permission==='granted')new Notification(title,{body});}catch(e){}}
function checkReminders(){
  const now=nowLocalMin();
  const cutoff=addLocalDays(todayStr(),-1)+'T'+now.slice(11);
  let changed=false;
  tasks.forEach(t=>{
    if(t.archivedAt)return;
    const at=computeRemindAt(t);if(!at||at>now)return;
    const key=t.id+'|'+at;if(fired.includes(key))return;
    fired.push(key);changed=true;
    if(at>=cutoff){notify('Task reminder',t.title+' · '+clientOf(t.client).name);pop();toast('Reminder · '+t.title);}
  });
  if(changed)saveFired();
}


/* ============================================================ supabase sync */
const SB_URL='https://wxbbobkgjfkviitkbien.supabase.co';
const SB_KEY='sb_publishable_L1j0KCJPx6h5td7K3d8ezw_XEWSDo3v';
const SB_TABLE='client_board';
const SB_ROW='pn_board_pratim_9c6b2f';
let syncRev=0,syncPushTimer=null,syncPulling=false;

function sbHeaders(){return{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=representation'}}
function buildSnapshot(){
  return{tasks,completions,exceptions,routines,templates,
    cfg:{clients:CLIENTS,people:PEOPLE,workMins:CFG.workMins,archiveDays:CFG.archiveDays,sound:CFG.sound},
    ui:UI,fired};
}
function applySnapshot(snap){
  if(Array.isArray(snap.tasks))tasks=snap.tasks.map(normTask);
  if(Array.isArray(snap.completions))completions=snap.completions;
  if(Array.isArray(snap.exceptions))exceptions=snap.exceptions;
  if(Array.isArray(snap.routines))routines=snap.routines;
  if(Array.isArray(snap.templates))templates=snap.templates;
  if(snap.cfg){
    if(snap.cfg.clients)CLIENTS=snap.cfg.clients;
    if(snap.cfg.people)PEOPLE=snap.cfg.people;
    if(snap.cfg.workMins)CFG.workMins=snap.cfg.workMins;
    if(snap.cfg.archiveDays)CFG.archiveDays=snap.cfg.archiveDays;
    if(typeof snap.cfg.sound==='boolean')CFG.sound=snap.cfg.sound;
  }
  if(snap.ui){UI={...UI,...snap.ui};if(snap.ui.view)UI.view={...UI.view,...snap.ui.view};}
  if(Array.isArray(snap.fired))fired=snap.fired;
  if(!['today','tasks','week'].includes(UI.tab))UI.tab='today';
  saveTasks();saveComp();saveExc();saveRout();saveTmpl();saveCfg();saveUi();saveFired();
}
async function syncPush(){
  clearTimeout(syncPushTimer);
  syncPushTimer=setTimeout(async()=>{
    syncRev=Date.now();
    const body={id:SB_ROW,data:buildSnapshot(),updated_at:syncRev};
    try{
      const r=await fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=eq.'+SB_ROW,{method:'GET',headers:sbHeaders()});
      const rows=await r.json();
      if(rows.length===0) await fetch(SB_URL+'/rest/v1/'+SB_TABLE,{method:'POST',headers:sbHeaders(),body:JSON.stringify(body)});
      else await fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=eq.'+SB_ROW,{method:'PATCH',headers:sbHeaders(),body:JSON.stringify(body)});
    }catch(e){}
  },1200);
}
async function syncPull(){
  if(syncPulling)return;syncPulling=true;
  try{
    const r=await fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=eq.'+SB_ROW,{method:'GET',headers:sbHeaders()});
    if(!r.ok){syncPulling=false;return;}
    const rows=await r.json();
    if(!rows.length){syncPulling=false;return;}
    const row=rows[0];
    if(row.updated_at&&row.updated_at>syncRev&&row.data){
      syncRev=row.updated_at;
      applySnapshot(row.data);
      render();
    }
  }catch(e){}
  syncPulling=false;
}
