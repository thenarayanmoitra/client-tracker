/* ================================================================ v6 · motion and polish (brand tokens unchanged) */
/* soft light that drifts very slowly behind everything */
.ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;will-change:transform}
.ambient i:nth-child(1){width:52vmax;height:52vmax;left:-16vmax;top:-22vmax;background:radial-gradient(circle,rgba(201,234,217,.85) 0%,rgba(201,234,217,0) 68%);animation:drift1 38s ease-in-out infinite alternate}
.ambient i:nth-child(2){width:44vmax;height:44vmax;right:-18vmax;top:24vh;background:radial-gradient(circle,rgba(226,241,216,.8) 0%,rgba(226,241,216,0) 68%);animation:drift2 46s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(9vmax,7vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-8vmax,-6vmax) scale(.92)}}
/* in dark mode the drifting light is a faint green glow, not pale smudges */
:root[data-theme=dark] .ambient{opacity:.1}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .ambient{opacity:.1}}

/* opening screen */
.boot{position:fixed;inset:0;z-index:200;display:grid;place-items:center;
  background:radial-gradient(60% 45% at 8% -5%,#D5EEE1 0%,rgba(213,238,225,0) 70%),radial-gradient(70% 50% at 50% 110%,#DFEBE4 0%,rgba(223,235,228,0) 70%),var(--bg);
  transition:opacity .55s var(--ease),visibility 0s linear .55s;animation:bootkill .01s 7s forwards}
.boot.out{opacity:0;visibility:hidden;pointer-events:none}
.boot-in{display:flex;flex-direction:column;align-items:center;gap:16px;transition:transform .6s var(--ease)}
.boot.out .boot-in{transform:scale(1.06) translateY(-8px)}
.boot-mark{width:78px;height:78px;border-radius:23px;box-shadow:0 24px 46px -18px rgba(20,97,76,.8);animation:bootpop .75s var(--spring) both}
.boot-mark svg{width:78px;height:78px;display:block}
.boot-mark .bk{stroke-dasharray:50;stroke-dashoffset:50;animation:draw .5s .34s var(--ease) forwards}
.boot-mark .bl{transform-box:fill-box;transform-origin:0% 100%;transform:scale(0);animation:leafin .55s .76s var(--spring) forwards}
.boot-word{font-family:var(--display);font-weight:750;font-size:26px;letter-spacing:-.02em;color:var(--ink);animation:fadeup .5s .5s var(--ease) both}
@keyframes bootkill{to{opacity:0;visibility:hidden;pointer-events:none}}
@keyframes bootpop{from{transform:scale(.55) rotate(-12deg);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes leafin{to{transform:scale(1)}}

/* sliding highlight under the active tab */
#sideNav{position:relative}
.nav-ind,.tab-ind{position:absolute;left:0;top:0;pointer-events:none;z-index:0;background:var(--brand-soft);
  transition:transform .46s cubic-bezier(.3,1.25,.5,1),width .3s var(--ease),height .3s var(--ease),opacity .2s}
.nav-ind{border-radius:13px}
.tab-ind{border-radius:20px}
#sideNav .nav-i,.tabbar .tab{position:relative;z-index:1}
#sideNav .nav-i.on,#sideNav .nav-i.on:hover,.tabbar .tab.on{background:transparent}
.nav-i svg,.tab svg{transition:transform .2s var(--spring)}
.nav-i:active svg,.tab:active svg{transform:scale(.88)}
.nav-i.just svg,.tab.just svg{animation:tabpop .5s var(--spring)}
@keyframes tabpop{0%{transform:scale(.78) translateY(2px)}60%{transform:scale(1.14) translateY(-1px)}100%{transform:none}}
.nav-i .grip{width:22px;height:26px;margin:-6px -6px -6px auto;opacity:0;transition:opacity .15s;border-radius:7px}
.nav-i .n+.grip{margin-left:2px}
.nav-i:hover .grip{opacity:1}
.drag-ghost.nav-i{background:var(--surface);color:var(--ink)}
.drag-ghost.tab{background:var(--surface);border-radius:20px;color:var(--brand-2)}
@media(max-width:359px){.tab{font-size:9.5px}.tab svg{width:21px;height:21px}}

/* page entrance when you switch tabs */
@keyframes enterup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.page.enter>*{animation:enterup .55s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms)}
.page.enter .rows>*,.page.enter .bcards>*,.page.enter .ngrid>*,.page.enter .hcards>*{animation:fadeup .5s var(--ease) both;animation-delay:calc(150ms + var(--j,0) * 38ms)}
@keyframes barin{from{width:0}}
.page.enter .hprog .bar i,.page.enter .goal-track i,.page.enter .ktrack i,.page.enter .ckp .tr i{animation:barin 1s .3s var(--ease) both}
.page.enter .chart rect{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s .2s var(--ease) both}
@keyframes grow{from{transform:scaleY(0)}}

/* a task or note you just added arrives with a glow */
.fresh{animation:freshin .8s var(--spring) both}
@keyframes freshin{0%{opacity:0;transform:translateY(-8px) scale(.98);box-shadow:0 0 0 3px var(--brand-soft-2)}60%{opacity:1}100%{transform:none}}

/* completing: a ring ripples out of the tick */
.tick.pop::before{content:"";position:absolute;inset:-2px;border-radius:50%;pointer-events:none;animation:ring .6s var(--ease) forwards}
@keyframes ring{from{box-shadow:0 0 0 0 rgba(30,127,102,.5)}to{box-shadow:0 0 0 14px rgba(30,127,102,0)}}
.ck-box.pop{box-shadow:0 0 0 6px rgba(47,158,110,0);transition:box-shadow .5s}

/* hero scene breathes */
.hero-art .h-cloud{animation:hcloud 16s ease-in-out infinite alternate;animation-delay:var(--ph,0s)}
.hero-art .h-birds{animation:hbirds 9s ease-in-out infinite;animation-delay:var(--ph,0s)}
.hero-art .h-sun{transform-box:fill-box;transform-origin:center;animation:hsun 6s ease-in-out infinite;animation-delay:var(--ph,0s)}
.hero-art .h-tree{transform-box:fill-box;transform-origin:50% 100%;animation:hsway 7s ease-in-out infinite;animation-delay:var(--ph,0s)}
.hero-art .h-tree.b{animation-duration:8.5s}
@keyframes hcloud{to{transform:translateX(-28px)}}
@keyframes hbirds{50%{transform:translate(-12px,-6px)}}
@keyframes hsun{50%{transform:scale(1.07);opacity:1}}
@keyframes hsway{50%{transform:rotate(1.8deg)}}

/* buttons get a soft sheen, surfaces lift a touch */
.btn-new,.btn.primary,.qa-go,.dp-h .add{position:relative}
.btn-new,.btn.primary,.fab,.qa-go,.dp-h .add{overflow:hidden;background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0))}
.btn-new::after,.btn.primary::after,.fab::after,.dp-h .add::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-130%);transition:transform .75s var(--ease)}
.btn-new:hover::after,.btn.primary:hover::after,.fab:hover::after,.dp-h .add:hover::after{transform:translateX(130%)}
.top.scrolled{box-shadow:0 10px 26px -20px rgba(19,33,26,.4)}
@media(hover:hover){
  .bcard:hover{transform:translateY(-2px)}
  .hcard,.ncard,.dlrow,.row-link{transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .15s}
  .hcard:hover,.ncard:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(19,33,26,.04),0 18px 36px -16px rgba(19,33,26,.26)}
  .row-link:hover{transform:translateX(2px)}
  .chip:hover,.qchip:hover,.tool:hover{border-color:var(--line-2)}
}
.bcol-h .bc{transition:transform .3s var(--spring)}
.drag-ghost{scale:1.02}
.sort-over{box-shadow:0 0 0 2px var(--brand-soft-2) !important}
.bcards.sort-over,.ngrid.sort-over{background:rgba(30,127,102,.05)}
.cscroll{position:relative}
.drag-ghost.chip{background:var(--surface)}
.drag-ghost.chip.on{background:var(--brand)}
.drag-ghost.ncard{background:var(--surface)}
.rows.rows-empty{background:var(--glass-2);border:1px dashed var(--line-2);box-shadow:none}
.rows-empty .quiet{border:0;background:transparent}

/* ================================================================ notes */
.nhead-tools{display:flex;align-items:center;gap:10px;margin:18px 2px 0;flex-wrap:wrap}
.nsearch{flex:1;min-width:180px;max-width:380px;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:13px;background:var(--card-solid);
  border:1px solid var(--line);box-shadow:var(--sh-1);color:var(--ink-3);transition:border-color .15s,box-shadow .15s}
.nsearch:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.nsearch input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:0}
.nsearch svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.nsec{display:flex;align-items:center;gap:8px;margin:24px 4px 10px}
.nsec h3{font-family:var(--display);font-size:17px;font-weight:750;margin:0;letter-spacing:-.01em}
.nsec .cnt{font-size:13px;font-weight:650;color:var(--ink-3)}
.nsec svg{width:15px;height:15px;color:var(--brand)}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px;position:relative;min-height:64px;border-radius:20px;transition:background .2s}
@media(max-width:560px){.ngrid{grid-template-columns:1fr 1fr;gap:10px}}
@media(max-width:350px){.ngrid{grid-template-columns:1fr}}
.ncard{position:relative;display:flex;flex-direction:column;gap:7px;min-height:136px;max-height:270px;padding:16px 15px 12px;background:var(--card-solid);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--sh-1);cursor:pointer;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ncard::before{content:"";position:absolute;left:16px;width:34px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--c,var(--brand))}
.ncard.pressing{transform:scale(.98)}
.ncard .nt{font-family:var(--display);font-weight:750;font-size:17px;line-height:1.22;letter-spacing:-.01em;word-break:break-word;padding-right:26px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ncard .nt.untitled{color:var(--ink-3)}
.ncard .nb{font-size:13.5px;color:var(--ink-2);line-height:1.5;white-space:pre-line;word-break:break-word;flex:1;
  display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.ncard .nb:empty{display:none}
.ncard .nf{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-3);margin-top:auto;padding-top:4px;min-width:0}
.ncard .nf .cdot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.ncard .nf .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ncard .nf .sp{flex:1}
.ncard .nf .grip{width:24px;height:22px;margin:-4px -6px -4px 0}
.npin{position:absolute;right:8px;top:9px;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3);opacity:0;transition:opacity .15s,background .15s,color .15s,transform .2s var(--spring)}
.npin svg{width:16px;height:16px}
.npin:hover{background:var(--fill);color:var(--ink)}
.npin:active{transform:scale(.85)}
.ncard:hover .npin,.npin.on{opacity:1}
.npin.on{color:var(--brand)}
.npin.on svg path{fill:currentColor}
@media(hover:none){.npin{opacity:.75}}
.ngrid .bempty{grid-column:1/-1}
.nmeta{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--ink-3);margin:2px 0 8px 2px;flex-wrap:wrap}
.nsaved{display:inline-flex;align-items:center;gap:6px}
.nsaved i{width:6px;height:6px;border-radius:50%;background:var(--green);transition:background .2s}
.nsaved.saving i{background:var(--amber);animation:blink 1s infinite}
.nbody{display:block;width:100%;min-height:40vh;border:0;background:transparent;resize:none;font-size:16px;line-height:1.65;padding:8px 2px 20px;color:var(--ink);overflow:hidden}
.nbody:focus-visible,#nTitle:focus-visible{outline:none}
/* reading typography for notes: a capped measure and a clear heading rhythm in the display face */
.npreview{min-height:40vh;padding:8px 2px 20px;font-size:16px;line-height:1.62;max-width:68ch}
.nbody{max-width:68ch;line-height:1.6;font-size:16px}
.npreview.md p{margin:0 0 12px}
.npreview.md h4{font-size:25px;line-height:1.18;letter-spacing:-.018em;margin:26px 0 8px}
.npreview.md h5{font-size:19.5px;line-height:1.25;letter-spacing:-.01em;margin:20px 0 6px}
.npreview.md h6{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin:18px 0 6px}
.npreview.md>h4:first-child,.npreview.md>h5:first-child,.npreview.md>h6:first-child{margin-top:4px}
.npreview.md ul,.npreview.md ol{margin:0 0 12px;padding-left:24px}
.npreview.md li{margin:4px 0}
.npreview.md li.task{margin-left:-22px}
.npreview.md blockquote{margin:0 0 12px;padding:4px 14px;font-style:italic;color:var(--ink-2)}
.npreview.md hr{margin:18px 0}
.npreview.md pre{margin:0 0 12px}
.ncard .nb{line-height:1.55}
.npreview:empty::before{content:"Nothing written yet.";color:var(--ink-3)}
.mdbar.show{display:flex;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:6px 0 2px}
.nprops{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:4px 0 6px}
.ibtn svg.filled path{fill:currentColor}

/* settings: arrange tabs */
.mgr .ti{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--fill);color:var(--ink-2);flex:0 0 auto}
.mgr .ti svg{width:16px;height:16px}
.mgr .tname{flex:1;min-width:0;font-size:15.5px;font-weight:600;padding:7px 2px}
.mgr .ttag{font-size:11px;font-weight:700;color:var(--brand-2);background:var(--brand-soft);padding:2px 8px;border-radius:999px;flex:0 0 auto}

/* ================================================================ v8 · GitHub style graphs */
.gh{padding:18px 18px 14px;margin-top:8px;position:relative;container-type:inline-size;--gc:var(--brand)}
.gh .ey,.lcard .ey,.wmain .ey,.wlog .ey,.jcompose .ey,.gh-over .ey{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.gh-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 12px}
.gh-top h3{margin:0;flex:1;min-width:200px;font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--ink-2)}
.gh-top h3 b{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.gh-years{display:flex;gap:3px;flex-wrap:wrap}
.gh-years button{height:30px;padding:0 11px;border-radius:9px;font-size:12.5px;font-weight:650;color:var(--ink-2);transition:background .15s,color .15s}
.gh-years button:hover{background:var(--fill)}
.gh-years button.on{background:var(--gc);color:#fff;box-shadow:0 6px 14px -8px var(--gc)}
.gh-scroll{overflow-x:auto;overflow-y:hidden;padding:2px 0 6px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.gh-body{display:flex;gap:6px;width:max-content;--gap:3px;--cs:max(10px,min(17px,calc((100cqw - 40px) / var(--weeks,53) - var(--gap))))}
.gh-days{display:grid;grid-template-rows:repeat(7,var(--cs));row-gap:var(--gap);margin-top:20px;width:26px;font-size:10.5px;font-weight:600;color:var(--ink-3)}
.gh-days span{line-height:var(--cs);height:var(--cs)}
.gh-months{display:grid;grid-template-columns:repeat(var(--weeks,53),var(--cs));column-gap:var(--gap);height:16px;margin-bottom:4px;font-size:11px;font-weight:600;color:var(--ink-3)}
.gh-months span{grid-row:1;white-space:nowrap;line-height:16px}
.gh-cells{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,var(--cs));grid-auto-columns:var(--cs);gap:var(--gap)}
.gh-cells i,.gh-foot i{display:block;width:var(--cs);height:var(--cs);border-radius:3.5px;background:var(--fill-2);box-shadow:inset 0 0 0 1px rgba(19,40,30,.04)}
.gh i.l1{background:color-mix(in srgb,var(--gc) 28%,var(--fill-2))}
.gh i.l2{background:color-mix(in srgb,var(--gc) 52%,var(--fill-2))}
.gh i.l3{background:color-mix(in srgb,var(--gc) 76%,var(--fill-2))}
.gh i.l4{background:var(--gc)}
.gh-cells i.o{background:transparent;box-shadow:none}
.gh-cells i.now{box-shadow:0 0 0 1.5px var(--ink-2)}
.gh-cells i[data-gd]{cursor:pointer;transition:transform .16s var(--spring)}
@media(hover:hover){.gh-cells i[data-gd]:hover{transform:scale(1.35);position:relative;z-index:1}}
.gh-cells i.hit{box-shadow:0 0 0 2px var(--ink);transform:scale(1.2);position:relative;z-index:1}
.gh-foot{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:11.5px;color:var(--ink-3)}
.gh-foot i{width:11px;height:11px;border-radius:3px}
.gh-hint{font-size:11.5px}
.gh-tip{position:absolute;z-index:6;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:650;padding:6px 10px;border-radius:9px;white-space:nowrap;
  transform:translate(-50%,-100%);box-shadow:0 10px 24px -10px rgba(0,0,0,.45);animation:tipin .16s var(--ease)}
.gh-tip::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;margin-left:-4px;background:inherit;transform:rotate(45deg);border-radius:1px}
@keyframes tipin{from{opacity:0;transform:translate(-50%,-90%)}}
.gh-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
@media(max-width:620px){.gh-stats{grid-template-columns:1fr 1fr}}
.gh-stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;min-width:0}
.gh-stat b{display:block;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh-stat span{display:block;font-size:12px;font-weight:600;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lstats{margin-top:12px}
.lstats .gh-stat{background:var(--card);border-color:var(--card-brd);box-shadow:var(--sh-1)}
.gh-over{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
@media(max-width:700px){.gh-over{grid-template-columns:1fr;gap:16px}}
.gh-over .tmbar{margin:10px 0 10px}
.dowbars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;height:86px}
.dw{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.dw .bar{flex:1;width:100%;max-width:26px;border-radius:7px;background:var(--fill-2);display:flex;align-items:flex-end;overflow:hidden}
.dw .bar i{display:block;width:100%;border-radius:7px;background:var(--gc);transition:height .6s var(--ease)}
.dw b{font-size:11px;font-weight:700;color:var(--ink-3)}
.gh-kinds{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.gh-kinds button{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);font-size:13px;font-weight:650;color:var(--ink-2);background:var(--surface);transition:background .2s,color .2s,border-color .2s}
.gh-kinds button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.gh-kinds button.on{background:var(--c);border-color:var(--c);color:#fff}
.gh-kinds button.on i{background:#fff}
/* graph squares arrive in a wave, week by week */
.page.enter .gh-cells i:not(.o),.gh-cells.swap i:not(.o){animation:ghpop .5s var(--spring) both;animation-delay:calc(60ms + var(--w,0) * 12ms)}
@keyframes ghpop{from{opacity:0;transform:scale(.15)}}
.page.enter .dw .bar i{animation:barup .9s .3s var(--ease) both}
@keyframes barup{from{height:0}}

/* ================================================================ v8 · life */
.lnav{position:relative;display:flex;gap:2px;padding:4px;border-radius:16px;background:var(--seg-bg);margin:4px 0 6px;overflow-x:auto;scrollbar-width:none}
.lnav::-webkit-scrollbar{display:none}
.lnav button{position:relative;z-index:1;flex:1 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 13px;border-radius:12px;font-size:14px;font-weight:650;color:var(--ink-2);white-space:nowrap;transition:color .2s}
.lnav button svg{width:17px;height:17px}
.lnav button.on{color:var(--ink)}
.lnav .tab-ind{background:var(--surface);box-shadow:0 1px 3px rgba(19,33,26,.14);border-radius:12px}
@media(max-width:440px){.lnav button{flex:1 1 auto;padding:0 6px;font-size:13.5px}.lnav button svg{display:none}}
@media(max-width:600px){.gh-kinds{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-18px;margin-right:-18px;padding:0 18px}.gh-kinds::-webkit-scrollbar{display:none}.gh-kinds button{flex:0 0 auto}
  .gh{padding:16px 14px 12px}.gh-kinds{margin-left:-14px;margin-right:-14px;padding:0 14px}}
@media(min-width:1024px){.lnav{display:none}}
.lquick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.lq{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px 14px 13px;border-radius:20px;background:var(--card-solid);border:1px solid var(--line);
  box-shadow:var(--sh-1);text-align:left;transition:transform .25s var(--spring),box-shadow .25s var(--ease)}
.lq::after{content:"";position:absolute;right:-26px;top:-26px;width:86px;height:86px;border-radius:50%;background:var(--c);opacity:.08;transition:transform .5s var(--ease)}
@media(hover:hover){.lq:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}.lq:hover::after{transform:scale(1.25)}}
.lq:active{transform:scale(.97)}
.lq .li{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);margin-bottom:6px}
.lq .li svg{width:21px;height:21px}
.lq b{font-size:15px;font-weight:700}
.lq span:last-child{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media(max-width:520px){.lq{padding:12px 10px;border-radius:17px}.lq b{font-size:13.5px}.lq span:last-child{font-size:11.5px}.lq .li{width:36px;height:36px}}
.lcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
@media(max-width:1180px){.lcards{grid-template-columns:1fr 1fr}}
@media(max-width:380px){.lcards{gap:8px}}
.lcard{padding:15px 15px 14px;cursor:pointer;position:relative;overflow:hidden;min-width:0;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
@media(hover:hover){.lcard:hover{transform:translateY(-2px)}}
.lcard::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c);opacity:.85}
.lcard .ey{display:flex;align-items:center;gap:6px}
.lcard .ey i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.lcard .big{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.05;margin-top:8px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard .big small{font-size:14px;font-weight:700;color:var(--ink-3);margin-left:4px;letter-spacing:0}
.big.dim,.wbig.dim{color:var(--ink-3)}
.lcard .sub{font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.4}
.spark{display:block;width:100%;height:36px;margin-top:10px}
.page.enter .spark path,.page.enter .wchart .avg{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s .3s var(--ease) forwards}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--fill);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.delta.good{color:var(--green);background:rgba(47,158,110,.13)}
.delta.bad{color:var(--red);background:rgba(209,75,75,.11)}
.moodstrip{display:flex;gap:3px;margin-top:12px}
.moodstrip i{flex:1;height:20px;border-radius:5px;background:var(--fill-2);min-width:0;transition:transform .2s var(--spring)}
@media(hover:hover){.moodstrip i:hover{transform:scaleY(1.2)}}
.wdots{display:flex;gap:4px;margin-top:12px}
.wdots span{flex:1;height:22px;min-width:18px;border-radius:7px;background:var(--fill-2);display:grid;place-items:center;font-size:10px;font-weight:750;color:var(--ink-3)}
.wdots span.on{background:var(--c);color:#fff}
.wdots span.now{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.goal-top .wdots{margin-top:0;max-width:200px;flex:1}
.feed{position:relative}
.fday{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:16px 4px 8px}
.fday:first-child{margin-top:4px}
.fitem{display:flex;gap:12px;align-items:center;padding:11px 14px;background:var(--card-solid);border:1px solid var(--line);border-radius:15px;margin-bottom:8px;cursor:pointer;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
@media(hover:hover){.fitem:hover{box-shadow:var(--sh-2);transform:translateX(3px)}}
.fitem .fi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);flex:0 0 auto}
.fitem .fi svg{width:19px;height:19px}
.fitem .fx{flex:1;min-width:0}
.fitem .ft{font-size:14.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fitem .fm{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.fitem .fv{font-family:var(--display);font-weight:750;font-size:16px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.jmood{display:inline-flex;align-items:center;gap:5px;font-family:var(--font);font-size:12px;font-weight:700;color:var(--ink-2)}
.jmood i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.dd{width:42px;text-align:center;flex:0 0 auto}
.dd b{display:block;font-family:var(--display);font-size:21px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.dd span{font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
/* weight */
.whero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:18px;padding:20px;margin-top:8px;position:relative;overflow:hidden}
@media(max-width:760px){.whero{grid-template-columns:minmax(0,1fr);padding:18px 16px 16px}}
.whero::before{content:"";position:absolute;left:-80px;top:-120px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--wc) 20%,transparent),transparent 70%);pointer-events:none}
.wmain{position:relative;min-width:0}
.wbig{font-family:var(--display);font-weight:800;font-size:58px;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums;margin-top:8px}
.wbig small{font-size:20px;color:var(--ink-3);font-weight:700;margin-left:6px;letter-spacing:0}
.wdeltas{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.wdeltas:empty{display:none}
.wlog{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 10px;align-self:start;box-shadow:var(--sh-1)}
.wl-in{display:flex;align-items:center;gap:8px;margin-top:4px}
.wl-in input{flex:1;min-width:0;width:100%;font-family:var(--display);font-size:30px;font-weight:750;border:0;background:transparent;padding:4px 2px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.wl-in input::-webkit-outer-spin-button,.wl-in input::-webkit-inner-spin-button,.wbig-in input::-webkit-outer-spin-button,.wbig-in input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.wl-in .u{font-size:15px;font-weight:700;color:var(--ink-3)}
.wl-in .go{height:44px;padding:0 18px;border-radius:13px;background:var(--wc);color:#fff;font-weight:700;font-size:15px;box-shadow:0 10px 20px -12px var(--wc);transition:transform .12s,filter .15s}
.wl-in .go:hover{filter:brightness(1.07)}

.sidesync{display:flex;align-items:center;gap:9px;width:100%;padding:8px 12px;border-radius:12px;font-size:12.5px;font-weight:550;color:var(--ink-3);transition:color .15s,background .15s}

.sidesync .sd{width:8px;height:8px;border-radius:50%;background:var(--green);flex:0 0 auto}
.sidesync .sd.syncing{background:var(--amber);animation:blink 1s infinite}
.sidesync .sd.offline,.sidesync .sd.error,.sidesync .sd.paused{background:var(--red)}
.sidesync .sd.idle,.sidesync .sd.local{background:var(--ink-3)}
.syncline .sd.local,.syncline .sd.idle{background:var(--ink-3)}

/* a clock left running */
.notice.clk{background:var(--gold-soft);color:var(--gold-ink)}
.notice.clk button{color:var(--gold-ink)}
.notice.clk span{min-width:0}

/* post ready till */
.mt{max-width:100%;min-width:0;overflow:hidden}
.mt.ready{gap:4px;color:var(--gold-ink);background:var(--gold-soft);font-weight:650;padding:1px 8px 1px 6px;border-radius:999px;cursor:pointer}
.mt.ready.out{color:var(--notice-ink);background:rgba(209,75,75,.1)}
.prop.ready{color:var(--gold-ink);border-color:var(--gold);background:var(--gold-soft)}
.prop.ready svg{color:var(--gold)}
.prop.ready.out{color:var(--notice-ink);border-color:var(--red);background:rgba(209,75,75,.08)}
.prop.ready.out svg{color:var(--red)}
.qchip.gold{color:var(--gold-ink);border-color:var(--gold)}
.qchip.gold svg{color:var(--gold)}
.qchip.gold.on{background:var(--gold);border-color:var(--gold);color:#fff}
.qchip.gold.on svg{color:#fff}
.runway{margin-top:16px}
.rw-h{display:flex;align-items:baseline;gap:9px;margin:0 4px 9px}
.rw-h h3{margin:0;font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em}
.rw-h span{font-size:13px;font-weight:550;color:var(--ink-3)}
.rw-row{display:flex;gap:9px;overflow-x:auto;padding:2px;margin:-2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.rw-row::-webkit-scrollbar{display:none}
.rw{position:relative;overflow:hidden;flex:0 0 auto;width:180px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:12px 14px;border-radius:var(--r-md);background:var(--card-solid);border:1px solid var(--line);box-shadow:var(--sh-1);text-align:left;transition:transform .34s var(--spring-pop,var(--spring)),box-shadow .25s}
.rw::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}

.rw b{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:-.02em;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.rw-d{font-size:12px;color:var(--ink-3)}
.rw-bar{display:block;width:100%;height:4px;border-radius:3px;background:var(--fill-2);margin-top:9px;overflow:hidden}
.rw-bar i{display:block;height:100%;width:var(--p);border-radius:3px;background:var(--brand)}
.rw.thin .rw-bar i{background:var(--amber)}
.rw.low .rw-bar i{background:var(--orange)}

.rs-who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs-sum{margin:0 0 12px;font-size:15px;color:var(--ink-2);line-height:1.4}
.rs-sum b{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.015em;color:var(--brand-ink)}
.rs-sum.out{color:var(--notice-ink)}
.chip .chip-d{font-weight:500;color:var(--ink-3);margin-left:2px}
.chip.on .chip-d{color:inherit;opacity:.75}
.mday.rdy::after{content:"";position:absolute;left:50%;bottom:3px;width:14px;height:2.5px;margin-left:-7px;border-radius:2px;background:var(--amber)}
.dprdy{display:flex;align-items:center;gap:8px;margin:0 2px 12px;padding:9px 12px;border-radius:13px;background:var(--gold-soft);color:var(--gold-ink);font-size:13px;font-weight:600;cursor:pointer}

/* the soft light that follows the cursor across cards */
.bcard{overflow:hidden;transition:box-shadow .2s,transform .34s var(--spring-pop,var(--spring))}
.bcard::after,.ncard::after,.rw::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--c,var(--brand)) 9%,transparent),transparent 68%)}
@media(hover:hover){.bcard:hover::after,.ncard:hover::after,.rw:hover::after{opacity:1}}

/* a tick draws itself and throws sparks */
.tick{transition:border-color .15s,background .15s,transform .34s var(--spring-pop,var(--spring))}

.spark-at{position:fixed;width:0;height:0;z-index:96;pointer-events:none}

/* sheets rise on a spring */

<script>
'use strict';
/* ============================================================ storage seam
   Every read and write goes through store. Values are mirrored in memory so a full device
   (quota exceeded) never serves a stale copy back to the app. */
const mem={};
let storageWarned=false;
const store={
  ok:(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}})(),
  get(k){if(k in mem)return mem[k];if(this.ok){try{return localStorage.getItem(k)}catch(e){}}return null},
  set(k,v){mem[k]=v;if(this.ok){try{localStorage.setItem(k,v);return true}catch(e){storageFull();return false}}return true},
  del(k){delete mem[k];if(this.ok){try{localStorage.removeItem(k)}catch(e){}}}
};
function storageFull(){if(storageWarned)return;storageWarned=true;setTimeout(()=>toast('This device is out of storage space. Your changes still sync to the cloud. Removing large file attachments frees space.'),60)}
/* a stored value that will not parse is set aside under its own key, never overwritten, so it can still be rescued */
function parseStored(key,fallback){
  const raw=store.get(key);
  if(raw===null)return fallback;
  try{return JSON.parse(raw)}catch(e){
    try{localStorage.setItem('pn_tb2_corrupt_'+key,raw)}catch(_){}
    setTimeout(()=>toast('Part of this device\'s copy could not be read. It was set aside, and the cloud copy fills the gap.'),900);
    return fallback;
  }
}

/* storage keys are unchanged from earlier versions so every existing board loads as is */
const K={tasks:'pn_tb2_tasks',comp:'pn_tb2_comp',exc:'pn_tb2_exc',rout:'pn_tb2_rout',
  tmpl:'pn_tb2_tmpl',cfg:'pn_tb2_cfg',ui:'pn_tb2_ui',rem:'pn_tb2_rem',meet:'pn_tb2_meet',x:'pn_tb2_x',
  dirty:'pn_tb2_dirty',v5synced:'pn_tb2_v5_synced',draftNew:'pn_tb2_draft_new',
  notes:'pn_tb2_notes', // v6 adds notes under a key of its own, every earlier key is untouched
  time:'pn_tb2_time',   // v7 adds the time log under a key of its own
  life:'pn_tb2_life'};  // v8 adds weight, workouts and journal entries under a key of their own
const OLD={tasks:'pn_taskboard_v1',cfg:'pn_taskboard_cfg_v1'};

/* ============================================================ recurrence engine */
function ruleFromPreset(key,anchor){
  if(!key)return null;
  const a=parseYmd(anchor||todayStr());
  switch(key){
    case'daily':return{freq:'DAILY',interval:1};
    case'weekdays':return{freq:'WEEKLY',interval:1,byday:WEEKDAYS.slice()};
    case'weekly':return{freq:'WEEKLY',interval:1,byday:[DOW[a.getUTCDay()]]};
    case'biweekly':return{freq:'WEEKLY',interval:2,byday:[DOW[a.getUTCDay()]]};
    case'monthly':return{freq:'MONTHLY',interval:1};
    case'monthlyWeekday':return{freq:'MONTHLY',interval:1,byday:[DOW[a.getUTCDay()]],bysetpos:isLastWeekday(a)?-1:nthWeekdayPos(a)};
    case'yearly':return{freq:'YEARLY',interval:1};
    default:return null;
  }
}
function baseMatches(rule,anchor,test){
  const a=parseYmd(anchor),t=parseYmd(test);
  if(t<a)return false;
  const iv=rule.interval||1;
  if(rule.freq==='DAILY')return daysBetweenU(anchor,test)%iv===0;
  if(rule.freq==='WEEKLY'){
    const days=(rule.byday&&rule.byday.length)?rule.byday:[DOW[a.getUTCDay()]];
    if(!days.includes(DOW[t.getUTCDay()]))return false;
    return(((weekIndexU(t)-weekIndexU(a))%iv)+iv)%iv===0;
  }
  if(rule.freq==='MONTHLY'){
    const md=(t.getUTCFullYear()-a.getUTCFullYear())*12+(t.getUTCMonth()-a.getUTCMonth());
    if(md%iv!==0)return false;
    if(rule.byday&&rule.bysetpos){
      if(DOW[t.getUTCDay()]!==rule.byday[0])return false;
      if(rule.bysetpos===-1)return isLastWeekday(t);
      return nthWeekdayPos(t)===rule.bysetpos;
    }
    return t.getUTCDate()===clampDay(t.getUTCFullYear(),t.getUTCMonth(),a.getUTCDate());
  }
  if(rule.freq==='YEARLY'){
    if((t.getUTCFullYear()-a.getUTCFullYear())%iv!==0)return false;
    if(t.getUTCMonth()!==a.getUTCMonth())return false;
    return t.getUTCDate()===clampDay(t.getUTCFullYear(),t.getUTCMonth(),a.getUTCDate());
  }
  return false;
}
const countEndMemo=new Map();
function countEnd(rule,anchor){
  const key=anchor+'|'+JSON.stringify(rule);
  if(countEndMemo.has(key))return countEndMemo.get(key);
  let n=0,cur=parseYmd(anchor),end=null,g=0;
  while(g++<4000){const s=ymdU(cur);if(baseMatches(rule,anchor,s)){n++;if(n>=rule.count){end=s;break;}}cur=addDaysU(cur,1);}
  countEndMemo.set(key,end);return end;
}
function ruleMatches(rule,anchor,test){
  if(rule.until&&test>rule.until)return false;
  if(rule.count>0){const e=countEnd(rule,anchor);if(e&&test>e)return false;}
  return baseMatches(rule,anchor,test);
}
function occurrences(task,from,to){
  let out=[];
  if(!task.rrule){ if(task.due&&task.due>=from&&task.due<=to)out.push(task.due); }
  else{
    const anchor=task.due||from;
    let cur=parseYmd(from<anchor?anchor:from);const end=parseYmd(to);let g=0;
    while(cur<=end&&g++<1500){const s=ymdU(cur);if(ruleMatches(task.rrule,anchor,s))out.push(s);cur=addDaysU(cur,1);}
  }
  exceptions.forEach(e=>{
    if(e.taskId!==task.id)return;
    if(e.action==='skip')out=out.filter(d=>d!==e.date);
    if(e.action==='move'){out=out.filter(d=>d!==e.date);if(e.newDate>=from&&e.newDate<=to)out.push(e.newDate);}
  });
  return [...new Set(out)].sort();
}
function isCompleted(taskId,date){return completions.some(c=>c.taskId===taskId&&c.date===date)}
function nextDue(task,from){
  if(!task.rrule){
    if(!task.due)return null;
    if(task.status==='done')return null;
    return task.due;
  }
  const anchor=task.due||from;
  const lookback=addLocalDays(from,-60);
  const start=lookback<anchor?anchor:lookback;
  const occ=occurrences(task,start,addLocalDays(from,800));
  return occ.find(s=>!isCompleted(task.id,s))||null;
}
function hiddenNow(task){return!!(task.startDate&&task.startDate>todayStr())}
function openTodayInstance(task){
  const today=todayStr();
  if(hiddenNow(task))return null;
  if(!task.rrule){
    if(task.status==='done'||task.archivedAt)return null;
    if(!task.due)return{date:today,floating:true};
    if(task.due<=today)return{date:task.due};
    return null;
  }
  const occ=occurrences(task,task.due||today,today);
  for(const d of occ){if(!isCompleted(task.id,d))return{date:d};}
  return null;
}
/* the open occurrence a board or list should show for a task, looking no further than `end` */
function openInstanceUpTo(task,end){
  if(task.archivedAt||isNote(task))return null;
  if(!task.rrule){
    if(task.status==='done')return null;
    if(!task.due)return{date:todayStr(),floating:true};
    return task.due<=end?{date:task.due}:null;
  }
  if(hiddenNow(task))return null;
  const d=nextDue(task,todayStr());
  return d&&d<=end?{date:d}:null;
}
function ordinal(n){return n===-1?'last':['','1st','2nd','3rd','4th','5th'][n]||n+'th'}
function repeatLabel(rule){
  if(!rule)return'';
  const iv=rule.interval||1;let s;
  if(rule.freq==='DAILY')s=iv===1?'Every day':'Every '+iv+' days';
  else if(rule.freq==='WEEKLY'){
    const d=rule.byday||[];
    if(iv===1&&d.length===5&&WEEKDAYS.every(x=>d.includes(x)))s='Weekdays';
    else if(iv===1&&d.length===7)s='Every day';
    else{const names=MON_FIRST.filter(x=>d.includes(x)).map(x=>DOW_LABEL[x]).join(' ');
      s=(iv===1?'Every ':'Every '+iv+' wks · ')+names;}
  }
  else if(rule.freq==='MONTHLY'){
    const base=iv===1?'Monthly':'Every '+iv+' months';
    s=rule.bysetpos?base+' · '+ordinal(rule.bysetpos)+' '+DOW_LABEL[rule.byday[0]]:base;
  }
  else if(rule.freq==='YEARLY')s=iv===1?'Yearly':'Every '+iv+' years';
  else s='Repeats';
  if(rule.until)s+=' · until '+fmtDM(rule.until);
  else if(rule.count)s+=' · '+rule.count+'×';
  return s;
}

    if(it.remind==='none'&&['attime','before30'].includes(loc.remind))it.remind=loc.remind;
    if(Array.isArray(it.subtasks)&&Array.isArray(loc.subtasks)){

/* the clock. A task in progress has exactly one open session; leaving In progress closes it.

  const now=Date.now();let ch=false;

  const byId=new Map(tasks.map(t=>[t.id,t]));

/* estimate against actual. Finished tasks with both a duration and logged time teach a correction factor
   per client (falling back to everything), the median of actual over estimate, kept between half and triple */
function estStats(client){
  const rows=[];
  tasks.forEach(t=>{if(!t.estimate||t.rrule||t.status!=='done'||isNote(t))return;if(client&&t.client!==client)return;
    const act=timeSpent(t.id)/60000;if(act<3)return;rows.push({est:t.estimate,act});});
  if(rows.length<2)return null;
  const ratios=rows.map(x=>x.act/x.est).sort((a,b)=>a-b);
  const med=ratios.length%2?ratios[(ratios.length-1)/2]:(ratios[ratios.length/2-1]+ratios[ratios.length/2])/2;
  return{n:rows.length,factor:Math.max(.5,Math.min(3,med)),est:rows.reduce((s,x)=>s+x.est,0),act:rows.reduce((s,x)=>s+x.act,0)};

const OLD_REPEAT=['daily','weekdays','weekly','biweekly','monthly','monthlyWeekday','yearly'];
function migrateOld(){

  try{oldTasks=JSON.parse(store.get(OLD.tasks)||'[]')}catch(e){oldTasks=[]}
  if(!Array.isArray(oldTasks)||!oldTasks.length)return false;
  const bySeries={};

  let idx=0;
  Object.values(bySeries).forEach(grp=>{
    grp.sort((a,b)=>String(a.due||'').localeCompare(String(b.due||'')));
    const first=grp[0];
    const rep=OLD_REPEAT.includes(first.repeat)?first.repeat:null;
    if(rep){
      const anchor=grp.map(g=>g.due).filter(Boolean).sort()[0]||first.due||todayStr();
      const nt=normTask({
        id:uid(),title:first.title,client:first.client,assignee:first.assignee,

        due:anchor,deadline:first.deadline,rrule:ruleFromPreset(rep,anchor),
        labels:first.labels,subtasks:(first.subtasks||[]).map(s=>({id:uid(),text:s.text,done:false})),
        notes:first.notes,status:'todo',sortIndex:idx++
      });
      tasks.push(nt);
      grp.forEach(g=>{if(g.status==='done'&&g.due)completions.push({id:uid(),taskId:nt.id,date:g.due,at:g.completedAt||new Date().toISOString()})});
    }else{

/* ---- one-time local safety copies, written straight to localStorage and never overwritten ---- */
function safetyCopy(flagKey,copyKey){
  try{
    if(localStorage.getItem(flagKey))return;
    const keys={};let size=0;Object.values(K).forEach(k=>{const v=localStorage.getItem(k);if(v!==null){keys[k]=v;size+=v.length;}});
    // a large board is not duplicated on the device, so the copy can never crowd out real saves.
    // the untouched cloud copy taken on the first sync covers that case
    let used=0;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);used+=k.length+(localStorage.getItem(k)||'').length;}
    if(Object.keys(keys).length&&size<1500000&&used+size<2000000)localStorage.setItem(copyKey,JSON.stringify({at:new Date().toISOString(),keys}));
  }catch(e){}
  try{localStorage.setItem(flagKey,'1')}catch(e){}
}

/* ============================================================ archive (hides, never deletes) */
function runArchive(){
  const cutoff=addLocalDays(todayStr(),-(CFG.archiveDays||4));
  let changed=false;
  tasks.forEach(t=>{
    if(t.status==='done'&&!t.rrule&&!t.archivedAt&&t.completedAt){
      const d=localDay(t.completedAt);
      if(t.due&&d>t.due)return;
      if(d<cutoff){t.archivedAt=new Date().toISOString();changed=true;}
    }
  });
  if(changed)saveTasks();
}

/* ============================================================ productivity: counts, goals, streaks, karma */
function onVacation(d){return X.vacations.some(v=>v&&v.from&&d>=v.from&&(!v.to||d<=v.to))||X.trips.some(t=>t&&d>=t.from&&d<=t.to)}
function manualVacation(){const v=X.vacations[X.vacations.length-1];return!!(v&&!v.to)}
function vacationActive(){return manualVacation()||onVacation(todayStr())}
function isOffDay(d){return X.daysOff.includes(dowOf(d))||onVacation(d)}
function completionLog(){
  const out=[];const byId=new Map(tasks.map(t=>[t.id,t]));
  tasks.forEach(t=>{if(!t.rrule&&t.status==='done'&&t.completedAt&&!isNote(t))out.push({day:localDay(t.completedAt),prio:t.priority,id:t.id});});
  completions.forEach(c=>{const t=byId.get(c.taskId);out.push({day:c.at?localDay(c.at):c.date,prio:t?t.priority:'None',id:c.taskId});});
  return out;
}
function weekCount(counts,mon){let n=0;for(let i=0;i<7;i++)n+=counts.get(addLocalDays(mon,i))||0;return n}
function weekHasVacation(mon){for(let i=0;i<7;i++)if(onVacation(addLocalDays(mon,i)))return true;return false}
function overduePenalties(){
  if(vacationActive())return[];
  const out=[];
  tasks.forEach(t=>{
    if(t.archivedAt||isNote(t)||t.habit)return;
    let d=null;
    if(t.rrule){const inst=openTodayInstance(t);d=inst&&inst.date;}
    else if(t.status!=='done'&&t.due)d=t.due;
    if(!d)return;
    const late=-dayDiff(d);
    if(late>5)out.push({task:t,late,pts:Math.min((late-5)*2,20)});
  });
  return out.sort((a,b)=>b.late-a.late);
}
let statsMemo=null;
function computeStats(){
  const key=dataVer+'|'+todayStr()+'|'+completions.length+'|'+tasks.length+'|'+X.dailyGoal+'|'+X.weeklyGoal+'|'+X.vacations.length+'|'+X.daysOff.join();
  if(statsMemo&&statsMemo.key===key)return statsMemo.v;
  const today=todayStr();
  const log=completionLog();
  const counts=new Map();log.forEach(e=>counts.set(e.day,(counts.get(e.day)||0)+1));
  const days=[...counts.keys()].sort();
  const first=days[0]||today;
  const g=X.dailyGoal,wg=X.weeklyGoal;
  // daily streak: off days and vacation days neither count nor break it
  let streak=0;{let d=today;if((counts.get(today)||0)<g)d=addLocalDays(today,-1);
    for(let i=0;i<1500;i++){if(d<first)break;if(isOffDay(d)){d=addLocalDays(d,-1);continue;}
      if((counts.get(d)||0)>=g){streak++;d=addLocalDays(d,-1);}else break;}}
  let longest=0,run=0,goalDays=0;
  for(let d=first,i=0;d<=today&&i<3000;d=addLocalDays(d,1),i++){
    const n=counts.get(d)||0;
    if(n>=g){goalDays++;run++;longest=Math.max(longest,run);}
    else if(isOffDay(d)||d===today){}
    else run=0;
  }
  const thisMon=mondayOf(today);
  let wstreak=0;{let m=thisMon;if(weekCount(counts,m)<wg)m=addLocalDays(m,-7);
    for(let i=0;i<300;i++){if(addLocalDays(m,6)<first)break;const n=weekCount(counts,m);
      if(n>=wg){wstreak++;m=addLocalDays(m,-7);}else if(weekHasVacation(m)){m=addLocalDays(m,-7);}else break;}}
  let goalWeeks=0;for(let m=mondayOf(first),i=0;m<=thisMon&&i<400;m=addLocalDays(m,7),i++)if(weekCount(counts,m)>=wg)goalWeeks++;
  const taskPts=log.reduce((s,e)=>s+(KPTS[e.prio]||4),0);
  const pens=overduePenalties();const penalty=pens.reduce((s,p)=>s+p.pts,0);
  const karma=Math.max(0,taskPts+goalDays*10+goalWeeks*30-penalty);
  let li=0;LEVELS.forEach((l,i)=>{if(karma>=l[1])li=i;});
  const next=LEVELS[li+1];
  const v={counts,today:counts.get(today)||0,week:weekCount(counts,thisMon),streak,longest,wstreak,
    karma,taskPts,goalDays,goalWeeks,penalty,pens,total:log.length,level:LEVELS[li][0],levelIdx:li,
    next:next?next[0]:null,toNext:next?next[1]-karma:0,levelPct:next?Math.round((karma-LEVELS[li][1])/(next[1]-LEVELS[li][1])*100):100};
  statsMemo={key,v};
  return v;
}

/* ============================================================ sound
   Everything you hear is made on the spot from three soft voices: a wooden pluck, a glass bell and a breath of
   filtered noise. No files to load. One short room reverb ties them together so the app sounds like one place */
let AC=null,SFX=null,lastSound=0,lastName='';
const VOLS={soft:.3,medium:.58,full:1};
function audio(){
  const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return null;
  if(!AC){
    AC=new Ctx();
    const out=AC.createGain();out.gain.value=VOLS[UI.sfxVol]||VOLS.medium;
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.attack.value=.002;comp.release.value=.12;
    out.connect(comp);comp.connect(AC.destination);
    const len=Math.floor(AC.sampleRate*.9),ir=AC.createBuffer(2,len,AC.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);let lp=0;for(let i=0;i<len;i++){lp+=((Math.random()*2-1)*Math.pow(1-i/len,3.2)-lp)*.28;d[i]=lp;}}
    const rev=AC.createConvolver();rev.buffer=ir;const wet=AC.createGain();wet.gain.value=.22;rev.connect(wet);wet.connect(out);
    const noise=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),nd=noise.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    SFX={out,rev,noise};
  }
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function setSfxVol(){if(SFX)SFX.out.gain.value=VOLS[UI.sfxVol]||VOLS.medium;}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const SCALE=[60,62,64,67,69,72,74,76,79,81,84]; // a pentatonic run, so any two sounds sit well together
function voice(type,f,t,dur,peak,wet,a){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+(a||.004));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(SFX.out);if(wet){const s=AC.createGain();s.gain.value=wet;g.connect(s);s.connect(SFX.rev);}
  o.start(t);o.stop(t+dur+.03);
}
function pluck(f,t,peak,dur){dur=dur||.34;voice('sine',f,t,dur,peak,.5);voice('sine',f*3.93,t,dur*.22,peak*.22,.3);voice('triangle',f*.5,t,dur*.4,peak*.18,0);}
function bell(f,t,peak,dur){dur=dur||1.1;voice('sine',f,t,dur,peak,.9);voice('sine',f*2.756,t,dur*.6,peak*.34,.9);voice('sine',f*5.404,t,dur*.3,peak*.12,.9);}
function breath(t,dur,peak,from,to,q){
  const s=AC.createBufferSource();s.buffer=SFX.noise;s.loop=true;
  const bp=AC.createBiquadFilter();bp.type='bandpass';bp.Q.value=q||1.2;bp.frequency.setValueAtTime(from,t);bp.frequency.exponentialRampToValueAtTime(to,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+dur*.35);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(bp);bp.connect(g);g.connect(SFX.out);const w=AC.createGain();w.gain.value=.4;g.connect(w);w.connect(SFX.rev);
  s.start(t,Math.random()*.5);s.stop(t+dur+.02);
}
function knock(f,t,peak){voice('sine',f,t,.07,peak,.15);breath(t,.03,peak*.5,f*4,f*3,2);}
const SOUNDS={
  tap(t){voice('sine',1320,t,.03,.04,0,.001);},
  soft(t){voice('sine',880,t,.05,.05,.1,.002);},
  tab(t,i){pluck(NOTE(SCALE[Math.max(0,i||0)+3]),t,.11,.22);},
  open(t){breath(t,.2,.05,320,1500,.9);pluck(NOTE(72),t+.03,.045,.26);},
  close(t){breath(t,.16,.04,1200,280,.9);},
  menu(t){pluck(NOTE(79),t,.055,.14);},
  add(t){pluck(NOTE(72),t,.16);pluck(NOTE(79),t+.07,.15,.4);},
  done(t){pluck(NOTE(76),t,.2);pluck(NOTE(84),t+.075,.2,.5);bell(NOTE(96),t+.14,.035,.7);},
  untick(t){pluck(NOTE(67),t,.12,.22);pluck(NOTE(60),t+.06,.1,.26);},
  tick(t,i){pluck(NOTE(SCALE[Math.min(SCALE.length-1,(i||0)+2)]),t,.13,.24);},
  list(t){[72,76,79,84].forEach((n,k)=>pluck(NOTE(n),t+k*.075,.16,.4));bell(NOTE(96),t+.3,.04,.9);},
  goal(t){[72,76,79,84,88].forEach((n,k)=>pluck(NOTE(n),t+k*.09,.17,.5));bell(NOTE(91),t+.42,.08,1.4);bell(NOTE(103),t+.5,.03,1.1);},
  ready(t){bell(NOTE(84),t,.08,.9);bell(NOTE(91),t+.06,.06,1);},
  time(t){pluck(NOTE(74),t,.12,.3);knock(1400,t+.06,.04);},
  start(t){knock(1040,t,.1);pluck(NOTE(79),t+.06,.12,.3);},
  stop(t){knock(780,t,.1);pluck(NOTE(67),t+.06,.11,.3);},
  pick(t){knock(520,t,.12);},
  drop(t){knock(340,t,.16);breath(t,.05,.04,900,500,1);},
  swipe(t){knock(1100,t,.07);},
  del(t){voice('sine',150,t,.18,.22,.2,.003);breath(t,.1,.05,700,220,1);},
  undo(t){pluck(NOTE(79),t,.12,.2);pluck(NOTE(72),t+.07,.12,.3);},
  warn(t){pluck(NOTE(57),t,.13,.24);pluck(NOTE(57),t+.14,.1,.24);},
  remind(t){bell(NOTE(81),t,.1,1.2);bell(NOTE(81),t+.32,.08,1.2);},
  log(t){[67,72,79].forEach(n=>pluck(NOTE(n),t,.09,.5));}
};

/* ============================================================ confetti */
function confetti(power,kind){
  if(!X.celebrations)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#fx');cv.hidden=false;const dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;const cx=cv.getContext('2d');cx.scale(dpr,dpr);
  const leaf=kind==='leaf';
  const cols=leaf?['#1E7F66','#2DA382','#46B48C','#9BE0BF','#5E8C31','#14614C']:['#1E7F66','#46B48C','#9BE0BF','#DD8530','#F2C14E','#3E7BD6','#D3ECDF'];
  const n=Math.round((leaf?70:90)*(power||1));const P=[];
  for(let i=0;i<n;i++){const left=i%2===0;
    P.push({x:left?-10:innerWidth+10,y:innerHeight*.72,vx:(left?1:-1)*(4+Math.random()*7),vy:-(9+Math.random()*9),
      w:5+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length]});}
  const t0=performance.now();
  (function frame(t){
    const el=t-t0;cx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.max(0,1-el/2400);cx.fillStyle=p.c;
      if(leaf){const w=p.w*1.6,h=p.h*1.1;cx.beginPath();cx.moveTo(0,-h/2);cx.quadraticCurveTo(w/2,-h/4,0,h/2);cx.quadraticCurveTo(-w/2,-h/4,0,-h/2);cx.fill();cx.strokeStyle='rgba(255,255,255,.45)';cx.lineWidth=1;cx.beginPath();cx.moveTo(0,-h/2+2);cx.lineTo(0,h/2-2);cx.stroke();}
      else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();});
    if(el<2400)requestAnimationFrame(frame);else{cx.clearRect(0,0,innerWidth,innerHeight);cv.hidden=true;}
  })(t0);
}

/* ============================================================ markdown (escaped first, then a small safe subset) */
function mdInline(s){
  const codes=[];
  s=s.replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return'\u0000'+(codes.length-1)+'\u0000'});
  s=s.replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/(^|[\s(])((?:https?:\/\/)[^\s<]+[^\s<.,;:!?)])/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g,'$1<em>$2</em>').replace(/(^|[^_\w])_([^_\s][^_]*?)_(?!\w)/g,'$1<em>$2</em>');
  s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s=mentionize(s);
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<code>'+codes[Number(i)]+'</code>');
  return s;
}
function mentionize(s){
  if(!PEOPLE.length)return s;
  const names=PEOPLE.slice().sort((a,b)=>b.length-a.length).map(n=>esc(n).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  return s.replace(new RegExp('(^|[\\s(>])@('+names.join('|')+')\\b','g'),'$1<span class="mention">@$2</span>');
}
function md(src){
  const lines=esc(src||'').split('\n');let out='',list=null,para=[],inCode=false,code=[];
  const flushP=()=>{if(para.length){out+='<p>'+para.map(mdInline).join('<br>')+'</p>';para=[];}};
  const closeL=()=>{if(list){out+='</'+list+'>';list=null;}};
  for(const raw of lines){
    const l=raw.replace(/\s+$/,'');
    if(/^```/.test(l)){if(inCode){out+='<pre><code>'+code.join('\n')+'</code></pre>';code=[];inCode=false;}else{flushP();closeL();inCode=true;}continue;}
    if(inCode){code.push(raw);continue;}
    let m;
    if(!l.trim()){flushP();closeL();continue;}
    if((m=l.match(/^(#{1,3})\s+(.*)/))){flushP();closeL();const n=m[1].length+3;out+='<h'+n+'>'+mdInline(m[2])+'</h'+n+'>';continue;}
    if(/^(-{3,}|\*{3,})$/.test(l.trim())){flushP();closeL();out+='<hr>';continue;}
    if((m=l.match(/^&gt;\s?(.*)/))){flushP();closeL();out+='<blockquote>'+mdInline(m[1])+'</blockquote>';continue;}
    if((m=l.match(/^\s*[-*+]\s+\[( |x|X)\]\s+(.*)/))){flushP();if(list!=='ul'){closeL();out+='<ul>';list='ul';}
      out+='<li class="task"><input type="checkbox" disabled'+(m[1].trim()?' checked':'')+'>'+mdInline(m[2])+'</li>';continue;}
    if((m=l.match(/^\s*[-*+]\s+(.*)/))){flushP();if(list!=='ul'){closeL();out+='<ul>';list='ul';}out+='<li>'+mdInline(m[1])+'</li>';continue;}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){flushP();if(list!=='ol'){closeL();out+='<ol>';list='ol';}out+='<li>'+mdInline(m[1])+'</li>';continue;}
    closeL();para.push(l);
  }
  if(inCode)out+='<pre><code>'+code.join('\n')+'</code></pre>';
  flushP();closeL();
  return out;
}

function blockEnd(list,i){const d=list[i].depth||0;let j=i+1;while(j<list.length&&(list[j].depth||0)>d)j++;return j}
function hasKids(list,i){return i+1<list.length&&(list[i+1].depth||0)>(list[i].depth||0)}
function visibleIdx(list,hideDone){
  const out=[];let hideBelow=null;
  for(let i=0;i<list.length;i++){
    const d=list[i].depth||0;
    if(hideBelow!==null){if(d>hideBelow)continue;hideBelow=null;}
    if(hideDone&&list[i].done){hideBelow=d;continue;}
    out.push(i);

  }

}

/* ============================================================ supabase sync
   How this keeps every device's work:
   1. each task carries updatedAt, each removal leaves a tombstone, so devices merge record by record
   2. a write only lands if the cloud row has not changed since it was read (compare-and-swap on
      updated_at). If another device wrote first, this device reads again, merges again, retries
   3. a pull never replaces local work. Local edits that have not reached the cloud yet are merged in
   4. a write that would cut the cloud task count by 40% or more is refused until you confirm it
   5. the first write of each day copies the cloud row into one of 14 rolling backup rows, and the
      first time v5 reads the cloud it keeps an untouched copy in its own row, once */

  addT(R.x&&R.x.tomb);addT(L.x&&L.x.tomb);

  const tt=k=>tombs[k]||0;

  const rMap=new Map(rTasks.map(t=>[t.id,t]));

  const have2=new Set(cfg.clients.map(c=>c.id));
  outTasks.forEach(t=>{if(t.client&&!have2.has(t.client)){const c=pool.find(x=>x&&x.id===t.client);if(c){cfg.clients.push(c);have2.add(c.id)}}});

  // settings: the side edited last wins, tombstones and section clocks are combined
  const xl=(Number(ls.x)||0)>(Number(rs.x)||0)||!R.x;
  const sec={};[rs,ls].forEach(s=>{for(const k in s){const v=Number(s[k])||0;if(!(sec[k]>=v))sec[k]=v}});
  const x={...((xl?L.x:R.x)||{}),tomb:tombs,_sec:sec};

  const pick=(k,sk)=>{const lw=(Number(ls[sk])||0)>(Number(rs[sk])||0);const rv=R[k],lv=L[k];
    if(lw||!Array.isArray(rv))return Array.isArray(lv)?lv:(Array.isArray(rv)?rv:[]);return rv};
  const firedAll=[...new Set([...(Array.isArray(R.fired)?R.fired:[]),...(Array.isArray(L.fired)?L.fired:[])])].slice(-600);

  // notes: newest edit wins, removals win over anything older. A side without any notes (an older
  // build, or a fresh device) never removes them, only a tombstone can
  const nr=new Map((Array.isArray(R.notebook)?R.notebook:[]).filter(n=>n&&n.id).map(n=>[n.id,n]));
  const nl=new Map((Array.isArray(L.notebook)?L.notebook:[]).filter(n=>n&&n.id).map(n=>[n.id,n]));
  const outNotes=[];
  new Set([...nr.keys(),...nl.keys()]).forEach(id=>{
    const r=nr.get(id),l=nl.get(id);
    const w=r&&l?(ut(l)>ut(r)?l:r):(r||l);
    const ts=tt('n:'+id);if(ts&&ts>=ut(w))return;
    outNotes.push(w);
  });

  // time log: newest edit of a session wins, removals win over anything older. A side without a
  // time log (an older build) never removes one
  const tr=new Map((Array.isArray(R.timelog)?R.timelog:[]).filter(r=>r&&r.id).map(r=>[r.id,r]));
  const tl=new Map((Array.isArray(L.timelog)?L.timelog:[]).filter(r=>r&&r.id).map(r=>[r.id,r]));
  const outTime=[];
  new Set([...tr.keys(),...tl.keys()]).forEach(id=>{
    const r=tr.get(id),l=tl.get(id);
    const w=r&&l?((Number(l.u)||0)>(Number(r.u)||0)?l:r):(r||l);
    const ts=tt('tl:'+id);if(ts&&ts>=(Number(w.u)||0))return;
    outTime.push(w);
  });

  // life entries: newest edit wins, removals win over anything older. A side without any (an older
  // build, or a fresh device) never removes them, only a tombstone can
  const lr=new Map((Array.isArray(R.life)?R.life:[]).filter(r=>r&&r.id).map(r=>[r.id,r]));
  const ll=new Map((Array.isArray(L.life)?L.life:[]).filter(r=>r&&r.id).map(r=>[r.id,r]));
  const outLife=[];
  new Set([...lr.keys(),...ll.keys()]).forEach(id=>{
    const r=lr.get(id),l=ll.get(id);
    const w=r&&l?((Number(l.u)||0)>(Number(r.u)||0)?l:r):(r||l);
    const ts=tt('lf:'+id);if(ts&&ts>=(Number(w.u)||0))return;
    outLife.push(w);
  });

  return{schema:SCHEMA,tasks:outTasks,completions:outComp,exceptions:outExc,
    routines:pick('routines','rout'),templates:pick('templates','tmpl'),meetings:pick('meetings','meet'),
    cfg,ui:L.ui||R.ui||{},fired:firedAll,x,notebook:outNotes,timelog:outTime,life:outLife};
}
/* a stable fingerprint of a snapshot, so "nothing changed" is detected however keys were ordered */
function stableStr(v){
  if(v===null||typeof v!=='object')return JSON.stringify(v===undefined?null:v);
  if(Array.isArray(v))return'['+v.map(stableStr).join(',')+']';
  return'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stableStr(v[k])).join(',')+'}';
}
function canon(s){
  if(!s)return'';
  const c=s.cfg||{};
  return stableStr([(s.tasks||[]).map(normTask),s.completions||[],s.exceptions||[],c.clients||[],c.people||[],
    c.workMins||null,c.archiveDays||null,typeof c.sound==='boolean'?c.sound:null,normX(s.x),s.routines||[],s.templates||[],s.meetings||[],(s.fired||[]).length,
    (Array.isArray(s.notebook)?s.notebook:[]).filter(n=>n&&n.id).map(n=>({...normNote(n),createdAt:n.createdAt||''})),
    (Array.isArray(s.timelog)?s.timelog:[]).filter(r=>r&&r.id).map(normTime),
    (Array.isArray(s.life)?s.life:[]).filter(r=>r&&r.id).map(normLife)]);
}
function applyMerged(m,before){
  tasks=(m.tasks||[]).map(normTask);
  completions=(m.completions||[]).slice();
  exceptions=(m.exceptions||[]).slice();
  routines=Array.isArray(m.routines)?m.routines:[];
  templates=Array.isArray(m.templates)?m.templates:[];
  meetings=(Array.isArray(m.meetings)?m.meetings:[]).map(normMeeting);
  if(Array.isArray(m.notebook))notebook=m.notebook.filter(n=>n&&n.id).map(normNote);
  if(Array.isArray(m.timelog))timelog=m.timelog.filter(r=>r&&r.id&&r.taskId).map(normTime);
  if(Array.isArray(m.life))life=m.life.filter(r=>r&&r.id).map(normLife);
  if(m.cfg){
    if(Array.isArray(m.cfg.clients)&&m.cfg.clients.length)CLIENTS=m.cfg.clients.map(c=>({...c}));
    if(Array.isArray(m.cfg.people)&&m.cfg.people.length)PEOPLE=m.cfg.people.slice();
    if(m.cfg.workMins)CFG.workMins=m.cfg.workMins;
    if(m.cfg.archiveDays)CFG.archiveDays=m.cfg.archiveDays;
    if(typeof m.cfg.sound==='boolean')CFG.sound=m.cfg.sound;
  }
  X=normX(m.x);
  fired=Array.isArray(m.fired)?m.fired.slice():[];
  countEndMemo.clear();
  writeAllRaw();rebaseline();dataVer++;dedupeTime();
  if(before&&canon(before)!==canon(m))onRemoteChange();

/* ---- the sync loop ---- */
function scheduleSync(ms){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(()=>syncNow(),ms==null?900:ms)}
function isDirty(){return localVer>SYNC.pushedVer||store.get(K.dirty)==='1'}
function setSync(st,err){SYNC.status=st;SYNC.err=err?String(err&&err.message||err):'';renderSyncDot();}
async function sbGet(q){
  const r=await fetch(SB_URL+'/rest/v1/'+SB_TABLE+q,{method:'GET',headers:sbHeaders(),cache:'no-store'});
  if(!r.ok)throw new Error('Cloud read failed ('+r.status+')');
  return r.json();
}
async function syncNow(){
  if(NOSYNC){setSync('local');return;}
  if(SYNC.busy){SYNC.again=true;return}
  if(SYNC.paused&&!SYNC.force)return;
  SYNC.busy=true;
  try{
    // cheap check first: when nothing changed here or in the cloud there is nothing to download
    if(SYNC.inited&&!isDirty()&&!SYNC.force){
      const head=await sbGet('?id=eq.'+SB_ROW+'&select=updated_at');
      if(head.length&&String(head[0].updated_at)===String(SYNC.lastSeen)){SYNC.lastOk=Date.now();setSync('ok');return;}
    }
    setSync('syncing');
    for(let attempt=0;attempt<6;attempt++){
      const rows=await sbGet('?id=eq.'+SB_ROW);
      const row=rows[0]||null;
      const hasCloud=!!(row&&row.data&&typeof row.data==='object');
      const first=store.get(K.v5synced)!=='1';
      const ver=localVer;
      const local=buildSnapshot();
      const merged=hasCloud?mergeSnap(row.data,local,first):mergeSnap(null,local,false);
      if(hasCloud&&!SYNC.force&&looksLikeWipe(taskCount(row.data),merged.tasks.length)){
        SYNC.paused={cloud:taskCount(row.data),after:merged.tasks.length,ids:row.data.tasks.map(t=>t&&t.id).filter(id=>id&&!merged.tasks.some(t=>t.id===id))};
        setSync('paused');
        toast('Sync paused. It would remove '+(SYNC.paused.cloud-SYNC.paused.after)+' tasks from the cloud, so nothing was changed. Open Settings to review.');
        return;
      }
      if(hasCloud){applyMerged(merged,local);await preUpgradeCloudCopy(row);}
      if(hasCloud&&canon(merged)===canon(row.data)){SYNC.lastSeen=row.updated_at;afterSyncOk(ver);break;}
      if(hasCloud)await backupCloudRow(row);
      const rev=Math.max(Date.now(),(Number(row&&row.updated_at)||0)+1);
      const body=JSON.stringify({id:SB_ROW,data:merged,updated_at:rev});
      if(row){
        const filt=row.updated_at==null?'updated_at=is.null':'updated_at=eq.'+encodeURIComponent(row.updated_at);
        const p=await fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=eq.'+SB_ROW+'&'+filt,{method:'PATCH',headers:sbHeaders(),body});
        if(!p.ok)throw new Error('Cloud write failed ('+p.status+')');
        const upd=await p.json();
        if(!Array.isArray(upd)||!upd.length){if(attempt===5)throw new Error('The cloud kept changing, will retry');continue;}
      }else{
        const p=await fetch(SB_URL+'/rest/v1/'+SB_TABLE,{method:'POST',headers:sbHeaders(),body});
        if(!p.ok)throw new Error('Cloud write failed ('+p.status+')');
      }
      SYNC.lastSeen=rev;SYNC.force=false;afterSyncOk(ver);break;
    }
  }catch(e){setSync(navigator.onLine===false?'offline':'error',e);}
  finally{SYNC.busy=false;if(SYNC.again){SYNC.again=false;scheduleSync(300);}}
}
function afterSyncOk(ver){
  SYNC.pushedVer=Math.max(SYNC.pushedVer,ver);
  if(localVer<=SYNC.pushedVer)store.set(K.dirty,'0');
  store.set(K.v5synced,'1');SYNC.inited=true;SYNC.lastOk=Date.now();SYNC.paused=null;setSync('ok');
  // housekeeping that edits tasks runs only once this device is up to date, so it never overrides newer edits
  if(!SYNC.archived){SYNC.archived=true;runArchive();}
}
function resolvePause(allow){
  if(!SYNC.paused)return;
  if(allow){SYNC.force=true;}
  else{SYNC.paused.ids.forEach(id=>{delete X.tomb['t:'+id]});writeX();}
  SYNC.paused=null;setSync('syncing');syncNow();
}
async function sbUpsert(id,data){
  const body=JSON.stringify({id,data,updated_at:Date.now()});
  const r=await fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=eq.'+id,{method:'PATCH',headers:sbHeaders(),body});
  const rows=r.ok?await r.json():[];
  if(!rows.length)await fetch(SB_URL+'/rest/v1/'+SB_TABLE,{method:'POST',headers:sbHeaders(),body});
}
async function sbInsertOnce(id,data){
  const rows=await sbGet('?id=eq.'+id+'&select=id');
  if(rows.length)return true;

/* an untouched copy of the cloud board, kept once per upgrade in a row of its own */
async function preUpgradeCloudCopy(row){
  if(!row||!row.data||taskCount(row.data)===0)return;
  for(const v of ['v5','v6','v7','v8','v10']){
    if(store.get('pn_tb2_cloud_preupgrade_'+v)==='1')continue;
    try{if(await sbInsertOnce(SB_ROW+'_preupgrade_'+v,{...row.data,_backupOf:row.updated_at}))store.set('pn_tb2_cloud_preupgrade_'+v,'1');}catch(e){}
  }
}
async function backupCloudRow(row){
  const day=Math.floor(Date.now()/86400000);
  if(!row||!row.data||taskCount(row.data)===0)return;
  if(store.get('pn_tb2_lastbak')!==String(day))try{
    // the day's slot keeps the earliest copy of the day, so a second device does not overwrite it
    const id=SB_ROW+'_bak'+(day%SB_BAK_SLOTS);
    const have=await sbGet('?id=eq.'+id+'&select=updated_at');
    if(!(have.length&&Math.floor(Number(have[0].updated_at)/86400000)===day))await sbUpsert(id,{...row.data,_backupOf:row.updated_at});
    store.set('pn_tb2_lastbak',String(day));
  }catch(e){}
  // a weekly copy as well, kept for eight weeks, so a mistake noticed late can still be undone
  const wk=Math.floor((day+3)/7);
  if(store.get('pn_tb2_lastwk')!==String(wk))try{
    const wid=SB_ROW+'_wk'+(wk%8);
    const hv=await sbGet('?id=eq.'+wid+'&select=updated_at');
    if(!(hv.length&&Math.floor((Math.floor(Number(hv[0].updated_at)/86400000)+3)/7)===wk))await sbUpsert(wid,{...row.data,_backupOf:row.updated_at});
    store.set('pn_tb2_lastwk',String(wk));
  }catch(e){}
}
/* makes the board exactly match a backup, on every device: restored records get a fresh clock,
   everything not in the backup gets a tombstone */
function replaceAll(b){
  const now=Date.now();
  const keepT=new Set((b.tasks||[]).map(t=>t&&t.id));
  tasks.forEach(t=>{if(!keepT.has(t.id))tomb('t:'+t.id,now)});
  tasks=(b.tasks||[]).filter(t=>t&&t.id).map(normTask).map(t=>({...t,updatedAt:now+1}));
  const keepC=new Set((b.completions||[]).map(c=>c.taskId+'|'+c.date));
  completions.forEach(c=>{const k=c.taskId+'|'+c.date;if(!keepC.has(k))tomb('kd:'+k,now)});
  completions=(b.completions||[]).map(c=>({...c,t:now+1}));
  const keepE=new Set((b.exceptions||[]).map(e=>e.id));
  exceptions.forEach(e=>{if(!keepE.has(e.id))tomb('e:'+e.id,now)});
  exceptions=(b.exceptions||[]).map(e=>({...e,t:now+1}));
  if(Array.isArray(b.routines))routines=b.routines;
  if(Array.isArray(b.templates))templates=b.templates;
  if(Array.isArray(b.meetings))meetings=b.meetings.map(normMeeting);
  // a backup made before notes existed leaves the current notes alone, so restoring it never loses one
  if(Array.isArray(b.notebook)){
    const keepN=new Set(b.notebook.map(n=>n&&n.id));
    notebook.forEach(n=>{if(!keepN.has(n.id))tomb('n:'+n.id,now)});
    notebook=b.notebook.filter(n=>n&&n.id).map(normNote).map(n=>({...n,updatedAt:now+1}));
    notebook.forEach(n=>{delete X.tomb['n:'+n.id]});
  }
  // the same for the time log: a backup made before it existed leaves the current log alone
  if(Array.isArray(b.timelog)){
    const keepL=new Set(b.timelog.map(r=>r&&r.id));
    timelog.forEach(r=>{if(!keepL.has(r.id))tomb('tl:'+r.id,now)});
    timelog=b.timelog.filter(r=>r&&r.id&&r.taskId).map(normTime).map(r=>({...r,u:now+1}));
    timelog.forEach(r=>{delete X.tomb['tl:'+r.id]});
  }
  // and for life entries: a backup made before v8 leaves the current ones alone
  if(Array.isArray(b.life)){
    const keepF=new Set(b.life.map(r=>r&&r.id));
    life.forEach(r=>{if(!keepF.has(r.id))tomb('lf:'+r.id,now)});
    life=b.life.filter(r=>r&&r.id).map(normLife).map(r=>({...r,u:now+1}));
  }
  const c=b.cfg||{};
  if(Array.isArray(c.clients)&&c.clients.length)CLIENTS=c.clients.map(x=>({...x}));
  if(Array.isArray(c.people)&&c.people.length)PEOPLE=c.people.slice();
  if(c.workMins)CFG.workMins=c.workMins;if(c.archiveDays)CFG.archiveDays=c.archiveDays;if(typeof c.sound==='boolean')CFG.sound=c.sound;
  if(b.x){const keepTomb=X.tomb;X=normX(b.x);X.tomb={...(X.tomb||{}),...keepTomb};}
  // remove tombstones that would hide the restored records
  tasks.forEach(t=>{delete X.tomb['t:'+t.id]});exceptions.forEach(e=>{delete X.tomb['e:'+e.id]});notebook.forEach(n=>{delete X.tomb['n:'+n.id]});life.forEach(r=>{delete X.tomb['lf:'+r.id]});
  X._sec.cfg=now;X._sec.x=now;
  writeAllRaw();rebaseline();dataVer++;
  SYNC.force=true;SYNC.paused=null;markDirty();
}

/* ============================================================ undo
   Undo only reverts the records the action touched, so it never rolls back anything that
   arrived from another device in the meantime. */
function snapState(){return{t:new Map(tasks.map(t=>[t.id,taskSig(t)])),c:new Map(completions.map(c=>[c.id,JSON.stringify(c)])),
  e:new Map(exceptions.map(x=>[x.id,JSON.stringify(x)])),cl:JSON.stringify(CLIENTS),xc:JSON.stringify(X.cleared),lc:JSON.stringify(X.labelColors)}}
function undoTo(b,a){
  const order=tasks.map(t=>t.id);const cur=new Map(tasks.map(t=>[t.id,t]));
  new Set([...b.t.keys(),...a.t.keys()]).forEach(id=>{
    const bv=b.t.get(id),av=a.t.get(id);if(bv===av)return;
    if(bv===undefined)cur.delete(id);
    else{cur.set(id,normTask(JSON.parse(bv)));if(!order.includes(id))order.push(id);}
  });
  tasks=order.filter(id=>cur.has(id)).map(id=>cur.get(id));
  const fix=(list,bm,am)=>{const m=new Map(list.map(x=>[x.id,x]));new Set([...bm.keys(),...am.keys()]).forEach(id=>{const bv=bm.get(id),av=am.get(id);if(bv===av)return;if(bv===undefined)m.delete(id);else m.set(id,JSON.parse(bv));});return[...m.values()]};
  completions=fix(completions,b.c,a.c);exceptions=fix(exceptions,b.e,a.e);
  if(b.cl!==a.cl){CLIENTS=JSON.parse(b.cl);saveCfg();}
  if(b.xc!==a.xc||b.lc!==a.lc){X.cleared=JSON.parse(b.xc);X.labelColors=JSON.parse(b.lc);saveX();}
  saveTasks();saveComp();saveExc();render();refreshOpenSheet();
}
