/* ============================================================ confetti */
function confetti(power){
  if(!X.celebrations)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#fx');cv.hidden=false;const dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;const cx=cv.getContext('2d');cx.scale(dpr,dpr);
  const cols=['#D98A2B','#E8B25C','#16241C','#3F7A4B','#B23A2E','#3569A8','#DCE4D2'];
  const n=Math.round(90*(power||1));const P=[];
  for(let i=0;i<n;i++){const left=i%2===0;
    P.push({x:left?-10:innerWidth+10,y:innerHeight*.72,vx:(left?1:-1)*(4+Math.random()*7),vy:-(9+Math.random()*9),
      w:5+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length]});}
  const t0=performance.now();
  (function frame(t){
    const el=t-t0;cx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.max(0,1-el/2400);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();});
    if(el<2400)requestAnimationFrame(frame);else{cx.clearRect(0,0,innerWidth,innerHeight);cv.hidden=true;}
  })(t0);
}
function celebrated(key){try{return JSON.parse(store.get('pn_tb2_cel')||'[]').includes(key)}catch(e){return false}}
function markCelebrated(key){let a=[];try{a=JSON.parse(store.get('pn_tb2_cel')||'[]')}catch(e){}a.push(key);store.set('pn_tb2_cel',JSON.stringify(a.slice(-60)))}
function afterComplete(){
  const today=todayStr();const st=computeStats();
  bumpKarma();
  const openToday=todaysTasks().filter(o=>!isNote(o.task)).length;
  if(openToday===0&&doneTodayList().length&&!celebrated('z'+today)){
    markCelebrated('z'+today);setTimeout(()=>{confetti(1.3);play('goal');toast('#TaskZero · everything for today is done');},250);return;
  }
  // celebrate only on the completion that crosses a goal, never for one already met earlier
  if(st.today>=X.dailyGoal&&st.today-1<X.dailyGoal&&!celebrated('d'+today)){
    markCelebrated('d'+today);setTimeout(()=>{confetti(1);play('goal');toast('Daily goal reached · '+st.streak+' day streak');},250);return;
  }
  const mon=mondayOf(today);
  if(st.week>=X.weeklyGoal&&st.week-1<X.weeklyGoal&&!celebrated('w'+mon)){
    markCelebrated('w'+mon);setTimeout(()=>{confetti(1.2);play('goal');toast('Weekly goal reached · '+st.week+' tasks this week');},250);
  }
}

/* ============================================================ markdown (escaped first, then a small safe subset) */
function mdInline(s){
  const codes=[];
  s=s.replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return'\u0000'+(codes.length-1)+'\u0000'});
  s=s.replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/(^|[\s(])((?:https?:\/\/)[^\s<]+[^\s<.,;:!?)])/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g,'$1<em>$2</em>').replace(/(^|[^_\w])_([^_\s][^_]*?)_(?!\w)/g,'$1<em>$2</em>');
  s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s=mentionize(s);
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<code>'+codes[Number(i)]+'</code>');
  return s;
}
function mentionize(s){
  if(!PEOPLE.length)return s;
  const names=PEOPLE.slice().sort((a,b)=>b.length-a.length).map(n=>esc(n).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  return s.replace(new RegExp('(^|[\\s(>])@('+names.join('|')+')\\b','g'),'$1<span class="mention">@$2</span>');
}
function md(src){
  const lines=esc(src||'').split('\n');let out='',list=null,para=[],inCode=false,code=[];
  const flushP=()=>{if(para.length){out+='<p>'+para.map(mdInline).join('<br>')+'</p>';para=[];}};
  const closeL=()=>{if(list){out+='</'+list+'>';list=null;}};
  for(const raw of lines){
    const l=raw.replace(/\s+$/,'');
    if(/^```/.test(l)){if(inCode){out+='<pre><code>'+code.join('\n')+'</code></pre>';code=[];inCode=false;}else{flushP();closeL();inCode=true;}continue;}
    if(inCode){code.push(raw);continue;}
    let m;
    if(!l.trim()){flushP();closeL();continue;}
    if((m=l.match(/^(#{1,3})\s+(.*)/))){flushP();closeL();const n=m[1].length+3;out+='<h'+n+'>'+mdInline(m[2])+'</h'+n+'>';continue;}
    if(/^(-{3,}|\*{3,})$/.test(l.trim())){flushP();closeL();out+='<hr>';continue;}
    if((m=l.match(/^&gt;\s?(.*)/))){flushP();closeL();out+='<blockquote>'+mdInline(m[1])+'</blockquote>';continue;}
    if((m=l.match(/^\s*[-*+]\s+\[( |x|X)\]\s+(.*)/))){flushP();if(list!=='ul'){closeL();out+='<ul>';list='ul';}
      out+='<li class="task"><input type="checkbox" disabled'+(m[1].trim()?' checked':'')+'>'+mdInline(m[2])+'</li>';continue;}
    if((m=l.match(/^\s*[-*+]\s+(.*)/))){flushP();if(list!=='ul'){closeL();out+='<ul>';list='ul';}out+='<li>'+mdInline(m[1])+'</li>';continue;}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){flushP();if(list!=='ol'){closeL();out+='<ol>';list='ol';}out+='<li>'+mdInline(m[1])+'</li>';continue;}
    closeL();para.push(l);
  }
  if(inCode)out+='<pre><code>'+code.join('\n')+'</code></pre>';
  flushP();closeL();
  return out;
}

/* ============================================================ checklist model helpers */
// an item's block is the item plus every following item that sits deeper than it
function blockEnd(list,i){const d=list[i].depth||0;let j=i+1;while(j<list.length&&(list[j].depth||0)>d)j++;return j}
function hasKids(list,i){return i+1<list.length&&(list[i+1].depth||0)>(list[i].depth||0)}
function visibleIdx(list,hideDone){
  const out=[];let hideBelow=null;
  for(let i=0;i<list.length;i++){
    const d=list[i].depth||0;
    if(hideBelow!==null){if(d>hideBelow)continue;hideBelow=null;}
    if(hideDone&&list[i].done){hideBelow=d;continue;}
    out.push(i);
    if(list[i].collapsed&&hasKids(list,i))hideBelow=d;
  }
  return out;
}
function ckStats(list){const n=list.length,d=list.filter(s=>s.done).length;return{n,d,pct:n?Math.round(d/n*100):0}}

/* ============================================================ list builders */
function todaysTasks(){
  const out=[];
  tasks.forEach(t=>{if(t.archivedAt)return;const inst=openTodayInstance(t);if(inst)out.push({task:t,date:inst.date,floating:inst.floating})});
  out.sort((a,b)=>{
    const ov=(dayDiff(a.date)<0?-1:0)-(dayDiff(b.date)<0?-1:0);if(ov)return ov;
    if((a.task.sortIndex||0)!==(b.task.sortIndex||0))return(a.task.sortIndex||0)-(b.task.sortIndex||0);
    return PRIORITIES.indexOf(a.task.priority)-PRIORITIES.indexOf(b.task.priority);
  });
  return out;
}
function doneTodayList(){
  const today=todayStr();const out=[];
  tasks.forEach(t=>{
    if(t.rrule&&isCompleted(t.id,today))out.push({task:t,date:today});
    else if(!t.rrule&&t.status==='done'&&!t.archivedAt&&t.completedAt&&localDay(t.completedAt)===today)out.push({task:t,date:today});
  });
  return out;
}
function visibleDoneToday(){

/* ============================================================ UPCOMING */
function weekDaysFrom(mon){const out=[];for(let i=0;i<7;i++)out.push(addLocalDays(mon,i));return out}
function tasksOnDay(dateStr,withDeadlines){
  const out=[];
  tasks.forEach(t=>{
    if(t.archivedAt)return;
    const occ=occurrences(t,dateStr,dateStr);
    if(occ.length)out.push({task:t,date:dateStr});
    else if(withDeadlines&&t.deadline===dateStr&&t.status!=='done')out.push({task:t,date:t.due||dateStr,dlOnly:true});
  });
  out.sort((a,b)=>{
    const at=a.task.dueTime||'99',bt=b.task.dueTime||'99';if(at!==bt)return at.localeCompare(bt);
    return PRIORITIES.indexOf(a.task.priority)-PRIORITIES.indexOf(b.task.priority);
  });
  return out;
}

function renderCalendar(){

  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Completed tasks chart">';
  data.forEach((d,i)=>{
    const x=pl+i*bw+bw*.18,w=bw*.64,top=y(d.v),hgt=Math.max(0,H-pb-top);

    s+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle"'+(d.cur?' style="fill:var(--tint);font-weight:700"':'')+'>'+esc(d.l)+'</text>';

  const gy=y(goal).toFixed(1);

  s+='<text x="'+(W-pr)+'" y="'+(Number(gy)-5)+'" text-anchor="end" style="fill:var(--accent-deep)">goal '+goal+'</text>';

/* ============================================================ task ops */
function maxSort(){return tasks.reduce((m,t)=>Math.max(m,t.sortIndex||0),0)}
function completeInstance(task,date){
  if(isNote(task))return false;
  let completed=false;
  if(task.rrule){
    if(isCompleted(task.id,date)) completions=completions.filter(c=>!(c.taskId===task.id&&c.date===date));
    else{
      completions.push({id:uid(),taskId:task.id,date,at:new Date().toISOString()});completed=true;
      if(task.resetSubs&&task.subtasks.some(s=>s.done)){task.subtasks.forEach(s=>s.done=false);logAct(task,'Checklist reset for the next time');saveTasks();}
    }
    saveComp();
  }else{
    if(task.status==='done'){task.status='todo';task.completedAt=null;}
    else{task.status='done';task.completedAt=new Date().toISOString();completed=true;}
    saveTasks();
  }
  if(completed)pop();else play('untick');
  return completed;
}
function snapshotData(){return JSON.stringify({tasks,completions,exceptions})}
function restoreData_(s){const b=JSON.parse(s);tasks=b.tasks.map(normTask);completions=b.completions;exceptions=b.exceptions;saveTasks();saveComp();saveExc();}
function toggleFromList(t,date){
  const before=snapshotData();
  const completed=completeInstance(t,date);
  if(completed){
    toast('Completed · '+titleOf(t),()=>{restoreData_(before);render();},'Undo');
    afterComplete();
  }
}
function rescheduleTask(task,target){
  const today=todayStr();const before=snapshotData();
  if(task.rrule){
    const inst=openTodayInstance(task)||{date:nextDue(task,today)};
    if(inst&&inst.date){exceptions.push({id:uid(),taskId:task.id,action:'move',date:inst.date,newDate:target});saveExc();}
  }else{task.due=target;if(task.status==='done')task.status='todo';logAct(task,'Rescheduled to '+fmtDM(target));saveTasks();}
  toast('Moved to '+fmtRel(target),()=>{restoreData_(before);render();},'Undo');
  render();
}
function cyclePostStatus(task){
  const i=POST_STATES.indexOf(task.postStatus);
  task.postStatus=POST_STATES[(i+1)%POST_STATES.length];
  saveTasks();render();
}
function deleteTask(id){
  const before=snapshotData();const t=tasks.find(x=>x.id===id);
  tasks=tasks.filter(t=>t.id!==id);
  completions=completions.filter(c=>c.taskId!==id);
  exceptions=exceptions.filter(e=>e.taskId!==id);
  saveTasks();saveComp();saveExc();render();
  toast('Deleted · '+(t?titleOf(t):'task'),()=>{restoreData_(before);render();},'Undo');
}
function duplicateTask(t){
  const c=clone(t);
  c.id=uid();c.subtasks=(c.subtasks||[]).map(s=>({...s,id:uid()}));
  c.attachments=(c.attachments||[]).map(a=>({...a,id:uid()}));
  c.comments=[];c.activity=[];c.createdAt=new Date().toISOString();
  if(!c.rrule){c.status='todo';c.completedAt=null;}
  c.archivedAt=null;c.sortIndex=(t.sortIndex||0)+.5;
  const n=normTask(c);logAct(n,'Duplicated from “'+titleOf(t)+'”');
  tasks.push(n);saveTasks();render();
  toast('Duplicated',()=>{tasks=tasks.filter(x=>x.id!==n.id);saveTasks();render();},'Undo');
  return n;
}
function moveTaskToClient(t,cid){
  const prev=t.client;t.client=cid;logAct(t,'Moved to '+clientOf(cid).name);saveTasks();render();
  toast('Moved to '+clientOf(cid).name,()=>{t.client=prev;saveTasks();render();},'Undo');
}
function copyTaskLink(t){
  const url=location.href.split('#')[0]+'#task='+t.id;
  const done=()=>toast('Link copied');
  try{navigator.clipboard.writeText(url).then(done,()=>prompt('Copy this link',url));}catch(e){prompt('Copy this link',url);}
}
// a task turned into a checklist item keeps its full original record on the item, so turning it back loses nothing
function convertToSubtask(t,parentId){
  const parent=tasks.find(x=>x.id===parentId);if(!parent||parent.id===t.id)return;
  const before=snapshotData();
  const origin=clone(t);delete origin.subtasks;
  const item={id:uid(),text:titleOf(t)||t.title,done:t.rrule?false:t.status==='done',depth:0,origin};
  const kids=(t.subtasks||[]).map(s=>({...s,depth:Math.min(MAX_DEPTH,(s.depth||0)+1)}));
  parent.subtasks.push(item,...kids);
  logAct(parent,'Added “'+titleOf(t)+'” as a checklist item');
  tasks=tasks.filter(x=>x.id!==t.id);
  saveTasks();render();
  toast('Now a checklist item in '+titleOf(parent),()=>{restoreData_(before);render();},'Undo');
}
function subtaskToTask(parent,idx){
  const before=snapshotData();
  const list=parent.subtasks;const end=blockEnd(list,idx);const item=list[idx];
  const d0=item.depth||0;
  const kids=list.slice(idx+1,end).map(s=>({...s,depth:Math.max(0,(s.depth||0)-d0-1)}));
  let nt;
  if(item.origin){
    nt=normTask({...item.origin,title:(isNote(item.origin)?'* ':'')+item.text,subtasks:kids,archivedAt:null});
    if(!nt.rrule){nt.status=item.done?'done':(nt.status==='done'?'todo':nt.status);nt.completedAt=item.done?(nt.completedAt||new Date().toISOString()):null;}
    if(tasks.some(x=>x.id===nt.id))nt.id=uid();
  }else{
    nt=normTask({id:uid(),title:item.text,client:parent.client,assignee:parent.assignee,priority:'None',
      due:parent.rrule?todayStr():(parent.due||todayStr()),subtasks:kids,status:item.done?'done':'todo',
      completedAt:item.done?new Date().toISOString():null,sortIndex:(parent.sortIndex||0)+.5});
  }
  logAct(nt,'Made a task from a checklist item of “'+titleOf(parent)+'”');
  list.splice(idx,end-idx);
  tasks.push(nt);saveTasks();
  toast('Now its own task',()=>{restoreData_(before);render();},'Undo');
  return nt;
}

    rrule:null,estimate:null,labels:[],subtasks:[],attachments:[],remind:'none',remindAt:null,notes:'',focusOn:true,status:'todo',
    comments:[],activity:[],resetSubs:false,rDirty:false,...(preset||{})};

function ruleToCustom(r){
  if(!r)return{interval:1,unit:'week',byday:[],monthMode:'date'};
  const unit={DAILY:'day',WEEKLY:'week',MONTHLY:'month',YEARLY:'year'}[r.freq]||'week';
  return{interval:r.interval||1,unit,byday:(r.byday||[]).slice(),monthMode:r.bysetpos?'weekday':'date'};
}
function taskToDraft(t){
  let repeatKey='';
  if(t.rrule){
    const r=t.rrule;const iv=r.interval||1;
    if(r.freq==='DAILY')repeatKey=iv===1?'daily':'custom';
    else if(r.freq==='WEEKLY'){
      const d=r.byday||[];
      if(iv===1&&d.length===5&&WEEKDAYS.every(x=>d.includes(x)))repeatKey='weekdays';
      else if(iv===2&&d.length===1)repeatKey='biweekly';
      else if(iv===1&&d.length===1)repeatKey='weekly';
      else repeatKey='custom';
    }
    else if(r.freq==='MONTHLY')repeatKey=iv===1?(r.bysetpos?'monthlyWeekday':'monthly'):'custom';
    else if(r.freq==='YEARLY')repeatKey=iv===1?'yearly':'custom';
  }
  const r=t.rrule||{};
  return{...clone(t),repeatKey,custom:ruleToCustom(t.rrule),endMode:r.until?'until':r.count?'count':'never',until:r.until||null,count:r.count||null,rDirty:false};
}
function draftRule(){
  let rule=null;
  if(draft.repeatKey==='custom'){
    const c=draft.custom||{interval:1,unit:'week',byday:[]};const iv=Math.max(1,Number(c.interval)||1);
    const anchor=parseYmd(draft.due||todayStr());
    if(c.unit==='day')rule={freq:'DAILY',interval:iv};
    else if(c.unit==='week')rule={freq:'WEEKLY',interval:iv,byday:c.byday&&c.byday.length?c.byday.slice():[DOW[anchor.getUTCDay()]]};
    else if(c.unit==='month')rule=c.monthMode==='weekday'?{freq:'MONTHLY',interval:iv,byday:[DOW[anchor.getUTCDay()]],bysetpos:isLastWeekday(anchor)?-1:nthWeekdayPos(anchor)}:{freq:'MONTHLY',interval:iv};
    else rule={freq:'YEARLY',interval:iv};
  }else if(draft.repeatKey)rule=ruleFromPreset(draft.repeatKey,draft.due||todayStr());
  if(rule){
    if(draft.endMode==='until'&&draft.until)rule.until=draft.until;
    if(draft.endMode==='count'&&draft.count>0)rule.count=Math.floor(draft.count);
  }
  return rule;
}

let commitTimer=null;
function liveCommit(){ if(!draft||!draft.id)return; clearTimeout(commitTimer); commitTimer=setTimeout(()=>commitDraft(false),500); }
function draftFields(){
  const rrule=(draft.rDirty||!draftOrig||draft.due!==draftOrig.due)?draftRule():(draftOrig.rrule?clone(draftOrig.rrule):null);
  const f={title:draft.title.trim()||(draftOrig?draftOrig.title:'Untitled'),client:draft.client,assignee:draft.assignee||null,priority:draft.priority,
    type:draft.type,postStatus:draft.postStatus,due:draft.due||(rrule?todayStr():null),dueTime:draft.dueTime||null,deadline:draft.deadline||null,startDate:draft.startDate||null,rrule,
    estimate:draft.estimate,labels:draft.labels.slice(),subtasks:draft.subtasks.filter(s=>s.text.trim()).map(s=>({...s})),
    attachments:draft.attachments.map(a=>({...a})),remind:draft.remind,remindAt:draft.remind==='custom'?draft.remindAt:null,
    notes:draft.notes||null,focusOn:draft.focusOn,resetSubs:!!draft.resetSubs,comments:(draft.comments||[]).map(c=>({...c}))};
  if(!rrule){f.status=draft.status||'todo';f.completedAt=f.status==='done'?(draft.completedAt||new Date().toISOString()):null;}
  else f.status='todo';
  return f;
}
function logDiff(t,a,b){
  if(!a)return;
  if(a.title!==b.title)logAct(t,'Renamed to “'+b.title+'”');
  if(a.due!==b.due)logAct(t,b.due?'Due date set to '+fmtDM(b.due):'Due date removed');
  if((a.dueTime||null)!==(b.dueTime||null))logAct(t,b.dueTime?'Time set to '+fmtTime(b.dueTime):'Time removed');
  if((a.deadline||null)!==(b.deadline||null))logAct(t,b.deadline?'Deadline set to '+fmtDM(b.deadline):'Deadline removed');
  if(a.priority!==b.priority)logAct(t,'Priority changed to '+PRIO_P[b.priority]);
  if(a.client!==b.client)logAct(t,'Moved to '+clientOf(b.client).name);
  if((a.assignee||null)!==(b.assignee||null))logAct(t,b.assignee?'Assigned to '+b.assignee:'Unassigned');
  if(JSON.stringify(a.rrule||null)!==JSON.stringify(b.rrule||null))logAct(t,b.rrule?'Repeat set to '+repeatLabel(b.rrule):'Repeat removed');
  if((a.startDate||null)!==(b.startDate||null))logAct(t,b.startDate?'Hidden until '+fmtDM(b.startDate):'Hide until removed');
  if((a.notes||'')!==(b.notes||''))logAct(t,'Description edited');
  if(a.status!==b.status&&!b.rrule)logAct(t,'Status changed to '+(b.status==='doing'?'doing':b.status==='done'?'done':'to do'));
}
function commitDraft(final){
  clearTimeout(commitTimer);
  if(!draft||!draft.id)return;
  const t=tasks.find(x=>x.id===draft.id);if(!t)return;
  const f=draftFields();
  if(final){Object.assign(t,f);logDiff(t,draftOrig,t);draftOrig=clone(t);}
  else Object.assign(t,f);
  saveTasks();
  if(final&&draft.remind!=='none')ensureNotifyPermission();
  if(final)render();
}
function saveDraft(){
  if(!draft.title.trim()){$('#dTitle').focus();return;}
  if(draft.id){commitDraft(true);sheetBeforeClose=null;closeSheet();return;}
  const f=draftFields();
  const nt=normTask({...f,id:uid(),sortIndex:maxSort()+1,createdAt:new Date().toISOString()});
  tasks.push(nt);saveTasks();
  if(draft.remind&&draft.remind!=='none')ensureNotifyPermission();
  sheetBeforeClose=null;closeSheet();render();
  toast('Added · '+titleOf(nt),()=>{tasks=tasks.filter(x=>x.id!==nt.id);saveTasks();render();},'Undo');
}
function mdWrap(ta,w){const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;const sel=v.slice(s,e)||'text';
  ta.value=v.slice(0,s)+w+sel+w+v.slice(e);ta.setSelectionRange(s+w.length,s+w.length+sel.length);ta.focus();draft.notes=ta.value;liveCommit();}
function mdLine(ta,p){const s=ta.selectionStart,v=ta.value;const ls=v.lastIndexOf('\n',s-1)+1;
  ta.value=v.slice(0,ls)+p+v.slice(ls);ta.setSelectionRange(s+p.length,s+p.length);ta.focus();draft.notes=ta.value;liveCommit();}

/* ---- checklist editing ---- */
function ckAt(i){return draft.subtasks[i]}
function ckInsertAfter(i,text,depth){
  const list=draft.subtasks;
  const at=i<0?list.length:blockEnd(list,i);
  const d=depth!==undefined?depth:(i>=0?(list[i].depth||0):0);
  list.splice(at,0,{id:uid(),text:text||'',done:false,depth:Math.min(MAX_DEPTH,d)});
  return at;
}
function ckIndent(i,dir){
  const list=draft.subtasks;if(!list[i])return;
  const end=blockEnd(list,i);const d=list[i].depth||0;
  if(dir>0){if(i===0)return;const prevD=list[i-1].depth||0;if(d+1>prevD+1)return;
    let deepest=0;for(let k=i;k<end;k++)deepest=Math.max(deepest,list[k].depth||0);if(deepest+1>MAX_DEPTH)return;}
  else if(d===0)return;
  for(let k=i;k<end;k++)list[k].depth=Math.max(0,(list[k].depth||0)+dir);
}
function ckMove(i,dir){
  const list=draft.subtasks;const end=blockEnd(list,i);const d=list[i].depth||0;const block=list.slice(i,end);
  if(dir<0){let j=i-1;while(j>=0&&(list[j].depth||0)>d)j--;if(j<0||(list[j].depth||0)<d)return i;
    list.splice(i,block.length);list.splice(j,0,...block);return j;}
  else{if(end>=list.length||(list[end].depth||0)<d)return i;const nEnd=blockEnd(list,end);
    list.splice(i,block.length);const ins=nEnd-block.length;list.splice(ins,0,...block);return ins;}
}
function ckTick(i,fromEl){
  const list=draft.subtasks;const s=list[i];s.done=!s.done;
  // ticking a parent ticks its whole branch, like Todoist
  const end=blockEnd(list,i);for(let k=i+1;k<end;k++)list[k].done=s.done;
  const st=ckStats(list);
  if(s.done&&st.d===st.n&&st.n>1){play('list');confetti(.45);
    if(draft.id&&!draft.rrule&&draft.status!=='done')setTimeout(()=>toast('Checklist complete',()=>{completeFromSheet();},'Complete task'),200);}
  else play(s.done?'tick':'untick');
  rerenderSheet();
  const box=$('[data-cktick="'+i+'"]');if(box&&s.done)box.classList.add('pop-anim');
}
let ckMenuEl=null;
function closeCkMenu(){if(ckMenuEl){ckMenuEl.remove();ckMenuEl=null;}}
function openCkMenu(i,anchor){
  closeCkMenu();
  const s=ckAt(i);const m=document.createElement('div');m.className='ckmenu';
  m.innerHTML='<button data-cm="indent">'+svg('indent')+'Indent</button><button data-cm="outdent">'+svg('outdent')+'Outdent</button>'

    +'<button data-cm="del" class="danger">'+svg('trash')+'Delete step'+(hasKids(draft.subtasks,i)?' and its sub-steps':'')+'</button>';

    else if(a==='down'){ckMove(i,1);rerenderSheet();}

    else if(a==='del'){draft.subtasks.splice(i,blockEnd(draft.subtasks,i)-i);rerenderSheet();}
    else if(a==='task'){commitDraft(false);const parent=tasks.find(x=>x.id===draft.id);if(!parent)return;
      const nt=subtaskToTask(parent,i);draft.subtasks=clone(parent.subtasks);draftOrig=clone(parent);rerenderSheet();render();
      setTimeout(()=>{if(confirm('Open the new task?'))openTaskSheet(nt.id);},50);}

setTimeout(()=>document.addEventListener('pointerdown',e=>{if(ckMenuEl&&!e.target.closest('.ckmenu'))closeCkMenu();},true));
function bindCkDrag(sh){
  sh.querySelectorAll('[data-ckgrip]').forEach(g=>{
    g.addEventListener('pointerdown',e=>{
      e.preventDefault();const from=Number(g.dataset.ckgrip);const row=g.closest('.ck');row.classList.add('dragging');
      let target=null,after=false;
      const clear=()=>sh.querySelectorAll('.ck').forEach(r=>r.classList.remove('drop-before','drop-after'));
      const move=ev=>{const el=document.elementFromPoint(ev.clientX,ev.clientY);const over=el&&el.closest('.ck[data-ck]');clear();
        if(over&&over!==row){const r=over.getBoundingClientRect();after=ev.clientY>r.top+r.height/2;target=Number(over.dataset.ck);over.classList.add(after?'drop-after':'drop-before');}else target=null;};
      const up=()=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);row.classList.remove('dragging');clear();
        if(target===null)return;const list=draft.subtasks;const end=blockEnd(list,from);
        if(target>=from&&target<end)return;
        const tItem=list[target];
        const block=list.splice(from,end-from);
        let t=list.indexOf(tItem);
        // the moved block takes the depth of the step it was dropped on, and lands before it or after its whole branch
        const shift=(tItem.depth||0)-(block[0].depth||0);
        if(after)t=blockEnd(list,t);
        block.forEach(b=>b.depth=Math.max(0,Math.min(MAX_DEPTH,(b.depth||0)+shift)));
        list.splice(t,0,...block);rerenderSheet();};
      document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
    });
  });
}

let recorder=null,recChunks=[],recStart=0,recTick=null;
function stopRecording(discard){
  if(!recorder)return;
  if(discard)recorder._discard=true;
  try{recorder.stop()}catch(e){}
}
async function toggleRecording(){
  if(recorder){stopRecording(false);return;}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Voice notes are not supported in this browser');return;}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){toast('Microphone access was blocked');return;}
  recChunks=[];
  try{recorder=new MediaRecorder(stream,{audioBitsPerSecond:24000});}catch(e){recorder=new MediaRecorder(stream);}
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data)};
  recorder.onstop=()=>{
    stream.getTracks().forEach(t=>t.stop());clearInterval(recTick);
    const discard=recorder._discard;recorder=null;
    const r=$('#cmRec');if(r)r.innerHTML='';const mic=$('#cmMic');if(mic)mic.innerHTML=svg('mic');
    if(discard||!recChunks.length)return;
    const blob=new Blob(recChunks,{type:recChunks[0].type||'audio/webm'});
    if(blob.size>ATTACH_CAP){toast('That voice note is too long to store. Keep it under a minute.');return;}
    const dur=Math.round((Date.now()-recStart)/1000);
    const fr=new FileReader();fr.onload=()=>{pendingCm.voice={url:String(fr.result),dur,size:blob.size};const p=$('#cmPending');if(p){p.innerHTML=pendingHtml();bindPending();}updatePostBtn();};
    fr.readAsDataURL(blob);
  };
  recorder.start();recStart=Date.now();
  const mic=$('#cmMic');if(mic)mic.innerHTML=svg('stop');
  recTick=setInterval(()=>{const s=Math.round((Date.now()-recStart)/1000);const r=$('#cmRec');if(r)r.innerHTML='<span class="rec"><i></i>'+s+'s</span>';if(s>=90)stopRecording(false);},250);
}

  const i=$('#cmIn');const text=(i.value||'').trim();
  if(!text&&!pendingCm.file&&!pendingCm.voice)return;

/* ============================================================ focus mode */
let focusQueue=[],focusPos=0,focusTimer=null,focusRemain=0,focusMinutes=25,focusRunning=false;
function startFocus(startId,queueIds){
  let q;
  if(queueIds)q=queueIds;
  else{q=todaysTasks().filter(o=>o.task.focusOn!==false&&!isNote(o.task)&&!(o.task.rrule?isCompleted(o.task.id,o.date):o.task.status==='done')).map(o=>o.task.id);}
  if(startId){const i=q.indexOf(startId);if(i>0)q=q.slice(i).concat(q.slice(0,i));else if(i<0)q=[startId].concat(q);}
  focusQueue=q.filter(Boolean);focusPos=0;
  if(!focusQueue.length){toast('Nothing to focus on');return;}
  focusRunning=false;stopTimer();
  $('#focus').hidden=false;requestAnimationFrame(()=>$('#focus').classList.add('show'));
  renderFocus();
}
function currentFocusTask(){const id=focusQueue[focusPos];return tasks.find(t=>t.id===id)}
function renderFocus(){
  const t=currentFocusTask();
  if(!t){exitFocus();return;}
  const c=clientOf(t.client);
  const mins=String(Math.floor(focusRemain/60)).padStart(2,'0');
  const secs=String(focusRemain%60).padStart(2,'0');
  const total=focusMinutes*60;const prog=total?(1-focusRemain/total)*100:0;
  let checks='';
  if(t.subtasks.length){const st=ckStats(t.subtasks);
    checks='<div class="focus-checks"><div class="focus-track" style="width:100%;margin:0 0 10px"><i style="width:'+st.pct+'%"></i></div>'+visibleIdx(t.subtasks,false).map(i=>{const s=t.subtasks[i];return'<div class="focus-check'+(s.done?' done':'')+'" data-fcheck="'+i+'" style="padding-left:'+((s.depth||0)*22)+'px"><span class="fb">'+svg('check')+'</span><span>'+esc(s.text)+'</span></div>'}).join('')+'</div>';}
  const timerBlock=focusRunning||focusRemain>0
    ? '<div class="focus-timer">'+mins+'<span class="sep">·</span>'+secs+'</div><div class="focus-track"><i style="width:'+prog+'%"></i></div>'
    : '<div class="focus-mins">'+[15,25,45].map(m=>'<button class="focus-min'+(focusMinutes===m?' on':'')+'" data-fmin="'+m+'">'+m+'m</button>').join('')+'</div>';
  $('#focus').innerHTML='<div class="focus-in">'
    +'<div class="focus-top"><button class="focus-close" id="fClose">Done</button>'
    +'<span class="focus-count">'+(focusPos+1)+' / '+focusQueue.length+'</span></div>'
    +'<div class="focus-mid"><div class="focus-client"><span class="dot" style="background:'+c.color+'"></span>'+esc(c.name)+'</div>'
    +'<div class="focus-title">'+esc(titleOf(t))+'</div>'
    +timerBlock+checks+'</div>'
    +'<div class="focus-actions">'
    +(focusPos<focusQueue.length-1?'<button class="focus-btn sec" id="fNext">Skip</button>':'')
    +'<button class="focus-btn main" id="fDone">'+(focusRunning?'Pause':'Complete')+'</button>'
    +(focusRunning?'':'<button class="focus-btn sec" id="fPlay">Start timer</button>')
    +'</div></div>';
  $('#fClose').onclick=exitFocus;
  $('#fDone').onclick=()=>{if(focusRunning){stopTimer();renderFocus();}else{completeFocusTask();}};
  const nx=$('#fNext');if(nx)nx.onclick=advanceFocus;
  const pl=$('#fPlay');if(pl)pl.onclick=()=>{focusRemain=focusMinutes*60;startTimer();renderFocus();};
  $('#focus').querySelectorAll('[data-fmin]').forEach(b=>b.onclick=()=>{focusMinutes=Number(b.dataset.fmin);renderFocus();});
  $('#focus').querySelectorAll('[data-fcheck]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.fcheck);const s=t.subtasks[i];s.done=!s.done;
    const end=blockEnd(t.subtasks,i);for(let k=i+1;k<end;k++)t.subtasks[k].done=s.done;
    const st=ckStats(t.subtasks);if(s.done&&st.d===st.n)play('list');else play(s.done?'tick':'untick');saveTasks();renderFocus();});
}
function completeFocusTask(){
  const t=currentFocusTask();if(!t)return;
  const inst=openTodayInstance(t);if(completeInstance(t,inst?inst.date:todayStr()))afterComplete();
  advanceFocus();
}
function advanceFocus(){
  stopTimer();focusRunning=false;focusRemain=0;
  focusPos++;
  if(focusPos>=focusQueue.length){exitFocus();return;}
  renderFocus();
}
function startTimer(){
  focusRunning=true;stopTimer();focusRunning=true;
  focusTimer=setInterval(()=>{
    focusRemain--;
    if(focusRemain<=0){stopTimer();focusRunning=false;try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}play('remind');toast('Time up');completeFocusTask();return;}
    const el=$('.focus-timer');if(el){const m=String(Math.floor(focusRemain/60)).padStart(2,'0'),s=String(focusRemain%60).padStart(2,'0');el.innerHTML=m+'<span class="sep">·</span>'+s;}
    const track=$('.focus-timer + .focus-track > i');if(track)track.style.width=((1-focusRemain/(focusMinutes*60))*100)+'%';
  },1000);
}
function stopTimer(){if(focusTimer){clearInterval(focusTimer);focusTimer=null}focusRunning=false;}
function exitFocus(){stopTimer();$('#focus').classList.remove('show');setTimeout(()=>{$('#focus').hidden=true;render();},280);}

/* ============================================================ data io */
function fullBlob(){return{version:SCHEMA,schema:SCHEMA,tasks,completions,exceptions,routines,templates,meetings,x:X,fired,
  cfg:{clients:CLIENTS,people:PEOPLE,workMins:CFG.workMins,archiveDays:CFG.archiveDays,sound:CFG.sound}}}
function backupData(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(fullBlob(),null,2)],{type:'application/json'}));
  a.download='taskboard-backup-'+todayStr()+'.json';a.click();
}
function restoreData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=async()=>{let b;try{b=JSON.parse(r.result)}catch(e){toast('That file could not be read');return;}
      if(!Array.isArray(b.tasks)){toast('That file has no tasks in it');return;}
      if(!confirm('Replace this board with the '+b.tasks.length+' tasks in that file? The current board is saved as an earlier copy first.'))return;
      store.set('pn_tb2_before_restore',JSON.stringify(fullBlob()));
      try{await sbUpsert(SB_ROW+'_bak_before_restore',{...buildSnapshot(),_backupOf:Date.now()});}catch(e){}
      tasks=b.tasks.map(normTask);
      if(Array.isArray(b.completions))completions=b.completions;
      if(Array.isArray(b.exceptions))exceptions=b.exceptions;
      if(Array.isArray(b.routines))routines=b.routines;
      if(Array.isArray(b.templates))templates=b.templates;
      if(Array.isArray(b.meetings))meetings=b.meetings.map(normMeeting);
      if(b.x)X=normX(b.x);
      if(b.cfg){if(b.cfg.clients)CLIENTS=b.cfg.clients;if(b.cfg.people)PEOPLE=b.cfg.people;if(b.cfg.workMins)CFG.workMins=b.cfg.workMins;if(b.cfg.archiveDays)CFG.archiveDays=b.cfg.archiveDays;if(typeof b.cfg.sound==='boolean')CFG.sound=b.cfg.sound;}
      syncForce=true;
      saveTasks();saveComp();saveExc();saveRout();saveTmpl();saveMeet();saveCfg();saveX();closeSheet();render();toast('Restored from backup');
    };
    r.readAsText(f);};
  inp.click();
}
function exportCsv(){
  const esc2=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['Title','Client','Assignee','Type','Priority','Due','Time','Deadline','Repeat','Duration','Status','Labels','Checklist','Description'].join(',')];
  tasks.forEach(t=>{const s=ckStats(t.subtasks);rows.push([esc2(t.title),esc2(clientOf(t.client).name),esc2(t.assignee),t.type,PRIO_P[t.priority],t.due||'',t.dueTime||'',t.deadline||'',esc2(repeatLabel(t.rrule)),t.estimate||'',t.rrule?'recurring':t.status,esc2(t.labels.join(' ')),s.n?s.d+'/'+s.n:'',esc2(t.notes||'')].join(','))});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));
  a.download='tasks-'+todayStr()+'.csv';a.click();
}

/* ============================================================ toast */
let toastTimer=null;
function toast(msg,action,label){
  const t=$('#toast'),u=$('#toastUndo');
  $('#toastText').textContent=msg;
  if(action){u.hidden=false;u.textContent=label||'Undo';u.onclick=()=>{u.hidden=true;t.classList.remove('show');setTimeout(()=>t.hidden=true,300);action();};}
  else u.hidden=true;
  t.hidden=false;requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.hidden=true,300)},action?5500:2800);
}

/* ============================================================ screen bindings */
// clearing the done list only hides rows for today. completion records are kept, so karma, streaks and recurring schedules are untouched
function clearCompleted(){
  const today=todayStr();
  const prev=clone(X.cleared||{date:'',keys:[]});
  const keys=doneTodayList().map(o=>o.task.id);
  X.cleared={date:today,keys:[...new Set([...(prev.date===today?prev.keys:[]),...keys])]};
  saveX();render();
  toast('Cleared '+keys.length+' completed',()=>{X.cleared=prev;saveX();render();},'Undo');
}

  s.querySelectorAll('[data-vacoff]').forEach(b=>b.addEventListener('click',()=>setVacation(false)));
  s.querySelectorAll('[data-xtoggle]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.xtoggle;X[k]=!X[k];saveX();if(k==='celebrations'&&X[k])confetti(.5);render();}));
  s.querySelectorAll('[data-soundt]').forEach(b=>b.addEventListener('click',()=>{CFG.sound=!CFG.sound;saveCfg();if(CFG.sound)pop();render();}));
  bindDrag();

function setVacation(on){

  if(on){X.vacations.push({from:today,to:null});toast('Vacation mode on. Streaks are paused.');}
  else{const v=X.vacations[X.vacations.length-1];if(v&&!v.to){v.to=today;if(v.to<v.from)v.to=v.from;}toast('Welcome back. Vacation mode off.');}

function deferMenu(t){
  if(!t)return;
  const today=todayStr();
  const opts=[['Tomorrow',addLocalDays(today,1)],['This weekend',offToDate('sat')],['Next week',offToDate('mon')],['In a week',addLocalDays(today,7)]];
  const h='<div class="sheet-hd"><span class="st">Reschedule</span><button class="sheet-x" id="dfCancel">Cancel</button></div><div class="sheet-body">'
    +opts.map(([l,d],i)=>'<div class="row-link" data-dfo="'+i+'"><span>'+l+'</span><span class="mono" style="font-size:11.5px;color:var(--text-2)">'+esc(fmtShort(d))+'</span></div>').join('')
    +'<div class="field" style="margin-top:12px"><label>Pick a date</label><input type="date" id="dfPick" min="'+today+'"></div></div>';
  openSheet(h);
  $('#dfCancel').onclick=closeSheet;
  document.querySelectorAll('[data-dfo]').forEach(el=>el.onclick=()=>{closeSheet();rescheduleTask(t,opts[Number(el.dataset.dfo)][1]);});
  $('#dfPick').onchange=e=>{const v=e.target.value;if(!v)return;closeSheet();rescheduleTask(t,v);};
}

/* ============================================================ drag reorder (today) */
let dragId=null;
function bindDrag(){
  const s=$('#screen');
  s.querySelectorAll('[data-grip]').forEach(g=>{
    g.addEventListener('pointerdown',e=>{
      e.preventDefault();
      const row=g.closest('.row');const cont=row.parentElement;dragId=row.dataset.tid;row.classList.add('dragging');
      const move=ev=>{
        const el=document.elementFromPoint(ev.clientX,ev.clientY);const over=el&&el.closest('.row');
        cont.querySelectorAll('.row').forEach(r=>r.classList.remove('drop-target'));
        if(over&&over!==row)over.classList.add('drop-target');
      };
      const up=ev=>{
        document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);
        const el=document.elementFromPoint(ev.clientX,ev.clientY);const over=el&&el.closest('.row');
        row.classList.remove('dragging');cont.querySelectorAll('.row').forEach(r=>r.classList.remove('drop-target'));
        if(over&&over.dataset.tid&&over.dataset.tid!==dragId)reorderTasks(dragId,over.dataset.tid);
        dragId=null;
      };
      document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);
    });
  });
}
function reorderTasks(fromId,toId){
  const order=todaysTasks().map(o=>o.task.id);
  const fi=order.indexOf(fromId),ti=order.indexOf(toId);if(fi<0||ti<0)return;
  order.splice(ti,0,order.splice(fi,1)[0]);
  order.forEach((id,i)=>{const t=tasks.find(x=>x.id===id);if(t)t.sortIndex=i;});
  saveTasks();render();
}

/* ============================================================ reminders */
function nowLocalMin(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function taskRep(t){
  const today=todayStr();
  if(t.rrule){const nd=nextDue(t,today);return{date:nd||today,done:isCompleted(t.id,today)};}
  return{date:t.due,done:t.status==='done'};
}
function computeRemindAt(t){
  if(!t.remind||t.remind==='none')return null;
  if(t.remind==='custom')return t.remindAt||null;
  const rep=taskRep(t);if(!rep.date||rep.done)return null;
  const tm=t.dueTime||'09:00';
  if(t.remind==='attime')return rep.date+'T'+tm;
  if(t.remind==='before30'){const[h,m]=tm.split(':').map(Number);const mins=h*60+m-30;
    return mins>=0?rep.date+'T'+pad(Math.floor(mins/60))+':'+pad(mins%60):addLocalDays(rep.date,-1)+'T'+pad(Math.floor((mins+1440)/60))+':'+pad((mins+1440)%60);}
  if(t.remind==='due9')return rep.date+'T09:00';
  if(t.remind==='due18')return rep.date+'T18:00';
  if(t.remind==='before1d9')return addLocalDays(rep.date,-1)+'T09:00';
  return null;
}
function ensureNotifyPermission(){try{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();}catch(e){}}
function notify(title,body){try{if('Notification'in window&&Notification.permission==='granted')new Notification(title,{body});}catch(e){}}
function checkReminders(){
  const now=nowLocalMin();
  const cutoff=addLocalDays(todayStr(),-1)+'T'+now.slice(11);
  let changed=false;
  tasks.forEach(t=>{
    if(t.archivedAt)return;
    const at=computeRemindAt(t);if(!at||at>now)return;
    const key=t.id+'|'+at;if(fired.includes(key))return;
    fired.push(key);changed=true;
    if(at>=cutoff){notify('Task reminder',titleOf(t)+' · '+clientOf(t.client).name);play('remind');toast('Reminder · '+titleOf(t));}
  });
  if(changed)saveFired();
}

/* ============================================================ supabase sync */
const SB_URL='https://wxbbobkgjfkviitkbien.supabase.co';
const SB_KEY='sb_publishable_L1j0KCJPx6h5td7K3d8ezw_XEWSDo3v';
const SB_TABLE='client_board';
const SB_ROW='pn_board_pratim_9c6b2f';
let syncRev=0,syncPushTimer=null,syncPulling=false,initialSyncDone=false;

function sbHeaders(){return{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=representation'}}
function buildSnapshot(){
  return{schema:SCHEMA,tasks,completions,exceptions,routines,templates,meetings,
    cfg:{clients:CLIENTS,people:PEOPLE,workMins:CFG.workMins,archiveDays:CFG.archiveDays,sound:CFG.sound},
    ui:UI,fired,x:X};
}
function applySnapshot(snap){
  const legacy=!(snap.schema>=SCHEMA);
  if(Array.isArray(snap.tasks))tasks=(legacy?restoreV4Fields(snap.tasks):snap.tasks).map(normTask);
  if(Array.isArray(snap.completions))completions=snap.completions;
  if(Array.isArray(snap.exceptions))exceptions=snap.exceptions;
  if(Array.isArray(snap.routines))routines=snap.routines;
  if(Array.isArray(snap.templates))templates=snap.templates;
  if(Array.isArray(snap.meetings))meetings=snap.meetings.map(normMeeting);
  if(snap.cfg){
    if(snap.cfg.clients)CLIENTS=snap.cfg.clients;
    if(snap.cfg.people)PEOPLE=snap.cfg.people;
    if(snap.cfg.workMins)CFG.workMins=snap.cfg.workMins;
    if(snap.cfg.archiveDays)CFG.archiveDays=snap.cfg.archiveDays;
    if(typeof snap.cfg.sound==='boolean')CFG.sound=snap.cfg.sound;
  }
  if(snap.x&&!legacy)X=normX(snap.x);
  // filters follow you across devices; which tab, week or month you are looking at stays on this device
  if(snap.ui&&snap.ui.view&&typeof snap.ui.view==='object')UI.view={...UI.view,...snap.ui.view};
  if(Array.isArray(snap.fired))fired=snap.fired;
  fixUi();
  saveTasks();saveComp();saveExc();saveRout();saveTmpl();saveMeet();saveCfg();saveUi();saveFired();saveX();
}
/* ---- data-loss guards ----
   1. sync only switches on after a successful read of the cloud copy, never after a failed one
   2. a write or a pull that would suddenly cut the task count by 40% or more is refused
   3. the first write of each day copies the current cloud row into one of 14 rolling backup rows
   4. the first time v4 reads the cloud it saves that untouched copy to its own row, once, and never overwrites it
   5. snapshots from older builds are merged so v4-only fields are never stripped */
const SB_BAK_SLOTS=14;
let syncForce=false;
function looksLikeWipe(fromCount,toCount){return fromCount>=8&&toCount<fromCount*0.6}
function taskCount(d){return d&&Array.isArray(d.tasks)?d.tasks.length:0}
async function sbUpsert(id,data){
  const body=JSON.stringify({id,data,updated_at:Date.now()});
  const r=await fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=eq.'+id,{method:'PATCH',headers:sbHeaders(),body});
  const rows=r.ok?await r.json():[];
  if(!rows.length)await fetch(SB_URL+'/rest/v1/'+SB_TABLE,{method:'POST',headers:sbHeaders(),body});
}
async function sbInsertOnce(id,data){
  const r=await fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=eq.'+id+'&select=id',{method:'GET',headers:sbHeaders()});
  if(!r.ok)return false;
  const rows=await r.json();if(rows.length)return true;
  const p=await fetch(SB_URL+'/rest/v1/'+SB_TABLE,{method:'POST',headers:sbHeaders(),body:JSON.stringify({id,data,updated_at:Date.now()})});
  return p.ok;
}
async function preUpgradeCloudCopy(row){
  if(store.get('pn_tb2_cloud_preupgrade_v4')==='1')return;
  if(!row||!row.data||taskCount(row.data)===0)return;
  try{if(await sbInsertOnce(SB_ROW+'_preupgrade_v4',{...row.data,_backupOf:row.updated_at}))store.set('pn_tb2_cloud_preupgrade_v4','1');}catch(e){}
}
async function backupCloudRow(row){
  const day=Math.floor(Date.now()/86400000);
  if(store.get('pn_tb2_lastbak')===String(day))return;
  if(!row||!row.data||taskCount(row.data)===0)return;
  await sbUpsert(SB_ROW+'_bak'+(day%SB_BAK_SLOTS),{...row.data,_backupOf:row.updated_at});
  store.set('pn_tb2_lastbak',String(day));
}
async function syncPush(){
  if(!initialSyncDone)return;
  clearTimeout(syncPushTimer);
  syncPushTimer=setTimeout(async()=>{
    try{
      const r=await fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=eq.'+SB_ROW,{method:'GET',headers:sbHeaders()});
      if(!r.ok)return;
      const rows=await r.json();
      if(rows.length&&!syncForce&&looksLikeWipe(taskCount(rows[0].data),tasks.length)){
        toast('Sync paused. This device has far fewer tasks than the cloud copy, so nothing was overwritten.');
        return;
      }
      syncForce=false;
      if(rows.length){await preUpgradeCloudCopy(rows[0]);await backupCloudRow(rows[0]);}
      syncRev=Date.now();
      const body={id:SB_ROW,data:buildSnapshot(),updated_at:syncRev};
      if(rows.length===0) await fetch(SB_URL+'/rest/v1/'+SB_TABLE,{method:'POST',headers:sbHeaders(),body:JSON.stringify(body)});
      else await fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=eq.'+SB_ROW,{method:'PATCH',headers:sbHeaders(),body:JSON.stringify(body)});
    }catch(e){}
  },1200);
}
async function syncPull(){
  if(syncPulling)return;syncPulling=true;
  try{
    const r=await fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=eq.'+SB_ROW,{method:'GET',headers:sbHeaders()});
    if(r.ok){
      const rows=await r.json();
      if(rows.length){
        const row=rows[0];
        await preUpgradeCloudCopy(row);
        if(row.updated_at&&row.updated_at>syncRev&&row.data){
          syncRev=row.updated_at;
          if(looksLikeWipe(tasks.length,taskCount(row.data))){
            initialSyncDone=true;syncPulling=false;syncPush();return;
          }
          applySnapshot(row.data);
          if($('#sheet').hidden)render();else renderKarmaPill();
        }
      }
      initialSyncDone=true;
    }
  }catch(e){}
  syncPulling=false;
}
async function openEarlierCopies(){
  openSheet('<div class="sheet-hd"><span class="st">Earlier copies</span><button class="sheet-x" id="ecClose">Close</button></div><div class="sheet-body"><p class="qa-hint" id="ecMsg">Loading</p><div id="ecList"></div></div>');
  $('#ecClose').onclick=closeSheet;
  try{
    const r=await fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=like.'+SB_ROW+'_*',{method:'GET',headers:sbHeaders()});
    const rows=(await r.json()).filter(x=>x.data).sort((a,b)=>(b.data._backupOf||0)-(a.data._backupOf||0));
    const lab=x=>/_preupgrade_v4$/.test(x.id)?'Before this update':/_bak_before_restore$/.test(x.id)?'Before last restore':'Daily copy';
    $('#ecMsg').textContent=rows.length?'Tap one to bring that copy back. Your current board is backed up first.':'No earlier copies yet. One is saved automatically each day.';
    $('#ecList').innerHTML=rows.map((x,i)=>'<div class="row-link" data-ec="'+i+'"><span>'+esc(new Date(x.data._backupOf||x.updated_at).toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))
      +' <span class="mono" style="font-size:10.5px;color:var(--text-3);margin-left:6px">'+lab(x)+'</span></span><span class="mono">'+taskCount(x.data)+' tasks</span></div>').join('');
    $('#ecList').querySelectorAll('[data-ec]').forEach(el=>el.onclick=async()=>{
      const x=rows[Number(el.dataset.ec)];
      if(!confirm('Restore the copy with '+taskCount(x.data)+' tasks? Your current board is saved as an earlier copy first.'))return;
      try{await sbUpsert(SB_ROW+'_bak_before_restore',{...buildSnapshot(),_backupOf:Date.now()});}catch(e){}
      syncForce=true;applySnapshot(x.data);closeSheet();render();toast('Restored');
    });
  }catch(e){$('#ecMsg').textContent='Could not reach the cloud copy.'}
}
