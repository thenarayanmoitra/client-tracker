/* ============================================================ markdown (escaped first, then a small safe subset) */
function mdInline(s){
  const codes=[];
  s=s.replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return'\u0000'+(codes.length-1)+'\u0000'});
  s=s.replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s=s.replace(/(^|[\s(])((?:https?:\/\/)[^\s<]+[^\s<.,;:!?)])/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g,'$1<em>$2</em>').replace(/(^|[^_\w])_([^_\s][^_]*?)_(?!\w)/g,'$1<em>$2</em>');
  s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s=mentionize(s);
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<code>'+codes[Number(i)]+'</code>');
  return s;
}
function mentionize(s){
  if(!PEOPLE.length)return s;
  const names=PEOPLE.slice().sort((a,b)=>b.length-a.length).map(n=>esc(n).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  return s.replace(new RegExp('(^|[\\s(>])@('+names.join('|')+')\\b','g'),'$1<span class="mention">@$2</span>');
}
function md(src){
  const lines=esc(src||'').split('\n');let out='',list=null,para=[],inCode=false,code=[];
  const flushP=()=>{if(para.length){out+='<p>'+para.map(mdInline).join('<br>')+'</p>';para=[];}};
  const closeL=()=>{if(list){out+='</'+list+'>';list=null;}};
  for(const raw of lines){
    const l=raw.replace(/\s+$/,'');
    if(/^```/.test(l)){if(inCode){out+='<pre><code>'+code.join('\n')+'</code></pre>';code=[];inCode=false;}else{flushP();closeL();inCode=true;}continue;}
    if(inCode){code.push(raw);continue;}
    let m;
    if(!l.trim()){flushP();closeL();continue;}
    if((m=l.match(/^(#{1,3})\s+(.*)/))){flushP();closeL();const n=m[1].length+3;out+='<h'+n+'>'+mdInline(m[2])+'</h'+n+'>';continue;}
    if(/^(-{3,}|\*{3,})$/.test(l.trim())){flushP();closeL();out+='<hr>';continue;}
    if((m=l.match(/^&gt;\s?(.*)/))){flushP();closeL();out+='<blockquote>'+mdInline(m[1])+'</blockquote>';continue;}
    if((m=l.match(/^\s*[-*+]\s+\[( |x|X)\]\s+(.*)/))){flushP();if(list!=='ul'){closeL();out+='<ul>';list='ul';}
      out+='<li class="task"><input type="checkbox" disabled'+(m[1].trim()?' checked':'')+'>'+mdInline(m[2])+'</li>';continue;}
    if((m=l.match(/^\s*[-*+]\s+(.*)/))){flushP();if(list!=='ul'){closeL();out+='<ul>';list='ul';}out+='<li>'+mdInline(m[1])+'</li>';continue;}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){flushP();if(list!=='ol'){closeL();out+='<ol>';list='ol';}out+='<li>'+mdInline(m[1])+'</li>';continue;}
    closeL();para.push(l);
  }
  if(inCode)out+='<pre><code>'+code.join('\n')+'</code></pre>';
  flushP();closeL();
  return out;
}

  meetings=(Array.isArray(m.meetings)?m.meetings:[]).map(normMeeting);
  if(Array.isArray(m.notebook))notebook=m.notebook.filter(n=>n&&n.id).map(normNote);
  if(m.cfg){
    if(Array.isArray(m.cfg.clients)&&m.cfg.clients.length)CLIENTS=m.cfg.clients.map(c=>({...c}));
    if(Array.isArray(m.cfg.people)&&m.cfg.people.length)PEOPLE=m.cfg.people.slice();
    if(m.cfg.workMins)CFG.workMins=m.cfg.workMins;
    if(m.cfg.archiveDays)CFG.archiveDays=m.cfg.archiveDays;
    if(typeof m.cfg.sound==='boolean')CFG.sound=m.cfg.sound;
  }
  X=normX(m.x);
  fired=Array.isArray(m.fired)?m.fired.slice():[];
  countEndMemo.clear();
  writeAllRaw();rebaseline();dataVer++;
  if(before&&canon(before)!==canon(m))onRemoteChange();
}
function onRemoteChange(){
  render({remote:true});
  refreshOpenSheet();
}

/* ---- the sync loop ---- */
function scheduleSync(ms){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(()=>syncNow(),ms==null?900:ms)}
function isDirty(){return localVer>SYNC.pushedVer||store.get(K.dirty)==='1'}
function setSync(st,err){SYNC.status=st;SYNC.err=err?String(err&&err.message||err):'';renderSyncDot();}
async function sbGet(q){
  const r=await fetch(SB_URL+'/rest/v1/'+SB_TABLE+q,{method:'GET',headers:sbHeaders(),cache:'no-store'});
  if(!r.ok)throw new Error('Cloud read failed ('+r.status+')');
  return r.json();
}
async function syncNow(){
  if(SYNC.busy){SYNC.again=true;return}
  if(SYNC.paused&&!SYNC.force)return;
  SYNC.busy=true;
  try{
    // cheap check first: when nothing changed here or in the cloud there is nothing to download
    if(SYNC.inited&&!isDirty()&&!SYNC.force){
      const head=await sbGet('?id=eq.'+SB_ROW+'&select=updated_at');
      if(head.length&&String(head[0].updated_at)===String(SYNC.lastSeen)){SYNC.lastOk=Date.now();setSync('ok');return;}
    }
    setSync('syncing');
    for(let attempt=0;attempt<6;attempt++){
      const rows=await sbGet('?id=eq.'+SB_ROW);
      const row=rows[0]||null;
      const hasCloud=!!(row&&row.data&&typeof row.data==='object');
      const first=store.get(K.v5synced)!=='1';
      const ver=localVer;
      const local=buildSnapshot();
      const merged=hasCloud?mergeSnap(row.data,local,first):mergeSnap(null,local,false);
      if(hasCloud&&!SYNC.force&&looksLikeWipe(taskCount(row.data),merged.tasks.length)){
        SYNC.paused={cloud:taskCount(row.data),after:merged.tasks.length,ids:row.data.tasks.map(t=>t&&t.id).filter(id=>id&&!merged.tasks.some(t=>t.id===id))};
        setSync('paused');
        toast('Sync paused. It would remove '+(SYNC.paused.cloud-SYNC.paused.after)+' tasks from the cloud, so nothing was changed. Open Settings to review.');
        return;
      }
      if(hasCloud){applyMerged(merged,local);await preUpgradeCloudCopy(row);}
      if(hasCloud&&canon(merged)===canon(row.data)){SYNC.lastSeen=row.updated_at;afterSyncOk(ver);break;}
      if(hasCloud)await backupCloudRow(row);
      const rev=Math.max(Date.now(),(Number(row&&row.updated_at)||0)+1);
      const body=JSON.stringify({id:SB_ROW,data:merged,updated_at:rev});
      if(row){
        const filt=row.updated_at==null?'updated_at=is.null':'updated_at=eq.'+encodeURIComponent(row.updated_at);
        const p=await fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=eq.'+SB_ROW+'&'+filt,{method:'PATCH',headers:sbHeaders(),body});
        if(!p.ok)throw new Error('Cloud write failed ('+p.status+')');
        const upd=await p.json();
        if(!Array.isArray(upd)||!upd.length){if(attempt===5)throw new Error('The cloud kept changing, will retry');continue;}
      }else{
        const p=await fetch(SB_URL+'/rest/v1/'+SB_TABLE,{method:'POST',headers:sbHeaders(),body});
        if(!p.ok)throw new Error('Cloud write failed ('+p.status+')');
      }
      SYNC.lastSeen=rev;SYNC.force=false;afterSyncOk(ver);break;
    }
  }catch(e){setSync(navigator.onLine===false?'offline':'error',e);}
  finally{SYNC.busy=false;if(SYNC.again){SYNC.again=false;scheduleSync(300);}}
}
function afterSyncOk(ver){
  SYNC.pushedVer=Math.max(SYNC.pushedVer,ver);
  if(localVer<=SYNC.pushedVer)store.set(K.dirty,'0');
  store.set(K.v5synced,'1');SYNC.inited=true;SYNC.lastOk=Date.now();SYNC.paused=null;setSync('ok');
  // housekeeping that edits tasks runs only once this device is up to date, so it never overrides newer edits
  if(!SYNC.archived){SYNC.archived=true;runArchive();}
}
function resolvePause(allow){
  if(!SYNC.paused)return;
  if(allow){SYNC.force=true;}
  else{SYNC.paused.ids.forEach(id=>{delete X.tomb['t:'+id]});writeX();}
  SYNC.paused=null;setSync('syncing');syncNow();
}
async function sbUpsert(id,data){
  const body=JSON.stringify({id,data,updated_at:Date.now()});
  const r=await fetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=eq.'+id,{method:'PATCH',headers:sbHeaders(),body});
  const rows=r.ok?await r.json():[];
  if(!rows.length)await fetch(SB_URL+'/rest/v1/'+SB_TABLE,{method:'POST',headers:sbHeaders(),body});
}
async function sbInsertOnce(id,data){
  const rows=await sbGet('?id=eq.'+id+'&select=id');
  if(rows.length)return true;
  const p=await fetch(SB_URL+'/rest/v1/'+SB_TABLE,{method:'POST',headers:sbHeaders(),body:JSON.stringify({id,data,updated_at:Date.now()})});
  return p.ok;
}
/* an untouched copy of the cloud board, kept once per upgrade in a row of its own */
async function preUpgradeCloudCopy(row){
  if(!row||!row.data||taskCount(row.data)===0)return;
  for(const v of ['v5','v6']){
    if(store.get('pn_tb2_cloud_preupgrade_'+v)==='1')continue;
    try{if(await sbInsertOnce(SB_ROW+'_preupgrade_'+v,{...row.data,_backupOf:row.updated_at}))store.set('pn_tb2_cloud_preupgrade_'+v,'1');}catch(e){}
  }
}
async function backupCloudRow(row){
  const day=Math.floor(Date.now()/86400000);
  if(store.get('pn_tb2_lastbak')===String(day))return;
  if(!row||!row.data||taskCount(row.data)===0)return;
  try{
    // the day's slot keeps the earliest copy of the day, so a second device does not overwrite it
    const id=SB_ROW+'_bak'+(day%SB_BAK_SLOTS);
    const have=await sbGet('?id=eq.'+id+'&select=updated_at');
    if(!(have.length&&Math.floor(Number(have[0].updated_at)/86400000)===day))await sbUpsert(id,{...row.data,_backupOf:row.updated_at});
    store.set('pn_tb2_lastbak',String(day));
  }catch(e){}
}
/* makes the board exactly match a backup, on every device: restored records get a fresh clock,
   everything not in the backup gets a tombstone */
function replaceAll(b){
  const now=Date.now();
  const keepT=new Set((b.tasks||[]).map(t=>t&&t.id));
  tasks.forEach(t=>{if(!keepT.has(t.id))tomb('t:'+t.id,now)});
  tasks=(b.tasks||[]).filter(t=>t&&t.id).map(normTask).map(t=>({...t,updatedAt:now+1}));
  const keepC=new Set((b.completions||[]).map(c=>c.taskId+'|'+c.date));
  completions.forEach(c=>{const k=c.taskId+'|'+c.date;if(!keepC.has(k))tomb('kd:'+k,now)});
  completions=(b.completions||[]).map(c=>({...c,t:now+1}));
  const keepE=new Set((b.exceptions||[]).map(e=>e.id));
  exceptions.forEach(e=>{if(!keepE.has(e.id))tomb('e:'+e.id,now)});
  exceptions=(b.exceptions||[]).map(e=>({...e,t:now+1}));
  if(Array.isArray(b.routines))routines=b.routines;
  if(Array.isArray(b.templates))templates=b.templates;
  if(Array.isArray(b.meetings))meetings=b.meetings.map(normMeeting);
  // a backup made before notes existed leaves the current notes alone, so restoring it never loses one
  if(Array.isArray(b.notebook)){
    const keepN=new Set(b.notebook.map(n=>n&&n.id));
    notebook.forEach(n=>{if(!keepN.has(n.id))tomb('n:'+n.id,now)});
    notebook=b.notebook.filter(n=>n&&n.id).map(normNote).map(n=>({...n,updatedAt:now+1}));
    notebook.forEach(n=>{delete X.tomb['n:'+n.id]});
  }
  const c=b.cfg||{};
  if(Array.isArray(c.clients)&&c.clients.length)CLIENTS=c.clients.map(x=>({...x}));
  if(Array.isArray(c.people)&&c.people.length)PEOPLE=c.people.slice();
  if(c.workMins)CFG.workMins=c.workMins;if(c.archiveDays)CFG.archiveDays=c.archiveDays;if(typeof c.sound==='boolean')CFG.sound=c.sound;
  if(b.x){const keepTomb=X.tomb;X=normX(b.x);X.tomb={...(X.tomb||{}),...keepTomb};}
  // remove tombstones that would hide the restored records
  tasks.forEach(t=>{delete X.tomb['t:'+t.id]});exceptions.forEach(e=>{delete X.tomb['e:'+e.id]});notebook.forEach(n=>{delete X.tomb['n:'+n.id]});
  X._sec.cfg=now;X._sec.x=now;
  writeAllRaw();rebaseline();dataVer++;
  SYNC.force=true;SYNC.paused=null;markDirty();
}

/* ============================================================ undo
   Undo only reverts the records the action touched, so it never rolls back anything that
   arrived from another device in the meantime. */
function snapState(){return{t:new Map(tasks.map(t=>[t.id,taskSig(t)])),c:new Map(completions.map(c=>[c.id,JSON.stringify(c)])),
  e:new Map(exceptions.map(x=>[x.id,JSON.stringify(x)])),cl:JSON.stringify(CLIENTS),xc:JSON.stringify(X.cleared),lc:JSON.stringify(X.labelColors)}}
function undoTo(b,a){
  const order=tasks.map(t=>t.id);const cur=new Map(tasks.map(t=>[t.id,t]));
  new Set([...b.t.keys(),...a.t.keys()]).forEach(id=>{
    const bv=b.t.get(id),av=a.t.get(id);if(bv===av)return;
    if(bv===undefined)cur.delete(id);
    else{cur.set(id,normTask(JSON.parse(bv)));if(!order.includes(id))order.push(id);}
  });
  tasks=order.filter(id=>cur.has(id)).map(id=>cur.get(id));
  const fix=(list,bm,am)=>{const m=new Map(list.map(x=>[x.id,x]));new Set([...bm.keys(),...am.keys()]).forEach(id=>{const bv=bm.get(id),av=am.get(id);if(bv===av)return;if(bv===undefined)m.delete(id);else m.set(id,JSON.parse(bv));});return[...m.values()]};
  completions=fix(completions,b.c,a.c);exceptions=fix(exceptions,b.e,a.e);
  if(b.cl!==a.cl){CLIENTS=JSON.parse(b.cl);saveCfg();}
  if(b.xc!==a.xc||b.lc!==a.lc){X.cleared=JSON.parse(b.xc);X.labelColors=JSON.parse(b.lc);saveX();}
  saveTasks();saveComp();saveExc();render();refreshOpenSheet();
}
function refreshOpenSheet(){if($('#sheet').hidden)return;if(SHEET.kind==='labels')openLabelsManager();else if(SHEET.kind==='settings')openSettings();else if(SHEET.kind==='arrange')openArrangeTabs();}
function withUndo(msg,fn,label){const b=snapState();const r=fn();const a=snapState();toast(msg,()=>undoTo(b,a),label||'Undo');return r;}

/* ============================================================ ordering
   One manual order (sortIndex) drives Today, Minimal and Board. Dragging gives the moved task a
   value between its new neighbours, so only that task changes. */
function prioIdx(t){return PRIORITIES.indexOf(t.priority)}
function manualCmp(a,b){
  const x=a.task||a,y=b.task||b;
  return((x.sortIndex||0)-(y.sortIndex||0))||(prioIdx(x)-prioIdx(y))||String(x.createdAt||'').localeCompare(String(y.createdAt||''));
}
function maxSort(){return tasks.reduce((m,t)=>Math.max(m,t.sortIndex||0),0)}
function applyOrder(ids,movedId,pool){
  const T=new Map((pool||tasks).map(t=>[t.id,t]));
  ids=ids.filter(id=>T.has(id));
  const i=ids.indexOf(movedId);if(i<0)return;
  const m=T.get(movedId);
  const a=i>0?(T.get(ids[i-1]).sortIndex||0):null,b=i<ids.length-1?(T.get(ids[i+1]).sortIndex||0):null;
  if(a===null&&b===null)return;
  if(a===null){m.sortIndex=b-1;return;}
  if(b===null){m.sortIndex=a+1;return;}
  if(b-a>1e-7){m.sortIndex=(a+b)/2;return;}
  // no room between the neighbours, so lay the whole list out again from its smallest value
  const base=Math.min(...ids.map(id=>T.get(id).sortIndex||0));
  ids.forEach((id,k)=>{T.get(id).sortIndex=base+k;});
}
function applyClientOrder(visibleIds){
  const slots=[];CLIENTS.forEach((c,i)=>{if(visibleIds.includes(c.id))slots.push(i)});
  const vis=visibleIds.map(id=>CLIENTS.find(c=>c.id===id)).filter(Boolean);
  if(vis.length!==slots.length)return;
  const next=CLIENTS.slice();slots.forEach((s,k)=>next[s]=vis[k]);
  CLIENTS=next;saveCfg();
}

/* ============================================================ completing
   Completing sets a state, it never blindly toggles, so a double tap cannot undo itself. */
function isDoneInst(t,date){return t.rrule?isCompleted(t.id,date):t.status==='done'}
function setInstDone(t,date,done,opts){
  if(!t||isNote(t))return false;
  opts=opts||{};
  const today=todayStr();
  if(t.rrule){
    if(done){
      if(!date)date=today;
      if(isCompleted(t.id,date))return false;
      let target=date;
      if(opts.smart&&date<today){
        // finishing a late repeat counts once: for today if today is on its schedule, otherwise for the
        // latest missed day. The other missed days are skipped, so the task leaves Today straight away
        const occ=occurrences(t,date,today).filter(d=>!isCompleted(t.id,d));
        target=occ.includes(today)?today:(occ.filter(d=>d<=today).pop()||date);
        const now=new Date().toISOString();
        occ.forEach(d=>{if(d!==target&&d<today)exceptions.push({id:uid(),taskId:t.id,action:'skip',date:d,at:now});});
        saveExc();
      }
      const at=opts.at||(target<today&&!opts.smart?target+'T12:00:00':new Date().toISOString());
      completions.push({id:uid(),taskId:t.id,date:target,at});
      if(t.status==='doing')t.status='todo';
      if(t.resetSubs&&t.subtasks.some(s=>s.done)){t.subtasks.forEach(s=>s.done=false);logAct(t,'Checklist reset for the next time');}
      saveComp();saveTasks();
    }else{
      if(!isCompleted(t.id,date))return false;
      completions=completions.filter(c=>!(c.taskId===t.id&&c.date===date));saveComp();
    }
  }else{
    if(done===(t.status==='done'))return false;
    if(done){t.status='done';t.completedAt=new Date().toISOString();}
    else{t.status='todo';t.completedAt=null;t.archivedAt=null;}
    saveTasks();
  }
  play(done?'done':'untick');
  return true;
}
function toggleDone(t,date,smart){
  if(!t||isNote(t))return;
  const want=!isDoneInst(t,date);
  let changed=false;
  withUndo(want?'Completed · '+titleOf(t):'Marked as not done',()=>{changed=setInstDone(t,date,want,{smart});});
  if(changed&&want)afterComplete();
  render();
}

/* ============================================================ task ops */
function rescheduleInst(t,from,to,silent){
  if(!t||!to||from===to)return;
  const fn=()=>{
    if(t.rrule){
      const now=new Date().toISOString();
      const ex=exceptions.find(e=>e.taskId===t.id&&e.action==='move'&&e.newDate===from);
      if(ex){exceptions=exceptions.filter(e=>e!==ex);if(ex.date!==to)exceptions.push({id:uid(),taskId:t.id,action:'move',date:ex.date,newDate:to,at:now});}
      else exceptions.push({id:uid(),taskId:t.id,action:'move',date:from||todayStr(),newDate:to,at:now});
      saveExc();
    }else{t.due=to;logAct(t,'Rescheduled to '+fmtDM(to));saveTasks();}
  };
  if(silent)fn();else withUndo('Moved to '+fmtRel(to)+(t.rrule?' · this time only':''),fn);
  render();
}
function moveOverdueToToday(list){
  const today=todayStr();
  withUndo('Moved '+plural(list.length,'task')+' to today',()=>{
    const now=new Date().toISOString();
    list.forEach(o=>{const t=o.task;
      if(!t.rrule){t.due=today;logAct(t,'Moved to today');return;}
      const occ=occurrences(t,o.date,today).filter(d=>!isCompleted(t.id,d));
      const missed=occ.filter(d=>d<today);
      if(occ.includes(today))missed.forEach(d=>exceptions.push({id:uid(),taskId:t.id,action:'skip',date:d,at:now}));
      else{const last=missed.pop();missed.forEach(d=>exceptions.push({id:uid(),taskId:t.id,action:'skip',date:d,at:now}));
        if(last)exceptions.push({id:uid(),taskId:t.id,action:'move',date:last,newDate:today,at:now});}
    });
    saveTasks();saveExc();
  });
  render();
}
function deleteTask(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  withUndo('Deleted · '+titleOf(t),()=>{
    tasks=tasks.filter(x=>x.id!==id);
    completions=completions.filter(c=>c.taskId!==id);
    exceptions=exceptions.filter(e=>e.taskId!==id);
    saveTasks();saveComp();saveExc();
  });
  render();
}
function duplicateTask(t){
  const c=clone(t);
  c.id=uid();c.subtasks=(c.subtasks||[]).map(s=>({...s,id:uid()}));
  c.attachments=(c.attachments||[]).map(a=>({...a,id:uid()}));
  c.comments=[];c.activity=[];c.createdAt=new Date().toISOString();
  if(!c.rrule){c.status='todo';c.completedAt=null;}
  c.archivedAt=null;c.sortIndex=(t.sortIndex||0)+.5;
  const n=normTask(c);logAct(n,'Duplicated from “'+titleOf(t)+'”');
  withUndo('Duplicated',()=>{tasks.push(n);saveTasks();});
  render();
  return n;
}
function moveTaskToClient(t,cid,silent){
  if(!t||t.client===cid)return;

function setTaskStatus(t,status,date){
  if(!t)return;
  const wasDone=isDoneInst(t,date);
  if(status==='done'){if(!wasDone){setInstDone(t,date,true,{smart:true});afterComplete();}return;}
  if(wasDone)setInstDone(t,date,false);
  if(t.status!==status&&!(t.rrule&&status==='done')){t.status=status;if(status!=='done')t.completedAt=null;logAct(t,'Status changed to '+(status==='doing'?'in progress':'to do'));}
  saveTasks();
}
function copyTaskLink(t){

// a task turned into a checklist item keeps its full original record on the item, so turning it back loses nothing
function convertToSubtask(t,parentId){
  const parent=tasks.find(x=>x.id===parentId);if(!parent||parent.id===t.id)return;
  withUndo('Now a checklist item in '+titleOf(parent),()=>{
    const origin=clone(t);delete origin.subtasks;
    const item={id:uid(),text:titleOf(t)||t.title,done:t.rrule?false:t.status==='done',depth:0,origin};
    const kids=(t.subtasks||[]).map(s=>({...s,depth:Math.min(MAX_DEPTH,(s.depth||0)+1)}));
    parent.subtasks.push(item,...kids);
    logAct(parent,'Added “'+titleOf(t)+'” as a checklist item');
    tasks=tasks.filter(x=>x.id!==t.id);
    saveTasks();
  });
  render();
}
function subtaskToTask(parent,idx){
  const list=parent.subtasks;const end=blockEnd(list,idx);const item=list[idx];
  const d0=item.depth||0;
  const kids=list.slice(idx+1,end).map(s=>({...s,depth:Math.max(0,(s.depth||0)-d0-1)}));
  let nt;
  if(item.origin){
    nt=normTask({...item.origin,title:(isNote(item.origin)?'* ':'')+item.text,subtasks:kids,archivedAt:null});
    if(!nt.rrule){nt.status=item.done?'done':(nt.status==='done'?'todo':nt.status);nt.completedAt=item.done?(nt.completedAt||new Date().toISOString()):null;}
    if(tasks.some(x=>x.id===nt.id))nt.id=uid();
  }else{
    nt=normTask({id:uid(),title:item.text,client:parent.client,assignee:parent.assignee,priority:'None',
      due:parent.rrule?todayStr():(parent.due||todayStr()),subtasks:kids,status:item.done?'done':'todo',
      completedAt:item.done?new Date().toISOString():null,sortIndex:(parent.sortIndex||0)+.5});
  }
  withUndo('Now its own task',()=>{
    logAct(nt,'Made a task from a checklist item of “'+titleOf(parent)+'”');
    list.splice(idx,end-idx);
    tasks.push(nt);saveTasks();
  });
  return nt;
}
/* ---- labels across every task ---- */
function labelUse(l){return tasks.filter(t=>t.labels.includes(l)).length}
function renameLabel(from,to){
  to=String(to||'').trim().replace(/^[#@]/,'');if(!to||to===from)return;
  withUndo('Renamed label to '+to,()=>{
    tasks.forEach(t=>{if(t.labels.includes(from)){t.labels=[...new Set(t.labels.map(l=>l===from?to:l))];}});
    if(X.labelColors[from]){if(!X.labelColors[to])X.labelColors[to]=X.labelColors[from];delete X.labelColors[from];}
    if(UI.view.fLabel===from){UI.view.fLabel=to;saveUi();}
    saveTasks();saveX();
  });
}
function deleteLabel(l){
  const n=labelUse(l);
  withUndo('Removed label '+l+(n?' from '+plural(n,'task'):''),()=>{
    tasks.forEach(t=>{if(t.labels.includes(l))t.labels=t.labels.filter(x=>x!==l);});
    delete X.labelColors[l];
    if(UI.view.fLabel===l){UI.view.fLabel='all';saveUi();}
    saveTasks();saveX();
  });
}

function removeClient(id,moveTo){

const QA={client:null,date:'0',prio:'None',text:''};
function qaDate(){if(QA.date==='0')return todayStr();if(QA.date==='1')return addLocalDays(todayStr(),1);if(QA.date==='mon')return addLocalDays(mondayOf(todayStr()),7);return QA.date}
function qaClient(){return(QA.client&&CLIENTS.some(c=>c.id===QA.client))?QA.client:(UI.view.fClient!=='all'&&CLIENTS.some(c=>c.id===UI.view.fClient)?UI.view.fClient:CLIENTS[0]?.id||'personal')}
function parseQuick(text){
  let title=' '+text+' ',client=null,prio=null;
  title=title.replace(/\s#([^\s#]+)/g,(m,w)=>{const q=w.toLowerCase();const c=CLIENTS.find(c=>c.name.toLowerCase().replace(/\s+/g,'').startsWith(q))||CLIENTS.find(c=>c.name.toLowerCase().includes(q));if(c&&!client){client=c.id;return' ';}return m;});
  title=title.replace(/\s(?:p|!)([1-4])(?=\s)/gi,(m,n)=>{if(!prio){prio=PRIORITIES[Number(n)-1];return' ';}return m;});
  return{title:title.replace(/\s+/g,' ').trim(),client,prio};
}
function quickAdd(){
  const raw=QA.text.trim();if(!raw)return;
  const p=parseQuick(raw);if(!p.title)return;
  const nt=normTask({id:uid(),title:p.title,client:p.client||qaClient(),assignee:meName(),priority:p.prio||QA.prio||'None',due:qaDate(),
    sortIndex:maxSort()+1,createdAt:new Date().toISOString(),status:'todo'});
  withUndo('Added · '+titleOf(nt)+(nt.due!==todayStr()?' · '+fmtRel(nt.due):''),()=>{tasks.push(nt);saveTasks();});
  QA.text='';play('tick');markFresh(nt.id);render();
  const q=$('#qaIn');if(q)q.focus({preventScroll:true});
}

/* ============================================================ list builders */
function todaysTasks(){
  const out=[];
  tasks.forEach(t=>{if(t.archivedAt)return;const inst=openTodayInstance(t);if(inst)out.push({task:t,date:inst.date,floating:inst.floating})});
  return out.sort(manualCmp);
}
function doneTodayList(){
  const today=todayStr();const out=[];
  tasks.forEach(t=>{
    if(t.rrule&&isCompleted(t.id,today))out.push({task:t,date:today});
    else if(t.rrule){const c=completions.find(c=>c.taskId===t.id&&c.at&&localDay(c.at)===today);if(c)out.push({task:t,date:c.date});}
    else if(t.status==='done'&&!t.archivedAt&&t.completedAt&&localDay(t.completedAt)===today)out.push({task:t,date:t.due||today});
  });
  return out;
}
function visibleDoneToday(){
  const today=todayStr();
  const keys=X.cleared&&X.cleared.date===today?X.cleared.keys:[];
  return doneTodayList().filter(o=>!keys.includes(o.task.id));
}
function tasksOnDay(dateStr,withDeadlines){
  const out=[];
  tasks.forEach(t=>{
    if(t.archivedAt&&!(t.status==='done'))return;
    const occ=occurrences(t,dateStr,dateStr);
    if(occ.length){if(t.archivedAt)return;out.push({task:t,date:dateStr});}
    else if(withDeadlines&&t.deadline===dateStr&&t.status!=='done'&&!t.archivedAt)out.push({task:t,date:t.due||dateStr,dlOnly:true});
  });
  out.sort((a,b)=>{
    const da=isDoneInst(a.task,a.date)?1:0,db=isDoneInst(b.task,b.date)?1:0;if(da!==db)return da-db;
    const at=a.task.dueTime||'99',bt=b.task.dueTime||'99';if(at!==bt)return at.localeCompare(bt);
    return manualCmp(a,b);
  });
  return out;
}
function habitList(){return tasks.filter(t=>t.habit&&t.rrule&&!t.archivedAt).sort(manualCmp)}
function habitsOn(date){return habitList().filter(t=>occurrences(t,date,date).length)}
function matchesFilters(o){
  const v=UI.view,t=o.task;
  if(v.fClient!=='all'&&t.client!==v.fClient)return false;
  if(v.fPrio!=='all'&&t.priority!==v.fPrio)return false;
  if(v.fLabel!=='all'&&!t.labels.includes(v.fLabel))return false;
  return true;
}
function filterChips(){
  const v=UI.view,chips=[];
  if(v.fClient!=='all')chips.push([clientOf(v.fClient).name,'fClient']);
  if(v.fPrio!=='all')chips.push([PRIO_P[v.fPrio]||v.fPrio,'fPrio']);
  if(v.fLabel!=='all')chips.push(['#'+v.fLabel,'fLabel']);
  return chips;
}

function lateLabel(d){const n=-dayDiff(d);return n===1?'Yesterday':n+'d late'}
function metaHtml(t,date,ctx,done){
  let m='';
  if(!done&&t.priority!=='None'&&!isNote(t))m+='<span class="mt '+PRIO_CLS[t.priority]+'">'+svg('flagf')+PRIO_P[t.priority]+'</span>';
  const groupedByClient=ctx==='today'&&UI.view.group==='client';
  if(!groupedByClient){const c=clientOf(t.client);m+='<span class="mt"><i class="cdot" style="background:'+c.color+'"></i>'+esc(c.name)+'</span>';}
  const today=todayStr();
  if(date&&!done&&date<today&&ctx!=='done')m+='<span class="mt late">'+svg('clock')+lateLabel(date)+'</span>';
  else if(date&&!done&&ctx!=='today'&&ctx!=='day'&&ctx!=='done'){
    if(date===today)m+='<span class="mt today">'+svg('calendar')+'Today</span>';
    else if(!t.rrule||ctx==='search')m+='<span class="mt">'+svg('calendar')+esc(fmtRel(date))+'</span>';
  }
  if(t.rrule)m+='<span class="mt">'+svg('repeat')+esc(repeatLabel(t.rrule))+'</span>';
  if(t.dueTime)m+='<span class="mt">'+svg('clock')+fmtTime(t.dueTime)+(t.estimate?'–'+fmtTime(addMinsToTime(t.dueTime,t.estimate)):'')+'</span>';
  else if(t.estimate)m+='<span class="mt">'+svg('timer')+fmtMins(t.estimate)+'</span>';
  if(t.deadline&&!done){const d=dayDiff(t.deadline);const cls=d<0?' late':d<=1?' soon':'';
    m+='<span class="mt'+cls+'">'+svg('flag')+(d<0?'Deadline passed':d===0?'Deadline today':d===1?'Deadline tomorrow':'Deadline '+fmtDM(t.deadline))+'</span>';}
  if(t.startDate&&t.startDate>today)m+='<span class="mt hid">'+svg('eyeoff')+'Shows '+fmtDM(t.startDate)+'</span>';
  if(t.type==='post')m+='<span class="mt post '+t.postStatus+'" data-poststatus="'+t.id+'">'+t.postStatus+'</span>';
  if(t.status==='doing'&&!done)m+='<span class="mt today">'+svg('status')+'In progress</span>';
  if(t.remind&&t.remind!=='none')m+='<span class="mt">'+svg('bell')+'</span>';
  if(t.comments&&t.comments.length)m+='<span class="mt">'+svg('chat')+t.comments.length+'</span>';
  if(t.attachments&&t.attachments.length)m+='<span class="mt">'+svg('clip')+t.attachments.length+'</span>';
  if(t.subtasks.length){const s=ckStats(t.subtasks);
    m+='<button class="ckp'+(s.d===s.n?' full':'')+(EXPANDED.has(t.id)?' open':'')+'" data-ckexp="'+t.id+'" title="Show checklist">'+svg('chev')+'<span class="tr"><i style="width:'+s.pct+'%"></i></span>'+s.d+'/'+s.n+'</button>';}
  t.labels.forEach(l=>m+='<span class="lbl" style="--c:'+labelColor(l)+'"><i></i>'+esc(l)+'</span>');
  if(t.assignee&&t.assignee!==meName())m+='<span class="mt">'+svg('person')+esc(t.assignee)+'</span>';
  return m;
}
function inlineChecklist(t){

/* ============================================================ time blocks */
function hourH(){return isPhone()?54:62}
function fmtHour(m){const h=Math.floor(m/60)%24;return(((h+11)%12)+1)+(h<12?' am':' pm')}
function layoutLanes(evs){
  evs.sort((a,b)=>a.s-b.s||b.e-a.e);
  let cluster=[],cEnd=-1;
  const flush=()=>{const ends=[];cluster.forEach(ev=>{let i=ends.findIndex(x=>x<=ev.s);if(i<0){i=ends.length;ends.push(ev.e);}else ends[i]=ev.e;ev.lane=i;});cluster.forEach(ev=>ev.lanes=ends.length);cluster=[];};
  evs.forEach(ev=>{if(cluster.length&&ev.s>=cEnd){flush();cEnd=-1;}cluster.push(ev);cEnd=Math.max(cEnd,ev.e);});
  if(cluster.length)flush();
  return evs;
}
function timelineHtml(date,opts){
  opts=opts||{};
  let items=(opts.items||tasksOnDay(date,false)).filter(o=>!isNote(o.task));
  if(opts.filter)items=items.filter(matchesFilters);
  const timed=items.filter(o=>o.task.dueTime);
  const untimed=items.filter(o=>!o.task.dueTime&&!isDoneInst(o.task,o.date));
  let s=7*60,e=21*60;
  const isToday=date===todayStr();const nowM=new Date().getHours()*60+new Date().getMinutes();
  timed.forEach(o=>{const m=toMin(o.task.dueTime);s=Math.min(s,Math.floor(m/60)*60);e=Math.max(e,Math.min(1440,Math.ceil((m+(o.task.estimate||30))/60)*60));});
  if(isToday){s=Math.min(s,Math.floor(nowM/60)*60);e=Math.max(e,Math.min(1440,Math.ceil((nowM+30)/60)*60));}
  const ppm=hourH()/60;
  let h='<div class="tl-wrap">';
  if(opts.tray!==false)h+='<div class="tl-tray" data-tltray="'+date+'"><span class="tl-tl">No time yet'+(untimed.length?' · '+untimed.length:'')+'</span>'
    +(untimed.length?untimed.map(o=>'<span class="tl-chip" data-drag="tray" data-tid="'+o.task.id+'" data-date="'+o.date+'" style="--c:'+clientOf(o.task.client).color+'"><span class="grip" data-handle>'+svg('grip')+'</span><i></i><span>'+esc(titleOf(o.task))+'</span></span>').join('')
      :'<span class="hint" style="margin:0">Everything here has a time.</span>')+'</div>';
  h+='<div class="tl" data-tl="'+date+'" data-s="'+s+'" data-e="'+e+'" style="height:'+Math.round((e-s)*ppm)+'px">';
  for(let m=s;m<e;m+=60){h+='<div class="tl-h" style="top:'+Math.round((m-s)*ppm)+'px"><span>'+fmtHour(m)+'</span></div><div class="tl-h half" style="top:'+Math.round((m+30-s)*ppm)+'px"></div>';}
  if(isToday&&nowM>=s&&nowM<=e)h+='<div class="tl-now" style="top:'+Math.round((nowM-s)*ppm)+'px"></div>';
  const evs=layoutLanes(timed.map(o=>{const st=toMin(o.task.dueTime);return{o,s:st,e:st+Math.max(15,o.task.estimate||30)}}));
  evs.forEach(ev=>{const t=ev.o.task;const c=clientOf(t.client);const done=ev.o.done!==undefined?ev.o.done:isDoneInst(t,ev.o.date);
    const top=Math.round((ev.s-s)*ppm),ht=Math.max(22,Math.round((ev.e-ev.s)*ppm)-3);
    const narrow=ev.lanes>=(isPhone()?3:5);
    h+='<div class="tl-b'+(done?' done':'')+(ht<44&&!narrow?' short':'')+(narrow?' narrow':'')+'" data-tlb data-tid="'+t.id+'" data-date="'+ev.o.date+'" style="top:'+top+'px;height:'+ht+'px;left:calc(58px + (100% - 66px) * '+(ev.lane/ev.lanes)+');width:calc((100% - 66px) / '+ev.lanes+' - 4px);--c:'+c.color+'">'
      +(isNote(t)||narrow?'':tickHtml(t,ev.o.date,done))
      +'<div class="tl-bx"><div class="tl-bt">'+esc(titleOf(t))+'</div><div class="tl-bm">'+fmtTime(t.dueTime)+' – '+fmtTime(addMinsToTime(t.dueTime,t.estimate||30))+' · '+esc(c.name)+'</div></div>'
      +(done?'':'<span class="tl-rs" data-tlrs aria-hidden="true"></span>')+'</div>';});
  h+='</div><p class="tl-hint">Tap an empty slot to add a task there. Drag a block to move it, drag its bottom edge to change how long it takes.</p></div>';
  return h;
}

const BCOLS=[['todo','To do','#9AA59D'],['doing','In progress','#DD8530'],['done','Done','#2F9E6E']];

  const cols={todo:[],doing:[],done:[]};
  tasks.forEach(t=>{
    if(isNote(t)||t.habit||t.archivedAt)return;

    const inst=openInstanceUpTo(t,end);

      if(cs.length)cols.done.push({task:t,date:cs[0].date,done:true});}
  });
  Object.values(cols).forEach(l=>l.sort(manualCmp));
  return cols;

/* ============================================================ HABITS */
function habitStats(t){
  const today=todayStr();
  const occ=occurrences(t,addLocalDays(today,-370),today);
  let streak=0,i=occ.length-1;
  if(i>=0&&occ[i]===today&&!isCompleted(t.id,today))i--;
  for(;i>=0;i--){if(isCompleted(t.id,occ[i]))streak++;else break;}
  let best=0,run=0;occ.forEach(d=>{if(isCompleted(t.id,d)){run++;best=Math.max(best,run);}else if(d!==today)run=0;});
  const last30=occ.filter(d=>d>addLocalDays(today,-30)&&d<=today);
  const done30=last30.filter(d=>isCompleted(t.id,d)).length;
  return{streak,best,rate:last30.length?Math.round(done30/last30.length*100):0,n30:last30.length,d30:done30};

        h+=(sched||on)&&d<=today?'<button class="'+cls+'" data-hcell="'+t.id+'|'+d+'" aria-label="'+esc(titleOf(t))+' on '+esc(fmtShort(d))+(on?', done':'')+'"><i>'+svg('check')+'</i></button>':'<span class="'+cls+'"><i></i></span>';});

    }

      +'<div class="heat-leg">Less<i style="background:var(--fill-2)"></i><i style="background:#CDEBDD"></i><i style="background:#94D2B5"></i><i style="background:#4FAE86"></i><i style="background:var(--brand-2)"></i>More</div></div>';
    h+='<div class="sec-h"><h3>Your habits</h3><span class="cnt">'+hs.length+'</span><span class="sp"></span><span class="hint" style="margin:0">Drag to reorder</span></div><div class="hcards">'+hs.map(t=>{const st=habitStats(t);
      return'<div class="card hcard" data-open="'+t.id+'" data-drag="habit" data-tid="'+t.id+'"><span class="hi">'+svg('leaf')+'</span><div class="hx"><div class="t">'+esc(titleOf(t))+'</div><div class="m">'+esc(repeatLabel(t.rrule))+' · '+st.rate+'% in 30 days · best '+st.best+'</div></div>'
        +'<div class="hr"><b>'+st.streak+'</b><span>streak</span></div></div>';}).join('')+'</div>';

  if(sugg.length)h+='<div class="sec-h"><h3>Track a repeat as a habit</h3></div>'+sugg.map(t=>'<div class="sugg"><div class="t">'+esc(titleOf(t))+'<span>'+esc(repeatLabel(t.rrule))+' · '+esc(clientOf(t.client).name)+'</span></div><button class="chip sm" data-mkhabit="'+t.id+'">Track</button></div>').join('');

}

/* ============================================================ PROGRESS */
function barChart(data,goal){
  const W=640,H=190,pl=6,pr=6,pt=22,pb=24;const n=data.length;
  const max=Math.max(goal,...data.map(d=>d.v),1);
  const bw=(W-pl-pr)/n;const y=v=>pt+(H-pt-pb)*(1-v/max);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Completed tasks chart">';
  data.forEach((d,i)=>{
    const x=pl+i*bw+bw*.2,w=bw*.6,top=y(d.v),hgt=Math.max(0,H-pb-top);
    const fill=d.off?'#D9E3DB':d.v>=goal?'#1E7F66':'#9BCFB6';
    if(d.v>0)s+='<rect x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+hgt.toFixed(1)+'" rx="6" style="fill:'+fill+'"/>';
    else s+='<rect x="'+x.toFixed(1)+'" y="'+(H-pb-3)+'" width="'+w.toFixed(1)+'" height="3" rx="1.5" style="fill:rgba(19,40,30,.12)"/>';
    if(d.v>0)s+='<text class="val" x="'+(x+w/2).toFixed(1)+'" y="'+(top-6).toFixed(1)+'" text-anchor="middle">'+d.v+'</text>';
    s+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle"'+(d.cur?' style="fill:#1E7F66;font-weight:800"':'')+'>'+esc(d.l)+'</text>';
  });
  const gy=y(goal).toFixed(1);
  s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'" style="stroke:#166651" stroke-dasharray="4 5" stroke-width="1.3"/>';
  s+='<text x="'+(W-pr)+'" y="'+(Number(gy)-6)+'" text-anchor="end" style="fill:#166651;font-weight:700">goal '+goal+'</text>';
  return s+'</svg>';
}

function noteDirty(){
  const sv=$('#nSaved');if(sv){sv.classList.add('saving');sv.lastChild.textContent='Saving…';}
  clearTimeout(nTimer);nTimer=setTimeout(()=>commitNote(false),450);
}
/* only the fields you changed are written, so an edit made to the same note on another device survives */
function commitNote(final){
  clearTimeout(nTimer);
  if(!NDRAFT)return;
  const d=NDRAFT;
  let n=notebook.find(x=>x.id===d.id);
  if(!n){
    const has=d.title.trim()||d.body.trim();
    if(!has){if(final){NDRAFT=null;NORIG=null;}return;}
    // a brand new note, or one removed on another device while it was open here: your words bring it back
    n=normNote({...(NORIG||{}),...d});delete n.updatedAt;
    notebook.push(n);markFresh(n.id);delete X.tomb['n:'+n.id];
    const del=$('#nDelete');if(del)del.innerHTML=svg('trash')+'Delete';
    const cr=$('#sheet .crumb .n');if(cr)cr.textContent=cr.textContent.replace(' · New note','');
  }else{
    const base=NORIG||{};
    ['title','body','client','pinned'].forEach(k=>{if(JSON.stringify(d[k])!==JSON.stringify(base[k]))n[k]=d[k];});
  }
  saveNotes();
  d.updatedAt=n.updatedAt;
  const sv=$('#nSaved');if(sv){sv.classList.remove('saving');sv.lastChild.textContent='Saved';}
  if(final){NDRAFT=null;NORIG=null;render();}
  else if(UI.tab==='notes'&&!DRAG.on)render();
}
function bindNoteSheet(){
  const sh=$('#sheet');
  const ti=$('#nTitle');autosize(ti);
  ti.oninput=()=>{NDRAFT.title=ti.value.replace(/\n/g,' ');autosize(ti);noteDirty();};
  ti.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const b=$('#nBody');if(b){b.focus();b.setSelectionRange(0,0);}}};
  const bd=$('#nBody');
  const setBody=v=>{NDRAFT.body=v;noteDirty();};
  if(bd){
    autosize(bd);
    bd.oninput=()=>{autosize(bd);setBody(bd.value);};
    // return carries a list on, return on an empty item ends it
    bd.onkeydown=e=>{
      if(e.key!=='Enter'||e.shiftKey||e.isComposing)return;
      const v=bd.value,p=bd.selectionStart;const ls=v.lastIndexOf('\n',p-1)+1;const line=v.slice(ls,p);
      const m=line.match(/^(\s*)([-*+] \[[ xX]\] |[-*+] |(\d+)[.)] )/);if(!m)return;
      e.preventDefault();
      if(line.trim()===m[2].trim()){bd.value=v.slice(0,ls)+v.slice(p);bd.setSelectionRange(ls,ls);}
      else{let mk=m[2];if(m[3])mk=(Number(m[3])+1)+mk.slice(m[3].length);mk=mk.replace(/\[[xX]\]/,'[ ]');
        const ins='\n'+m[1]+mk;bd.value=v.slice(0,p)+ins+v.slice(bd.selectionEnd);bd.setSelectionRange(p+ins.length,p+ins.length);}
      autosize(bd);setBody(bd.value);
    };
  }
  $$('[data-nmdw]',sh).forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>mdWrap($('#nBody'),b.dataset.nmdw,setBody);});
  $$('[data-nmdl]',sh).forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>mdLine($('#nBody'),b.dataset.nmdl,setBody);});
  $$('[data-nmdlink]',sh).forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{const u=prompt('Link address');if(!u)return;const ta=$('#nBody');const s=ta.selectionStart,e2=ta.selectionEnd;const txt=ta.value.slice(s,e2)||'link';
    ta.value=ta.value.slice(0,s)+'['+txt+']('+(/^https?:|^mailto:/i.test(u)?u:'https://'+u)+')'+ta.value.slice(e2);ta.focus();mdDone(ta,setBody);};});
  $$('[data-nmode]',sh).forEach(b=>b.onclick=()=>{nPreview=b.dataset.nmode==='read';rerenderNote(nPreview?null:'#nBody');});
  $('#nPin').onclick=()=>{NDRAFT.pinned=!NDRAFT.pinned;play('tick');commitNote(false);rerenderNote();};
  $('#nClient').onclick=e=>{
    openMenu(e.currentTarget,[['__none','No client',svg('x'),!NDRAFT.client?'on':'']].concat(CLIENTS.map(c=>[c.id,c.name,dotIcon(c.color),c.id===NDRAFT.client?'on':''])),k=>{
      NDRAFT.client=k==='__none'?null:k;commitNote(false);rerenderNote();},{title:'Client'});
  };
  $('#nMore').onclick=e=>{
    const btn=e.currentTarget;
    openMenu(btn,[['task','Turn into a task','totask'],['dup','Duplicate','copy'],['copy','Copy the text','copy'],'-',['del','Delete note','trash','danger']],k=>{
      commitNote(false);const cur=notebook.find(x=>x.id===NDRAFT.id)||NDRAFT;
      if(k==='task'){const nt=noteToTask(cur);toast('Task created · the note is kept',()=>{commitNote(true);SHEET.beforeClose=null;closeSheet(true);setTimeout(()=>openTaskSheet(nt.id),320);},'Open task');}
      else if(k==='dup'){const c2=normNote({...clone(cur),id:uid(),title:(cur.title||'Untitled')+' copy',createdAt:new Date().toISOString(),sortIndex:(cur.sortIndex||0)+.5});delete c2.updatedAt;
        notebook.push(c2);saveNotes();markFresh(c2.id);render();toast('Duplicated');}
      else if(k==='copy'){const txt=(cur.title?cur.title+'\n\n':'')+(cur.body||'');try{navigator.clipboard.writeText(txt).then(()=>toast('Copied'),()=>prompt('Copy the note',txt));}catch(_){prompt('Copy the note',txt);}}
      else if(k==='del')$('#nDelete').click();
    });
  };
  $('#nDone').onclick=()=>closeSheet();
  $('#nSave').onclick=()=>closeSheet();
  $('#nDelete').onclick=()=>{
    const id=NDRAFT.id;const saved=notebook.some(x=>x.id===id);
    if(saved&&!confirm('Delete this note? You can undo straight after.'))return;
    if(!saved&&(NDRAFT.title.trim()||NDRAFT.body.trim())&&!confirm('Discard this note?'))return;
    clearTimeout(nTimer);NDRAFT=null;NORIG=null;SHEET.beforeClose=null;closeSheet(true);
    if(saved)deleteNote(id);
  };
}

const TABS=[['today','Today'],['upcoming','Upcoming'],['calendar','Calendar'],['board','Board'],['notes','Notes'],['habits','Habits'],['progress','Progress']];
const TAB_KEYS=TABS.map(t=>t[0]);
/* your own tab order, synced with the rest of your settings. Tabs added by a later version join at the end */
function orderedTabs(){
  const known=new Map(TABS.map(t=>[t[0],t]));const out=[];
  (X.tabOrder||[]).forEach(k=>{const t=known.get(k);if(t&&!out.includes(t))out.push(t)});
  TABS.forEach(t=>{if(!out.includes(t))out.push(t)});
  return out;
}
function tabLabel(k){return(TABS.find(t=>t[0]===k)||['',''])[1]}
function setTabOrder(ids){
  const prev=(X.tabOrder||[]).slice();
  const next=ids.filter(k=>TAB_KEYS.includes(k));orderedTabs().forEach(t=>{if(!next.includes(t[0]))next.push(t[0])});
  if(JSON.stringify(next)===JSON.stringify(orderedTabs().map(t=>t[0])))return render();
  X.tabOrder=next;saveX();render();
  toast('Tab order saved',()=>{X.tabOrder=prev;saveX();render();refreshOpenSheet();});
}

let pendingRender=false,RENDERED_TAB=null,BOOTING=true;
function render(opts){

  const ae=document.activeElement;const typing=ae&&['qaIn','nqIn','nsQ'].includes(ae.id)?ae.id:null;const caret=typing?ae.selectionStart:null;
  // a change from another device waits until you finish typing in a box on the page
  if(typing&&opts&&opts.remote){pendingRender=true;return;}
  pendingRender=false;

  try{
    if(UI.tab==='today')s.innerHTML=renderToday();
    else if(UI.tab==='upcoming')s.innerHTML=renderUpcoming();
    else if(UI.tab==='calendar')s.innerHTML=renderCalendar();
    else if(UI.tab==='board')s.innerHTML=renderBoard();

  }catch(err){

/* the new tab's sections rise in one after another, the way the board first opens */
let enterTimer=null;
function animateEnter(){
  const s=$('#screen');if(!s)return;
  s.classList.remove('enter');void s.offsetWidth;
  [...s.children].forEach((c,i)=>c.style.setProperty('--i',Math.min(i,10)));
  s.querySelectorAll('.rows,.bcards,.ngrid,.hcards').forEach(l=>[...l.children].forEach((c,j)=>c.style.setProperty('--j',Math.min(j,12))));
  s.classList.add('enter');countUp(s);
  clearTimeout(enterTimer);enterTimer=setTimeout(()=>s.classList.remove('enter'),1500);
}
function countUp(root){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  root.querySelectorAll('[data-count]').forEach(el=>{const to=Number(el.dataset.count)||0;if(to<2)return;const t0=performance.now(),d=1000;
    const step=t=>{const p=Math.min(1,(t-t0)/d);el.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString('en-GB');if(p<1&&el.isConnected)requestAnimationFrame(step);};
    el.textContent='0';requestAnimationFrame(step);});
}
/* the opening screen stays until the fonts are in, so nothing on the board jumps as it appears */
function hideBoot(){
  const b=$('#boot');if(!b){BOOTING=false;return;}
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  const minWait=new Promise(r=>setTimeout(r,Math.max(0,(reduce?250:1250)-performance.now())));
  const fonts=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1600))]):Promise.resolve();
  Promise.all([minWait,fonts]).then(()=>{
    BOOTING=false;try{renderShell();}catch(e){}
    b.classList.add('out');animateEnter();
    setTimeout(()=>b.remove(),700);
  });
}

let draft=null,draftOrig=null,descEditing=false,ckHideDone=false,pendingCm={file:null,voice:null},PROP='';
function newTaskDraft(preset){
  return{id:null,title:'',client:qaClient(),assignee:meName(),priority:'None',type:'task',
    postStatus:'draft',due:todayStr(),dueTime:null,deadline:null,startDate:null,repeatKey:'',custom:null,endMode:'never',until:null,count:null,
    rrule:null,estimate:null,labels:[],subtasks:[],attachments:[],remind:'none',remindAt:null,notes:'',focusOn:true,status:'todo',habit:false,
    comments:[],activity:[],resetSubs:false,rDirty:false,...(preset||{})};
}
function ruleToCustom(r){
  if(!r)return{interval:1,unit:'week',byday:[],monthMode:'date'};
  const unit={DAILY:'day',WEEKLY:'week',MONTHLY:'month',YEARLY:'year'}[r.freq]||'week';
  return{interval:r.interval||1,unit,byday:(r.byday||[]).slice(),monthMode:r.bysetpos?'weekday':'date'};
}
function taskToDraft(t){
  let repeatKey='';
  if(t.rrule){
    const r=t.rrule;const iv=r.interval||1;
    if(r.freq==='DAILY')repeatKey=iv===1?'daily':'custom';
    else if(r.freq==='WEEKLY'){
      const d=r.byday||[];
      if(iv===1&&d.length===5&&WEEKDAYS.every(x=>d.includes(x)))repeatKey='weekdays';
      else if(iv===2&&d.length===1)repeatKey='biweekly';
      else if(iv===1&&d.length===1)repeatKey='weekly';
      else repeatKey='custom';
    }
    else if(r.freq==='MONTHLY')repeatKey=iv===1?(r.bysetpos?'monthlyWeekday':'monthly'):'custom';
    else if(r.freq==='YEARLY')repeatKey=iv===1?'yearly':'custom';
  }
  const r=t.rrule||{};
  return{...clone(t),repeatKey,custom:ruleToCustom(t.rrule),endMode:r.until?'until':r.count?'count':'never',until:r.until||null,count:r.count||null,rDirty:false};
}
function draftRule(){
  let rule=null;
  if(draft.repeatKey==='custom'){
    const c=draft.custom||{interval:1,unit:'week',byday:[]};const iv=Math.max(1,Number(c.interval)||1);
    const anchor=parseYmd(draft.due||todayStr());
    if(c.unit==='day')rule={freq:'DAILY',interval:iv};
    else if(c.unit==='week')rule={freq:'WEEKLY',interval:iv,byday:c.byday&&c.byday.length?c.byday.slice():[DOW[anchor.getUTCDay()]]};
    else if(c.unit==='month')rule=c.monthMode==='weekday'?{freq:'MONTHLY',interval:iv,byday:[DOW[anchor.getUTCDay()]],bysetpos:isLastWeekday(anchor)?-1:nthWeekdayPos(anchor)}:{freq:'MONTHLY',interval:iv};
    else rule={freq:'YEARLY',interval:iv};
  }else if(draft.repeatKey)rule=ruleFromPreset(draft.repeatKey,draft.due||todayStr());
  if(rule){
    if(draft.endMode==='until'&&draft.until)rule.until=draft.until;
    if(draft.endMode==='count'&&draft.count>0)rule.count=Math.floor(draft.count);
  }
  return rule;
}
function effRule(){return(draft.rDirty||!draftOrig||draft.due!==draftOrig.due)?draftRule():(draftOrig.rrule?clone(draftOrig.rrule):null)}

function openTaskSheet(id,preset){
  const t=id?tasks.find(x=>x.id===id):null;
  if(id&&!t){toast('That task no longer exists');return;}
  closeMenu();
  draft=t?taskToDraft(t):newTaskDraft(preset);
  draftOrig=t?clone(t):null;descEditing=false;ckHideDone=false;pendingCm={file:null,voice:null};PROP='';
  openSheet(taskSheetHtml(),{kind:'task',tall:true});
  bindTaskSheet();
  SHEET.beforeClose=()=>{
    if(!draft)return;
    if(draft.id){commitDraft(true);return;}
    // a new task closed by tapping outside or swiping down is kept if it has a title
    if((draft.title||'').trim()){saveDraft(true);return;}
    if(draftHasContent()&&!confirm('Discard this new task? Its notes and checklist will be lost.'))return false;
    clearNewDraftCopy();
  };
  if(!id)setTimeout(()=>{const el=$('#dTitle');if(el)el.focus()},340);
}
const DUE_CHIPS=[['Today',0],['Tomorrow',1],['This weekend','sat'],['Next week','mon'],['In a week',7]];
function offToDate(off){
  if(off==='none')return null;
  const today=todayStr();
  if(off==='sat'){const d=parseYmd(today);const add=(6-d.getUTCDay()+7)%7;return addLocalDays(today,add||0);}
  if(off==='mon')return addLocalDays(mondayOf(today),7);
  return addLocalDays(today,Number(off));
}
function dateChips(attr,cur,withNone){
  return DUE_CHIPS.map(([lab,off])=>{const v=offToDate(off);return'<button class="chip sm'+(cur===v?' on':'')+'" data-'+attr+'="'+off+'">'+lab+'</button>'}).join('')
    +(withNone?'<button class="chip sm'+(!cur?' on':'')+'" data-'+attr+'="none">No date</button>':'');
}

function activityItems(){
  const t=draft;const out=[];
  if(t.createdAt)out.push({at:t.createdAt,what:'Created'});
  (t.activity||[]).forEach(a=>out.push(a));
  if(t.id){
    completions.filter(c=>c.taskId===t.id).forEach(c=>out.push({at:c.at||c.date+'T12:00:00',what:'Completed the '+fmtDM(c.date)+' occurrence',done:true}));
    if(!t.rrule&&t.completedAt)out.push({at:t.completedAt,what:'Completed',done:true});
    exceptions.filter(e=>e.taskId===t.id).forEach(e=>out.push({at:e.at||e.date+'T00:00:00',what:e.action==='move'?'Moved the '+fmtDM(e.date)+' occurrence to '+fmtDM(e.newDate):'Skipped the '+fmtDM(e.date)+' occurrence'}));
  }
  return out.sort((a,b)=>String(b.at).localeCompare(String(a.at)));
}

function logDiff(t,a,b){

  if((a.dueTime||null)!==(b.dueTime||null))logAct(t,b.dueTime?'Time set to '+fmtTime(b.dueTime):'Time removed');
  if((a.deadline||null)!==(b.deadline||null))logAct(t,b.deadline?'Deadline set to '+fmtDM(b.deadline):'Deadline removed');
  if(a.priority!==b.priority)logAct(t,'Priority changed to '+PRIO_P[b.priority]);
  if(a.client!==b.client)logAct(t,'Moved to '+clientOf(b.client).name);
  if((a.assignee||null)!==(b.assignee||null))logAct(t,b.assignee?'Assigned to '+b.assignee:'Unassigned');
  if(JSON.stringify(a.rrule||null)!==JSON.stringify(b.rrule||null))logAct(t,b.rrule?'Repeat set to '+repeatLabel(b.rrule):'Repeat removed');
  if((a.startDate||null)!==(b.startDate||null))logAct(t,b.startDate?'Hidden until '+fmtDM(b.startDate):'Hide until removed');

/* ---- checklist editing ---- */
function ckAt(i){return draft.subtasks[i]}
function ckInsertAfter(i,text,depth){
  const list=draft.subtasks;
  const at=i<0?list.length:blockEnd(list,i);
  const d=depth!==undefined?depth:(i>=0?(list[i].depth||0):0);
  list.splice(at,0,{id:uid(),text:text||'',done:false,depth:Math.min(MAX_DEPTH,d)});
  return at;
}
function ckIndent(i,dir){
  const list=draft.subtasks;if(!list[i])return;
  const end=blockEnd(list,i);const d=list[i].depth||0;
  if(dir>0){if(i===0)return;const prevD=list[i-1].depth||0;if(d+1>prevD+1)return;
    let deepest=0;for(let k=i;k<end;k++)deepest=Math.max(deepest,list[k].depth||0);if(deepest+1>MAX_DEPTH)return;}
  else if(d===0)return;
  for(let k=i;k<end;k++)list[k].depth=Math.max(0,(list[k].depth||0)+dir);
}
function ckMove(i,dir){
  const list=draft.subtasks;const end=blockEnd(list,i);const d=list[i].depth||0;const block=list.slice(i,end);
  if(dir<0){let j=i-1;while(j>=0&&(list[j].depth||0)>d)j--;if(j<0||(list[j].depth||0)<d)return i;
    list.splice(i,block.length);list.splice(j,0,...block);return j;}
  else{if(end>=list.length||(list[end].depth||0)<d)return i;const nEnd=blockEnd(list,end);
    list.splice(i,block.length);const ins=nEnd-block.length;list.splice(ins,0,...block);return ins;}
}
function ckTick(i){
  const list=draft.subtasks;const s=list[i];s.done=!s.done;
  // ticking a parent ticks its whole branch, like Todoist
  const end=blockEnd(list,i);for(let k=i+1;k<end;k++)list[k].done=s.done;
  const st=ckStats(list);
  if(s.done&&st.d===st.n&&st.n>1){play('list');confetti(.45);
    if(draft.id&&!draft.rrule&&draft.status!=='done')setTimeout(()=>toast('Checklist complete',()=>{completeFromSheet();},'Complete task'),200);}
  else play(s.done?'tick':'untick');

function openCkMenu(i,anchor){
  const s=ckAt(i);
  const items=[['indent','Indent','indent'],['outdent','Outdent','outdent'],['up','Move up','up'],['down','Move down','down'],['below','Add step below','plus'],'-'];
  if(draft.id)items.push(['task',s.origin?'Turn back into a task':'Make it a task','totask']);
  items.push(['del','Delete step'+(hasKids(draft.subtasks,i)?' and its sub-steps':''),'trash','danger']);

    if(a==='indent'){ckIndent(i,1);rerenderSheet();}
    else if(a==='outdent'){ckIndent(i,-1);rerenderSheet();}

function bindCkDrag(sh){
  sh.querySelectorAll('[data-ckgrip]').forEach(g=>{
    g.addEventListener('pointerdown',e=>{
      e.preventDefault();const from=Number(g.dataset.ckgrip);const row=g.closest('.ck');row.classList.add('dragging');

      const clear=()=>sh.querySelectorAll('.ck').forEach(r=>r.classList.remove('drop-before','drop-after'));
      const move=ev=>{const el=document.elementFromPoint(ev.clientX,ev.clientY);const over=el&&el.closest('.ck[data-ck]');clear();
        if(over&&over!==row){const r=over.getBoundingClientRect();after=ev.clientY>r.top+r.height/2;target=Number(over.dataset.ck);over.classList.add(after?'drop-after':'drop-before');}else target=null;};

let recorder=null,recChunks=[],recStart=0,recTick=null;
function stopRecording(discard){

async function toggleRecording(){
  if(recorder){stopRecording(false);return;}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Voice notes are not supported in this browser');return;}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}catch(e){toast('Microphone access was blocked');return;}
  recChunks=[];
  try{recorder=new MediaRecorder(stream,{audioBitsPerSecond:24000});}catch(e){recorder=new MediaRecorder(stream);}
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data)};
  recorder.onstop=()=>{
    stream.getTracks().forEach(t=>t.stop());clearInterval(recTick);
    const discard=recorder._discard;recorder=null;
    const r=$('#cmRec');if(r)r.innerHTML='';const mic=$('#cmMic');if(mic)mic.innerHTML=svg('mic');
    if(discard||!recChunks.length)return;
    const blob=new Blob(recChunks,{type:recChunks[0].type||'audio/webm'});

    const dur=Math.round((Date.now()-recStart)/1000);

    fr.readAsDataURL(blob);
  };

  const mic=$('#cmMic');if(mic)mic.innerHTML=svg('stop');
  recTick=setInterval(()=>{const s=Math.round((Date.now()-recStart)/1000);const r=$('#cmRec');if(r)r.innerHTML='<span class="rec"><i></i>'+s+'s</span>';if(s>=90)stopRecording(false);},250);

function completeFromSheet(){

  const inst=openTodayInstance(t);const date=inst?inst.date:(t.rrule?(nextDue(t,todayStr())||todayStr()):todayStr());
  SHEET.beforeClose=null;closeSheet(true);

}
function openTaskActions(anchor){
  const t=tasks.find(x=>x.id===draft.id);if(!t)return;
  const items=[['dup','Duplicate','copy'],['move','Move to client…','move'],['link','Copy link to task','link'],['sub','Make it a sub-task of…','tosub']];
  if(t.rrule&&t.subtasks.length)items.push(['reset','Complete and reset checklist','reset']);
  items.push('-',['del','Delete task','trash','danger']);
  openMenu(anchor,items,a=>{
    commitDraft(true);const task=tasks.find(x=>x.id===draft.id);if(!task)return;
    if(a==='dup'){SHEET.beforeClose=null;closeSheet(true);const n=duplicateTask(task);setTimeout(()=>openTaskSheet(n.id),340);}
    else if(a==='move')pickClientMenu(anchor,task.client,cid=>{draft.client=cid;commitDraft(true);rerenderSheet();toast('Moved to '+clientOf(cid).name);});
    else if(a==='link')copyTaskLink(task);
    else if(a==='sub'){SHEET.beforeClose=null;closeSheet(true);setTimeout(()=>pickParent(task),320);}
    else if(a==='reset'){const inst=openTodayInstance(task);const date=inst?inst.date:(nextDue(task,todayStr())||todayStr());
      withUndo('Completed · checklist reset for next time',()=>{
        if(!isCompleted(task.id,date)){completions.push({id:uid(),taskId:task.id,date,at:new Date().toISOString()});saveComp();play('done');}
        task.subtasks.forEach(s=>s.done=false);logAct(task,'Completed and reset the checklist');saveTasks();});
      SHEET.beforeClose=null;closeSheet(true);render();afterComplete();}
    else if(a==='del'){if(confirm('Delete this task? You can undo straight after.')){const id=task.id;SHEET.beforeClose=null;draft=null;closeSheet(true);deleteTask(id);}}

/* ============================================================ drag and drop
   Works the same with a mouse, a finger or a pencil. A grip handle starts a drag at once.
   Anywhere else on a row: a mouse drags after a small move, a finger after a short press,
   so normal scrolling on the phone still works. */
const DRAG={on:false,pressing:false};
const TLDRAG={on:false};
let suppressClickUntil=0;
document.addEventListener('click',e=>{if(Date.now()<suppressClickUntil){e.preventDefault();e.stopPropagation();}},true);
document.addEventListener('touchmove',e=>{if(DRAG.on||TLDRAG.on)e.preventDefault();},{passive:false});
document.addEventListener('contextmenu',e=>{if(DRAG.on||DRAG.pressing||TLDRAG.on)e.preventDefault();});

function pressToDrag(e,el,start){
  if(DRAG.on||TLDRAG.on||e.button>0)return;
  const onHandle=!!e.target.closest('[data-handle]');
  const ctl=e.target.closest('button,a,input,textarea,select,label,[data-nodrag]');
  if(!onHandle&&ctl&&ctl!==el)return;
  const sx=e.clientX,sy=e.clientY,touch=e.pointerType!=='mouse';
  if(onHandle){e.preventDefault();start(e);return;}
  let timer=null,last=e;
  const off=()=>{clearTimeout(timer);DRAG.pressing=false;el.classList.remove('pressing');
    window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',off);window.removeEventListener('pointercancel',off);window.removeEventListener('scroll',off,true);};
  const origin={x:sx,y:sy};
  const mv=ev=>{last=ev;const d=Math.hypot(ev.clientX-sx,ev.clientY-sy);if(touch){if(d>9)off();}else if(d>6){off();start(ev,origin);}};
  if(touch){DRAG.pressing=true;el.classList.add('pressing');window.addEventListener('scroll',off,true);
    timer=setTimeout(()=>{off();try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}start(last,origin);},380);}
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',off);window.addEventListener('pointercancel',off);
}
function flipMove(lists,mutate){
  const els=[];lists.forEach(l=>{if(l)[...l.children].forEach(c=>{if(!els.includes(c))els.push(c)})});
  const pre=new Map(els.map(x=>{const r=x.getBoundingClientRect();return[x,{t:r.top,l:r.left}]}));
  mutate();
  els.forEach(x=>{const r=x.getBoundingClientRect(),p=pre.get(x);const dy=p.t-r.top,dx=p.l-r.left;if(!dy&&!dx)return;
    x.style.transition='none';x.style.transform='translate('+dx+'px,'+dy+'px)';x.getBoundingClientRect();
    x.style.transition='transform .22s var(--ease)';x.style.transform='';});
}
function autoScroller(st,o,onTick){
  const loop=()=>{
    if(!st.live)return;
    let vy=0,vx=0;const edge=78;
    const top=o.scroller?o.scroller.getBoundingClientRect().top:$('#top').getBoundingClientRect().bottom;
    const bottom=o.scroller?o.scroller.getBoundingClientRect().bottom:window.innerHeight-(isWide()?0:86);
    if(o.noV){}
    else if(st.y<top+edge)vy=-Math.min(18,Math.ceil((top+edge-st.y)/edge*18));
    else if(st.y>bottom-edge)vy=Math.min(18,Math.ceil((st.y-(bottom-edge))/edge*18));
    if(vy){if(o.scroller)o.scroller.scrollTop+=vy;else window.scrollBy(0,vy);}
    if(o.hscroll){const hr=o.hscroll.getBoundingClientRect();if(st.x<hr.left+46)vx=-14;else if(st.x>hr.right-46)vx=14;if(vx)o.hscroll.scrollLeft+=vx;}
    if(vy||vx)onTick();
    st.raf=requestAnimationFrame(loop);
  };
  st.raf=requestAnimationFrame(loop);
}
/* o: itemSel, listSel, dates (drop on [data-drop-date]), onDrop(toList,item,fromList), onDate(date), scroller, hscroll, prepare,
   axis ('y' by default, 'x' for a row of tabs or chips, 'grid' for cards that wrap), noV (no vertical autoscroll) */
function startSort(e,item,o){
  const r0=item.getBoundingClientRect();
  const offY=e.clientY-r0.top,offX=e.clientX-r0.left;
  if(o.prepare)o.prepare();
  const r=item.getBoundingClientRect();
  const ghost=item.cloneNode(true);
  ghost.classList.add('drag-ghost');ghost.classList.remove('pressing');ghost.removeAttribute('data-drag');
  ghost.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));
  const gx=e.clientX-Math.min(offX,r.width-12),gy=e.clientY-Math.min(offY,r.height-8);
  Object.assign(ghost.style,{position:'fixed',left:gx+'px',top:gy+'px',width:r.width+'px',height:r.height+'px',margin:'0',zIndex:'95',pointerEvents:'none',boxSizing:'border-box'});
  document.body.appendChild(ghost);
  item.classList.add('drag-src');item.classList.remove('pressing');
  const home={parent:item.parentElement,next:item.nextElementSibling};
  DRAG.on=true;document.body.classList.add('is-dragging');
  const st={x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,dateEl:null,raf:0,moved:false,live:true,over:null};
  const setOver=l=>{if(l===st.over)return;if(st.over)st.over.classList.remove('sort-over');st.over=l;if(l)l.classList.add('sort-over');};
  const place=()=>{
    ghost.style.transform='translate3d('+(st.x-st.x0)+'px,'+(st.y-st.y0)+'px,0)'+(o.tilt?' rotate(1.5deg)':'');
    const under=document.elementFromPoint(st.x,st.y);
    const dEl=o.dates&&under?under.closest('[data-drop-date]'):null;
    if(dEl!==st.dateEl){if(st.dateEl)st.dateEl.classList.remove('drop-on');st.dateEl=dEl;if(dEl)dEl.classList.add('drop-on');}
    if(dEl||!o.listSel){setOver(null);return;}
    const list=under?under.closest(o.listSel):null;
    if(!list)return;
    if(o.axis==='grid'||o.listSel==='.rows[data-day]'||o.listSel==='.bcards')setOver(list);
    const kids=[...list.children].filter(k=>k!==item&&k.matches(o.itemSel));
    const lr=list.getBoundingClientRect();
    let before=null;
    // positions come from layout (offsetTop/Left), not from the boxes mid-animation, so the order never flickers
    if(o.axis==='x'){for(const k of kids){const mid=lr.left+k.offsetLeft-list.scrollLeft+k.offsetWidth/2;if(st.x<mid){before=k;break;}}}
    else if(o.axis==='grid'){for(const k of kids){const top=lr.top+k.offsetTop-list.scrollTop,left=lr.left+k.offsetLeft;
      if(st.y<top||(st.y<=top+k.offsetHeight&&st.x<left+k.offsetWidth/2)){before=k;break;}}}
    else for(const k of kids){const mid=lr.top+k.offsetTop-list.scrollTop+k.offsetHeight/2;if(st.y<mid){before=k;break;}}
    const ref=before||list.querySelector(':scope > [data-sort-end]')||null;
    if(item.parentElement===list&&(item.nextElementSibling===ref||(!ref&&item===list.lastElementChild)))return;
    flipMove([list,item.parentElement],()=>list.insertBefore(item,ref));
    st.moved=true;
  };
  const mv=ev=>{st.x=ev.clientX;st.y=ev.clientY;place();};
  const key=ev=>{if(ev.key==='Escape')end(true)};
  const end=cancelled=>{
    st.live=false;cancelAnimationFrame(st.raf);
    window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cancel);document.removeEventListener('keydown',key);
    ghost.remove();item.classList.remove('drag-src');document.body.classList.remove('is-dragging');
    if(st.dateEl)st.dateEl.classList.remove('drop-on');setOver(null);
    if(o.cleanup)o.cleanup();
    DRAG.on=false;suppressClickUntil=Date.now()+400;
    const restore=()=>{if(home.parent&&home.parent.isConnected)home.parent.insertBefore(item,home.next&&home.next.parentElement===home.parent?home.next:null);};
    if(cancelled){restore();render();return;}
    if(st.dateEl){const d=st.dateEl.dataset.dropDate;restore();if(o.onDate)o.onDate(d);else render();return;}
    if(st.moved&&o.onDrop)o.onDrop(item.parentElement,item,home.parent);else render();
  };
  const up=()=>end(false),cancel=()=>end(true);
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',cancel);document.addEventListener('keydown',key);
  place();if(!o.noScroll)autoScroller(st,o,place);
}

/* ---- what each kind of drag does when dropped ---- */
function dropRow(to,item){
  const id=item.dataset.tid;const t=tasks.find(x=>x.id===id);if(!t){render();return;}
  const ids=[...to.querySelectorAll(':scope > .row')].map(r=>r.dataset.tid);
  const nc=to.dataset.client;
  if(nc&&nc!==t.client){withUndo('Moved to '+clientOf(nc).name,()=>{t.client=nc;logAct(t,'Moved to '+clientOf(nc).name);applyOrder(ids,id);saveTasks();});}
  else{applyOrder(ids,id);saveTasks();}
  render();
}
function dropCard(to,item,from){
  const id=item.dataset.tid;const t=tasks.find(x=>x.id===id);if(!t){render();return;}
  const status=to.dataset.status,was=from.dataset.status;const date=item.dataset.date||todayStr();
  const ids=[...to.querySelectorAll(':scope > .bcard')].map(r=>r.dataset.tid);
  if(status!==was){
    withUndo(status==='done'?'Completed · '+titleOf(t):status==='doing'?'In progress · '+titleOf(t):'Back to to do · '+titleOf(t),()=>{setTaskStatus(t,status,date);applyOrder(ids,id);saveTasks();});
  }else{applyOrder(ids,id);saveTasks();}
  render();
}
function startKindDrag(e,el){
  const kind=el.dataset.drag;
  if(kind==='row'){
    const sk=el.parentElement.dataset.sort;
    startSort(e,el,{itemSel:'.row',listSel:sk==='client'?'.rows[data-sort="client"]':'.rows[data-sort="'+sk+'"]',onDrop:dropRow});
  }else if(kind==='group'){
    const groups=el.parentElement;
    startSort(e,el,{itemSel:'.cgroup',listSel:'.groups',prepare:()=>groups.classList.add('collapsing'),cleanup:()=>groups.classList.remove('collapsing'),
      onDrop:()=>{const ids=$$('.groups > .cgroup').map(g=>g.dataset.gid).filter(Boolean);withUndo('Client order saved',()=>applyClientOrder(ids));render();}});
  }else if(kind==='card'){
    startSort(e,el,{itemSel:'.bcard',listSel:'.bcards',hscroll:$('.board'),tilt:true,onDrop:dropCard});
  }else if(kind==='dayrow'){
    startSort(e,el,{itemSel:'.row',listSel:'.rows[data-day]',dates:true,onDrop:dropDayRow,
      onDate:d=>{const t=tasks.find(x=>x.id===el.dataset.tid);rescheduleInst(t,el.dataset.date,d);}});
  }else if(kind==='tray'){
    startTrayDrag(e,el);
  }else if(kind==='bchip'){
    const strip=el.parentElement;
    startSort(e,el,{itemSel:'[data-drag="bchip"]',listSel:'.cscroll',axis:'x',hscroll:strip,noV:true,
      onDrop:()=>{const ids=$$('.cscroll > [data-drag="bchip"]').map(b=>b.dataset.cid);withUndo('Client order saved',()=>applyClientOrder(ids));render();}});
  }else if(kind==='habit'){
    startSort(e,el,{itemSel:'.hcard',listSel:'.hcards',axis:'grid',
      onDrop:(to,item)=>{const ids=[...to.querySelectorAll(':scope > .hcard')].map(c=>c.dataset.tid);applyOrder(ids,item.dataset.tid);saveTasks();render();}});
  }else if(kind==='note'){
    startSort(e,el,{itemSel:'.ncard',listSel:'.ngrid',axis:'grid',onDrop:dropNote});
  }
}
/* a task dragged within a day keeps its new place, dragged into another day it moves there */
function dropDayRow(to,item){

/* ============================================================ time block interactions */
const snap15=m=>Math.round(m/15)*15;
function tlGeom(tl){return{s:Number(tl.dataset.s),e:Number(tl.dataset.e),ppm:hourH()/60}}
function tlTip(tl){const tip=document.createElement('div');tip.className='tl-tip';tl.appendChild(tip);return tip}
function tlDragShell(onMove,onEnd){
  TLDRAG.on=true;document.body.classList.add('is-dragging');
  const st={x:0,y:0,live:true,raf:0,sy0:window.scrollY};
  const mv=ev=>{st.x=ev.clientX;st.y=ev.clientY;onMove(st);};
  const fin=cancel=>{st.live=false;cancelAnimationFrame(st.raf);window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cn);
    document.body.classList.remove('is-dragging');TLDRAG.on=false;suppressClickUntil=Date.now()+400;onEnd(cancel);};
  const up=()=>fin(false),cn=()=>fin(true);
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',cn);
  return st;
}
function startBlockMove(e,b,origin){
  const tl=b.closest('.tl');const g=tlGeom(tl);const t=tasks.find(x=>x.id===b.dataset.tid);if(!t||!t.dueTime)return;
  const dur=Math.max(15,t.estimate||30),s0=toMin(t.dueTime),y0=origin?origin.y:e.clientY,top0=b.offsetTop;
  b.classList.add('moving');const tip=tlTip(tl);const tray=tl.parentElement.querySelector('.tl-tray');
  let cur=s0,overTray=false;
  const st=tlDragShell(s=>{
    const dy=(s.y+window.scrollY)-(y0+s.sy0);
    const under=document.elementFromPoint(s.x,s.y);overTray=!!(under&&tray&&under.closest('.tl-tray')===tray);
    if(tray)tray.classList.toggle('drop-zone',overTray);
    cur=Math.max(g.s,Math.min(g.e-15,snap15(s0+dy/g.ppm)));
    b.style.top=(top0+(cur-s0)*g.ppm)+'px';
    tip.style.top=Math.max(0,top0+(cur-s0)*g.ppm-26)+'px';tip.textContent=overTray?'Remove the time':fmtTime(fromMin(cur))+' – '+fmtTime(fromMin(cur+dur));
  },cancel=>{
    tip.remove();b.classList.remove('moving');if(tray)tray.classList.remove('drop-zone');
    if(cancel){render();return;}
    if(overTray)withUndo('Time removed · '+titleOf(t),()=>{t.dueTime=null;saveTasks();});
    else if(cur!==s0)withUndo('Moved to '+fmtTime(fromMin(cur))+(t.rrule?' · every repeat':''),()=>{t.dueTime=fromMin(cur);logAct(t,'Time set to '+fmtTime(t.dueTime));saveTasks();});
    render();
  });
  st.x=e.clientX;st.y=e.clientY;
  autoScroller(st,{},()=>{});
}
function startBlockResize(e,b){
  e.preventDefault();e.stopPropagation();
  const tl=b.closest('.tl');const g=tlGeom(tl);const t=tasks.find(x=>x.id===b.dataset.tid);if(!t)return;
  const d0=Math.max(15,t.estimate||30),y0=e.clientY;let dur=d0;
  b.classList.add('moving');const tip=tlTip(tl);
  const st=tlDragShell(s=>{
    const dy=(s.y+window.scrollY)-(y0+s.sy0);
    dur=Math.max(15,Math.min(12*60,snap15(d0+dy/g.ppm)));
    b.style.height=Math.max(22,dur*g.ppm-3)+'px';
    tip.style.top=(b.offsetTop+b.offsetHeight+4)+'px';tip.textContent=fmtMins(dur)+' · until '+fmtTime(addMinsToTime(t.dueTime,dur));
  },cancel=>{
    tip.remove();b.classList.remove('moving');
    if(!cancel&&dur!==(t.estimate||30))withUndo('Takes '+fmtMins(dur)+' now',()=>{t.estimate=dur;saveTasks();});
    render();
  });
  st.x=e.clientX;st.y=e.clientY;
  autoScroller(st,{},()=>{});
}
function startTrayDrag(e,chip){
  const t=tasks.find(x=>x.id===chip.dataset.tid);if(!t)return;
  const date=chip.dataset.date;const wrap=chip.closest('.tl-wrap');const tl=wrap&&wrap.querySelector('.tl');if(!tl)return;
  const g=tlGeom(tl);const dur=Math.max(15,t.estimate||30);
  const r=chip.getBoundingClientRect();const ghost=chip.cloneNode(true);ghost.classList.add('drag-ghost');
  Object.assign(ghost.style,{position:'fixed',left:r.left+'px',top:r.top+'px',zIndex:'95',pointerEvents:'none',margin:'0'});
  document.body.appendChild(ghost);chip.classList.add('drag-src');
  const prev=document.createElement('div');prev.className='tl-prev';prev.hidden=true;tl.appendChild(prev);
  const x0=e.clientX,y0=e.clientY;let at=null;
  const st=tlDragShell(s=>{
    ghost.style.transform='translate3d('+(s.x-x0)+'px,'+(s.y-y0)+'px,0)';
    const tr=tl.getBoundingClientRect();
    if(s.x>=tr.left&&s.x<=tr.right&&s.y>=tr.top&&s.y<=tr.bottom){
      at=Math.max(g.s,Math.min(g.e-15,snap15(g.s+(s.y-tr.top)/g.ppm-dur/2)));
      prev.hidden=false;prev.style.top=((at-g.s)*g.ppm)+'px';prev.style.height=Math.max(22,dur*g.ppm-3)+'px';prev.textContent=fmtTime(fromMin(at))+' – '+fmtTime(fromMin(at+dur));
    }else{at=null;prev.hidden=true;}
  },cancel=>{
    ghost.remove();prev.remove();chip.classList.remove('drag-src');
    if(!cancel&&at!==null)withUndo('Scheduled for '+fmtTime(fromMin(at))+' · '+titleOf(t),()=>{
      t.dueTime=fromMin(at);if(!t.estimate)t.estimate=30;
      if(!t.rrule&&(!t.due||t.due<date))t.due=date;
      logAct(t,'Time set to '+fmtTime(t.dueTime));saveTasks();});
    render();
  });
  st.x=e.clientX;st.y=e.clientY;
  autoScroller(st,{},()=>{});
}

/* ---- one place that routes every press on the screen to the right drag ---- */
$('#screen').addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  const rs=e.target.closest('[data-tlrs]');
  if(rs){const b=rs.closest('[data-tlb]');if(b)startBlockResize(e,b);return;}
  const blk=e.target.closest('[data-tlb]');
  if(blk){if(!blk.classList.contains('done'))pressToDrag(e,blk,(ev,o)=>startBlockMove(ev,blk,o));return;}
  const el=e.target.closest('[data-drag]');
  if(el){pressToDrag(e,el,ev=>startKindDrag(ev,el));return;}
  const mg=e.target.closest('[data-mgrid]');
  if(mg&&e.pointerType!=='mouse'){
    // swipe the month left or right on a touch screen
    const x0=e.clientX,y0=e.clientY,t0=Date.now();
    const up=ev=>{window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cn);
      const dx=ev.clientX-x0,dy=ev.clientY-y0;
      if(Math.abs(dx)>55&&Math.abs(dy)<45&&Date.now()-t0<700){suppressClickUntil=Date.now()+350;shiftMonth(dx<0?1:-1);}};
    const cn=()=>{window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cn);};
    window.addEventListener('pointerup',up);window.addEventListener('pointercancel',cn);
  }
});
$('#sideClients').addEventListener('pointerdown',e=>{

function shiftMonth(v){
  const[y,m]=UI.calMonth.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+v,1,12));
  UI.calMonth=d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1);

/* ============================================================ menus (popover on wide screens, action sheet on a phone) */
let MENU=null,menuClosedAt=0,menuClosedAnchor=null;
function openMenu(anchor,items,onPick,opts){
  if(anchor&&anchor===menuClosedAnchor&&Date.now()-menuClosedAt<350)return;
  closeMenu();
  const m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');
  let h=opts&&opts.title?'<div class="mh">'+esc(opts.title)+'</div>':'';
  items.forEach(it=>{
    if(it==='-'){h+='<hr>';return;}
    const[k,label,icon,cls,extra]=it;
    h+='<button class="mi'+(cls?' '+cls:'')+'" data-mk="'+esc(k)+'" role="menuitem">'+(icon?(icon.charAt(0)==='<'?icon:svg(icon)):'')+'<span>'+esc(label)+'</span>'+(extra?'<span class="r">'+esc(extra)+'</span>':'')+'</button>';
  });
  m.innerHTML=h;document.body.appendChild(m);
  let scrim=null;
  if(isPhone()){scrim=document.createElement('div');scrim.className='menu-scrim';document.body.appendChild(scrim);scrim.onclick=closeMenu;}
  else if(anchor){
    const r=anchor.getBoundingClientRect();const w=m.offsetWidth,hh=m.offsetHeight;
    const left=Math.min(innerWidth-w-10,Math.max(10,r.right-w));

  }
  m.onclick=e=>{const b=e.target.closest('[data-mk]');if(!b)return;const k=b.dataset.mk;closeMenu();onPick(k);};
  MENU={m,scrim,anchor};
}
function closeMenu(){if(MENU){menuClosedAt=Date.now();menuClosedAnchor=MENU.anchor;MENU.m.remove();if(MENU.scrim)MENU.scrim.remove();MENU=null;if(pendingRender)setTimeout(()=>{if(pendingRender&&!MENU)render()},30);}}
document.addEventListener('pointerdown',e=>{if(MENU&&!e.target.closest('.menu')&&!e.target.closest('.menu-scrim'))closeMenu();},true);

function rowMenu(anchor,t,date){
  if(!t)return;
  const today=todayStr();const done=isDoneInst(t,date);
  const items=[['open','Open details','edit']];
  if(!done){
    if(date!==today)items.push(['today','Do it today','today']);
    items.push(['tomorrow','Tomorrow','defer'],['nextweek','Next week','upcoming'],['pick','Pick a date…','calendar'],'-',['focus','Focus on it','focus']);
  }
  items.push(['client','Move to client…','move',null,clientOf(t.client).name],['prio','Priority…','flag',null,PRIO_P[t.priority]],['dup','Duplicate','copy'],'-',['del','Delete','trash','danger']);
  openMenu(anchor,items,k=>{
    if(k==='open')openTaskSheet(t.id);
    else if(k==='today')rescheduleInst(t,date,today);
    else if(k==='tomorrow')rescheduleInst(t,date,addLocalDays(today,1));
    else if(k==='nextweek')rescheduleInst(t,date,addLocalDays(mondayOf(today),7));
    else if(k==='pick')datePickSheet(t,date);

    else if(k==='prio')prioMenu(anchor,t.priority,p=>{withUndo('Priority set to '+PRIO_P[p],()=>{t.priority=p;logAct(t,'Priority changed to '+PRIO_P[p]);saveTasks();});render();});

  });
}

/* ============================================================ search */
function openSearch(){
  openSheet('<div class="sh-head"><span class="st">Search</span><button class="sh-x" data-close>Close</button></div><div class="sh-body last">'
    +'<input class="inp" type="search" id="sQ" placeholder="Search tasks, descriptions, clients, labels and notes" enterkeyhint="search" autocomplete="off"><div class="sres" id="sRes"></div></div>',{kind:'search',tall:true});
  const q=$('#sQ');
  const draw=()=>{
    const v=(q.value||'').trim().toLowerCase();const out=$('#sRes');if(!out)return;
    if(!v){out.innerHTML='<p class="hint" style="margin:8px 4px">Finds every task, including done and hidden ones, and every note.</p>';return;}
    const words=v.split(/\s+/);
    const hits=tasks.filter(t=>{const hay=(t.title+' '+(t.notes||'')+' '+clientOf(t.client).name+' '+t.labels.join(' ')+' '+t.subtasks.map(s=>s.text).join(' ')).toLowerCase();return words.every(w=>hay.includes(w));});
    hits.sort((a,b)=>{const da=a.rrule?0:a.status==='done'?1:0,db=b.rrule?0:b.status==='done'?1:0;return da-db||String(a.due||'9').localeCompare(String(b.due||'9'));});
    const nh=notebook.filter(n=>noteMatches(n,v)).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,30);
    out.innerHTML=(hits.length?'<p class="hint" style="margin:4px 4px 8px">'+plural(hits.length,'task')+(hits.length>80?', showing 80':'')+'</p><div class="rows">'+hits.slice(0,80).map(t=>{
      const inst=t.rrule?{date:nextDue(t,todayStr())||t.due}:{date:t.due};return rowHtml({task:t,date:inst.date,done:t.rrule?false:t.status==='done'},'search');}).join('')+'</div>':'')
      +(nh.length?'<p class="hint" style="margin:16px 4px 8px">'+plural(nh.length,'note')+'</p>'+nh.map(n=>'<div class="row-link" data-snote="'+n.id+'"><span>'+esc(n.title.trim()||'Untitled')

      +(!hits.length&&!nh.length?'<div class="empty" style="padding:30px 10px"><b>No matches</b><p>Try fewer words.</p></div>':'');
