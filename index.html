<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task Board</title>
<link rel="icon" href="/favicon.svg?v=6" type="image/svg+xml">
<link rel="icon" href="/favicon-192.png?v=6" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/favicon-180.png?v=6">
<meta name="theme-color" content="#EDF1EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tasks">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500..800&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
/* ================================================================ tokens */
:root{
  --bg:#EDF1EC;
  --card:rgba(255,255,255,.80);
  --card-solid:#FFFFFF;
  --card-brd:rgba(255,255,255,.75);
  --glass:rgba(247,250,246,.72);
  --fill:#F2F5F1;
  --fill-2:#E8EDE7;
  --line:rgba(19,40,30,.08);
  --line-2:rgba(19,40,30,.15);
  --ink:#13211A;
  --ink-2:#4E5D54;
  --ink-3:#86938A;
  --brand:#1E7F66;
  --brand-2:#166651;
  --brand-ink:#0F4D3C;
  --brand-soft:rgba(30,127,102,.10);
  --brand-soft-2:rgba(30,127,102,.18);
  --mint:#D3ECDF;
  --mint-2:#EAF6EF;
  --deep:#163A30;
  --deep-2:#1F5547;
  --red:#D14B4B;
  --orange:#DD8530;
  --blue:#3E7BD6;
  --amber:#C99A2E;
  --green:#2F9E6E;
  --p1:#D14B4B;--p2:#DD8530;--p3:#3E7BD6;--p4:#9AA59D;
  --r-xl:26px;--r-lg:20px;--r-md:16px;--r-sm:11px;
  --sh-1:0 1px 2px rgba(19,33,26,.05);
  --sh-2:0 1px 2px rgba(19,33,26,.04),0 12px 32px -14px rgba(19,33,26,.16);
  --sh-3:0 28px 70px -18px rgba(19,33,26,.38),0 2px 6px rgba(19,33,26,.08);
  --blur:saturate(180%) blur(22px);
  --ease:cubic-bezier(.22,.8,.24,1);
  --spring:cubic-bezier(.3,1.35,.6,1);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --font:-apple-system,BlinkMacSystemFont,'Inter',system-ui,'Segoe UI',Roboto,sans-serif;
  --display:'Urbanist',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side-w:256px;
  --tab-space:96px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  min-height:100vh;min-height:100dvh;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60% 45% at 8% -5%,#D5EEE1 0%,rgba(213,238,225,0) 70%),
    radial-gradient(45% 40% at 100% 0%,#E2F0DD 0%,rgba(226,240,221,0) 70%),
    radial-gradient(70% 50% at 50% 110%,#DFEBE4 0%,rgba(223,235,228,0) 70%),
    var(--bg)}
/* NEVER REMOVE. The hidden attribute must always win, or sheets and menus render open on load and cannot be closed */
[hidden]{display:none !important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
input,textarea,select{font:inherit;color:var(--ink);font-size:16px;-webkit-appearance:none;appearance:none;border-radius:0}
input[type=checkbox]{-webkit-appearance:auto;appearance:auto}
::placeholder{color:var(--ink-3)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
::selection{background:var(--brand-soft-2)}
svg{flex:0 0 auto}
.disp{font-family:var(--display)}
.num{font-variant-numeric:tabular-nums}
.sp{flex:1}

/* ================================================================ shell */
.app{min-height:100vh;min-height:100dvh}
.side{display:none}
.main{min-width:0}
@media(min-width:1024px){
  .app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;
    padding:22px 12px 18px 18px;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 8px}
.brand-mark{width:36px;height:36px;border-radius:11px;display:block;flex:0 0 auto;box-shadow:0 8px 18px -8px rgba(20,97,76,.75);transition:transform .5s var(--spring)}
.brand-mark svg{width:36px;height:36px;display:block}
.brand:hover .brand-mark{transform:rotate(-6deg) scale(1.06)}
.brand-name{font-family:var(--display);font-weight:700;font-size:23px;letter-spacing:-.015em}
.navcard{background:var(--card);border:1px solid var(--card-brd);border-radius:var(--r-lg);padding:7px;box-shadow:var(--sh-1)}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:13px;font-size:15px;font-weight:500;color:var(--ink-2);transition:background .15s,color .15s}
.nav-i svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-i:hover{background:var(--fill)}
.nav-i.on{color:var(--brand-2);background:var(--brand-soft);font-weight:650}
.nav-i .n{margin-left:auto;font-size:12px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav-i.on .n{color:var(--brand)}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 0 12px;font-size:13.5px;font-weight:650;color:var(--ink-2)}
.side-h button{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3)}
.side-h button:hover{background:var(--fill);color:var(--ink)}
.side-h svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.clist{position:relative}
.crow{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;border-radius:12px;font-size:14.5px;font-weight:500;color:var(--ink-2);cursor:pointer;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background .15s}
.crow:hover{background:var(--fill)}
.crow.on{background:var(--brand-soft);color:var(--brand-2);font-weight:650}
.crow .cdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.crow .cn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cc{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.crow .grip{opacity:0}
.crow:hover .grip{opacity:1}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:8px}

.top{position:sticky;top:0;z-index:40;padding:calc(var(--safe-t) + 10px) calc(16px + var(--safe-r)) 10px calc(16px + var(--safe-l));
  background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid transparent;transition:border-color .2s,background .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:46px}
.ttl{min-width:0;flex:1}
.ttl .eb{font-size:11.5px;font-weight:650;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;line-height:1.2}
.ttl h1{font-family:var(--display);font-weight:750;font-size:27px;margin:1px 0 0;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbox{flex:1;max-width:440px;display:none;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:14px;background:var(--card-solid);
  border:1px solid var(--line);color:var(--ink-3);font-size:14.5px;box-shadow:var(--sh-1);transition:border-color .15s}
.searchbox:hover{border-color:var(--line-2)}
.searchbox svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.searchbox kbd{margin-left:auto;font-family:var(--font);font-size:11.5px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px}
.top-act{display:flex;align-items:center;gap:8px;flex:0 0 auto}
@media(max-width:1023px){.top-in>.sp{display:none}}
.ibtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--card-solid);border:1px solid var(--line);
  color:var(--ink-2);box-shadow:var(--sh-1);transition:background .15s,transform .12s;position:relative}
.ibtn:hover{background:var(--fill)}
.ibtn:active{transform:scale(.95)}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ibtn.sm{width:36px;height:36px;border-radius:11px}
.ibtn.sm svg{width:18px;height:18px}
.ibtn.flat{background:transparent;border-color:transparent;box-shadow:none}
.ibtn.flat:hover{background:var(--fill)}
.btn-new{height:44px;padding:0 18px 0 15px;border-radius:14px;background:var(--brand);color:#fff;font-weight:650;font-size:15px;display:none;gap:7px;align-items:center;
  box-shadow:0 10px 22px -10px rgba(30,127,102,.85),inset 0 1px 0 rgba(255,255,255,.18);transition:background .15s,transform .12s}
.btn-new:hover{background:var(--brand-2)}
.btn-new:active{transform:scale(.97)}
.btn-new svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.kpill{height:44px;padding:0 13px;border-radius:14px;display:none;align-items:center;gap:7px;background:var(--card-solid);border:1px solid var(--line);
  font-size:13.5px;font-weight:650;box-shadow:var(--sh-1);white-space:nowrap}
.kpill svg{width:16px;height:16px;fill:var(--amber)}
.kpill .kl{font-size:11.5px;font-weight:600;color:var(--ink-3)}
.kpill.bump{animation:tickpop .5s var(--spring)}
.syncdot{position:absolute;right:9px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px #fff}
.syncdot.syncing{background:var(--amber);animation:blink 1s infinite}
.syncdot.offline,.syncdot.error,.syncdot.paused{background:var(--red)}
.syncdot.idle{background:var(--ink-3)}
@media(min-width:1024px){
  .top{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;padding-top:20px}
  .top.scrolled{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
  .top-in{padding:0 12px}
  .ttl{display:none}
  .searchbox{display:flex}
  .btn-new,.kpill{display:inline-flex}
  .top .only-phone{display:none}
}
@media(min-width:700px) and (max-width:1023px){
  .kpill{display:inline-flex}
}
.page{max-width:1180px;margin:0 auto;padding:6px calc(16px + var(--safe-r)) calc(var(--tab-space) + var(--safe-b) + 40px) calc(16px + var(--safe-l))}
@media(min-width:700px){.page{padding-left:24px;padding-right:24px}}
@media(min-width:1024px){.page{padding:6px 28px 70px 28px}}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 10px);z-index:45;display:flex;gap:2px;padding:6px;border-radius:26px;
  background:rgba(255,255,255,.80);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,.85);
  box-shadow:0 18px 40px -16px rgba(19,33,26,.38),0 1px 3px rgba(19,33,26,.08);width:min(540px,calc(100vw - 20px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:20px;font-size:10.5px;font-weight:650;color:var(--ink-3);
  transition:background .2s,color .2s;min-width:0}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--brand-2);background:var(--brand-soft)}
.tab span{white-space:nowrap}
.fab{position:fixed;right:calc(16px + var(--safe-r));bottom:calc(var(--safe-b) + 92px);z-index:44;width:58px;height:58px;border-radius:20px;background:var(--brand);color:#fff;
  display:grid;place-items:center;box-shadow:0 16px 30px -12px rgba(21,102,80,.9),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .15s var(--spring)}
.fab:active{transform:scale(.92)}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
@media(min-width:1024px){.tabbar,.fab{display:none}}
body.kb-open .tabbar,body.kb-open .fab{display:none}

/* ================================================================ common */
.card{background:var(--card);border:1px solid var(--card-brd);border-radius:var(--r-lg);box-shadow:var(--sh-2)}
.solid{background:var(--card-solid)}
.sec-h{display:flex;align-items:center;gap:8px;margin:26px 4px 10px}
.sec-h h3{font-family:var(--display);font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.sec-h .cnt{font-size:13px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sec-h .lnk{font-size:13.5px;font-weight:650;color:var(--brand)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;display:inline-block}
.seg{display:inline-flex;background:rgba(19,40,30,.06);border-radius:13px;padding:3px;gap:2px;flex:0 0 auto}
.seg button{padding:7px 14px;border-radius:10px;font-size:13.5px;font-weight:650;color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s,box-shadow .15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(19,33,26,.14)}
.seg.full{display:flex;width:100%}
.seg.full button{flex:1;text-align:center}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:7px 13px;border-radius:999px;background:var(--card-solid);border:1px solid var(--line-2);
  font-size:14px;font-weight:550;color:var(--ink);transition:background .15s,border-color .15s,color .15s,transform .1s;white-space:nowrap}
.chip:hover{background:var(--fill)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.sm{min-height:32px;padding:5px 11px;font-size:13px}
.chip .cd{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.chip.on .cd{box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip.dash{border-style:dashed;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:15px;font-size:15.5px;font-weight:650;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 10px 22px -12px rgba(30,127,102,.9)}
.btn.primary:hover{background:var(--brand-2)}
.btn.ghost{background:var(--card-solid);border:1px solid var(--line-2);color:var(--ink)}
.btn.ghost:hover{background:var(--fill)}
.btn.danger{color:var(--red);background:transparent}
.btn.danger:hover{background:rgba(209,75,75,.08)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lnkbtn{color:var(--brand);font-weight:650;font-size:14px;display:inline-flex;align-items:center;gap:6px;padding:6px 2px}
.lnkbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.inp{width:100%;background:var(--card-solid);border:1px solid var(--line-2);border-radius:13px;padding:11px 13px;font-size:16px;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
textarea.inp{resize:vertical;line-height:1.45}
.field{margin-bottom:18px}
.field>label,.flabel{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);margin:0 2px 8px;letter-spacing:.01em}
.hint{font-size:12.5px;color:var(--ink-3);margin:6px 2px 0;line-height:1.4}
.switch{width:51px;height:31px;border-radius:999px;background:rgba(19,40,30,.16);position:relative;transition:background .2s;flex:0 0 auto}
.switch.on{background:var(--brand)}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(19,33,26,.25);transition:left .22s var(--spring)}
.switch.on i{left:22px}
.row-link{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card-solid);border:1px solid var(--line);border-radius:15px;
  padding:13px 15px;margin-bottom:8px;font-size:15px;font-weight:550;cursor:pointer;transition:background .15s}
.row-link:hover{background:var(--fill)}
.row-link .chev{color:var(--ink-3);display:flex}
.row-link .chev svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none}
.row-link .sub{display:block;font-size:12.5px;font-weight:450;color:var(--ink-3);margin-top:1px}
.empty{text-align:center;padding:44px 24px;color:var(--ink-2)}
.empty b{display:block;font-family:var(--display);font-size:21px;font-weight:700;color:var(--ink);margin-bottom:6px}
.empty p{margin:0 auto;font-size:14.5px;max-width:300px}
.quiet{font-size:14px;color:var(--ink-3);padding:14px 16px;background:rgba(255,255,255,.55);border:1px dashed var(--line-2);border-radius:var(--r-md);text-align:center}
.grip{width:30px;height:34px;display:grid;place-items:center;color:var(--ink-3);cursor:grab;touch-action:none;flex:0 0 auto;border-radius:9px}
.grip:hover{background:var(--fill);color:var(--ink-2)}
.grip svg{width:16px;height:16px}
@keyframes tickpop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes blink{50%{opacity:.3}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ================================================================ task rows */
.rows{background:var(--card-solid);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-1);position:relative;overflow:hidden}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 6px 12px 14px;position:relative;background:var(--card-solid);cursor:pointer;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background .15s,transform .15s}
.row+.row::before{content:"";position:absolute;left:50px;right:0;top:0;height:1px;background:var(--line)}
@media(hover:hover){.row:hover{background:#FAFBF9}}
.row.pressing{background:var(--fill);transform:scale(.99)}
.row.done .rt{color:var(--ink-3);text-decoration:line-through;text-decoration-color:rgba(134,147,138,.6)}
.row.leaving{animation:rowout .32s var(--ease) forwards}
@keyframes rowout{to{opacity:0;transform:translateX(18px)}}
.tick{flex:0 0 auto;width:24px;height:24px;border-radius:50%;margin-top:0;border:2px solid var(--p4);background:transparent;display:grid;place-items:center;
  transition:border-color .15s,background .15s,transform .12s;position:relative}
.tick::after{content:"";position:absolute;inset:-10px}
.tick svg{width:13px;height:13px;stroke:#fff;stroke-width:3.4;fill:none;opacity:0;transition:opacity .12s;stroke-linecap:round;stroke-linejoin:round}
.tick:active{transform:scale(.86)}
.tick.p1{border-color:var(--p1);background:rgba(209,75,75,.07)}
.tick.p2{border-color:var(--p2);background:rgba(221,133,48,.07)}
.tick.p3{border-color:var(--p3);background:rgba(62,123,214,.07)}
@media(hover:hover){.tick:hover svg{opacity:.5;stroke:var(--ink-3)}.tick.p1:hover svg{stroke:var(--p1)}.tick.p2:hover svg{stroke:var(--p2)}.tick.p3:hover svg{stroke:var(--p3)}}
.tick.on{background:var(--brand);border-color:var(--brand)}
.tick.on.p1{background:var(--p1);border-color:var(--p1)}.tick.on.p2{background:var(--p2);border-color:var(--p2)}.tick.on.p3{background:var(--p3);border-color:var(--p3)}
.tick.on svg,.tick.on:hover svg{opacity:1;stroke:#fff}
.tick.pop{animation:tickpop .32s var(--spring)}
.notemark{flex:0 0 auto;width:24px;height:24px;display:grid;place-items:center;color:var(--ink-3)}
.notemark svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.row.note .rt{font-weight:650;color:var(--ink-2);font-size:14px;letter-spacing:.01em}
.rb{flex:1 1 auto;min-width:0;padding-top:1px}
.rt{font-size:15.5px;font-weight:500;line-height:1.32;color:var(--ink);word-break:break-word}
.rd{font-size:13px;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm{display:flex;flex-wrap:wrap;align-items:center;gap:5px 11px;margin-top:5px;font-size:12.5px;color:var(--ink-3)}
.rm:empty{display:none}
.mt{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-weight:500}
.mt svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mt .cdot{width:7px;height:7px;border-radius:50%}
.mt.late{color:var(--red);font-weight:650}
.mt.today{color:var(--brand);font-weight:650}
.mt.soon{color:var(--orange);font-weight:650}
.mt.hid{color:var(--ink-3)}
.mt.p1{color:var(--p1);font-weight:700}.mt.p2{color:var(--p2);font-weight:700}.mt.p3{color:var(--p3);font-weight:700}
.mt.p1 svg,.mt.p2 svg,.mt.p3 svg{fill:currentColor;stroke:none}
.mt.post{padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:650;text-transform:capitalize;background:var(--fill)}
.mt.post.scheduled{color:var(--amber);background:rgba(201,154,46,.13)}
.mt.post.posted{color:var(--green);background:rgba(47,158,110,.13)}
.lbl{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 7px;border-radius:999px;background:var(--fill);color:var(--ink-2);font-size:11.5px;font-weight:550;white-space:nowrap}
.lbl i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.ckp{display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 6px;border-radius:999px;background:var(--fill);font-size:11.5px;font-weight:650;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ckp .tr{width:34px;height:4px;border-radius:3px;background:rgba(19,40,30,.1);overflow:hidden;display:block}
.ckp .tr i{display:block;height:100%;background:var(--brand);border-radius:3px}
.ckp.full .tr i{background:var(--green)}
.ckp svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.6;transition:transform .2s}
.ckp.open svg{transform:rotate(90deg)}
.ra{flex:0 0 auto;display:flex;align-items:center;gap:0;margin:-5px 0 -5px}
.rmore{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3)}
.rmore:hover{background:var(--fill);color:var(--ink)}
.rmore svg{width:18px;height:18px}
@media(hover:hover) and (pointer:fine){
  .row .ra .rmore,.row .ra .grip{opacity:0;transition:opacity .15s}
  .row:hover .ra .rmore,.row:hover .ra .grip{opacity:1}
}
.row.min{padding-top:11px;padding-bottom:11px}
.row.min .rt{font-size:15.5px}
.row.min .mindot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-top:8px}
.row.min .late{color:var(--red);font-size:12px;font-weight:650;flex:0 0 auto;margin-top:2px}
.rck{margin:8px 0 2px;padding-top:6px;border-top:1px dashed var(--line-2)}
.rck .ck{min-height:30px}

/* drag */
body.is-dragging{cursor:grabbing;-webkit-user-select:none;user-select:none}
body.is-dragging *{cursor:grabbing !important}
.drag-ghost{box-shadow:var(--sh-3) !important;border-radius:16px !important;opacity:.97;transition:none !important;will-change:transform}
.drag-ghost.row,.drag-ghost.cgroup{background:#fff}
.drag-src{opacity:.32}
.drag-src.row,.drag-src.bcard,.drag-src.crow{background:var(--mint-2) !important}
.drop-on{background:var(--brand) !important;color:#fff !important;box-shadow:0 0 0 3px var(--brand-soft-2) !important}
.drop-on *{color:#fff !important}
.drop-zone{outline:2px dashed var(--brand);outline-offset:-3px}

/* ================================================================ today */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);min-height:188px;padding:22px 22px 20px;margin-top:6px;
  color:var(--hero-ink);box-shadow:var(--sh-2);isolation:isolate;
  --sky1:#C9EDDD;--sky2:#F2FBF6;--sun:#FFFFFF;--h1:#B4DCC6;--h2:#86C2A2;--h3:#5FA383;--t1:#1E5A46;--t2:#8DCB8B;--trunk:#8B6B4C;--bird:#24453A;--hero-ink:#13211A;--hero-sub:#3E5248}
.hero.sky-day{--sky1:#CBEBF0;--sky2:#F3FAF8;--sun:#FFF7DD}
.hero.sky-eve{--sky1:#183F39;--sky2:#3B6E61;--sun:#F4E6BC;--h1:#2F5E51;--h2:#244C42;--h3:#1A3A32;--t1:#0E2A22;--t2:#3F7A5C;--trunk:#3A2E22;--bird:#DCEDE4;--hero-ink:#F3FAF5;--hero-sub:rgba(243,250,245,.78)}
.hero-art{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero-txt{position:relative;max-width:420px}
.hero-eb{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--hero-sub)}
.hero h2{font-family:var(--display);font-weight:750;font-size:30px;line-height:1.08;letter-spacing:-.02em;margin:6px 0 6px}
.hero-sub{margin:0;font-size:15px;color:var(--hero-sub)}
.hero-sub b{color:var(--hero-ink);font-weight:750}
.hero-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.hchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:650;
  background:rgba(255,255,255,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#13211A;border:1px solid rgba(255,255,255,.7)}
.hchip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hchip svg.f{fill:var(--amber);stroke:none}
.hchip.fire svg{fill:#E0702F;stroke:none}
.hprog{margin-top:14px;max-width:280px}
.hprog .bar{height:6px;border-radius:4px;background:rgba(255,255,255,.55);overflow:hidden}
.hprog .bar i{display:block;height:100%;border-radius:4px;background:var(--brand);transition:width .5s var(--ease)}
.sky-eve .hprog .bar i{background:#9BE0BF}
.hprog .lab{font-size:12px;font-weight:650;color:var(--hero-sub);margin-top:6px}
.upnext{position:absolute;right:20px;top:20px;width:290px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:18px;padding:14px 16px;box-shadow:0 16px 40px -18px rgba(19,33,26,.45);color:var(--ink);display:none}
.upnext h4{margin:0 0 8px;font-size:14px;font-weight:700}
.un-i{display:flex;gap:10px;padding:6px 0;cursor:pointer}
.un-i+.un-i{border-top:1px solid var(--line)}
.un-i .bar{width:3px;border-radius:3px;background:var(--c);flex:0 0 auto}
.un-i .t{font-size:13.5px;font-weight:550;line-height:1.3}
.un-i .m{font-size:12px;color:var(--ink-3);margin-top:2px}
@media(min-width:760px){.upnext{display:block}.hero{min-height:212px;padding:28px}.hero h2{font-size:34px}}
@media(max-width:420px){.hero h2{font-size:27px}}

.qa{margin-top:14px;padding:6px 6px 8px;border-radius:var(--r-lg)}
.qa-row{display:flex;align-items:center;gap:8px;padding:2px 2px 2px 10px}
.qa-row .plus{width:24px;height:24px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--ink-3);flex:0 0 auto}
.qa-row .plus svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.qa-row input{flex:1;min-width:0;border:0;background:transparent;padding:11px 2px;font-size:16px}
.qa-go{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;background:var(--brand);flex:0 0 auto;transition:opacity .15s,transform .1s}
.qa-go:disabled{opacity:.3;cursor:default}
.qa-go:active{transform:scale(.94)}
.qa-go svg{width:19px;height:19px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.qa-chips{display:flex;gap:6px;overflow-x:auto;padding:4px 4px 0;scrollbar-width:none}
.qa-chips::-webkit-scrollbar{display:none}
.qchip{position:relative;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--card-solid);font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.qchip:hover{background:var(--fill)}
.qchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.qchip svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qchip .cd{width:8px;height:8px;border-radius:50%}
.qchip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px}
.qa-hint{font-size:11.5px;color:var(--ink-3);margin:6px 10px 0}
.toolbar{display:flex;align-items:center;gap:10px;margin:22px 2px 0;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:12px;background:var(--card-solid);border:1px solid var(--line);
  font-size:13.5px;font-weight:650;color:var(--ink-2);box-shadow:var(--sh-1)}
.tool:hover{background:var(--fill)}
.tool svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.tool .badge{min-width:18px;height:18px;border-radius:9px;background:var(--brand);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.filts{display:flex;gap:6px;flex-wrap:wrap;margin:12px 2px 0}
.fchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 11px;border-radius:999px;background:var(--brand-soft);color:var(--brand-2);font-size:13px;font-weight:650}
.fchip button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:15px;line-height:1}
.fchip button:hover{background:var(--brand-soft-2)}
.notice{display:flex;align-items:center;gap:10px;margin-top:14px;padding:11px 12px 11px 14px;border-radius:15px;background:rgba(209,75,75,.08);color:#9E3434;font-size:14px;font-weight:600}
.notice svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;flex:0 0 auto}
.notice button{margin-left:auto;height:32px;padding:0 12px;border-radius:10px;background:#fff;color:#9E3434;font-size:13px;font-weight:700;box-shadow:var(--sh-1);white-space:nowrap}
.hstrip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -2px;scrollbar-width:none}
.hstrip::-webkit-scrollbar{display:none}
.hpill{flex:0 0 auto;display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 15px 0 8px;border-radius:999px;background:var(--card-solid);
  border:1px solid var(--line);box-shadow:var(--sh-1);font-size:14px;font-weight:600;transition:background .2s,color .2s}
.hpill .hb{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;transition:all .2s}
.hpill .hb svg{width:14px;height:14px;stroke:#fff;stroke-width:3.4;fill:none;opacity:0;stroke-linecap:round;stroke-linejoin:round}
.hpill.on{background:var(--mint-2);color:var(--brand-2);border-color:transparent}
.hpill.on .hb{background:var(--brand);border-color:var(--brand)}
.hpill.on .hb svg{opacity:1}
.hpill .hs{font-size:12px;color:var(--ink-3);font-weight:650}
.groups{position:relative}
.cgroup{margin-top:20px}
.cg-h{display:flex;align-items:center;gap:8px;margin:0 2px 9px 0;min-height:34px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cg-h .grip{width:26px;margin-left:-4px}
.cg-h .cdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.cg-h .cgn{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cg-h .cgc{font-size:13px;font-weight:650;color:var(--ink-3)}
.cg-h .fold{margin-left:auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3)}
.cg-h .fold:hover{background:rgba(255,255,255,.7)}
.cg-h .fold svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;transition:transform .2s}
.cgroup.closed .fold svg{transform:rotate(-90deg)}
.cgroup.closed .rows{display:none}
.donebar{display:flex;align-items:center;gap:10px;margin:26px 2px 10px}
.donebar .dt{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:650;color:var(--ink-2);padding:6px 4px}
.donebar .dt svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;transition:transform .2s}
.donebar .dt.open svg.chev{transform:rotate(90deg)}
.donebar .dt .n{min-width:22px;height:22px;border-radius:11px;background:var(--fill-2);font-size:12px;display:grid;place-items:center;padding:0 6px}
.zero{text-align:center;padding:36px 20px 30px}
.zero svg.art{width:150px;height:auto;display:block;margin:0 auto 14px}
.zero b{display:block;font-family:var(--display);font-size:24px;font-weight:750;margin-bottom:4px}
.zero .tag{font-size:11.5px;letter-spacing:.14em;color:var(--brand);font-weight:700;text-transform:uppercase}
.zero p{margin:8px auto 0;font-size:14.5px;color:var(--ink-2);max-width:320px}

/* ================================================================ timeline (time blocks) */
.tl-wrap{margin-top:14px}
.tl-tray{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;align-items:center;min-height:52px;padding:8px 10px;border-radius:var(--r-md);background:rgba(255,255,255,.6);
  border:1px dashed var(--line-2);margin-bottom:12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tl-tray::-webkit-scrollbar{display:none}
.tl-tray .tl-tl{flex:0 0 auto;white-space:nowrap}
.tl-tray .tl-chip{flex:0 0 auto;max-width:240px}
.tl-tray .tl-tl{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;margin-right:4px}
.tl-chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px 0 10px;border-radius:11px;background:#fff;border:1px solid var(--line);
  box-shadow:var(--sh-1);font-size:13.5px;font-weight:550;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;max-width:100%}
.tl-chip i{width:4px;height:18px;border-radius:3px;background:var(--c)}
.tl-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-chip .grip{width:20px;height:24px;margin-left:-4px}
.tl{position:relative;background:var(--card-solid);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-1);overflow:hidden;cursor:copy}
.tl-h{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line)}
.tl-h:first-child{border-top-color:transparent}
.tl-h span{position:absolute;left:10px;top:-8px;font-size:11px;font-weight:600;color:var(--ink-3);background:var(--card-solid);padding-right:6px;font-variant-numeric:tabular-nums}
.tl-h.half{border-top-style:dashed;border-top-color:rgba(19,40,30,.05)}
.tl-now{position:absolute;left:52px;right:0;height:2px;background:var(--red);z-index:3;pointer-events:none}
.tl-now::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.tl-b{position:absolute;z-index:2;border-radius:11px;background:color-mix(in srgb,var(--c) 14%,#fff);border-left:4px solid var(--c);padding:5px 8px 5px 8px;
  overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(19,33,26,.06);display:flex;gap:7px;align-items:flex-start;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:box-shadow .15s}
.tl-b:hover{box-shadow:0 4px 14px -6px rgba(19,33,26,.25)}
.tl-b.done{opacity:.55}
.tl-b.done .tl-bt{text-decoration:line-through}
.tl-b .tick{width:18px;height:18px;border-width:2px;margin-top:1px}
.tl-b .tick svg{width:10px;height:10px}
.tl-b .tl-bx{min-width:0;flex:1}
.tl-bt{font-size:13.5px;font-weight:600;line-height:1.25;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-bm{font-size:11.5px;color:var(--ink-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tl-b.short{padding-top:2px;padding-bottom:2px;align-items:center}
.tl-b.short .tl-bm{display:none}
.tl-b.narrow{padding:4px 5px 4px 6px;border-left-width:3px}
.tl-b.narrow .tl-bt{white-space:normal;font-size:11.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-word}
.tl-b.narrow .tl-bm{display:none}
.tl-rs{position:absolute;left:0;right:0;bottom:0;height:12px;cursor:ns-resize;touch-action:none}
.tl-rs::after{content:"";position:absolute;left:50%;bottom:3px;width:26px;height:4px;margin-left:-13px;border-radius:3px;background:rgba(19,33,26,.22);opacity:0;transition:opacity .15s}
.tl-b:hover .tl-rs::after,.tl-b.moving .tl-rs::after{opacity:1}
@media(hover:none){.tl-rs::after{opacity:.8}}
.tl-b.moving{box-shadow:var(--sh-3);z-index:5;opacity:.95}
.tl-prev{position:absolute;z-index:4;left:56px;right:8px;border-radius:11px;border:2px dashed var(--brand);background:var(--brand-soft);pointer-events:none;
  font-size:12px;font-weight:700;color:var(--brand-2);padding:4px 8px}
.tl-tip{position:absolute;z-index:6;right:10px;padding:3px 8px;border-radius:8px;background:var(--ink);color:#fff;font-size:12px;font-weight:650;pointer-events:none;font-variant-numeric:tabular-nums}
.tl-hint{font-size:12px;color:var(--ink-3);margin:8px 4px 0}

/* ================================================================ upcoming */
.wk{display:flex;align-items:center;gap:6px;padding:8px;border-radius:var(--r-lg);margin-top:8px}
.wk-days{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wkd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border-radius:15px;transition:background .15s,color .15s}
.wkd:hover{background:var(--fill)}
.wkd .d{font-size:11.5px;font-weight:650;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.wkd .n{font-family:var(--display);font-size:20px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.wkd .dots{display:flex;gap:3px;height:5px}
.wkd .dots i{width:5px;height:5px;border-radius:50%;background:var(--c,var(--brand))}
.wkd.today .n{color:var(--brand)}
.wkd.off{opacity:.6}
.wkd.sel{background:var(--brand);color:#fff;box-shadow:0 10px 20px -12px rgba(30,127,102,.9)}
.wkd.sel .d,.wkd.sel .n{color:#fff}
.wkd.sel .dots i{background:#fff !important}
.pbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto;border:1px solid var(--line);background:var(--card-solid)}
.pbtn:hover{background:var(--fill)}
.pbtn svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pager{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.pager .rng{font-size:13.5px;font-weight:650;color:var(--ink-2);font-variant-numeric:tabular-nums}
.ptoday{height:32px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:700;color:var(--brand);background:var(--brand-soft)}
.dayhd{display:flex;align-items:baseline;gap:8px;margin:24px 4px 10px}
.dayhd h3{font-family:var(--display);font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.dayhd .cnt{font-size:13px;font-weight:650;color:var(--ink-3)}
.dayhd .tag{font-size:11px;font-weight:750;color:var(--brand);text-transform:uppercase;letter-spacing:.08em}
.dayhd .add{margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:10px;font-size:13px;font-weight:700;color:var(--brand)}
.dayhd .add:hover{background:var(--brand-soft)}
.dayhd .add svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}

/* ================================================================ calendar */
.calwrap{display:grid;gap:16px;margin-top:8px;grid-template-columns:minmax(0,1fr)}
@media(min-width:880px){.calwrap{grid-template-columns:minmax(330px,400px) minmax(0,1fr);grid-template-areas:"m d" "l d";align-items:start}
  .calwrap .mside{grid-area:m}.calwrap .dpwrap{grid-area:d}.calwrap .dlside{grid-area:l}}
.mcard{padding:18px 16px 14px}
.m-head{display:flex;align-items:center;gap:10px;margin:0 2px 14px}
.m-t{flex:1;text-align:center}
.m-name{font-family:var(--display);font-weight:750;font-size:22px;letter-spacing:-.015em;line-height:1.1}
.m-y{font-size:12.5px;font-weight:600;color:var(--ink-3);margin-top:1px}
.cbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card-solid);color:var(--ink-2)}
.cbtn:hover{background:var(--fill)}
.cbtn svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.m-dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.m-dow span{text-align:center;font-size:12px;font-weight:600;color:var(--ink-3);padding:4px 0}
.m-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:4px;touch-action:pan-y}
.mday{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;height:52px;padding-top:6px;border-radius:14px;transition:background .15s}
.mday:hover{background:var(--fill)}
.mday .mn{width:34px;height:30px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-size:16.5px;font-weight:650;font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.mday.out .mn{color:#B8C1BA}
.mday.off .mn{color:var(--ink-3)}
.mday.vac::after{content:"";position:absolute;left:8px;right:8px;top:2px;height:3px;border-radius:2px;background:var(--amber);opacity:.6}
.mday.today .mn{color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
.mday.sel .mn{background:var(--brand);color:#fff;box-shadow:0 8px 16px -8px rgba(30,127,102,.95)}
.mdots{display:flex;gap:3px;height:5px;align-items:center}
.mdots i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.mdots i.done{opacity:.35}
.mdots b{font-size:9px;font-weight:700;color:var(--ink-3);line-height:5px}
.mday.drop-on .mn{background:transparent;color:#fff;box-shadow:none}
.m-foot{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 4px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
.m-foot b{color:var(--ink);font-weight:700}
.dpanel{padding:18px 16px 16px}
.dp-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 14px}
.dp-h .dpt{flex:1;min-width:150px}
.dp-h .dpe{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.dp-h .dpn{font-family:var(--display);font-weight:750;font-size:22px;letter-spacing:-.015em;line-height:1.15}
.dp-h .add{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:12px;background:var(--brand);color:#fff;font-size:13.5px;font-weight:700}
.dp-h .add svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.dlrow{display:flex;align-items:center;gap:10px;padding:10px 4px;cursor:pointer;border-radius:10px}
.dlrow+.dlrow{border-top:1px solid var(--line)}
.dlrow .dd{width:44px;text-align:center;flex:0 0 auto}
.dlrow .dd b{display:block;font-family:var(--display);font-size:18px;font-weight:750;line-height:1}
.dlrow .dd span{font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase}
.dlrow .dx{flex:1;min-width:0}
.dlrow .dx .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlrow .dx .m{font-size:12px;color:var(--ink-3)}
.dlrow.late .dd b{color:var(--red)}

/* ================================================================ board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:14px;margin-top:14px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x mandatory;
  scrollbar-width:thin;align-items:start}
@media(max-width:699px){.board{grid-auto-columns:86%;margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px;scroll-padding:0 16px}}
.bcol{scroll-snap-align:start;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.7);border-radius:var(--r-lg);padding:12px 10px 10px;min-height:160px}
.bcol-h{display:flex;align-items:center;gap:8px;margin:2px 4px 12px}
.bcol-h .bdot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.bcol-h .bt{font-family:var(--display);font-size:16.5px;font-weight:750}
.bcol-h .bc{font-size:12.5px;font-weight:700;color:var(--ink-3);background:var(--fill-2);border-radius:999px;padding:1px 8px}
.bcol-h .ba{margin-left:auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3)}
.bcol-h .ba:hover{background:#fff;color:var(--brand)}
.bcol-h .ba svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.bcards{display:flex;flex-direction:column;gap:9px;min-height:60px;position:relative;border-radius:14px}
.bcard{background:var(--card-solid);border:1px solid var(--line);border-radius:15px;padding:11px 12px 11px;box-shadow:var(--sh-1);cursor:pointer;position:relative;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:box-shadow .15s,transform .15s}
@media(hover:hover){.bcard:hover{box-shadow:0 8px 20px -12px rgba(19,33,26,.35)}}
.bcard.pressing{transform:scale(.98)}
.bcard::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}
.bc-top{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;color:var(--ink-3);margin-bottom:5px}
.bc-top .cdot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.bc-top .grip{margin-left:auto;width:24px;height:22px;margin-right:-4px}
.bc-main{display:flex;gap:9px;align-items:flex-start}
.bc-main .tick{width:20px;height:20px;margin-top:1px}
.bc-main .tick svg{width:11px;height:11px}
.bc-t{font-size:14.5px;font-weight:550;line-height:1.32;flex:1;min-width:0;word-break:break-word}
.bcard.done .bc-t{color:var(--ink-3);text-decoration:line-through}
.bc-m{display:flex;flex-wrap:wrap;gap:5px 9px;margin-top:8px;font-size:12px;color:var(--ink-3)}
.bc-m:empty{display:none}
.bempty{font-size:13px;color:var(--ink-3);text-align:center;padding:16px 8px;border:1.5px dashed var(--line-2);border-radius:14px}
.cscroll{display:flex;gap:6px;overflow-x:auto;padding:2px;margin-top:12px;scrollbar-width:none}
.cscroll::-webkit-scrollbar{display:none}

/* ================================================================ habits */
.hgrid-card{padding:16px 14px 12px;margin-top:8px}
.hg-head{display:flex;align-items:center;gap:8px;margin:0 4px 12px}
.hg-head .rng{flex:1;font-family:var(--display);font-size:17px;font-weight:750}
.hgrid{display:grid;grid-template-columns:minmax(110px,1.4fr) repeat(7,minmax(30px,1fr));align-items:center;row-gap:4px}
.hgrid .hh{text-align:center;font-size:11px;font-weight:700;color:var(--ink-3);padding-bottom:4px;line-height:1.25}
.hgrid .hh b{display:block;font-family:var(--display);font-size:15px;color:var(--ink-2);font-weight:700}
.hgrid .hh.today b{color:var(--brand)}
.hname{display:flex;align-items:center;gap:8px;min-width:0;padding:8px 6px 8px 4px;cursor:pointer;border-radius:10px}
.hname:hover{background:var(--fill)}
.hname .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hname .s{font-size:11.5px;font-weight:700;color:#D06A2A;display:inline-flex;align-items:center;gap:2px;flex:0 0 auto}
.hname .s svg{width:12px;height:12px;fill:currentColor}
.hcell{justify-self:center;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;transition:transform .12s,background .2s}
.hcell i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;transition:all .2s}
.hcell i svg{width:12px;height:12px;stroke:#fff;stroke-width:3.4;fill:none;opacity:0;stroke-linecap:round;stroke-linejoin:round}
.hcell.on i{background:var(--brand);border-color:var(--brand)}
.hcell.on i svg{opacity:1}
.hcell.miss i{border-color:rgba(209,75,75,.35);background:rgba(209,75,75,.05)}
.hcell.na{cursor:default}
.hcell.na i{width:6px;height:6px;border:0;background:var(--fill-2)}
.hcell.fut i{border-style:dashed}
.hcell.today i{box-shadow:0 0 0 3px var(--brand-soft)}
.hcell:not(.na):active{transform:scale(.88)}
.heat-card{padding:16px;margin-top:14px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-template-columns:repeat(18,minmax(0,1fr));gap:4px;max-width:520px}
.heat i{width:100%;aspect-ratio:1;border-radius:4px;background:var(--fill-2)}
@media(max-width:420px){.heat{gap:3px}.heat i{border-radius:3px}}
.heat i.l1{background:#CDEBDD}.heat i.l2{background:#94D2B5}.heat i.l3{background:#4FAE86}.heat i.l4{background:var(--brand-2)}
.heat i.fut{background:transparent}
.heat-leg{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-3);margin-top:8px;justify-content:flex-end}
.heat-leg i{width:11px;height:11px;border-radius:3px}
.hcards{display:grid;gap:10px;margin-top:10px;position:relative}
@media(min-width:760px){.hcards{grid-template-columns:1fr 1fr}}
.hcard{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.hcard .hi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--mint-2);color:var(--brand-2);flex:0 0 auto}
.hcard .hi svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hcard .hx{flex:1;min-width:0}
.hcard .hx .t{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard .hx .m{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.hcard .hr{text-align:right;flex:0 0 auto}
.hcard .hr b{font-family:var(--display);font-size:20px;font-weight:750;display:block;line-height:1}
.hcard .hr span{font-size:11px;font-weight:650;color:var(--ink-3)}
.sugg{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card-solid);border:1px solid var(--line);margin-top:8px}
.sugg .t{flex:1;min-width:0;font-size:14px;font-weight:600}
.sugg .t span{display:block;font-size:12px;font-weight:500;color:var(--ink-3)}

/* ================================================================ progress */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
@media(max-width:760px){.cards{grid-template-columns:1fr}}
.pc{padding:18px 18px}
.pc.dark{background:linear-gradient(150deg,var(--deep),var(--deep-2));color:#F1F7F3;border-color:transparent}
.pc .ey{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.pc.dark .ey{color:rgba(241,247,243,.6)}
.pc .big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1.02;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pc .lvl{font-family:var(--display);font-size:20px;font-weight:650;margin-top:2px;color:#9BE0BF}
.pc .sub{font-size:13px;color:var(--ink-2);margin-top:6px}
.pc.dark .sub{color:rgba(241,247,243,.72)}
.ktrack{height:7px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:14px}
.ktrack i{display:block;height:100%;background:#9BE0BF;border-radius:4px;transition:width .6s var(--ease)}
.klevels{display:flex;margin-top:10px;gap:4px}
.klevels span{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.15)}
.klevels span.on{background:#9BE0BF}
.streakbig{display:flex;align-items:center;gap:12px;margin-top:10px}
.streakbig .flame{width:46px;height:46px;border-radius:15px;background:rgba(224,112,47,.12);display:grid;place-items:center;flex:0 0 auto}
.streakbig .flame svg{width:24px;height:24px;fill:#E0702F}
.streakbig .flame.cold{background:var(--fill-2)}
.streakbig .flame.cold svg{fill:var(--ink-3)}
.streakbig .flame.star{background:rgba(201,154,46,.14)}
.streakbig .flame.star svg{fill:var(--amber)}
.streakbig .n{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.streakbig .l{font-size:12.5px;color:var(--ink-2)}
.goal{margin-top:14px}
.goal-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:650;margin-bottom:8px;gap:10px}
.goal-top .v{font-size:12.5px;color:var(--ink-3);font-weight:550}
.goal-track{display:block;height:9px;border-radius:5px;background:var(--fill-2);overflow:hidden}
.goal-track i{display:block;height:100%;background:var(--brand);border-radius:5px;transition:width .5s var(--ease)}
.goal.met .goal-track i{background:var(--green)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:11px;overflow:hidden;background:#fff}
.stepper button{width:34px;height:32px;font-size:17px;font-weight:650;color:var(--ink-2);text-align:center}
.stepper button:hover{background:var(--fill)}
.stepper span{min-width:34px;text-align:center;font-size:14px;font-weight:650;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart text{font-family:var(--font);font-size:10.5px;fill:var(--ink-3);font-weight:600}
.chart .val{font-size:11px;fill:var(--ink);font-weight:700}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.srow+.srow{border-top:1px solid var(--line)}
.srow .k{font-size:14.5px;font-weight:650}
.srow .d{font-size:12.5px;color:var(--ink-3);font-weight:450;margin-top:1px}
.srow .v{font-weight:700;font-variant-numeric:tabular-nums}
.dayoff{display:flex;gap:4px;flex-wrap:wrap}
.dayoff button{width:36px;height:32px;border-radius:10px;border:1px solid var(--line-2);font-size:12px;font-weight:650;color:var(--ink-2);background:#fff}
.dayoff button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.vacbanner{display:flex;gap:10px;align-items:center;background:rgba(201,154,46,.12);color:#8A6A14;border-radius:15px;padding:11px 14px;font-size:14px;font-weight:600;margin-top:14px}
.vacbanner svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;flex:0 0 auto}
.vacbanner button{margin-left:auto;font-size:13px;font-weight:700;text-decoration:underline;color:inherit}

/* ================================================================ sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(14,28,22,.36);opacity:0;transition:opacity .28s var(--ease);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.scrim.show{opacity:1}
.sheet{position:fixed;z-index:51;left:50%;top:50%;width:min(720px,calc(100vw - 48px));max-height:min(88vh,920px);transform:translate(-50%,-47%) scale(.98);opacity:0;
  background:#F7F9F6;border-radius:26px;display:flex;flex-direction:column;box-shadow:var(--sh-3);transition:transform .3s var(--ease),opacity .22s;overflow:hidden}
.sheet.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.sheet.narrow{width:min(520px,calc(100vw - 48px))}
.sh-grab{display:none}
.sh-head{display:flex;align-items:center;gap:8px;padding:16px 16px 10px 20px;flex:0 0 auto;-webkit-user-select:none;user-select:none}
.sh-head .st{font-family:var(--display);font-weight:750;font-size:21px;letter-spacing:-.01em;flex:1}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:650;color:var(--ink-2)}
.crumb .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-x{height:36px;padding:0 14px;border-radius:12px;font-size:15px;font-weight:700;color:var(--brand);background:var(--brand-soft)}
.sh-x:hover{background:var(--brand-soft-2)}
.sh-x.plain{background:transparent;color:var(--ink-2)}
.sh-body{overflow-y:auto;padding:4px 20px 20px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;flex:1 1 auto}
.sh-foot{display:flex;align-items:center;gap:10px;padding:12px 20px calc(14px);border-top:1px solid var(--line);background:rgba(247,249,246,.94);flex:0 0 auto}
.sh-foot .btn{flex:1}
.sh-foot .btn.danger{flex:0 0 auto}
@media(max-width:699px){
  .sheet,.sheet.narrow{left:0;right:0;bottom:0;top:auto;width:100%;max-height:calc(100% - var(--safe-t) - 10px);height:auto;border-radius:24px 24px 0 0;
    transform:translateY(105%);opacity:1}
  .sheet.tall{height:calc(100% - var(--safe-t) - 10px)}
  .sheet.show{transform:translateY(0)}
  .sh-grab{display:block;width:40px;height:5px;border-radius:3px;background:rgba(19,40,30,.2);margin:8px auto 0;flex:0 0 auto}
  .sh-head{padding:8px 12px 8px 18px}
  .sh-body{padding:2px 16px 18px}
  .sh-foot{padding:10px 16px calc(10px + var(--safe-b))}
  .sh-body.last{padding-bottom:calc(20px + var(--safe-b))}
}

/* task sheet */
.t-title{display:flex;gap:12px;align-items:flex-start;margin:2px 0 4px}
.t-title .tick{margin-top:9px;width:26px;height:26px}
.titleta{flex:1;border:0;background:transparent;resize:none;overflow:hidden;font-family:var(--display);font-weight:700;font-size:25px;line-height:1.22;padding:4px 2px;
  letter-spacing:-.015em;color:var(--ink);min-height:40px}
.titleta::placeholder{color:#AAB4AD}
.notehint{font-size:12.5px;color:var(--ink-3);margin:0 0 8px 40px}
.desc-ed{border:1px solid transparent;border-radius:15px;background:transparent;transition:border-color .15s,background .15s,box-shadow .15s;margin:2px 0 4px}
.desc-ed.on{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px var(--brand-soft)}
.desc-ed textarea{display:block;width:100%;border:0;background:transparent;resize:none;min-height:46px;padding:9px 12px;font-size:16px;line-height:1.5;overflow:hidden}
.mdbar{display:none;gap:2px;padding:4px 6px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.mdbar::-webkit-scrollbar{display:none}
.desc-ed.on .mdbar{display:flex}
.mdbar button{min-width:34px;height:32px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--ink-2);padding:0 8px;flex:0 0 auto}
.mdbar button:hover{background:var(--fill)}
.mdbar svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.desc-view{min-height:40px;padding:9px 12px;border-radius:15px;cursor:text;font-size:15.5px;transition:background .15s;margin:2px 0 4px}
.desc-view:hover{background:rgba(255,255,255,.7)}
.props{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 2px;padding-top:12px;border-top:1px solid var(--line)}
.prop{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:6px 12px 6px 10px;border-radius:12px;background:#fff;border:1px solid var(--line-2);
  font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s;max-width:100%}
.prop span{overflow:hidden;text-overflow:ellipsis}
.prop svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;color:var(--ink-2)}
.prop .cd{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.prop.unset{border-style:dashed;color:var(--ink-3);background:transparent}
.prop.unset svg{color:var(--ink-3)}
.prop:hover{background:var(--fill)}
.prop.open{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);background:#fff}
.prop.late{color:var(--red)}.prop.late svg{color:var(--red)}
.prop.today{color:var(--brand-2)}.prop.today svg{color:var(--brand)}
.prop.p1 svg{color:var(--p1);fill:var(--p1);stroke:none}.prop.p2 svg{color:var(--p2);fill:var(--p2);stroke:none}.prop.p3 svg{color:var(--p3);fill:var(--p3);stroke:none}

.ambient i:nth-child(2){width:44vmax;height:44vmax;right:-18vmax;top:24vh;background:radial-gradient(circle,rgba(226,241,216,.8) 0%,rgba(226,241,216,0) 68%);animation:drift2 46s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(9vmax,7vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-8vmax,-6vmax) scale(.92)}}

/* opening screen */
.boot{position:fixed;inset:0;z-index:200;display:grid;place-items:center;
  background:radial-gradient(60% 45% at 8% -5%,#D5EEE1 0%,rgba(213,238,225,0) 70%),radial-gradient(70% 50% at 50% 110%,#DFEBE4 0%,rgba(223,235,228,0) 70%),var(--bg);
  transition:opacity .55s var(--ease),visibility 0s linear .55s;animation:bootkill .01s 7s forwards}
.boot.out{opacity:0;visibility:hidden;pointer-events:none}
.boot-in{display:flex;flex-direction:column;align-items:center;gap:16px;transition:transform .6s var(--ease)}

.boot-mark{width:78px;height:78px;border-radius:23px;box-shadow:0 24px 46px -18px rgba(20,97,76,.8);animation:bootpop .75s var(--spring) both}
.boot-mark svg{width:78px;height:78px;display:block}

.boot-bar{width:120px;height:4px;border-radius:3px;background:rgba(19,40,30,.08);overflow:hidden;animation:fadein .4s .65s both}
.boot-bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,var(--brand),#46B48C);animation:bootbar 1.1s .65s ease-in-out infinite}
@keyframes bootkill{to{opacity:0;visibility:hidden;pointer-events:none}}
@keyframes bootpop{from{transform:scale(.55) rotate(-12deg);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}

/* sliding highlight under the active tab */

  .boot-mark .bl{transform:none !important}
  .ambient{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

<script>
'use strict';
/* ============================================================ storage seam
   Every read and write goes through store. Values are mirrored in memory so a full device
   (quota exceeded) never serves a stale copy back to the app. */
const mem={};
let storageWarned=false;
const store={
  ok:(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}})(),
  get(k){if(k in mem)return mem[k];if(this.ok){try{return localStorage.getItem(k)}catch(e){}}return null},
  set(k,v){mem[k]=v;if(this.ok){try{localStorage.setItem(k,v);return true}catch(e){storageFull();return false}}return true},
  del(k){delete mem[k];if(this.ok){try{localStorage.removeItem(k)}catch(e){}}}
};
function storageFull(){if(storageWarned)return;storageWarned=true;setTimeout(()=>toast('This device is out of storage space. Your changes still sync to the cloud. Removing large file attachments frees space.'),60)}

/* storage keys are unchanged from earlier versions so every existing board loads as is */
const K={tasks:'pn_tb2_tasks',comp:'pn_tb2_comp',exc:'pn_tb2_exc',rout:'pn_tb2_rout',
  tmpl:'pn_tb2_tmpl',cfg:'pn_tb2_cfg',ui:'pn_tb2_ui',rem:'pn_tb2_rem',meet:'pn_tb2_meet',x:'pn_tb2_x',
  dirty:'pn_tb2_dirty',v5synced:'pn_tb2_v5_synced',draftNew:'pn_tb2_draft_new',
  notes:'pn_tb2_notes'}; // v6 adds notes under a key of its own, every earlier key is untouched
const OLD={tasks:'pn_taskboard_v1',cfg:'pn_taskboard_cfg_v1'};
const SCHEMA=5;

/* ============================================================ config defaults */
const DEFAULT_CLIENTS=[
  {id:'kipling',name:'Kipling India',color:'#B0552F'},
  {id:'druk',name:'Druk Asia',color:'#2F6B5E'},
  {id:'wfta',name:'WFTA',color:'#8A742C'},
  {id:'gbta',name:'GBTA',color:'#2E6F8E'},
  {id:'bluepoppy',name:'Blue Poppy Bhutan',color:'#3E5C94'},
  {id:'vtn',name:'V Travel Network',color:'#6D4C8C'},
  {id:'simplenight',name:'Simple Night',color:'#B07C1E'},
  {id:'advtravel',name:'Adventure.travel',color:'#3F7A4B'},
  {id:'hanwong',name:'Han Wong International',color:'#B23A2E'},

/* ============================================================ recurrence engine */
function ruleFromPreset(key,anchor){
  if(!key)return null;
  const a=parseYmd(anchor||todayStr());
  switch(key){
    case'daily':return{freq:'DAILY',interval:1};
    case'weekdays':return{freq:'WEEKLY',interval:1,byday:WEEKDAYS.slice()};
    case'weekly':return{freq:'WEEKLY',interval:1,byday:[DOW[a.getUTCDay()]]};
    case'biweekly':return{freq:'WEEKLY',interval:2,byday:[DOW[a.getUTCDay()]]};
    case'monthly':return{freq:'MONTHLY',interval:1};
    case'monthlyWeekday':return{freq:'MONTHLY',interval:1,byday:[DOW[a.getUTCDay()]],bysetpos:isLastWeekday(a)?-1:nthWeekdayPos(a)};
    case'yearly':return{freq:'YEARLY',interval:1};
    default:return null;
  }
}
function baseMatches(rule,anchor,test){
  const a=parseYmd(anchor),t=parseYmd(test);
  if(t<a)return false;
  const iv=rule.interval||1;
  if(rule.freq==='DAILY')return daysBetweenU(anchor,test)%iv===0;
  if(rule.freq==='WEEKLY'){
    const days=(rule.byday&&rule.byday.length)?rule.byday:[DOW[a.getUTCDay()]];
    if(!days.includes(DOW[t.getUTCDay()]))return false;
    return(((weekIndexU(t)-weekIndexU(a))%iv)+iv)%iv===0;
  }
  if(rule.freq==='MONTHLY'){
    const md=(t.getUTCFullYear()-a.getUTCFullYear())*12+(t.getUTCMonth()-a.getUTCMonth());
    if(md%iv!==0)return false;
    if(rule.byday&&rule.bysetpos){
      if(DOW[t.getUTCDay()]!==rule.byday[0])return false;
      if(rule.bysetpos===-1)return isLastWeekday(t);
      return nthWeekdayPos(t)===rule.bysetpos;
    }
    return t.getUTCDate()===clampDay(t.getUTCFullYear(),t.getUTCMonth(),a.getUTCDate());
  }
  if(rule.freq==='YEARLY'){
    if((t.getUTCFullYear()-a.getUTCFullYear())%iv!==0)return false;
    if(t.getUTCMonth()!==a.getUTCMonth())return false;
    return t.getUTCDate()===clampDay(t.getUTCFullYear(),t.getUTCMonth(),a.getUTCDate());
  }
  return false;
}
const countEndMemo=new Map();
function countEnd(rule,anchor){
  const key=anchor+'|'+JSON.stringify(rule);
  if(countEndMemo.has(key))return countEndMemo.get(key);
  let n=0,cur=parseYmd(anchor),end=null,g=0;
  while(g++<4000){const s=ymdU(cur);if(baseMatches(rule,anchor,s)){n++;if(n>=rule.count){end=s;break;}}cur=addDaysU(cur,1);}
  countEndMemo.set(key,end);return end;
}
function ruleMatches(rule,anchor,test){
  if(rule.until&&test>rule.until)return false;
  if(rule.count>0){const e=countEnd(rule,anchor);if(e&&test>e)return false;}
  return baseMatches(rule,anchor,test);
}
function occurrences(task,from,to){
  let out=[];
  if(!task.rrule){ if(task.due&&task.due>=from&&task.due<=to)out.push(task.due); }
  else{
    const anchor=task.due||from;
    let cur=parseYmd(from<anchor?anchor:from);const end=parseYmd(to);let g=0;
    while(cur<=end&&g++<1500){const s=ymdU(cur);if(ruleMatches(task.rrule,anchor,s))out.push(s);cur=addDaysU(cur,1);}
  }
  exceptions.forEach(e=>{
    if(e.taskId!==task.id)return;
    if(e.action==='skip')out=out.filter(d=>d!==e.date);
    if(e.action==='move'){out=out.filter(d=>d!==e.date);if(e.newDate>=from&&e.newDate<=to)out.push(e.newDate);}
  });
  return [...new Set(out)].sort();
}
function isCompleted(taskId,date){return completions.some(c=>c.taskId===taskId&&c.date===date)}
function nextDue(task,from){
  if(!task.rrule){
    if(!task.due)return null;
    if(task.status==='done')return null;
    return task.due;
  }
  const anchor=task.due||from;
  const lookback=addLocalDays(from,-60);
  const start=lookback<anchor?anchor:lookback;
  const occ=occurrences(task,start,addLocalDays(from,800));
  return occ.find(s=>!isCompleted(task.id,s))||null;
}
function hiddenNow(task){return!!(task.startDate&&task.startDate>todayStr())}
function openTodayInstance(task){
  const today=todayStr();
  if(hiddenNow(task))return null;
  if(!task.rrule){
    if(task.status==='done'||task.archivedAt)return null;
    if(!task.due)return{date:today,floating:true};
    if(task.due<=today)return{date:task.due};
    return null;
  }
  const occ=occurrences(task,task.due||today,today);
  for(const d of occ){if(!isCompleted(task.id,d))return{date:d};}
  return null;
}
/* the open occurrence a board or list should show for a task, looking no further than `end` */
function openInstanceUpTo(task,end){
  if(task.archivedAt||isNote(task))return null;
  if(!task.rrule){
    if(task.status==='done')return null;
    if(!task.due)return{date:todayStr(),floating:true};
    return task.due<=end?{date:task.due}:null;
  }
  if(hiddenNow(task))return null;
  const d=nextDue(task,todayStr());
  return d&&d<=end?{date:d}:null;
}
function ordinal(n){return n===-1?'last':['','1st','2nd','3rd','4th','5th'][n]||n+'th'}
function repeatLabel(rule){
  if(!rule)return'';
  const iv=rule.interval||1;let s;
  if(rule.freq==='DAILY')s=iv===1?'Every day':'Every '+iv+' days';
  else if(rule.freq==='WEEKLY'){
    const d=rule.byday||[];
    if(iv===1&&d.length===5&&WEEKDAYS.every(x=>d.includes(x)))s='Weekdays';
    else if(iv===1&&d.length===7)s='Every day';
    else{const names=MON_FIRST.filter(x=>d.includes(x)).map(x=>DOW_LABEL[x]).join(' ');
      s=(iv===1?'Every ':'Every '+iv+' wks · ')+names;}
  }
  else if(rule.freq==='MONTHLY'){
    const base=iv===1?'Monthly':'Every '+iv+' months';
    s=rule.bysetpos?base+' · '+ordinal(rule.bysetpos)+' '+DOW_LABEL[rule.byday[0]]:base;
  }
  else if(rule.freq==='YEARLY')s=iv===1?'Yearly':'Every '+iv+' years';
  else s='Repeats';
  if(rule.until)s+=' · until '+fmtDM(rule.until);
  else if(rule.count)s+=' · '+rule.count+'×';
  return s;
}

/* builds older than v4 strip fields they do not know. When a snapshot from one of them arrives,

const V4_TASK_FIELDS=['dueTime','startDate','comments','activity','resetSubs','habit','updatedAt'];
function restoreV4Fields(incoming,localTasks){
  const byId=new Map((localTasks||[]).map(t=>[t.id,t]));
  return incoming.map(raw=>{
    const it={...raw};
    const loc=byId.get(it.id);if(!loc)return it;
    V4_TASK_FIELDS.forEach(f=>{if(it[f]===undefined&&loc[f]!==undefined)it[f]=loc[f];});
    if(it.priority==='Medium'&&loc.priority==='None')it.priority='None';
    if(it.remind==='none'&&['attime','before30'].includes(loc.remind))it.remind=loc.remind;
    if(Array.isArray(it.subtasks)&&Array.isArray(loc.subtasks)){
      const sm=new Map(loc.subtasks.map(s=>[s.id,s]));
      it.subtasks=it.subtasks.map(s=>{const ls=sm.get(s.id);return ls?{...ls,...s,depth:s.depth!==undefined?s.depth:ls.depth}:s});
    }
    if(Array.isArray(it.attachments)&&Array.isArray(loc.attachments)){
      const am=new Map(loc.attachments.map(a=>[a.id,a]));
      it.attachments=it.attachments.map(a=>({...(am.get(a.id)||{}),...a}));
    }

/* ============================================================ persistence

const SIG={tasks:new Map(),comp:new Map(),exc:new Map(),cfg:'',x:'',clients:new Set(),rout:'',tmpl:'',meet:'',notes:new Map()};

function rebaseline(){
  SIG.tasks=new Map(tasks.map(t=>[t.id,taskSig(t)]));
  SIG.comp=new Map(completions.map(c=>[c.id,c.taskId+'|'+c.date]));
  SIG.exc=new Map(exceptions.map(e=>[e.id,1]));
  SIG.cfg=JSON.stringify(cfgObj());SIG.x=xSig();SIG.clients=new Set(CLIENTS.map(c=>c.id));
  SIG.rout=JSON.stringify(routines);SIG.tmpl=JSON.stringify(templates);SIG.meet=JSON.stringify(meetings);
  SIG.notes=new Map(notebook.map(n=>[n.id,noteSig(n)]));
}
function tomb(key,ts){if(!(X.tomb[key]>=ts))X.tomb[key]=ts}

function saveTasks(){
  const now=Date.now();let ch=false;const seen=new Set();
  const parts=tasks.map(t=>{seen.add(t.id);const s=taskSig(t);
    if(SIG.tasks.get(t.id)!==s){t.updatedAt=Math.max(now,(t.updatedAt||0)+1);SIG.tasks.set(t.id,s);ch=true;}
    return JSON.stringify(t)});
  for(const id of [...SIG.tasks.keys()])if(!seen.has(id)){SIG.tasks.delete(id);tomb('t:'+id,now);ch=true;}
  store.set(K.tasks,'['+parts.join(',')+']');

}
/* notes are stamped and tombstoned exactly like tasks, so they merge note by note across devices */
function saveNotes(){
  const now=Date.now();let ch=false;const seen=new Set();

/* ---- migration from the very first occurrence-based model (kept as is) ---- */
const OLD_REPEAT=['daily','weekdays','weekly','biweekly','monthly','monthlyWeekday','yearly'];
function migrateOld(){
  let oldTasks=[];
  try{oldTasks=JSON.parse(store.get(OLD.tasks)||'[]')}catch(e){oldTasks=[]}
  if(!Array.isArray(oldTasks)||!oldTasks.length)return false;
  const bySeries={};
  oldTasks.forEach(t=>{const sid=t.seriesId||t.id;(bySeries[sid]=bySeries[sid]||[]).push(t)});
  let idx=0;
  Object.values(bySeries).forEach(grp=>{
    grp.sort((a,b)=>String(a.due||'').localeCompare(String(b.due||'')));
    const first=grp[0];
    const rep=OLD_REPEAT.includes(first.repeat)?first.repeat:null;
    if(rep){
      const anchor=grp.map(g=>g.due).filter(Boolean).sort()[0]||first.due||todayStr();
      const nt=normTask({
        id:uid(),title:first.title,client:first.client,assignee:first.assignee,
        priority:first.priority,type:/post|reel|story/i.test(first.title||'')?'post':'task',
        due:anchor,deadline:first.deadline,rrule:ruleFromPreset(rep,anchor),
        labels:first.labels,subtasks:(first.subtasks||[]).map(s=>({id:uid(),text:s.text,done:false})),
        notes:first.notes,status:'todo',sortIndex:idx++
      });
      tasks.push(nt);
      grp.forEach(g=>{if(g.status==='done'&&g.due)completions.push({id:uid(),taskId:nt.id,date:g.due,at:g.completedAt||new Date().toISOString()})});
    }else{
      grp.forEach(g=>{
        tasks.push(normTask({
          id:uid(),title:g.title,client:g.client,assignee:g.assignee,priority:g.priority,
          type:/post|reel|story/i.test(g.title||'')?'post':'task',
          due:g.due,deadline:g.deadline,rrule:null,labels:g.labels,
          subtasks:(g.subtasks||[]).map(s=>({id:uid(),text:s.text,done:!!s.done})),
          notes:g.notes,status:g.status,completedAt:g.completedAt,sortIndex:idx++
        }));
      });
    }
  });
  return true;
}

/* ---- one-time local safety copies, written straight to localStorage and never overwritten ---- */
function safetyCopy(flagKey,copyKey){
  try{
    if(localStorage.getItem(flagKey))return;
    const keys={};let size=0;Object.values(K).forEach(k=>{const v=localStorage.getItem(k);if(v!==null){keys[k]=v;size+=v.length;}});
    // a large board is not duplicated on the device, so the copy can never crowd out real saves.
    // the untouched cloud copy taken on the first sync covers that case
    let used=0;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);used+=k.length+(localStorage.getItem(k)||'').length;}
    if(Object.keys(keys).length&&size<1500000&&used+size<2000000)localStorage.setItem(copyKey,JSON.stringify({at:new Date().toISOString(),keys}));
  }catch(e){}
  try{localStorage.setItem(flagKey,'1')}catch(e){}
}

/* ============================================================ archive (hides, never deletes) */
function runArchive(){
  const cutoff=addLocalDays(todayStr(),-(CFG.archiveDays||4));
  let changed=false;
  tasks.forEach(t=>{
    if(t.status==='done'&&!t.rrule&&!t.archivedAt&&t.completedAt){
      const d=localDay(t.completedAt);
      if(t.due&&d>t.due)return;
      if(d<cutoff){t.archivedAt=new Date().toISOString();changed=true;}
    }
  });
  if(changed)saveTasks();
}

/* ============================================================ productivity: counts, goals, streaks, karma */
function onVacation(d){return X.vacations.some(v=>v&&v.from&&d>=v.from&&(!v.to||d<=v.to))}
function vacationActive(){const v=X.vacations[X.vacations.length-1];return!!(v&&!v.to)}
function isOffDay(d){return X.daysOff.includes(dowOf(d))||onVacation(d)}
function completionLog(){
  const out=[];const byId=new Map(tasks.map(t=>[t.id,t]));
  tasks.forEach(t=>{if(!t.rrule&&t.status==='done'&&t.completedAt&&!isNote(t))out.push({day:localDay(t.completedAt),prio:t.priority,id:t.id});});
  completions.forEach(c=>{const t=byId.get(c.taskId);out.push({day:c.at?localDay(c.at):c.date,prio:t?t.priority:'None',id:c.taskId});});
  return out;
}
function weekCount(counts,mon){let n=0;for(let i=0;i<7;i++)n+=counts.get(addLocalDays(mon,i))||0;return n}
function weekHasVacation(mon){for(let i=0;i<7;i++)if(onVacation(addLocalDays(mon,i)))return true;return false}
function overduePenalties(){
  if(vacationActive())return[];
  const out=[];
  tasks.forEach(t=>{
    if(t.archivedAt||isNote(t)||t.habit)return;
    let d=null;
    if(t.rrule){const inst=openTodayInstance(t);d=inst&&inst.date;}
    else if(t.status!=='done'&&t.due)d=t.due;
    if(!d)return;
    const late=-dayDiff(d);
    if(late>5)out.push({task:t,late,pts:Math.min((late-5)*2,20)});
  });
  return out.sort((a,b)=>b.late-a.late);
}
let statsMemo=null;
function computeStats(){
  const key=dataVer+'|'+todayStr()+'|'+completions.length+'|'+tasks.length+'|'+X.dailyGoal+'|'+X.weeklyGoal+'|'+X.vacations.length+'|'+X.daysOff.join();
  if(statsMemo&&statsMemo.key===key)return statsMemo.v;
  const today=todayStr();
  const log=completionLog();
  const counts=new Map();log.forEach(e=>counts.set(e.day,(counts.get(e.day)||0)+1));
  const days=[...counts.keys()].sort();
  const first=days[0]||today;
  const g=X.dailyGoal,wg=X.weeklyGoal;
  // daily streak: off days and vacation days neither count nor break it
  let streak=0;{let d=today;if((counts.get(today)||0)<g)d=addLocalDays(today,-1);
    for(let i=0;i<1500;i++){if(d<first)break;if(isOffDay(d)){d=addLocalDays(d,-1);continue;}
      if((counts.get(d)||0)>=g){streak++;d=addLocalDays(d,-1);}else break;}}
  let longest=0,run=0,goalDays=0;
  for(let d=first,i=0;d<=today&&i<3000;d=addLocalDays(d,1),i++){
    const n=counts.get(d)||0;
    if(n>=g){goalDays++;run++;longest=Math.max(longest,run);}
    else if(isOffDay(d)||d===today){}
    else run=0;
  }
  const thisMon=mondayOf(today);
  let wstreak=0;{let m=thisMon;if(weekCount(counts,m)<wg)m=addLocalDays(m,-7);
    for(let i=0;i<300;i++){if(addLocalDays(m,6)<first)break;const n=weekCount(counts,m);
      if(n>=wg){wstreak++;m=addLocalDays(m,-7);}else if(weekHasVacation(m)){m=addLocalDays(m,-7);}else break;}}
  let goalWeeks=0;for(let m=mondayOf(first),i=0;m<=thisMon&&i<400;m=addLocalDays(m,7),i++)if(weekCount(counts,m)>=wg)goalWeeks++;
  const taskPts=log.reduce((s,e)=>s+(KPTS[e.prio]||4),0);
  const pens=overduePenalties();const penalty=pens.reduce((s,p)=>s+p.pts,0);
  const karma=Math.max(0,taskPts+goalDays*10+goalWeeks*30-penalty);
  let li=0;LEVELS.forEach((l,i)=>{if(karma>=l[1])li=i;});
  const next=LEVELS[li+1];
  const v={counts,today:counts.get(today)||0,week:weekCount(counts,thisMon),streak,longest,wstreak,
    karma,taskPts,goalDays,goalWeeks,penalty,pens,total:log.length,level:LEVELS[li][0],levelIdx:li,
    next:next?next[0]:null,toNext:next?next[1]-karma:0,levelPct:next?Math.round((karma-LEVELS[li][1])/(next[1]-LEVELS[li][1])*100):100};
  statsMemo={key,v};
  return v;
}

function play(name){
  if(!CFG.sound)return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
    AC=AC||new Ctx();if(AC.state==='suspended')AC.resume();
    const t0=AC.currentTime;
    (SND[name]||SND.done).forEach(([f,st,dur,gain])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.setValueAtTime(f,t0+st);
      g.gain.setValueAtTime(.0001,t0+st);
      g.gain.exponentialRampToValueAtTime(gain,t0+st+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t0+st+dur);
      o.connect(g).connect(AC.destination);o.start(t0+st);o.stop(t0+st+dur+.02);
    });
  }catch(e){}
}

function confetti(power){
  if(!X.celebrations)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=$('#fx');cv.hidden=false;const dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;const cx=cv.getContext('2d');cx.scale(dpr,dpr);
  const cols=['#1E7F66','#46B48C','#9BE0BF','#DD8530','#F2C14E','#3E7BD6','#D3ECDF'];
  const n=Math.round(90*(power||1));const P=[];
  for(let i=0;i<n;i++){const left=i%2===0;
    P.push({x:left?-10:innerWidth+10,y:innerHeight*.72,vx:(left?1:-1)*(4+Math.random()*7),vy:-(9+Math.random()*9),
      w:5+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[i%cols.length]});}
  const t0=performance.now();
  (function frame(t){
    const el=t-t0;cx.clearRect(0,0,innerWidth,innerHeight);
    P.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.max(0,1-el/2400);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore();});
    if(el<2400)requestAnimationFrame(frame);else{cx.clearRect(0,0,innerWidth,innerHeight);cv.hidden=true;}
  })(t0);
}

}
