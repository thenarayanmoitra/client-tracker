<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/favicon-180.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Task Board</title>
<meta name="theme-color" content="#F1F4EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Fraunces:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F4EC;
  --paper-deep:#E7ECDF;
  --parchment:#DCE4D2;
  --ink-deep:#16241C;
  --ink-deep-2:#1F3327;
  --ink:#202A22;
  --ink-mid:#4B5A4E;
  --ink-faint:#5C6A5E;
  --accent:#D98A2B;
  --accent-deep:#8A5410;
  --accent-soft:#E8B25C;

  --bg:var(--paper);
  --surface:#FFFFFF;
  --surface-2:var(--paper-deep);
  --text:var(--ink);
  --text-2:var(--ink-mid);
  --text-3:var(--ink-faint);
  --sep:rgba(22,36,28,.14);
  --sep-strong:rgba(22,36,28,.22);
  --tint:var(--accent-deep);
  --tint-press:var(--accent-deep);
  --tint-soft:rgba(138,84,16,.12);
  --red:#B23A2E;
  --amber:#B07C1E;
  --green:#3F7A4B;
  --radius:4px;
  --radius-lg:4px;
  --radius-sm:4px;
  --ease:cubic-bezier(.22,.8,.24,1);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --maxw:1120px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Manrope',system-ui,sans-serif;
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
[hidden]{display:none !important}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none;margin:0}
input,select,textarea{font-family:inherit;color:var(--text);font-size:15px}
input,textarea,select{-webkit-appearance:none;appearance:none}
select{-webkit-appearance:none;background-image:none}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:4px}
.mono{font-family:'Space Mono',ui-monospace,monospace}
.fr{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600}
::selection{background:var(--tint-soft)}

/* ---------------- top bar ---------------- */
.topbar{position:sticky;top:0;z-index:44;
  background:rgba(241,244,236,.82);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep-strong);
  padding:calc(var(--safe-top) + 10px) 20px 10px}
.topbar-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:16px}
.brand{display:flex;flex-direction:column;line-height:1;flex:0 0 auto;margin-right:2px}
.brand .bn{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:500;font-size:22px;letter-spacing:-.01em}
.brand .bd{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);margin-top:3px}
.tabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--sep);border-radius:4px;padding:3px}
.tabs button{padding:7px 15px;border-radius:4px;font-size:14px;font-weight:600;color:var(--text-2);transition:all .14s;white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(22,36,28,.1)}
.topbar-sp{flex:1}
.topact{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:4px;
  font-size:14px;font-weight:600;color:var(--text);background:var(--surface);border:1px solid var(--sep-strong);
  transition:all .12s;white-space:nowrap}
.tbtn:hover{background:var(--surface-2)}
.tbtn:active{transform:scale(.97)}
.tbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.tbtn.accent{background:var(--ink-deep);border-color:var(--ink-deep);color:var(--paper)}
.tbtn.accent:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.tbtn.icon{padding:0;width:38px;justify-content:center}
.tbtn .lbl{display:inline}

/* ---------------- page ---------------- */
.page{max-width:var(--maxw);margin:0 auto;padding:20px 20px 80px}
.center{max-width:760px;margin:0 auto}
.hd{padding:6px 2px 4px;position:relative}
.hd .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--text-2);margin:0 0 4px}
.hd h1{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;
  font-size:32px;line-height:1.05;margin:0;color:var(--text);letter-spacing:-.01em}

.section-label{font-size:12.5px;font-weight:700;letter-spacing:.02em;
  text-transform:uppercase;color:var(--text-2);margin:24px 4px 9px;display:flex;align-items:center;gap:8px}
.section-label .cnt{font-family:'Space Mono',monospace;font-weight:400;color:var(--text-3);text-transform:none;letter-spacing:0}

.group{background:var(--surface);border-radius:var(--radius);
  overflow:hidden;border:1px solid var(--sep);box-shadow:0 1px 2px rgba(22,36,28,.03)}

/* ---------------- task row ---------------- */
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 15px;position:relative;
  background:var(--surface);transition:background .12s}
.row + .row{box-shadow:inset 0 1px 0 var(--sep)}
.row:hover{background:var(--surface-2)}
.row.done .rtitle{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--text-3)}
.row.dragging{opacity:.45}
.row.drop-target{box-shadow:inset 0 2px 0 var(--tint)}
.tick{flex:0 0 auto;width:23px;height:23px;border-radius:50%;margin-top:1px;
  border:2px solid var(--text-3);background:transparent;display:grid;place-items:center;
  transition:border-color .15s,background .15s,transform .1s}
.tick:active{transform:scale(.88)}
.tick svg{width:13px;height:13px;stroke:#fff;stroke-width:3.4;opacity:0;transition:opacity .12s}
.tick.on{background:var(--ink-deep);border-color:var(--ink-deep)}
.tick.on svg{opacity:1}
.tick.prio-High{border-color:var(--red)}
.tick.prio-High.on{background:var(--red);border-color:var(--red)}
.rbody{flex:1 1 auto;min-width:0}
.rtitle{font-size:15.5px;font-weight:500;line-height:1.3;color:var(--text);word-break:break-word}
.rmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.mtag{font-size:12.5px;color:var(--text-2);display:inline-flex;align-items:center;gap:4px}
.mtag svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.lblchip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--surface-2);
  border:1px solid var(--sep);color:var(--text-2)}
.pill{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.03em;
  color:var(--tint);background:var(--tint-soft);padding:2px 7px;border-radius:4px;
  display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.pill svg{width:11px;height:11px;stroke:var(--tint);fill:none;stroke-width:2}
.pill.over{color:var(--red);background:rgba(178,58,46,.1)}
.pill.over svg{stroke:var(--red)}
.status-pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;letter-spacing:.02em}
.status-pill.draft{color:var(--text-2);background:var(--sep)}
.status-pill.scheduled{color:var(--amber);background:rgba(176,124,30,.13)}
.status-pill.posted{color:var(--green);background:rgba(63,122,75,.13)}
.rside{flex:0 0 auto;display:flex;align-items:center;gap:1px;margin-top:-1px;opacity:.55;transition:opacity .12s}
.row:hover .rside{opacity:1}
.iconbtn{width:33px;height:33px;border-radius:4px;display:grid;place-items:center;
  color:var(--text-2);transition:background .12s,color .12s}
.iconbtn:hover{background:var(--sep)}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9}
.grip{color:var(--text-3);cursor:grab;touch-action:none}
.grip svg{width:16px;height:16px}

/* ---------------- empty ---------------- */
.empty{text-align:center;padding:52px 30px;color:var(--text-2)}
.empty .fr{font-size:21px;font-style:italic;color:var(--text);display:block;margin-bottom:6px}
.empty p{margin:0;font-size:14px;max-width:280px;margin-left:auto;margin-right:auto}
.rosterempty{font-size:13px;color:var(--text-3);padding:11px 15px;background:var(--surface);
  border:1px dashed var(--sep-strong);border-radius:var(--radius)}

/* ---------------- load bar ---------------- */
.load{margin-top:16px;background:var(--surface);border:1px solid var(--sep);border-radius:var(--radius);padding:14px 16px}
.load-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.load-top .l{font-size:13px;font-weight:600}
.load-top .r{font-family:'Space Mono',monospace;font-size:12px;color:var(--text-2)}
.load-track{height:7px;border-radius:4px;background:var(--sep);overflow:hidden}
.load-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .4s var(--ease)}
.load.over .load-fill{background:var(--red)}
.load.over .r{color:var(--red)}
.load-warn{font-size:12.5px;color:var(--red);margin-top:8px;display:flex;gap:6px;align-items:center}
.load-warn svg{width:14px;height:14px;stroke:var(--red);fill:none;stroke-width:2;flex:0 0 auto}

/* ---------------- quick add ---------------- */
.qa{margin-top:16px;display:flex;gap:9px;align-items:center}
.qa input{flex:1;background:var(--surface);border:1px solid var(--sep-strong);
  border-radius:4px;padding:12px 14px;font-size:15px;box-shadow:0 1px 2px rgba(22,36,28,.03)}
.qa input:focus{outline:none;border-color:var(--tint)}
.qa .go{flex:0 0 auto;width:46px;height:46px;border-radius:4px;background:var(--ink-deep);
  display:grid;place-items:center;transition:background .12s,transform .1s}
.qa .go:hover{background:var(--accent-deep)}
.qa .go:active{transform:scale(.95)}
.qa .go svg{width:22px;height:22px;stroke:#fff;stroke-width:2.4;fill:none}
.qa-hint{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--text-3);margin:7px 4px 0;letter-spacing:.02em}

/* ---------------- routine + template cards ---------------- */
.rcard{background:var(--surface);border:1px solid var(--sep);border-radius:var(--radius);
  margin-bottom:10px;padding:14px 16px;display:flex;align-items:center;gap:13px}
.rcard .ri{flex:1;min-width:0}
.rcard .rn{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.rcard .rsub{font-size:12.5px;color:var(--text-2);margin-top:2px}
.streak{font-family:'Space Mono',monospace;font-size:11px;color:var(--tint);
  background:var(--tint-soft);padding:2px 7px;border-radius:4px;display:inline-flex;gap:3px;align-items:center}
.streak svg{width:11px;height:11px;fill:var(--tint);stroke:none}
.rcard.done{opacity:.7}
.rdone-tag{font-size:12px;font-weight:600;color:var(--green)}
.rplay{flex:0 0 auto;background:var(--tint-soft);color:var(--tint);font-size:13px;
  font-weight:600;padding:9px 15px;border-radius:4px;transition:background .12s}
.rplay:hover{background:rgba(138,84,16,.2)}
.rplay.ghost{background:var(--surface-2);color:var(--text-2)}

/* ---------------- tasks view toolbar ---------------- */
.toolbar{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.filtsum{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.fchip{font-size:12.5px;font-weight:600;color:var(--tint);background:var(--tint-soft);
  padding:5px 10px;border-radius:4px;display:inline-flex;align-items:center;gap:6px}
.fchip button{color:var(--tint);opacity:.7;font-size:14px;line-height:1;display:grid;place-items:center}
.fchip button:hover{opacity:1}

/* ---------------- board ---------------- */
.board{display:flex;gap:14px;margin-top:16px;align-items:flex-start;overflow-x:auto;padding-bottom:6px}
.bcol{flex:1 1 0;min-width:260px;background:var(--surface-2);border-radius:var(--radius);
  border:1px solid var(--sep);padding:12px;min-height:120px}
.bcol-h{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 12px}
.bcol-h .t{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.bcol-h .c{font-family:'Space Mono',monospace;font-size:11px;color:var(--text-2)}
.bcard{background:var(--surface);border:1px solid var(--sep);border-radius:4px;
  padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 2px rgba(22,36,28,.04);cursor:pointer;transition:box-shadow .12s}
.bcard:hover{box-shadow:0 2px 8px rgba(22,36,28,.08)}
.bcard.dragging{opacity:.45}
.bcard .btop{display:flex;align-items:flex-start;gap:9px}
.bcard .bt{font-size:14px;font-weight:500;line-height:1.3;flex:1}
.bcard .bm{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.bcol.drop-target{outline:2px dashed var(--tint);outline-offset:-4px}
.minitick{flex:0 0 auto;width:19px;height:19px;border-radius:50%;border:2px solid var(--text-3);
  display:grid;place-items:center;margin-top:1px}
.minitick svg{width:11px;height:11px;stroke:#fff;stroke-width:3.4;opacity:0}
.minitick.on{background:var(--ink-deep);border-color:var(--ink-deep)}
.minitick.on svg{opacity:1}

/* ---------------- week ---------------- */
.wk-strip{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.wk-day{flex:1 1 0;min-width:64px;text-align:center;padding:10px 6px;border-radius:4px;
  background:var(--surface);border:1px solid var(--sep);transition:all .12s}
.wk-day:hover{border-color:var(--sep-strong)}
.wk-day.today{border-color:var(--tint)}
.wk-day.sel{background:var(--ink-deep);border-color:var(--ink-deep)}
.wk-day .wd{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.wk-day .wn{font-size:20px;font-weight:600;margin-top:3px}
.wk-day .wc{width:5px;height:5px;border-radius:50%;background:var(--accent);margin:5px auto 0}
.wk-day.sel .wd,.wk-day.sel .wn{color:#fff}
.wk-day.sel .wc{background:#fff}
.wk-day.today .wn{color:var(--tint)}
.wk-day.today.sel .wn{color:#fff}

/* ---------------- view menu popover ---------------- */
.pop{position:fixed;z-index:56;width:320px;max-width:calc(100vw - 24px);
  background:var(--surface);border:1px solid var(--sep-strong);border-radius:4px;
  box-shadow:0 16px 48px rgba(22,36,28,.22);overflow:hidden;
  opacity:0;transform:translateY(-6px);transition:opacity .16s,transform .16s var(--ease)}
.pop.show{opacity:1;transform:translateY(0)}
.pop-in{max-height:min(72vh,560px);overflow-y:auto;padding:6px}
.pop-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:4px}
.pop-row + .pop-row{box-shadow:inset 0 1px 0 var(--sep)}
.pop-row .k{font-size:14px;font-weight:600}
.pop-sel{position:relative}
.pop-sel select{background:var(--surface-2);border:1px solid var(--sep-strong);border-radius:4px;
  padding:8px 30px 8px 12px;font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer}
.pop-sel::after{content:"";position:absolute;right:11px;top:50%;width:7px;height:7px;
  border-right:2px solid var(--text-2);border-bottom:2px solid var(--text-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.pop-seg{display:flex;background:var(--sep);border-radius:4px;padding:3px;gap:3px}
.pop-seg button{padding:7px 12px;border-radius:4px;font-size:13px;font-weight:600;color:var(--text-2)}
.pop-seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(22,36,28,.12)}
.pop-reset{width:100%;text-align:center;color:var(--red);font-size:14px;font-weight:600;padding:12px}

/* ---------------- switch ---------------- */
.switch{width:44px;height:27px;border-radius:4px;background:var(--sep-strong);position:relative;transition:background .2s;flex:0 0 auto}
.switch.on{background:var(--ink-deep)}
.switch i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:4px;background:var(--paper);box-shadow:0 1px 3px rgba(22,36,28,.25);transition:left .2s}
.switch.on i{left:20px}

/* ---------------- sheet / modal ---------------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(22,36,28,.42);opacity:0;transition:opacity .3s var(--ease)}
.scrim.show{opacity:1}
.sheet{position:fixed;z-index:51;background:var(--bg);
  left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;
  width:min(560px,calc(100vw - 40px));max-height:88vh;border-radius:4px;
  display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(22,36,28,.3);
  transition:transform .28s var(--ease),opacity .22s}
.sheet.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.sheet-grab{display:none}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;flex:0 0 auto}
.sheet-hd .st{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:20px}
.sheet-x{font-size:14px;font-weight:600;color:var(--tint);padding:6px 8px}
.sheet-body{overflow-y:auto;padding:0 18px 18px;-webkit-overflow-scrolling:touch}
@media(max-width:640px){
  .sheet{left:0;right:0;bottom:0;top:auto;transform:translateY(100%);width:100%;
    max-height:92vh;border-radius:4px 4px 0 0}
  .sheet.show{transform:translateY(0)}
  .sheet-grab{display:block;width:38px;height:5px;border-radius:4px;background:var(--sep-strong);margin:9px auto 0;flex:0 0 auto}
  .sheet-body{padding-bottom:calc(20px + var(--safe-bottom))}
}

.field{margin-bottom:15px}
.field > label{display:block;font-size:12px;font-weight:700;color:var(--text-2);
  text-transform:uppercase;letter-spacing:.03em;margin-bottom:7px}
.field input[type=text],.field textarea,.field .titlein,.field input[type=date],.field input[type=datetime-local],.field input[type=url],.field input[type=time]{
  width:100%;background:var(--surface);border:1px solid var(--sep-strong);border-radius:4px;padding:11px 13px;font-size:15px}
.field textarea{resize:vertical;min-height:60px;line-height:1.4}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--tint)}
.titlein{font-size:18px !important;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--sep-strong);border-radius:4px;
  padding:9px 13px;font-size:14px;font-weight:500;color:var(--text);transition:all .12s}
.chip:hover{background:var(--surface-2)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink-deep);border-color:var(--ink-deep);color:var(--paper)}
.chip.sm{padding:7px 11px;font-size:13px}
.chip .cd{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}
.seg{display:flex;background:var(--sep);border-radius:4px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px;border-radius:4px;font-size:14px;font-weight:500;color:var(--text-2);transition:all .15s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(22,36,28,.1)}
.subrow{display:flex;align-items:center;gap:10px;padding:7px 0}
.subrow .sx{color:var(--text-3);font-size:20px;padding:0 4px;flex:0 0 auto}
.subrow input{flex:1;background:transparent;border:none;border-bottom:1px solid var(--sep);padding:6px 2px;font-size:14.5px}
.subrow input:focus{outline:none;border-bottom-color:var(--tint)}
.addline{color:var(--tint);font-size:14px;font-weight:600;padding:8px 2px;display:inline-flex;gap:6px;align-items:center}
.addline svg{width:16px;height:16px;stroke:var(--tint);stroke-width:2.4;fill:none}
.sheet-actions{display:flex;gap:10px;padding:14px 0 4px}
.btn{flex:1;padding:13px;border-radius:4px;font-size:15px;font-weight:600;text-align:center;transition:all .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ink-deep);color:var(--paper)}
.btn.primary:hover{background:var(--accent-deep)}
.btn.ghost{background:var(--surface);border:1px solid var(--sep-strong);color:var(--text)}
.btn.danger{background:transparent;color:var(--red);flex:0 0 auto;padding:13px 18px}
.row-link{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface);border:1px solid var(--sep);border-radius:4px;
  padding:12px 14px;margin-bottom:9px;font-size:14.5px;font-weight:500}
.row-link .chev{color:var(--text-3);display:flex;align-items:center}
.row-link .chev svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none}

/* ---------------- manager rows (clients / people) ---------------- */
.mgr{display:flex;align-items:center;gap:11px;padding:9px 0}
.mgr + .mgr{box-shadow:inset 0 1px 0 var(--sep)}
.mgr .sw{width:26px;height:26px;border-radius:4px;flex:0 0 auto;border:1px solid rgba(22,36,28,.12);position:relative;cursor:pointer;overflow:hidden}
.mgr .sw input{position:absolute;inset:0;opacity:0;cursor:pointer;padding:0;border:none}
.mgr .nm{flex:1;background:transparent;border:none;border-bottom:1px solid transparent;padding:6px 2px;font-size:15px;font-weight:500}
.mgr .nm:focus{outline:none;border-bottom-color:var(--tint)}
.mgr .del{color:var(--text-3);font-size:20px;padding:2px 6px;flex:0 0 auto}
.mgr .del:hover{color:var(--red)}
.swatchrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.swatch.on{border-color:var(--text);box-shadow:0 0 0 2px var(--surface) inset}

/* ---------------- attachments ---------------- */
.attach{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--sep);
  border-radius:4px;padding:9px 11px;margin-bottom:8px;font-size:14px}
.attach .ai{width:16px;height:16px;stroke:var(--tint);fill:none;stroke-width:2;flex:0 0 auto}
.attach a,.attach .an{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:500;text-decoration:none}
.attach a:hover{color:var(--tint)}
.attach .asz{font-family:'Space Mono',monospace;font-size:11px;color:var(--text-3)}
.attach .ax{color:var(--text-3);font-size:18px;padding:0 4px;flex:0 0 auto}
.attach .ax:hover{color:var(--red)}
.attach-add{display:flex;gap:8px;margin-top:2px}

/* ---------------- focus overlay ---------------- */
.focus{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,var(--ink-deep),var(--ink-deep-2) 55%,#0E1712);
  color:var(--paper);display:none;flex-direction:column;
  padding:calc(var(--safe-top) + 14px) 22px calc(var(--safe-bottom) + 24px)}
.focus.show{display:flex}
.focus-in{max-width:640px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
.focus-top{display:flex;justify-content:space-between;align-items:center}
.focus-close{color:rgba(241,244,236,.7);font-size:15px;font-weight:600;padding:8px}
.focus-count{font-family:'Space Mono',monospace;font-size:12px;color:rgba(241,244,236,.55);letter-spacing:.08em}
.focus-mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:20px}
.focus-client{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(241,244,236,.6);display:flex;align-items:center;gap:8px}
.focus-title{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:34px;line-height:1.18;max-width:440px}
.focus-timer{font-family:'Space Mono',monospace;font-size:54px;letter-spacing:.02em;color:var(--paper);font-weight:400}
.focus-timer .sep{opacity:.5}
.focus-track{width:220px;height:5px;border-radius:4px;background:rgba(241,244,236,.18);overflow:hidden;margin-top:-8px}
.focus-track > i{display:block;height:100%;background:var(--accent);width:0}
.focus-checks{width:100%;max-width:360px;text-align:left}
.focus-check{display:flex;gap:10px;align-items:center;padding:8px 0;color:rgba(241,244,236,.85);font-size:15px}
.focus-check .fb{width:20px;height:20px;border-radius:4px;border:1.5px solid rgba(241,244,236,.4);display:grid;place-items:center;flex:0 0 auto}
.focus-check.done .fb{background:var(--accent);border-color:var(--accent)}
.focus-check.done span{text-decoration:line-through;opacity:.5}
.focus-check .fb svg{width:12px;height:12px;stroke:var(--ink-deep);stroke-width:3;fill:none;opacity:0}
.focus-check.done .fb svg{opacity:1}
.focus-actions{display:flex;gap:12px;align-items:center;justify-content:center}
.focus-btn{padding:14px 26px;border-radius:4px;font-size:16px;font-weight:600}
.focus-btn.main{background:var(--accent-soft);color:var(--ink-deep);min-width:180px;text-align:center}
.focus-btn.main:hover{background:var(--accent)}
.focus-btn.sec{background:rgba(241,244,236,.12);color:var(--paper)}
.focus-mins{display:flex;gap:8px;justify-content:center;margin-bottom:4px}
.focus-min{font-family:'Space Mono',monospace;font-size:13px;padding:6px 12px;border-radius:4px;background:rgba(241,244,236,.1);color:rgba(241,244,236,.8)}
.focus-min.on{background:var(--accent-soft);color:var(--ink-deep)}

/* ---------------- toast ---------------- */
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(140%);bottom:calc(20px + var(--safe-bottom));z-index:70;
  width:min(440px,calc(100vw - 32px));background:var(--ink-deep);color:var(--paper);
  border-radius:4px;padding:13px 16px;display:flex;align-items:center;gap:12px;
  box-shadow:0 8px 30px rgba(22,36,28,.35);opacity:0;transition:transform .32s var(--ease),opacity .2s}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast .tt{flex:1;font-size:14px}
.toast .tu{font-weight:600;font-size:14px;color:var(--accent-soft);padding:4px 6px}

@media(max-width:640px){
  .topbar{padding-left:14px;padding-right:14px}
  .topbar-in{flex-wrap:wrap;gap:10px}
  .brand{flex:1}
  .tabs{order:3;width:100%;justify-content:space-between}
  .tabs button{flex:1;text-align:center}
  .tbtn .lbl{display:none}
  .tbtn{padding:0;width:38px;justify-content:center}
  .tbtn.accent{width:38px}
  .page{padding:16px 14px 90px}
  .hd h1{font-size:28px}
  .toast{bottom:calc(18px + var(--safe-bottom))}
}

/* ================================================================ v4 additions */
:root{--p1:#B23A2E;--p2:#C8741A;--p3:#3569A8;--p4:#8A948B}
/* priority ticks, P1 red, P2 orange, P3 blue, P4 plain */
.tick.p1,.minitick.p1{border-color:var(--p1);background:rgba(178,58,46,.07)}
.tick.p2,.minitick.p2{border-color:var(--p2);background:rgba(200,116,26,.07)}
.tick.p3,.minitick.p3{border-color:var(--p3);background:rgba(53,105,168,.07)}
.tick.p1.on{background:var(--p1);border-color:var(--p1)}
.tick.p2.on{background:var(--p2);border-color:var(--p2)}
.tick.p3.on{background:var(--p3);border-color:var(--p3)}
.tick:hover svg{opacity:.45;stroke:var(--text-3)}
.tick.p1:hover svg{stroke:var(--p1)}.tick.p2:hover svg{stroke:var(--p2)}.tick.p3:hover svg{stroke:var(--p3)}
.tick.on:hover svg,.tick.on svg{opacity:1;stroke:#fff}
.tick.pop-anim{animation:tickpop .32s var(--ease)}
@keyframes tickpop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.row.leaving{animation:rowout .34s var(--ease) forwards}
@keyframes rowout{to{opacity:0;transform:translateX(14px)}}
.notedot{flex:0 0 auto;width:23px;height:23px;display:grid;place-items:center;color:var(--text-3)}
.notedot svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.row.note .rtitle{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:14px;letter-spacing:.01em;color:var(--text-2)}
.rdesc{font-size:13px;color:var(--text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pflag{display:inline-flex;align-items:center;gap:3px;font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:4px}
.pflag svg{width:11px;height:11px;fill:currentColor;stroke:none}
.pflag.p1{color:var(--p1);background:rgba(178,58,46,.1)}
.pflag.p2{color:var(--p2);background:rgba(200,116,26,.12)}
.pflag.p3{color:var(--p3);background:rgba(53,105,168,.1)}
.pill.dl{color:var(--text-2);background:var(--surface-2);border:1px solid var(--sep)}
.pill.dl svg{stroke:var(--text-2)}
.pill.dl.soon{color:var(--p2);background:rgba(200,116,26,.1);border-color:transparent}
.pill.dl.soon svg{stroke:var(--p2)}
.pill.dl.late{color:var(--red);background:rgba(178,58,46,.1);border-color:transparent}
.pill.dl.late svg{stroke:var(--red)}
.pill.hid{color:var(--text-2);background:var(--sep)}
.pill.hid svg{stroke:var(--text-2)}
.lblchip .ld{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:0}

/* checklist progress pill on rows */
.ckp{display:inline-flex;align-items:center;gap:7px;padding:3px 8px 3px 7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--sep);font-family:'Space Mono',monospace;font-size:10.5px;color:var(--text-2);transition:background .12s,border-color .12s}
.ckp:hover{border-color:var(--sep-strong);background:var(--parchment)}
.ckp .tr{width:44px;height:5px;border-radius:3px;background:var(--sep);overflow:hidden;display:block}
.ckp .tr i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s var(--ease)}
.ckp.full .tr i{background:var(--green)}
.ckp svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4;transition:transform .2s}
.ckp.open svg{transform:rotate(90deg)}
/* inline checklist under a row */
.rck{margin:8px 0 2px;padding:6px 0 2px;border-top:1px dashed var(--sep)}
.rck .ck{min-height:30px}

/* ---------------- checklist (sheet + inline) ---------------- */
.ckhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.ckhead .ckn{font-family:'Space Mono',monospace;font-size:12px;color:var(--text-2);white-space:nowrap}
.ckhead .cktrack{flex:1;height:8px;border-radius:4px;background:var(--sep);overflow:hidden}
.ckhead .cktrack i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-soft));border-radius:4px;transition:width .45s var(--ease)}
.ckhead.full .cktrack i{background:var(--green)}
.ckhead .ckpct{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;min-width:42px;text-align:right}
.cklist{background:var(--surface);border:1px solid var(--sep);border-radius:var(--radius);padding:4px 6px}
.ck{display:flex;align-items:flex-start;gap:6px;padding:4px 2px 4px calc(var(--d,0) * 26px);border-radius:4px;position:relative;transition:background .12s}
.ck:hover{background:var(--paper)}
.ck.dragging{opacity:.4}
.ck.drop-before{box-shadow:inset 0 2px 0 var(--tint)}
.ck.drop-after{box-shadow:inset 0 -2px 0 var(--tint)}
.ck-fold{flex:0 0 auto;width:18px;height:26px;display:grid;place-items:center;color:var(--text-3);visibility:hidden}
.ck-fold.has{visibility:visible}
.ck-fold svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.6;transition:transform .18s}
.ck-fold.open svg{transform:rotate(90deg)}
.ck-box{flex:0 0 auto;width:20px;height:20px;margin-top:3px;border-radius:50%;border:1.8px solid var(--text-3);display:grid;place-items:center;background:var(--surface);transition:all .15s}
.ck-box svg{width:11px;height:11px;stroke:#fff;stroke-width:3.4;fill:none;opacity:0}
.ck-box:hover{border-color:var(--ink-deep)}
.ck-box:hover svg{opacity:.35;stroke:var(--ink-deep)}
.ck-box.on{background:var(--green);border-color:var(--green)}
.ck-box.on svg{opacity:1;stroke:#fff}
.ck-box.pop-anim{animation:tickpop .3s var(--ease)}
.ck-text{flex:1;min-width:0;border:none;background:transparent;resize:none;overflow:hidden;font-size:14.5px;line-height:1.45;padding:3px 2px;min-height:26px;color:var(--text);font-family:inherit;display:block;width:100%}
.ck-text:focus{outline:none;background:var(--surface);box-shadow:0 0 0 1px var(--tint);border-radius:4px}
div.ck-text{white-space:pre-wrap;word-break:break-word;cursor:default}
.ck.done .ck-text{color:var(--text-3);text-decoration:line-through;text-decoration-color:rgba(92,106,94,.5)}
.ck-kids{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-3);margin-top:6px;flex:0 0 auto}
.ck-more,.ck-grip{flex:0 0 auto;width:26px;height:26px;display:grid;place-items:center;color:var(--text-3);border-radius:4px;opacity:0;transition:opacity .12s}
.ck:hover .ck-more,.ck:hover .ck-grip,.ck:focus-within .ck-more,.ck:focus-within .ck-grip{opacity:1}
.ck-more:hover{background:var(--sep)}
.ck-more svg,.ck-grip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.ck-grip{cursor:grab;touch-action:none}
@media(hover:none){.ck-more,.ck-grip{opacity:.6}}
.ckadd{display:flex;align-items:flex-start;gap:8px;padding:6px 2px 4px 26px}
.ckadd .plus{width:20px;height:20px;margin-top:3px;border-radius:50%;display:grid;place-items:center;color:var(--tint);flex:0 0 auto}
.ckadd .plus svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.4;fill:none}
.ckadd textarea{flex:1;border:none;background:transparent;resize:none;font-size:14.5px;padding:3px 2px;min-height:26px;line-height:1.45;font-family:inherit;overflow:hidden}
.ckadd textarea:focus{outline:none}
.ckadd textarea::placeholder{color:var(--tint);font-weight:600}
.cktools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.cktools .addline{padding:4px 2px}
.cktools .sp{flex:1}
.kbd{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-3)}
.ckmenu{position:fixed;z-index:57;background:var(--surface);border:1px solid var(--sep-strong);border-radius:4px;box-shadow:0 12px 36px rgba(22,36,28,.2);padding:4px;min-width:190px}
.ckmenu button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 11px;font-size:13.5px;font-weight:500;border-radius:4px;text-align:left}
.ckmenu button:hover{background:var(--surface-2)}
.ckmenu button.danger{color:var(--red)}
.ckmenu button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex:0 0 auto;color:var(--text-2)}
.ckmenu hr{border:none;border-top:1px solid var(--sep);margin:4px 0}

/* ---------------- wide task sheet ---------------- */
.sheet.wide{width:min(1000px,calc(100vw - 40px));max-height:92vh}
.sheet-hd .crumb{display:flex;align-items:center;gap:8px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);min-width:0}
.sheet-hd .crumb span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-hd .hdr{display:flex;align-items:center;gap:6px}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) 310px;grid-template-areas:"top side" "bot side";gap:0 26px;align-items:start}
.tgrid .ttop{grid-area:top}
.tgrid .tbot{grid-area:bot}
.tgrid .tside{grid-area:side;background:var(--surface-2);border:1px solid var(--sep);border-radius:var(--radius);padding:14px 14px 4px;position:sticky;top:0}
.tside .field{margin-bottom:14px}
.tside .field > label{font-size:11px;margin-bottom:6px}
.tside .chip.sm{padding:6px 9px;font-size:12.5px}
.tside .chips{gap:6px}
.tside input[type=date],.tside input[type=time],.tside input[type=text],.tside input[type=number],.tside input[type=url]{padding:8px 10px !important;font-size:14px !important}
.twhen{display:flex;gap:6px}
.twhen input[type=date]{flex:1 1 auto;min-width:0}
.twhen input[type=time]{flex:0 0 108px}
.clr{flex:0 0 auto;color:var(--text-3);font-size:18px;padding:0 6px}
.clr:hover{color:var(--red)}
.titlewrap{display:flex;gap:12px;align-items:flex-start;margin:2px 0 8px}
.titlewrap .tick{margin-top:9px;width:24px;height:24px}
.titleta{flex:1;border:1px solid transparent;background:transparent;border-radius:4px;resize:none;overflow:hidden;
  font-family:'Space Grotesk',system-ui,sans-serif;font-weight:600;font-size:22px;line-height:1.25;padding:6px 8px;color:var(--text)}
.titleta:hover{border-color:var(--sep)}
.titleta:focus{outline:none;border-color:var(--tint);background:var(--surface)}
.notehint{font-size:12px;color:var(--text-3);margin:-4px 0 10px 44px}
.tsec{margin:18px 0 0}
.tsec-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
.tsec-h .cnt{font-family:'Space Mono',monospace;font-weight:400;color:var(--text-3);text-transform:none}
.tsec-h .sp{flex:1}
.tsec-h .lnk{font-size:12px;font-weight:600;color:var(--tint);text-transform:none;letter-spacing:0}
.prio4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.prio4 button{display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 4px;border-radius:4px;border:1px solid var(--sep-strong);background:var(--surface);font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--text-2)}
.prio4 button svg{width:12px;height:12px}
.prio4 button.on{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.prio4 .p1{color:var(--p1)}.prio4 .p2{color:var(--p2)}.prio4 .p3{color:var(--p3)}.prio4 .p4{color:var(--text-2)}
.prio4 button svg{fill:currentColor;stroke:none}
.rep-ed{background:var(--surface);border:1px solid var(--sep);border-radius:4px;padding:10px;margin-top:8px}
.rep-ed .rline{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:13px;color:var(--text-2);flex-wrap:wrap}
.rep-ed input[type=number]{width:62px;background:var(--surface);border:1px solid var(--sep-strong);border-radius:4px;padding:7px 8px;font-size:14px}
.rep-ed .pop-sel select{padding:7px 28px 7px 10px;font-size:13px}
.rep-sum{font-size:12.5px;color:var(--tint);margin-top:6px;font-weight:600}
.lblpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lblpick .chip.sm{border-style:dashed;color:var(--text-2)}
.lchip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 8px;border-radius:4px;font-size:12.5px;font-weight:600;background:var(--surface);border:1px solid var(--sep-strong)}
.lchip .lsw{width:12px;height:12px;border-radius:50%;position:relative;overflow:hidden;cursor:pointer;flex:0 0 auto}
.lchip .lsw input{position:absolute;inset:-4px;opacity:0;cursor:pointer;border:none;padding:0}
.lchip button{color:var(--text-3);font-size:15px;line-height:1;padding:0 2px}
.lchip button:hover{color:var(--red)}

/* description / markdown */
.desc-view{min-height:40px;padding:8px 10px;border-radius:4px;border:1px solid transparent;cursor:text;color:var(--text);font-size:14.5px}
.desc-view:hover{border-color:var(--sep)}
.desc-view.empty{color:var(--text-3)}
.desc-ed{border:1px solid var(--tint);border-radius:4px;background:var(--surface);overflow:hidden}
.desc-ed textarea{width:100%;border:none;resize:vertical;min-height:120px;padding:10px 12px;font-size:14.5px;line-height:1.5;background:transparent;font-family:inherit}
.desc-ed textarea:focus{outline:none}
.mdbar{display:flex;gap:2px;padding:4px;border-bottom:1px solid var(--sep);background:var(--paper)}
.mdbar button{min-width:30px;height:28px;border-radius:4px;font-size:13px;font-weight:700;color:var(--text-2);padding:0 7px}
.mdbar button:hover{background:var(--sep)}
.mdbar .sp{flex:1}
.mdbar .hint{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-3);align-self:center;padding-right:6px}
.md{line-height:1.55;word-break:break-word}
.md p{margin:0 0 8px}
.md p:last-child{margin-bottom:0}
.md h4,.md h5,.md h6{font-family:'Space Grotesk',sans-serif;margin:10px 0 6px;font-weight:600}
.md h4{font-size:18px}.md h5{font-size:16px}.md h6{font-size:14.5px}
.md ul,.md ol{margin:0 0 8px;padding-left:22px}
.md li{margin:2px 0}
.md li.task{list-style:none;margin-left:-20px}
.md li.task input{margin-right:6px;vertical-align:-1px;-webkit-appearance:auto;appearance:auto}
.md code{font-family:'Space Mono',monospace;font-size:12.5px;background:var(--surface-2);border:1px solid var(--sep);padding:1px 5px;border-radius:4px}
.md pre{background:var(--ink-deep);color:var(--paper);padding:10px 12px;border-radius:4px;overflow:auto;font-size:12.5px}
.md pre code{background:none;border:none;color:inherit;padding:0}
.md blockquote{margin:0 0 8px;padding:2px 12px;border-left:3px solid var(--accent);color:var(--text-2)}
.md a{color:var(--tint);text-decoration:underline;text-underline-offset:2px}
.md hr{border:none;border-top:1px solid var(--sep-strong);margin:10px 0}
.mention{color:var(--tint);background:var(--tint-soft);border-radius:4px;padding:0 3px;font-weight:600}

/* comments */
.cm{display:flex;gap:10px;padding:10px 0}
.cm + .cm{box-shadow:inset 0 1px 0 var(--sep)}
.av{flex:0 0 auto;width:30px;height:30px;border-radius:4px;background:var(--ink-deep);color:var(--paper);display:grid;place-items:center;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px}
.cm-b{flex:1;min-width:0}
.cm-h{display:flex;align-items:baseline;gap:8px;font-size:13px}
.cm-h b{font-weight:700}
.cm-h .t{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--text-3)}
.cm-h .x{margin-left:auto;color:var(--text-3);font-size:16px;padding:0 4px;opacity:0}
.cm:hover .cm-h .x{opacity:1}
@media(hover:none){.cm-h .x{opacity:.6}}
.cm-t{font-size:14px;margin-top:3px}
.cm audio{width:100%;max-width:320px;height:36px;margin-top:6px}
.cm .attach{margin:6px 0 0}
.reacts{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;align-items:center}
.react{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:2px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--sep-strong)}
.react.on{background:var(--tint-soft);border-color:var(--tint);color:var(--tint)}
.react-add{font-size:12px;color:var(--text-3);padding:2px 7px;border-radius:12px;border:1px dashed var(--sep-strong)}
.emo{display:inline-flex;gap:2px;background:var(--surface);border:1px solid var(--sep-strong);border-radius:14px;padding:2px 4px}
.emo button{font-size:16px;padding:1px 4px;border-radius:8px}
.emo button:hover{background:var(--surface-2)}
.composer{margin-top:10px;background:var(--surface);border:1px solid var(--sep-strong);border-radius:var(--radius)}
.composer:focus-within{border-color:var(--tint)}
.composer textarea{width:100%;border:none;background:transparent;resize:none;min-height:44px;padding:10px 12px;font-size:14px;font-family:inherit;line-height:1.45}
.composer textarea:focus{outline:none}
.comp-bar{display:flex;align-items:center;gap:4px;padding:4px 6px 6px 6px}
.comp-bar .sp{flex:1}
.comp-bar .post{background:var(--ink-deep);color:var(--paper);font-size:13px;font-weight:600;padding:7px 14px;border-radius:4px}
.comp-bar .post:disabled{opacity:.35;cursor:default}
.comp-bar .post:not(:disabled):hover{background:var(--accent-deep)}
.rec{color:var(--red);font-family:'Space Mono',monospace;font-size:11.5px;display:inline-flex;align-items:center;gap:6px}
.rec i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.mentions{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 8px}
.pending{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 6px}
.pending .lchip{font-weight:500}
/* activity */
details.act summary{cursor:pointer;list-style:none;font-size:12px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:6px}
details.act summary::-webkit-details-marker{display:none}
details.act summary svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.6;transition:transform .18s}
details.act[open] summary svg{transform:rotate(90deg)}
.actlist{margin-top:8px;border-left:2px solid var(--sep);padding-left:14px}
.actitem{position:relative;font-size:13px;color:var(--text-2);padding:4px 0}
.actitem::before{content:"";position:absolute;left:-19px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--surface);border:2px solid var(--sep-strong)}
.actitem.done::before{background:var(--green);border-color:var(--green)}
.actitem .t{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--text-3);margin-left:6px}

/* ---------------- upcoming ---------------- */
.pager{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.pager .pbtn{width:36px;height:36px;border-radius:4px;border:1px solid var(--sep-strong);background:var(--surface);display:grid;place-items:center}
.pager .pbtn:hover{background:var(--surface-2)}
.pager .pbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}
.pager .prange{font-family:'Space Mono',monospace;font-size:12.5px;letter-spacing:.04em;color:var(--text-2);min-width:120px;text-align:center}
.pager .ptoday{font-size:13px;font-weight:600;color:var(--tint);padding:6px 10px;border-radius:4px}
.pager .ptoday:hover{background:var(--tint-soft)}
.pager .sp{flex:1}
.pager .seg{width:210px}
.pager .seg button,.seg button{white-space:nowrap}
.wk-day .wcn{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-2);margin-top:3px;height:14px}
.wk-day.sel .wcn{color:rgba(241,244,236,.75)}
.wk-day.off{background:var(--paper-deep)}
.wk-day.sel.off{background:var(--ink-deep)}
.wk-day .wbar{height:3px;border-radius:2px;background:var(--sep);margin:5px 10px 0;overflow:hidden}
.wk-day .wbar i{display:block;height:100%;background:var(--accent)}
.wk-day.sel .wbar{background:rgba(241,244,236,.2)}
.dayhd{display:flex;align-items:baseline;gap:8px}
.dayhd .add{margin-left:auto;font-size:12px;font-weight:600;color:var(--tint);text-transform:none;letter-spacing:0;display:inline-flex;align-items:center;gap:4px}
.dayhd .add svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.4;fill:none}
.dayhd .tag{font-family:'Space Mono',monospace;font-size:10px;font-weight:400;color:var(--tint);text-transform:uppercase;letter-spacing:.08em}
.quiet{font-size:13px;color:var(--text-3);padding:10px 15px;background:var(--surface);border:1px dashed var(--sep-strong);border-radius:var(--radius)}

/* ---------------- calendar ---------------- */
.calbar{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.months{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px}
.months button{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:4px;color:var(--text-2);border:1px solid transparent}
.months button:hover{background:var(--surface)}
.months button.on{background:var(--ink-deep);color:var(--paper)}
.months button.now{border-color:var(--tint)}
.months button .mc{display:block;font-size:9px;opacity:.65;margin-top:1px}
.cal{margin-top:14px;background:var(--surface);border:1px solid var(--sep);border-radius:var(--radius);overflow:hidden}
.cal-h{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface-2);border-bottom:1px solid var(--sep)}
.cal-h div{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);padding:8px 8px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cc{min-height:112px;padding:6px 6px 6px;border-right:1px solid var(--sep);border-bottom:1px solid var(--sep);cursor:pointer;position:relative;transition:background .12s;text-align:left;display:flex;flex-direction:column;gap:3px;align-items:stretch}
.cc:nth-child(7n){border-right:none}
.cc:hover{background:var(--paper)}
.cc.out{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(22,36,28,.025) 6px 12px)}
.cc.out .cn{color:var(--text-3)}
.cc.off{background:var(--paper)}
.cc.vac{background:rgba(217,138,43,.07)}
.cc.sel{box-shadow:inset 0 0 0 2px var(--ink-deep)}
.cc .cn{font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.cc .cn .num{width:24px;height:24px;display:grid;place-items:center;border-radius:4px}
.cc.today .cn .num{background:var(--accent-deep);color:#fff}
.cc .cn .cnt{font-family:'Space Mono',monospace;font-size:10px;font-weight:400;color:var(--text-3)}
.ci{font-size:11.5px;line-height:1.25;padding:2px 5px 2px 6px;border-radius:3px;background:var(--surface-2);border-left:3px solid var(--c,var(--text-3));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.ci.done{color:var(--text-3);text-decoration:line-through}
.ci.dl{background:rgba(178,58,46,.08);border-left-color:var(--red);color:var(--red)}
.ci .tm{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-2);margin-right:4px}
.cmore{font-family:'Space Mono',monospace;font-size:10px;color:var(--text-2);padding-left:6px}
.cdots{display:none;gap:3px;flex-wrap:wrap;padding:2px}
.cdots i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--accent))}
@media(max-width:700px){
  .cc{min-height:62px;padding:4px}
  .cc .ci,.cc .cmore{display:none}
  .cc .cdots{display:flex}
  .cc .cn .cnt{display:none}
  .cal-h div{padding:7px 4px;text-align:center}
  .cc .cn{justify-content:center}
}

/* ---------------- progress ---------------- */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--sep);border-radius:var(--radius);padding:16px 18px}
.card.dark{background:linear-gradient(160deg,var(--ink-deep),var(--ink-deep-2));color:var(--paper);border-color:var(--ink-deep)}
.card .ey{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2)}
.card.dark .ey{color:rgba(241,244,236,.6)}
.card .big{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:40px;line-height:1.05;margin-top:6px;letter-spacing:-.01em}
.card .lvl{font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:22px;margin-top:2px;color:var(--accent-soft)}
.card .sub{font-size:13px;color:var(--text-2);margin-top:6px}
.card.dark .sub{color:rgba(241,244,236,.7)}
.ktrack{height:7px;border-radius:4px;background:rgba(241,244,236,.16);overflow:hidden;margin-top:12px}
.ktrack i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .6s var(--ease)}
.klevels{display:flex;justify-content:space-between;margin-top:10px;gap:4px}
.klevels span{flex:1;height:4px;border-radius:2px;background:rgba(241,244,236,.15)}
.klevels span.on{background:var(--accent-soft)}
.streakbig{display:flex;align-items:center;gap:12px;margin-top:8px}
.streakbig .flame{width:44px;height:44px;border-radius:4px;background:var(--tint-soft);display:grid;place-items:center;flex:0 0 auto}
.streakbig .flame svg{width:24px;height:24px;fill:var(--accent)}
.streakbig .flame.cold{background:var(--sep)}
.streakbig .flame.cold svg{fill:var(--text-3)}
.streakbig .n{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:30px;line-height:1}
.streakbig .l{font-size:12.5px;color:var(--text-2)}
.goal{margin-top:12px}
.goal-top{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:600;margin-bottom:6px}
.goal-top .v{font-family:'Space Mono',monospace;font-size:12px;color:var(--text-2);font-weight:400}
.goal-track{height:9px;border-radius:5px;background:var(--sep);overflow:hidden}
.goal-track i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .5s var(--ease)}
.goal.met .goal-track i{background:var(--green)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--sep-strong);border-radius:4px;overflow:hidden;background:var(--surface)}
.stepper button{width:30px;height:28px;font-size:16px;font-weight:600;color:var(--text-2)}
.stepper button:hover{background:var(--surface-2)}
.stepper span{min-width:34px;text-align:center;font-family:'Space Mono',monospace;font-size:13px}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart text{font-family:'Space Mono',monospace;font-size:10px;fill:var(--text-2)}
.chart .val{font-size:10.5px;fill:var(--text)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0}
.srow + .srow{box-shadow:inset 0 1px 0 var(--sep)}
.srow .k{font-size:14px;font-weight:600}
.srow .d{font-size:12.5px;color:var(--text-2);font-weight:400;margin-top:1px}
.dayoff{display:flex;gap:4px}
.dayoff button{width:34px;height:30px;border-radius:4px;border:1px solid var(--sep-strong);font-family:'Space Mono',monospace;font-size:11px;color:var(--text-2);background:var(--surface)}
.dayoff button.on{background:var(--ink-deep);color:var(--paper);border-color:var(--ink-deep)}
.vacbanner{display:flex;gap:10px;align-items:center;background:rgba(217,138,43,.12);border:1px solid rgba(217,138,43,.35);color:var(--accent-deep);border-radius:var(--radius);padding:10px 14px;font-size:13.5px;font-weight:600;margin-top:14px}
.vacbanner svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;flex:0 0 auto}
.vacbanner button{margin-left:auto;font-size:12.5px;text-decoration:underline;color:inherit}

/* karma pill in top bar */
.kpill{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:4px;border:1px solid var(--sep-strong);background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap}
.kpill:hover{background:var(--surface-2)}
.kpill svg{width:16px;height:16px;fill:var(--accent);stroke:none}
.kpill .kl{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--text-2);font-weight:400;letter-spacing:.04em;text-transform:uppercase}
.kpill.bump{animation:tickpop .5s var(--ease)}

/* zero state */
.zero{text-align:center;padding:34px 20px 40px}
.zero svg.art{width:150px;height:auto;display:block;margin:0 auto 14px}
.zero .fr{font-size:24px;display:block;margin-bottom:4px}
.zero .tag{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--tint);text-transform:uppercase}
.zero p{margin:8px auto 0;font-size:14px;color:var(--text-2);max-width:320px}
.goalline{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--sep);font-size:12.5px;color:var(--text-2)}
.goalline .sp{flex:1}
.goalline b{color:var(--text);font-weight:600}
.toast .tu{white-space:nowrap}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80}

@media(max-width:800px){
  .tgrid{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "side" "bot"}
  .tgrid .tside{position:static;margin-top:6px}
  .cards{grid-template-columns:1fr}
}
@media(max-width:640px){
  .tabs button{padding:7px 4px;font-size:13px}
  .kpill .kl{display:none}
  .kpill{padding:0 9px}
  .pager .seg{width:100%;order:9}
  .titleta{font-size:19px}
  .mdbar .hint,.cktools .kbd{display:none}
  .mdbar{overflow-x:auto}
  .sheet.wide{width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

<script>
'use strict';
/* ============================================================ storage seam */
const mem={};
const store={
  ok:(()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}})(),
  get(k){ if(this.ok){try{return localStorage.getItem(k)}catch(e){}} return k in mem?mem[k]:null },
  set(k,v){ if(this.ok){try{localStorage.setItem(k,v);return true}catch(e){mem[k]=v;return false}} mem[k]=v;return true }
};
/* storage keys are unchanged from earlier versions so every existing board loads as is.
   pn_tb2_x is new and only holds v4 extras (goals, karma settings, label colours). */
const K={tasks:'pn_tb2_tasks',comp:'pn_tb2_comp',exc:'pn_tb2_exc',rout:'pn_tb2_rout',
  tmpl:'pn_tb2_tmpl',cfg:'pn_tb2_cfg',ui:'pn_tb2_ui',rem:'pn_tb2_rem',meet:'pn_tb2_meet',x:'pn_tb2_x'};
const OLD={tasks:'pn_taskboard_v1',cfg:'pn_taskboard_cfg_v1'};
const SCHEMA=4;

/* ============================================================ config defaults */
const DEFAULT_CLIENTS=[
  {id:'kipling',name:'Kipling India',color:'#B0552F'},
  {id:'druk',name:'Druk Asia',color:'#2F6B5E'},
  {id:'wfta',name:'WFTA',color:'#8A742C'},
  {id:'gbta',name:'GBTA',color:'#2E6F8E'},
  {id:'bluepoppy',name:'Blue Poppy Bhutan',color:'#3E5C94'},
  {id:'vtn',name:'V Travel Network',color:'#6D4C8C'},
  {id:'simplenight',name:'Simple Night',color:'#B07C1E'},
  {id:'advtravel',name:'Adventure.travel',color:'#3F7A4B'},
  {id:'hanwong',name:'Han Wong International',color:'#B23A2E'},
  {id:'personal',name:'Personal',color:'#6B665C'}
];
const DEFAULT_PEOPLE=['Pratim','Nupur','Chirag','Gautam'];
/* priority values stay as the strings older builds wrote. High is P1, Medium P2, Low P3, None P4 */
const PRIORITIES=['High','Medium','Low','None'];
const PRIO_P={High:'P1',Medium:'P2',Low:'P3',None:'P4'};
const PRIO_CLS={High:'p1',Medium:'p2',Low:'p3',None:'p4'};
const PRIO_COLOR={High:'#B23A2E',Medium:'#C8741A',Low:'#3569A8',None:'#8A948B'};
const PRIO_NAME={High:'P1 · Urgent',Medium:'P2 · High',Low:'P3 · Medium',None:'P4 · None'};
const POST_STATES=['draft','scheduled','posted'];
const SWATCHES=['#B0552F','#2F6B5E','#8A742C','#3E5C94','#6D4C8C','#6B665C','#B23A2E','#3F7A4B','#2E6F8E','#9C6B2F','#8C5A9E','#456B2F','#B07C1E','#5A4632'];
const REPEAT_PRESETS=[
  ['','Once'],['daily','Every day'],['weekdays','Weekdays'],['weekly','Weekly'],
  ['biweekly','Every 2 weeks'],['monthly','Monthly'],['monthlyWeekday','Monthly by weekday'],
  ['yearly','Yearly'],['custom','Custom']
];
const REMIND_KEYS=['none','attime','before30','due9','due18','before1d9','custom'];
const REMIND_PRESETS=[['none','None'],['attime','At due time'],['before30','30 min before'],['due9','9am on the day'],['due18','6pm on the day'],['before1d9','Day before, 9am'],['custom','Custom']];
const DOW=['SU','MO','TU','WE','TH','FR','SA'];
const DOW_LABEL={SU:'Sun',MO:'Mon',TU:'Tue',WE:'Wed',TH:'Thu',FR:'Fri',SA:'Sat'};
const MON_FIRST=['MO','TU','WE','TH','FR','SA','SU'];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const clone=o=>JSON.parse(JSON.stringify(o));
function uid(){return crypto.randomUUID?crypto.randomUUID():'t'+Date.now()+Math.random().toString(16).slice(2)}
function parseYmd(s){const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d,12,0,0))}
function ymdU(d){return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function addDaysU(dt,n){const d=new Date(dt);d.setUTCDate(d.getUTCDate()+n);return d}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function localDay(iso){const d=new Date(iso);if(isNaN(d))return String(iso||'').slice(0,10);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addLocalDays(s,n){const d=parseYmd(s);d.setUTCDate(d.getUTCDate()+n);return ymdU(d)}
function dowOf(s){return DOW[parseYmd(s).getUTCDay()]}
function mondayOf(s){const d=parseYmd(s);return addLocalDays(s,-((d.getUTCDay()+6)%7))}
function daysBetweenU(a,b){return Math.round((parseYmd(b)-parseYmd(a))/86400000)}
function clampDay(y,mi,day){const last=new Date(Date.UTC(y,mi+1,0,12)).getUTCDate();return Math.min(day,last)}
function weekIndexU(dt){const day=(dt.getUTCDay()+6)%7;const mon=addDaysU(dt,-day);return Math.floor(parseYmd(ymdU(mon))/86400000)}
function nthWeekdayPos(dt){return Math.floor((dt.getUTCDate()-1)/7)+1}
function isLastWeekday(dt){return dt.getUTCDate()+7>new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()+1,0,12)).getUTCDate()}
function clientOf(id){return CLIENTS.find(c=>c.id===id)||{id:'',name:'No client',color:'#B7AF9F'}}
function dayDiff(s){return daysBetweenU(todayStr(),s)}
function fmtDayLong(s){return parseYmd(s).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}
function fmtShort(s){return parseYmd(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function fmtDM(s){return parseYmd(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function fmtRel(s){const d=dayDiff(s);if(d===0)return'Today';if(d===1)return'Tomorrow';if(d===-1)return'Yesterday';if(d>1&&d<7)return parseYmd(s).toLocaleDateString('en-GB',{weekday:'long'});return fmtDM(s)}
function fmtMins(m){if(!m)return'';if(m<60)return m+'m';const h=Math.floor(m/60),r=m%60;return r?h+'h '+r+'m':h+'h'}
function fmtTime(t){if(!t)return'';const[h,m]=t.split(':').map(Number);if(isNaN(h))return'';const ap=h<12?'am':'pm';const h12=((h+11)%12)+1;return h12+(m?':'+pad(m):'')+' '+ap}
function addMinsToTime(t,m){const[h,mm]=t.split(':').map(Number);const tot=(h*60+mm+m+1440)%1440;return pad(Math.floor(tot/60))+':'+pad(tot%60)}
function fmtStamp(iso){const d=new Date(iso);if(isNaN(d))return'';const ds=localDay(iso);const rel=dayDiff(ds);
  const tm=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  return(rel===0?'Today':rel===-1?'Yesterday':d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}))+' '+tm}
function allLabels(){const set=new Set();tasks.forEach(t=>t.labels.forEach(l=>set.add(l)));Object.keys(X.labelColors||{}).forEach(l=>set.add(l));return[...set].sort((a,b)=>a.localeCompare(b))}
function hashStr(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function labelColor(l){return(X.labelColors&&X.labelColors[l])||SWATCHES[hashStr(l)%SWATCHES.length]}
function isNote(t){return /^\*/.test(t.title||'')}
function titleOf(t){return isNote(t)?t.title.replace(/^\*\s*/,''):t.title}
function meName(){return X.me||PEOPLE[0]||'Me'}
function initials(n){return String(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase()}
function plain(md){return String(md||'').replace(/```[\s\S]*?```/g,' ').replace(/[#>*_`~\[\]]|\(https?:[^)]*\)/g,'').replace(/^\s*[-+]\s+/gm,'').trim()}

/* ============================================================ recurrence engine */
function ruleFromPreset(key,anchor){
  if(!key)return null;
  const a=parseYmd(anchor||todayStr());
  switch(key){
    case'daily':return{freq:'DAILY',interval:1};
    case'weekdays':return{freq:'WEEKLY',interval:1,byday:WEEKDAYS.slice()};
    case'weekly':return{freq:'WEEKLY',interval:1,byday:[DOW[a.getUTCDay()]]};
    case'biweekly':return{freq:'WEEKLY',interval:2,byday:[DOW[a.getUTCDay()]]};
    case'monthly':return{freq:'MONTHLY',interval:1};
    case'monthlyWeekday':return{freq:'MONTHLY',interval:1,byday:[DOW[a.getUTCDay()]],bysetpos:isLastWeekday(a)?-1:nthWeekdayPos(a)};
    case'yearly':return{freq:'YEARLY',interval:1};
    default:return null;
  }
}
function baseMatches(rule,anchor,test){
  const a=parseYmd(anchor),t=parseYmd(test);
  if(t<a)return false;
  const iv=rule.interval||1;
  if(rule.freq==='DAILY')return daysBetweenU(anchor,test)%iv===0;
  if(rule.freq==='WEEKLY'){
    const days=(rule.byday&&rule.byday.length)?rule.byday:[DOW[a.getUTCDay()]];
    if(!days.includes(DOW[t.getUTCDay()]))return false;
    return(((weekIndexU(t)-weekIndexU(a))%iv)+iv)%iv===0;
  }
  if(rule.freq==='MONTHLY'){
    const md=(t.getUTCFullYear()-a.getUTCFullYear())*12+(t.getUTCMonth()-a.getUTCMonth());
    if(md%iv!==0)return false;
    if(rule.byday&&rule.bysetpos){
      if(DOW[t.getUTCDay()]!==rule.byday[0])return false;
      if(rule.bysetpos===-1)return isLastWeekday(t);
      return nthWeekdayPos(t)===rule.bysetpos;
    }
    return t.getUTCDate()===clampDay(t.getUTCFullYear(),t.getUTCMonth(),a.getUTCDate());
  }
  if(rule.freq==='YEARLY'){
    if((t.getUTCFullYear()-a.getUTCFullYear())%iv!==0)return false;
    if(t.getUTCMonth()!==a.getUTCMonth())return false;
    return t.getUTCDate()===clampDay(t.getUTCFullYear(),t.getUTCMonth(),a.getUTCDate());
  }
  return false;
}
const countEndMemo=new Map();
function countEnd(rule,anchor){
  const key=anchor+'|'+JSON.stringify(rule);
  if(countEndMemo.has(key))return countEndMemo.get(key);
  let n=0,cur=parseYmd(anchor),end=null,g=0;
  while(g++<4000){const s=ymdU(cur);if(baseMatches(rule,anchor,s)){n++;if(n>=rule.count){end=s;break;}}cur=addDaysU(cur,1);}
  countEndMemo.set(key,end);return end;
}
function ruleMatches(rule,anchor,test){
  if(rule.until&&test>rule.until)return false;
  if(rule.count>0){const e=countEnd(rule,anchor);if(e&&test>e)return false;}
  return baseMatches(rule,anchor,test);
}
function occurrences(task,from,to){
  let out=[];
  if(!task.rrule){ if(task.due&&task.due>=from&&task.due<=to)out.push(task.due); }
  else{
    const anchor=task.due||from;
    let cur=parseYmd(from<anchor?anchor:from);const end=parseYmd(to);let g=0;
    while(cur<=end&&g++<1200){const s=ymdU(cur);if(ruleMatches(task.rrule,anchor,s))out.push(s);cur=addDaysU(cur,1);}
  }
  exceptions.forEach(e=>{
    if(e.taskId!==task.id)return;
    if(e.action==='skip')out=out.filter(d=>d!==e.date);
    if(e.action==='move'){out=out.filter(d=>d!==e.date);if(e.newDate>=from&&e.newDate<=to)out.push(e.newDate);}
  });
  return out.sort();
}
function isCompleted(taskId,date){return completions.some(c=>c.taskId===taskId&&c.date===date)}
function nextDue(task,from){
  if(!task.rrule){
    if(!task.due)return null;
    if(task.status==='done')return null;
    return task.due;
  }
  const anchor=task.due||from;
  const lookback=addLocalDays(from,-60);
  const start=lookback<anchor?anchor:lookback;
  let cur=parseYmd(start),g=0;
  while(g++<1200){const s=ymdU(cur);
    if(ruleMatches(task.rrule,anchor,s)&&!isCompleted(task.id,s)&&!exceptions.some(e=>e.taskId===task.id&&e.action==='skip'&&e.date===s))return s;
    cur=addDaysU(cur,1);}
  return null;
}
function hiddenNow(task){return!!(task.startDate&&task.startDate>todayStr())}
function openTodayInstance(task){
  const today=todayStr();
  if(hiddenNow(task))return null;
  if(!task.rrule){
    if(task.status==='done'||task.archivedAt)return null;
    if(!task.due)return{date:today,floating:true};
    if(task.due<=today)return{date:task.due};
    return null;
  }
  const occ=occurrences(task,task.due||today,today);
  for(const d of occ){if(!isCompleted(task.id,d))return{date:d};}
  return null;
}
function ordinal(n){return n===-1?'last':['','1st','2nd','3rd','4th','5th'][n]||n+'th'}
function repeatLabel(rule){
  if(!rule)return'';
  const iv=rule.interval||1;let s;
  if(rule.freq==='DAILY')s=iv===1?'Every day':'Every '+iv+' days';
  else if(rule.freq==='WEEKLY'){
    const d=rule.byday||[];
    if(iv===1&&d.length===5&&WEEKDAYS.every(x=>d.includes(x)))s='Weekdays';
    else if(iv===1&&d.length===7)s='Every day';
    else{const names=MON_FIRST.filter(x=>d.includes(x)).map(x=>DOW_LABEL[x]).join(' ');
      s=(iv===1?'Repeats ':'Every '+iv+' wks ')+names;}
  }
  else if(rule.freq==='MONTHLY'){
    const base=iv===1?'Monthly':'Every '+iv+' months';
    s=rule.bysetpos?base+' · '+ordinal(rule.bysetpos)+' '+DOW_LABEL[rule.byday[0]]:base;
  }
  else if(rule.freq==='YEARLY')s=iv===1?'Yearly':'Every '+iv+' years';
  else s='Repeats';
  if(rule.until)s+=' · until '+fmtDM(rule.until);
  else if(rule.count)s+=' · '+rule.count+'×';
  return s;
}

/* normTask never drops a field. Anything it does not recognise is carried through untouched,
   so data written by a newer or older build survives a round trip through this one. */
function normSub(s){
  const d=Number(s.depth);
  return{...s,id:s.id||uid(),text:String(s.text),done:!!s.done,depth:d>=0&&d<=MAX_DEPTH?Math.floor(d):0};
}
function normTask(t){
  return{
    ...t,
    id:t.id||uid(),
    title:String(t.title||'Untitled'),
    client:t.client||CLIENTS[0]?.id||'personal',
    assignee:t.assignee||null,
    priority:PRIORITIES.includes(t.priority)?t.priority:'Medium',
    type:t.type==='post'?'post':'task',
    postStatus:POST_STATES.includes(t.postStatus)?t.postStatus:'draft',
    due:t.due||null,
    dueTime:/^\d\d:\d\d$/.test(t.dueTime||'')?t.dueTime:null,
    deadline:t.deadline||null,
    startDate:t.startDate||null,
    rrule:t.rrule||null,
    estimate:typeof t.estimate==='number'?t.estimate:null,
    labels:Array.isArray(t.labels)?t.labels.filter(Boolean).map(String):[],
    subtasks:Array.isArray(t.subtasks)?t.subtasks.filter(s=>s&&s.text).map(normSub):[],
    attachments:Array.isArray(t.attachments)?t.attachments.filter(a=>a&&a.url).map(a=>({...a,id:a.id||uid(),name:String(a.name||a.url),kind:a.kind==='file'?'file':'link',url:String(a.url),size:a.size||0})):[],
    remind:REMIND_KEYS.includes(t.remind)?t.remind:'none',
    remindAt:t.remindAt||null,
    notes:t.notes||null,
    status:['todo','doing','done'].includes(t.status)?t.status:'todo',
    focusOn:t.focusOn!==false,
    sortIndex:typeof t.sortIndex==='number'?t.sortIndex:0,
    routineId:t.routineId||null,
    createdAt:t.createdAt||new Date().toISOString(),
    completedAt:t.completedAt||null,
    archivedAt:t.archivedAt||null,
    resetSubs:!!t.resetSubs,
    comments:Array.isArray(t.comments)?t.comments.filter(Boolean):[],
    activity:Array.isArray(t.activity)?t.activity.filter(Boolean):[]
  };
}
function normMeeting(m){
  return{...m,id:m.id||uid(),date:m.date||todayStr(),client:m.client||null,time:m.time||'',notes:m.notes||'',done:!!m.done,createdAt:m.createdAt||new Date().toISOString()};
}
function normX(x){
  const o={...X,...(x||{})};
  o.dailyGoal=Math.max(1,Number(o.dailyGoal)||5);
  o.weeklyGoal=Math.max(1,Number(o.weeklyGoal)||25);
  if(!Array.isArray(o.daysOff))o.daysOff=[];
  if(!Array.isArray(o.vacations))o.vacations=[];
  if(!o.labelColors||typeof o.labelColors!=='object')o.labelColors={};
  if(!o.cleared||typeof o.cleared!=='object')o.cleared={date:'',keys:[]};
  if(!Array.isArray(o.cleared.keys))o.cleared.keys=[];
  return o;
}
function logAct(t,what){
  if(!t)return;
  if(!Array.isArray(t.activity))t.activity=[];
  t.activity.push({at:new Date().toISOString(),by:meName(),what});
  if(t.activity.length>80)t.activity=t.activity.slice(-80);
}

/* ---- older builds strip fields they do not know. When a snapshot from one of them arrives,
   put back the v4-only fields this device still holds, matched by task and checklist id. ---- */
const V4_TASK_FIELDS=['dueTime','startDate','comments','activity','resetSubs'];
function restoreV4Fields(incoming){
  const byId=new Map(tasks.map(t=>[t.id,t]));
  return incoming.map(raw=>{
    const it={...raw};
    const loc=byId.get(it.id);if(!loc)return it;
    V4_TASK_FIELDS.forEach(f=>{if(it[f]===undefined&&loc[f]!==undefined)it[f]=loc[f];});
    if(it.priority==='Medium'&&loc.priority==='None')it.priority='None';
    if(it.remind==='none'&&['attime','before30'].includes(loc.remind))it.remind=loc.remind;
    if(Array.isArray(it.subtasks)&&Array.isArray(loc.subtasks)){
      const sm=new Map(loc.subtasks.map(s=>[s.id,s]));
      it.subtasks=it.subtasks.map(s=>{const ls=sm.get(s.id);return ls?{...ls,...s,depth:s.depth!==undefined?s.depth:ls.depth}:s});
    }
    if(Array.isArray(it.attachments)&&Array.isArray(loc.attachments)){
      const am=new Map(loc.attachments.map(a=>[a.id,a]));
      it.attachments=it.attachments.map(a=>({...(am.get(a.id)||{}),...a}));
    }
    return it;
  });
}

/* ---- migration from the very first occurrence-based model (kept as is) ---- */
const OLD_REPEAT=['daily','weekdays','weekly','biweekly','monthly','monthlyWeekday','yearly'];
function migrateOld(){
  let oldTasks=[];
  try{oldTasks=JSON.parse(store.get(OLD.tasks)||'[]')}catch(e){oldTasks=[]}
  if(!Array.isArray(oldTasks)||!oldTasks.length)return false;
  const bySeries={};
  oldTasks.forEach(t=>{const sid=t.seriesId||t.id;(bySeries[sid]=bySeries[sid]||[]).push(t)});
  let idx=0;
  Object.values(bySeries).forEach(grp=>{
    grp.sort((a,b)=>String(a.due||'').localeCompare(String(b.due||'')));
    const first=grp[0];
    const rep=OLD_REPEAT.includes(first.repeat)?first.repeat:null;
    if(rep){
      const anchor=grp.map(g=>g.due).filter(Boolean).sort()[0]||first.due||todayStr();
      const nt=normTask({
        id:uid(),title:first.title,client:first.client,assignee:first.assignee,
        priority:first.priority,type:/post|reel|story/i.test(first.title||'')?'post':'task',
        due:anchor,deadline:first.deadline,rrule:ruleFromPreset(rep,anchor),
        labels:first.labels,subtasks:(first.subtasks||[]).map(s=>({id:uid(),text:s.text,done:false})),
        notes:first.notes,status:'todo',sortIndex:idx++
      });
      tasks.push(nt);
      grp.forEach(g=>{if(g.status==='done'&&g.due)completions.push({id:uid(),taskId:nt.id,date:g.due,at:g.completedAt||new Date().toISOString()})});
    }else{
      grp.forEach(g=>{
        tasks.push(normTask({
          id:uid(),title:g.title,client:g.client,assignee:g.assignee,priority:g.priority,
          type:/post|reel|story/i.test(g.title||'')?'post':'task',
          due:g.due,deadline:g.deadline,rrule:null,labels:g.labels,
          subtasks:(g.subtasks||[]).map(s=>({id:uid(),text:s.text,done:!!s.done})),
          notes:g.notes,status:g.status,completedAt:g.completedAt,sortIndex:idx++
        }));
      });
    }
  });
  return true;
}

/* ---- one-time local safety copy taken the first time v4 opens on a device ---- */
function preUpgradeLocalCopy(){
  if(store.get('pn_tb2_preupgrade_v4_done'))return;
  try{
    const keys={};Object.values(K).forEach(k=>{const v=store.get(k);if(v!==null)keys[k]=v;});
    if(Object.keys(keys).length)store.set('pn_tb2_preupgrade_v4',JSON.stringify({at:new Date().toISOString(),keys}));
  }catch(e){}
  store.set('pn_tb2_preupgrade_v4_done','1');
}

function loadAll(){
  let cfg=null;try{cfg=JSON.parse(store.get(K.cfg)||'null')}catch(e){}
  if(!cfg){try{const oc=JSON.parse(store.get(OLD.cfg)||'null');if(oc)cfg={clients:oc.clients,people:oc.people}}catch(e){}}
  CLIENTS=(cfg&&Array.isArray(cfg.clients)&&cfg.clients.length)?cfg.clients:DEFAULT_CLIENTS.map(c=>({...c}));
  PEOPLE=(cfg&&Array.isArray(cfg.people)&&cfg.people.length)?cfg.people:DEFAULT_PEOPLE.slice();
  CFG.workMins=(cfg&&cfg.workMins)||360;
  CFG.archiveDays=(cfg&&cfg.archiveDays)||4;
  CFG.sound=cfg&&typeof cfg.sound==='boolean'?cfg.sound:true;

  const hasNew=store.get(K.tasks)!==null;
  try{tasks=JSON.parse(store.get(K.tasks)||'[]').map(normTask)}catch(e){tasks=[]}
  try{completions=JSON.parse(store.get(K.comp)||'[]')}catch(e){completions=[]}
  try{exceptions=JSON.parse(store.get(K.exc)||'[]')}catch(e){exceptions=[]}
  try{routines=JSON.parse(store.get(K.rout)||'null')}catch(e){routines=null}
  try{templates=JSON.parse(store.get(K.tmpl)||'null')}catch(e){templates=null}
  try{fired=JSON.parse(store.get(K.rem)||'[]')}catch(e){fired=[]}
  try{meetings=JSON.parse(store.get(K.meet)||'[]').map(normMeeting)}catch(e){meetings=[]}
  try{X=normX(JSON.parse(store.get(K.x)||'null'))}catch(e){X=normX(null)}
  try{const u=JSON.parse(store.get(K.ui)||'null');if(u){UI={...UI,...u};UI.view={...UI.view,...(u.view||{})}}}catch(e){}
  fixUi();
  if(!Array.isArray(fired))fired=[];
  if(!Array.isArray(completions))completions=[];
  if(!Array.isArray(exceptions))exceptions=[];
  if(!Array.isArray(meetings))meetings=[];

  if(!hasNew){
    const migrated=migrateOld();
    if(routines===null)routines=[];
    if(templates===null)seedTemplates();
    saveTasks();saveComp();saveCfg();saveRout();saveTmpl();
    if(migrated)setTimeout(()=>toast('Imported your tasks into the new board'),400);
  }
  if(!Array.isArray(routines))routines=[];
  let stripped=false;
  tasks.forEach(t=>{if(t.routineId){t.routineId=null;stripped=true;}});
  if(stripped)saveTasks();
  if(!Array.isArray(templates))templates=[];
  runArchive();
}

/* ============================================================ archive (hides, never deletes) */
function runArchive(){
  const cutoff=addLocalDays(todayStr(),-(CFG.archiveDays||4));
  let changed=false;
  tasks.forEach(t=>{
    if(t.status==='done'&&!t.rrule&&!t.archivedAt&&t.completedAt){
      const d=t.completedAt.slice(0,10);
      if(t.due&&d>t.due)return;
      if(d<cutoff){t.archivedAt=new Date().toISOString();changed=true;}
    }
  });
  if(changed)saveTasks();
}

/* ============================================================ productivity: counts, goals, streaks, karma */
function onVacation(d){return X.vacations.some(v=>v&&v.from&&d>=v.from&&(!v.to||d<=v.to))}
function vacationActive(){const v=X.vacations[X.vacations.length-1];return!!(v&&!v.to)}
function isOffDay(d){return X.daysOff.includes(dowOf(d))||onVacation(d)}
function completionLog(){
  const out=[];const byId=new Map(tasks.map(t=>[t.id,t]));
  tasks.forEach(t=>{if(!t.rrule&&t.status==='done'&&t.completedAt&&!isNote(t))out.push({day:localDay(t.completedAt),prio:t.priority,id:t.id});});
  completions.forEach(c=>{const t=byId.get(c.taskId);out.push({day:c.at?localDay(c.at):c.date,prio:t?t.priority:'None',id:c.taskId});});
  return out;
}
function dayCounts(){const m=new Map();completionLog().forEach(e=>m.set(e.day,(m.get(e.day)||0)+1));return m}
function weekCount(counts,mon){let n=0;for(let i=0;i<7;i++)n+=counts.get(addLocalDays(mon,i))||0;return n}
function weekHasVacation(mon){for(let i=0;i<7;i++)if(onVacation(addLocalDays(mon,i)))return true;return false}
function overduePenalties(){
  if(vacationActive())return[];
  const out=[];
  tasks.forEach(t=>{
    if(t.archivedAt||isNote(t))return;
    let d=null;
    if(t.rrule){const inst=openTodayInstance(t);d=inst&&inst.date;}
    else if(t.status!=='done'&&t.due)d=t.due;
    if(!d)return;
    const late=-dayDiff(d);
    if(late>5)out.push({task:t,late,pts:Math.min((late-5)*2,20)});
  });
  return out.sort((a,b)=>b.late-a.late);
}
function computeStats(){
  const today=todayStr();
  const log=completionLog();
  const counts=new Map();log.forEach(e=>counts.set(e.day,(counts.get(e.day)||0)+1));
  const days=[...counts.keys()].sort();
  const first=days[0]||today;
  const g=X.dailyGoal,wg=X.weeklyGoal;
  // daily streak: off days and vacation days neither count nor break it
  let streak=0;{let d=today;if((counts.get(today)||0)<g)d=addLocalDays(today,-1);
    for(let i=0;i<1500;i++){if(d<first)break;if(isOffDay(d)){d=addLocalDays(d,-1);continue;}
      if((counts.get(d)||0)>=g){streak++;d=addLocalDays(d,-1);}else break;}}
  let longest=0,run=0,goalDays=0;
  for(let d=first,i=0;d<=today&&i<3000;d=addLocalDays(d,1),i++){
    const n=counts.get(d)||0;
    if(n>=g){goalDays++;run++;longest=Math.max(longest,run);}
    else if(isOffDay(d)||d===today){}
    else run=0;
  }
  // weekly streak
  const thisMon=mondayOf(today);
  let wstreak=0;{let m=thisMon;if(weekCount(counts,m)<wg)m=addLocalDays(m,-7);
    for(let i=0;i<300;i++){if(addLocalDays(m,6)<first)break;const n=weekCount(counts,m);
      if(n>=wg){wstreak++;m=addLocalDays(m,-7);}else if(weekHasVacation(m)){m=addLocalDays(m,-7);}else break;}}
  let goalWeeks=0;for(let m=mondayOf(first),i=0;m<=thisMon&&i<400;m=addLocalDays(m,7),i++)if(weekCount(counts,m)>=wg)goalWeeks++;
  const taskPts=log.reduce((s,e)=>s+(KPTS[e.prio]||4),0);
  const pens=overduePenalties();const penalty=pens.reduce((s,p)=>s+p.pts,0);
  const karma=Math.max(0,taskPts+goalDays*10+goalWeeks*30-penalty);
  let li=0;LEVELS.forEach((l,i)=>{if(karma>=l[1])li=i;});
  const next=LEVELS[li+1];
  return{counts,today:counts.get(today)||0,week:weekCount(counts,thisMon),streak,longest,wstreak,
    karma,taskPts,goalDays,goalWeeks,penalty,pens,total:log.length,level:LEVELS[li][0],levelIdx:li,
    next:next?next[0]:null,toNext:next?next[1]-karma:0,levelPct:next?Math.round((karma-LEVELS[li][1])/(next[1]-LEVELS[li][1])*100):100};
}

function play(name){
  if(!CFG.sound)return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
    AC=AC||new Ctx();if(AC.state==='suspended')AC.resume();
    const t0=AC.currentTime;
    (SND[name]||SND.done).forEach(([f,st,dur,gain])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.setValueAtTime(f,t0+st);
      g.gain.setValueAtTime(.0001,t0+st);
      g.gain.exponentialRampToValueAtTime(gain,t0+st+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t0+st+dur);
      o.connect(g).connect(AC.destination);o.start(t0+st);o.stop(t0+st+dur+.02);
    });
  }catch(e){}
}
